<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카페 타이쿤 — 중1 정수와 유리수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   카페 타이쿤 v1.0 — 스타일
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#fdf6ec; --bg2:#f6ead9; --panel:#ffffff; --panel2:#fffaf3;
  --line:#e7d9c4; --line2:#d8c5a8;
  --txt:#3b2d21; --dim:#8a7a67;
  --brown:#8b5e3c; --gold:#dfa02e; --green:#3f9a6b; --red:#d2603f; --blue:#4a7bb5; --pink:#b3517a;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--txt); min-height:100vh; -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px}
button:disabled{cursor:not-allowed;opacity:.45}
.hidden{display:none !important}

/* ── 버튼 ── */
.btn{padding:11px 20px;font-size:15px;font-weight:700;background:var(--brown);color:#fff;transition:.15s}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.sec{background:#efe3d2;color:var(--txt)}
.btn.gold{background:var(--gold);color:#3b2600}
.btn.green{background:var(--green);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn.big{padding:15px 30px;font-size:17px;border-radius:12px}

/* ── 분수 표기 ──
   가로줄이 글자 한가운데 오도록 vertical-align:middle 을 쓴다.
   (예전처럼 -0.45em 으로 내리면 분모가 줄 아래로 삐져나와 줄 간격이 어긋난다.)
   분수가 들어가는 줄은 line-height 를 1.9 이상 줘야 위아래 줄과 겹치지 않는다. */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.04;text-align:center;margin:0 .12em;font-size:.86em;position:relative;top:-.04em}
.fr i{font-style:normal;border-bottom:1.4px solid currentColor;padding:0 .3em}
.fr b{font-weight:600;padding:0 .3em}
/* 분수가 나오는 곳은 줄 간격을 넉넉히 */
.money td,.taskrow .detail,.taskrow .need,.forecast .eq,.forecast p,
table.log td,table.rank td,.chip .q,.modal p{line-height:1.95}

/* ── 헤더 ── */
header{
  display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;
  background:#fffdf9;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;
}
header h1{margin:0;font-size:18px;font-weight:900;letter-spacing:-.5px}
header h1 small{font-size:11px;font-weight:500;color:var(--dim);margin-left:6px}
.spacer{flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.stat b{font-weight:900}
.stat .lbl{color:var(--dim);font-weight:500;margin-right:5px;font-size:12px}

/* ── 탭 ── */
nav{display:flex;gap:6px;padding:8px 16px;background:#fffdf9;border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:49;overflow-x:auto}
nav button{padding:8px 16px;font-size:14px;font-weight:700;background:transparent;color:var(--dim);border-radius:9px;white-space:nowrap}
nav button.on{background:var(--brown);color:#fff}

/* ── 화면 ── */
.screen{display:none;padding:20px 16px 70px;max-width:1080px;margin:0 auto}
.screen.active{display:block}
h2.title{font-size:22px;margin:0 0 4px;font-weight:900;letter-spacing:-.5px}
p.sub{margin:0 0 18px;color:var(--dim);font-size:14px}

/* ── 카드 ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

/* ── 그림 자리 ── */
.thumb{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--bg2);
  display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb span{display:none;font-size:12px;font-weight:700;color:var(--dim);text-align:center;padding:6px}
.thumb.noimg{background:repeating-linear-gradient(45deg,#f7eddf,#f7eddf 8px,#f2e4d1 8px,#f2e4d1 16px)}
.thumb.noimg span{display:block}
.thumb.wide{aspect-ratio:4/3}
.thumb.small{width:52px;height:52px;aspect-ratio:auto;flex:0 0 52px}

/* ── 직원 ── */
.staff{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px}
.staff .top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.staff .nm{font-weight:800;font-size:15px}
.staff .meta{font-size:12px;color:var(--dim);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;font-size:13px;font-weight:700;border-radius:9px;background:#f2e8da;color:var(--dim);border:1.5px solid transparent}
.chip.on{background:#fff;color:var(--txt);border-color:currentColor}
.chip .q{display:block;font-size:11px;font-weight:600;opacity:.85;margin-top:1px}
.warn{color:var(--red);font-size:13px;font-weight:700;margin-top:8px}

/* ── 업무 막대 ── */
.taskrow{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;background:var(--panel)}
.taskrow.bottleneck{border-color:var(--red);background:#fef4f0}
.taskrow .hd{display:flex;align-items:center;gap:9px;cursor:pointer}
.taskrow .ticon{width:26px;height:26px;object-fit:contain;flex:0 0 26px}
.chip .ticon{width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:3px}
.taskrow .nm{font-weight:800;font-size:15px}
.taskrow .need{font-size:12px;color:var(--dim)}
.taskrow .cnt{margin-left:auto;font-weight:900;font-size:16px}
.taskrow .bar{height:9px;border-radius:5px;background:#eee3d4;margin-top:9px;overflow:hidden}
.taskrow .bar i{display:block;height:100%;border-radius:5px}
.taskrow .detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2);font-size:13.5px;line-height:2}
.taskrow.open .detail{display:block}
.taskrow .detail div{color:var(--dim)}
.taskrow .detail .fin{color:var(--txt);font-weight:700}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;background:var(--red);color:#fff}

/* ── 예보 ── */
.forecast{background:linear-gradient(135deg,#fff6e6,#ffeccd);border:1px solid var(--line2);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.forecast .big{font-size:34px;font-weight:900;letter-spacing:-1px}
.forecast .eq{font-size:19px;font-weight:800;background:#fff;border:1px dashed var(--line2);border-radius:10px;padding:12px 14px;margin:10px 0;text-align:center}
.forecast p{margin:6px 0 0;font-size:14px;color:#6b5946;line-height:1.6}
.sns{background:#fff1f4;border-color:#f3c7d2}

/* ── 결과 ── */
.result-hero{text-align:center;padding:18px 10px}
.result-hero .n{font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1.1}
.result-hero .cap{color:var(--dim);font-size:14px}
.money{width:100%;border-collapse:collapse;font-size:14.5px}
.money td{padding:8px 4px;border-bottom:1px solid var(--line)}
.money td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.money tr:last-child td{border-bottom:none;font-size:16px}
.pos{color:var(--green)} .neg{color:var(--red)}

/* ── 상점 ── */
.shoptabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.shoptabs button{padding:8px 14px;font-size:13.5px;font-weight:700;background:#f0e5d5;color:var(--dim);border-radius:9px}
.shoptabs button.on{background:var(--gold);color:#3b2600}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.item .nm{font-weight:800;font-size:14.5px}
.item .desc{font-size:12.5px;color:var(--dim);line-height:1.5;flex:1}
.item .price{font-weight:900;font-size:15px}
.item.owned{opacity:.72;border-color:var(--green)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#efe3d2;color:var(--dim)}
.tag.set{background:#ffe8f0;color:#b3517a}

/* ── 기록 ── */
table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th,table.log td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.log th:first-child,table.log td:first-child{text-align:left}
table.log th{color:var(--dim);font-weight:700;font-size:12.5px}

/* ── 카페 그림 (내 카페 모습 · 영업 연출) ── */
.scene{position:relative;height:250px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(#fbf1e2 0 58%, #ecdcc2 58% 60%, #e6d3b6 60% 100%)}
.scene .wall,.scene .floor{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 12px}
.scene .wall{top:12px;align-items:flex-start}
.scene .floor{bottom:10px;align-items:flex-end}
.scene .wall img,.scene .floor img{object-fit:contain;filter:drop-shadow(0 3px 5px rgba(90,60,30,.14))}
.scene .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:13.5px;text-align:center;padding:20px;line-height:1.7}
.scene .guest{position:absolute;bottom:12px;left:0;font-size:32px;line-height:1;pointer-events:none;
  filter:drop-shadow(0 2px 3px rgba(90,60,30,.2))}
.scene .guest img{width:44px;height:44px;object-fit:contain}
.scene .tag{position:absolute;top:10px;left:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);
  border-radius:20px;padding:4px 12px;font-size:12.5px;font-weight:800;color:var(--dim)}
.scene .count{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);
  border-radius:20px;padding:5px 14px;font-size:14px;font-weight:900}
.scene .count small{font-weight:600;color:var(--dim)}
.playbar{height:8px;border-radius:5px;background:#eee3d4;overflow:hidden;margin-top:12px}
.playbar i{display:block;height:100%;background:var(--green);width:0}
@media(max-width:520px){ .scene{height:210px} .scene .guest{font-size:26px} }

/* ── 로그인 표시 ── */
.userchip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);font-weight:600}
.userchip img{width:24px;height:24px;border-radius:50%}
.userchip button{font-size:12px;padding:4px 9px;background:#efe3d2;color:var(--dim);border-radius:7px;font-weight:700}

/* ── 랭킹 ── */
table.rank{width:100%;border-collapse:collapse;font-size:14px}
table.rank th,table.rank td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.rank th:nth-child(2),table.rank td:nth-child(2){text-align:left;white-space:normal}
table.rank th{color:var(--dim);font-weight:700;font-size:12.5px}
table.rank tr.me{background:#fff6e6}
table.rank tr.me td{font-weight:800}
.medal{font-size:16px}
.rank .who{font-weight:800}
.rank .who small{display:block;font-weight:500;color:var(--dim);font-size:12px}

/* ── 안내창 ── */
.modal{position:fixed;inset:0;background:rgba(50,35,20,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal .box{background:var(--panel);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:86vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:19px;font-weight:900}
.modal p,.modal li{font-size:14.5px;line-height:1.75;color:#5a4a3a}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#3b2d21;color:#fff;padding:11px 20px;
  border-radius:24px;font-size:14px;font-weight:700;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}

@media(max-width:520px){
  header h1{font-size:16px} .stat{font-size:12px;padding:4px 9px}
  .result-hero .n{font-size:44px}
}
</style>
</head>
<body>

<header>
  <h1>☕ 카페 타이쿤<small>중1 정수와 유리수</small></h1>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
  <span class="userchip" id="userchip"></span>
  <button class="btn sec sm" onclick="도움말()">도움말</button>
</header>

<nav id="nav" class="hidden">
  <button data-scr="s-home" onclick="탭('s-home')">🏠 내 카페</button>
  <button data-scr="s-assign" onclick="탭('s-assign')">📋 업무 배정</button>
  <button data-scr="s-shop" onclick="탭('s-shop')">🛒 상점</button>
  <button data-scr="s-rank" onclick="탭('s-rank')">🏆 랭킹</button>
  <button data-scr="s-log" onclick="탭('s-log')">📈 기록</button>
</nav>

<!-- ── 시작 ────────────────────────────────────────────────── -->
<div class="screen active" id="s-start"></div>

<!-- ── 랭킹 ────────────────────────────────────────────────── -->
<div class="screen" id="s-rank"></div>

<!-- ── 내 카페 ─────────────────────────────────────────────── -->
<div class="screen" id="s-home"></div>

<!-- ── 업무 배정 ───────────────────────────────────────────── -->
<div class="screen" id="s-assign"></div>

<!-- ── 영업 중 (연출) ──────────────────────────────────────── -->
<div class="screen" id="s-play"></div>

<!-- ── 영업 결과 ───────────────────────────────────────────── -->
<div class="screen" id="s-result"></div>

<!-- ── 상점 ────────────────────────────────────────────────── -->
<div class="screen" id="s-shop"></div>

<!-- ── 기록 ────────────────────────────────────────────────── -->
<div class="screen" id="s-log"></div>

<div class="toast" id="toast"></div>

<script src="cafe-catalog.js?v=1.0"></script>
<script src="cafe-engine.js?v=1.0"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   카페 타이쿤 v1.0 — 화면 코드
   계산은 전부 cafe-engine.js 가 한다. 이 파일은 "보여 주기"만 한다.
   ══════════════════════════════════════════════════════════════ */
'use strict';
const CG = window.CafeGame;
const CAT = CG.setCatalog(window.CAFE_CATALOG);
const F = CG.F;
const 저장키 = 'cafeTycoon.v1';

let st = null;          // 게임 상태
let 배정 = {};          // 지금 편집 중인 업무 배정 { 직원id: [업무id...] }
let 상점탭 = 'hire';

/* ── 도우미 ─────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** "12 ÷ 3/4 = 16" 처럼 분수가 섞인 글을 진짜 분수 모양으로 바꾼다 */
function 수(s) {
  return String(s).replace(/(-?\d+)\/(\d+)/g,
    (m, n, d) => '<span class="fr"><i>' + n + '</i><b>' + d + '</b></span>');
}
/** Fraction 을 화면용 HTML 로 */
function 분수(x) { return 수(x.toString()); }

function 그림(경로, 이름, cls) {
  cls = cls || '';
  if (!경로) return '<div class="thumb noimg ' + cls + '"><span>' + esc(이름) + '</span></div>';
  const src = CAT.이미지.폴더 + 경로;
  // loading="lazy": 화면에 보이는 그림만 내려받는다 (상점을 열자마자 전부 받지 않도록)
  return '<div class="thumb ' + cls + '"><img src="' + esc(src) + '" alt="' + esc(이름) + '" loading="lazy" decoding="async"' +
         ' onerror="this.parentNode.classList.add(\'noimg\');this.remove()"><span>' + esc(이름) + '</span></div>';
}

/** 업무 이름 옆에 붙는 작은 아이콘 (그림이 없으면 그냥 사라진다) */
function 업무아이콘(업무) {
  if (!업무.이미지) return '';
  return '<img class="ticon" src="' + esc(CAT.이미지.폴더 + 업무.이미지) + '" alt="" loading="lazy"' +
         ' onerror="this.remove()">';
}

let 토스트타이머 = null;
function 알림(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(토스트타이머); 토스트타이머 = setTimeout(() => t.classList.remove('on'), 1900);
}

function 별(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

/** 한글 받침에 맞는 조사를 붙인다. 조사('서빙','이','가') → '서빙이' */
function 조사(말, 있을때, 없을때) {
  const c = String(말).charCodeAt(String(말).length - 1);
  const 받침 = (c >= 0xAC00 && c <= 0xD7A3) ? ((c - 0xAC00) % 28 !== 0) : false;
  return 말 + (받침 ? 있을때 : 없을때);
}

/* ── 저장 ───────────────────────────────────────────────────── */
function 저장() {
  try { localStorage.setItem(저장키, CG.저장(st)); } catch (e) { /* 사생활 보호 모드 등 */ }
}
function 불러오기() {
  try {
    const s = localStorage.getItem(저장키);
    return s ? CG.불러오기(s) : null;
  } catch (e) { return null; }
}

/* ── 화면 전환 ──────────────────────────────────────────────── */
function 화면(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.scr === id));
  window.scrollTo(0, 0);
}
function 탭(id) {
  if (id === 's-home') 홈그리기();
  if (id === 's-assign') 배정그리기();
  if (id === 's-shop') 상점그리기();
  if (id === 's-rank') 랭킹그리기();
  if (id === 's-log') 기록그리기();
  화면(id);
}

/* ── 상단 수치 ──────────────────────────────────────────────── */
function 수치그리기() {
  if (!st) { $('stats').innerHTML = ''; return; }
  const 주 = st.끝남 ? '시즌 종료' : st.주차 + '주차';
  $('stats').innerHTML =
    '<div class="stat"><span class="lbl">주차</span><b>' + 주 + '</b></div>' +
    '<div class="stat"><span class="lbl">코인</span><b>' + 분수(st.코인) + '</b></div>' +
    '<div class="stat"><span class="lbl">평판</span><b style="color:var(--gold)">' + 별(st.평판) + '</b></div>' +
    '<div class="stat"><span class="lbl">매력도</span><b>' + CG.매력도(st) + '</b></div>' +
    '<div class="stat"><span class="lbl">누적 순이익</span><b>' + 분수(CG.누적순이익(st)) + '</b></div>';
}

/* ══════════════════════════════════════════════════════════════
   로그인과 클라우드 저장
   ══════════════════════════════════════════════════════════════
   로그인하면 진행 상황이 학교 서버(Firestore)에도 저장되어 다른 기기에서 이어서 할 수 있고,
   랭킹에도 올라간다. 로그인하지 않아도 이 기기에서 혼자 하는 것은 그대로 된다.
   실제 통신은 아래쪽 module 스크립트(window.CafeCloud)가 맡는다.
   ────────────────────────────────────────────────────────────── */
let 사용자 = null;        // 로그인한 사람 {uid, 이름, 사진}
let 게스트 = false;       // "로그인 없이 이 기기에서만" 을 고른 상태
let 인증확인중 = true;    // 아직 로그인 상태를 확인하는 중
let 저장타이머 = null;

function 헤더그리기() {
  const c = $('userchip');
  if (!c) return;
  if (인증확인중) { c.innerHTML = '<span style="opacity:.55">로그인 확인 중…</span>'; return; }
  c.innerHTML = 사용자
    ? (사용자.사진 ? '<img src="' + esc(사용자.사진) + '" alt="">' : '') + esc(사용자.이름) +
      '<button onclick="로그아웃()">로그아웃</button>'
    : '<button onclick="로그인()">구글 로그인</button>';
}

async function 로그인() {
  if (!window.CafeCloud) { 알림('로그인 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); return; }
  try { await window.CafeCloud.로그인(); }
  catch (e) { 알림('로그인 오류: ' + (e.code || e.message)); }
}
function 로그아웃() { if (window.CafeCloud) window.CafeCloud.로그아웃(); }

/** 로그인 상태가 바뀌면 module 스크립트가 이 함수를 부른다. */
async function 로그인상태(u) {
  인증확인중 = false;
  사용자 = u;
  헤더그리기();
  if (!u) {                                   // 로그아웃했거나 아직 로그인하지 않음
    if (!게스트) { st = null; 배정 = {}; $('nav').classList.add('hidden'); 시작그리기(); 화면('s-start'); }
    return;
  }
  게스트 = false;

  // 서버에 저장된 것과 이 기기에 저장된 것 중 더 많이 진행된 쪽을 고른다
  let 원격 = null;
  try { 원격 = await window.CafeCloud.불러오기(); }
  catch (e) { console.warn('[클라우드 읽기 실패]', e); 알림('저장 기록을 불러오지 못했습니다.'); }
  const 로컬 = 불러오기();
  const 진행 = s => (s && s.기록) ? s.기록.length : -1;

  if (진행(원격) < 0 && 진행(로컬) < 0) { 시작그리기(); 화면('s-start'); return; }

  if (진행(원격) > 진행(로컬)) { st = 원격; 알림('저장해 둔 카페를 불러왔습니다.'); }
  else { st = 로컬 || 원격; if (진행(로컬) > 진행(원격)) 클라우드저장(true); }

  배정 = st._배정 || {};
  저장();
  $('nav').classList.remove('hidden');
  탭(st.끝남 ? 's-log' : 's-home');
}

/**
 * 랭킹과 이어하기에 쓰는 요약 정보 (게임 상태 전체와 함께 저장한다)
 *
 * ※ 서버에 저장하는 항목 이름만 영문이다.
 *   Firestore 보안 규칙 언어가 한글 이름을 읽지 못해서(`data.주차` → 문법 오류),
 *   규칙에서 검사해야 하는 항목은 영문으로 둔다. 화면에 보이는 글자는 모두 한글 그대로다.
 */
function 요약(s) {
  const 순 = CG.누적순이익(s);
  return {
    cafeName: s.카페이름 || '이름 없는 카페',
    week: s.주차,
    reputation: s.평판,
    charm: CG.매력도(s),
    decor: s.인테리어.slice(),
    facilities: s.시설.slice(),
    staffCount: s.직원.length,
    profit: 순.toString(),                          // 분수 그대로 (예: "177/5")
    profitValue: 순.numerator / 순.denominator,     // 순위를 매기기 위한 수
    finished: !!s.끝남
  };
}

/** 클라우드 저장. 즉시가 아니면 1.5초 모아서 한 번만 보낸다. */
function 클라우드저장(즉시) {
  if (!사용자 || !st || !window.CafeCloud) return;
  clearTimeout(저장타이머);
  const 보내기 = () => window.CafeCloud.저장(요약(st), CG.저장(st))
    .catch(e => { console.warn('[클라우드 저장 실패]', e); 알림('서버에 저장하지 못했습니다. (이 기기에는 저장됨)'); });
  if (즉시) 보내기(); else 저장타이머 = setTimeout(보내기, 1500);
}

/* ══════════════════════════════════════════════════════════════
   시작 화면
   ══════════════════════════════════════════════════════════════ */
function 시작그리기() {
  const 로컬 = 불러오기();
  const 머리 = '<div style="text-align:center;padding:32px 10px">' +
    '<div style="font-size:64px">☕</div>' +
    '<h2 class="title" style="font-size:32px">카페 타이쿤</h2>' +
    '<p class="sub">10주 동안 카페를 키워 보세요.<br>직원을 어떻게 배치하느냐에 따라 받을 수 있는 손님이 달라집니다.</p>';
  const 꼬리 = '<button class="btn sec sm" onclick="도움말()">게임 설명 보기</button></div>';

  if (인증확인중) {
    $('s-start').innerHTML = 머리 + '<p class="sub">로그인 상태를 확인하는 중…</p>' + 꼬리;
    return;
  }

  if (!사용자 && !게스트) {
    $('s-start').innerHTML = 머리 +
      '<div class="card" style="max-width:400px;margin:22px auto">' +
      '<p style="margin:0 0 14px;font-size:14.5px;line-height:1.7">구글 로그인을 하면 <b>다른 기기에서도 이어서</b> 할 수 있고, ' +
      '<b>랭킹</b>에 올라갑니다.<br>학습지에 이미 로그인해 두었다면 바로 들어옵니다.</p>' +
      '<button class="btn big" style="width:100%" onclick="로그인()">구글 로그인하고 시작</button>' +
      '<button class="btn sec sm" style="width:100%;margin-top:8px" onclick="게스트시작()">로그인 없이 이 기기에서만 하기</button>' +
      '</div>' + 꼬리;
    return;
  }

  $('s-start').innerHTML = 머리 +
    '<div class="card" style="max-width:380px;margin:22px auto;text-align:left">' +
    (사용자 ? '<p class="sub" style="margin:0 0 12px">' + esc(사용자.이름) + '님으로 로그인했습니다.</p>'
            : '<p class="sub" style="margin:0 0 12px">이 기기에만 저장됩니다. 랭킹에는 올라가지 않아요.</p>') +
    '<h3>카페 이름</h3>' +
    '<input id="cafename" maxlength="14" placeholder="예: 달콤한 오후" value="' + esc((로컬 && 로컬.카페이름) || '') + '"' +
    ' style="width:100%;padding:12px;font-size:16px;font-family:inherit;border:1px solid var(--line2);border-radius:10px">' +
    '<div style="display:flex;gap:8px;margin-top:12px">' +
    '<button class="btn big" style="flex:1" onclick="새게임()">새로 시작</button>' +
    (로컬 ? '<button class="btn sec big" onclick="이어하기()">이어하기</button>' : '') +
    '</div></div>' + 꼬리;
}

function 게스트시작() { 게스트 = true; 시작그리기(); }

function 새게임() {
  const inp = $('cafename');
  const 이름 = ((inp && inp.value) || '').trim() || '이름 없는 카페';
  if (st && !confirm('지금까지의 기록이 사라집니다. 새로 시작할까요?')) return;
  st = CG.newGame();
  st.카페이름 = 이름;
  배정 = {};
  저장(); 클라우드저장(true);
  $('nav').classList.remove('hidden');
  탭('s-home');
}
function 이어하기() {
  const s = 불러오기();
  if (!s) { 알림('저장된 기록이 없습니다.'); return; }
  st = s; 배정 = st._배정 || {};
  $('nav').classList.remove('hidden');
  탭(st.끝남 ? 's-log' : 's-home');
}

/* ══════════════════════════════════════════════════════════════
   내 카페 (홈)
   ══════════════════════════════════════════════════════════════ */
function 홈그리기() {
  수치그리기();
  const 직원들 = st.직원.map(s => {
    const t = CAT.직원유형별[s.유형];
    const 다음 = CG.업그레이드가능(st, s.id);
    return '<div class="staff"><div class="top">' + 그림(t.이미지, t.이름, 'small') +
      '<div><div class="nm">' + esc(s.이름) + '</div>' +
      '<div class="meta">업무능력 ' + CG.능력(st, s).toString() + ' · 레벨 ' + s.레벨 +
      ' · 주급 ' + t.주급 + '</div></div></div>' +
      '<div class="meta" style="font-size:12.5px;color:var(--dim)">' + esc(t.설명) + '</div>' +
      (다음 ? '<div class="meta" style="margin-top:6px">다음 레벨 업무능력 ' + 다음.업무능력 + ' · ' + 다음.비용 + '코인</div>' : '') +
      '</div>';
  }).join('');

  const 인테리어 = st.인테리어.length
    ? '<div class="grid g3">' + st.인테리어.map(id => {
        const d = CAT.인테리어별[id];
        return '<div>' + 그림(d.이미지, d.이름) +
          '<div style="text-align:center;font-size:12.5px;font-weight:700;margin-top:5px">' + esc(d.이름) + '</div></div>';
      }).join('') + '</div>'
    : '<p class="sub" style="margin:0">아직 꾸미지 않았어요. 상점에서 인테리어를 사면 매력도가 올라가고 SNS에 오를 확률이 높아집니다.</p>';

  const 세트 = CG.완성세트(st);
  const 시설 = st.시설.length
    ? st.시설.map(id => '<span class="tag">' + esc(CAT.시설별[id].이름) + '</span>').join(' ')
    : '<span class="sub">아직 없음</span>';

  $('s-home').innerHTML =
    '<h2 class="title">' + esc(st.카페이름 || '내 카페') + '</h2>' +
    '<p class="sub">' + (st.끝남 ? '10주 시즌이 끝났습니다.' : st.주차 + '주차 · 이번 주 예상 손님을 확인하고 직원을 배치하세요.') + '</p>' +

    (st.끝남 ? '' :
      '<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
      '<div><div style="font-size:13px;color:var(--dim)">이번 주 손님 예보</div>' +
      '<div style="font-size:26px;font-weight:900">' + (st.예보.숨김 ? '예약 주문 ?명' : st.예보.손님수 + '명') + '</div></div>' +
      '<div class="spacer" style="flex:1"></div>' +
      '<button class="btn big" onclick="탭(\'s-assign\')">업무 배정하러 가기 →</button></div>') +

    '<div class="card"><h3>직원 ' + st.직원.length + '명 <span class="sub" style="font-weight:400">(주급 합계 ' +
      분수(CG.주급합(st)) + ')</span></h3><div class="grid g2">' + 직원들 + '</div></div>' +

    '<div class="card"><h3>카페 꾸미기 <span class="sub" style="font-weight:400">매력도 ' + CG.매력도(st) +
      ' · 다음 주 SNS 확률 ' + CG.SNS확률(st) + '%</span></h3>' +
      가게그림(st, '내 카페') +
      (세트.length ? '<div style="margin:10px 0">' + 세트.map(s => '<span class="tag set">' + esc(s) + ' 세트 완성!</span>').join(' ') + '</div>' : '<div style="height:10px"></div>') +
      인테리어 + '</div>' +

    '<div class="card"><h3>시설</h3>' + 시설 + '</div>';
}

/* ══════════════════════════════════════════════════════════════
   업무 배정
   ══════════════════════════════════════════════════════════════ */
function 열린업무목록() { return CG.열린업무(st); }

function 배정정리() {
  // 지금 열려 있는 업무만 남긴다 (시설을 사서 업무가 늘어난 경우 등)
  const 열린 = 열린업무목록().map(t => t.id);
  st.직원.forEach(s => {
    배정[s.id] = (배정[s.id] || []).filter(id => 열린.indexOf(id) >= 0);
  });
  Object.keys(배정).forEach(k => { if (!st.직원.some(s => s.id === k)) delete 배정[k]; });
}

function 업무토글(직원id, 업무id) {
  const cur = 배정[직원id] || [];
  const i = cur.indexOf(업무id);
  if (i >= 0) cur.splice(i, 1); else cur.push(업무id);
  배정[직원id] = cur;
  st._배정 = 배정; 저장();
  배정그리기();
}

function 추천배치누르기() {
  const r = CG.추천배치(st, 25);
  배정 = r.배정; st._배정 = 배정; 저장();
  배정그리기();
  알림('최대 ' + r.가능손님 + '명까지 받을 수 있는 배치입니다.');
}

function 예보HTML() {
  const f = st.예보;
  if (f.숨김) {
    const m = f.미션;
    return '<div class="forecast"><div style="font-size:13px;color:#8a6c45;font-weight:800">📞 예약 주문이 들어왔어요</div>' +
      '<p>' + esc(m.이야기) + '</p>' +
      '<div class="eq">' + 수(m.준비.toString()) + ' + ' + 수(m.계수.toString()) + ' × <b>x</b> = ' + 수(m.총량.toString()) + '</div>' +
      '<p><b>x</b>가 이번 주에 올 예약 손님 수입니다. 직접 계산해서, 그만큼 받을 수 있게 직원을 배치하세요.<br>' +
      '답을 입력하는 칸은 없습니다. 배치가 맞으면 주문을 모두 처리하고, 모자라면 주문이 밀립니다.</p></div>';
  }
  const sns = f.배수;
  return '<div class="forecast' + (sns ? ' sns' : '') + '">' +
    (sns ? '<div style="font-size:13px;color:#b3517a;font-weight:800">🔥 SNS에서 우리 카페가 화제예요!</div>' : '') +
    '<div style="font-size:13px;color:#8a6c45;font-weight:800">' + st.주차 + '주차 손님 예보</div>' +
    '<div class="big">' + f.손님수 + '명</div>' +
    (sns ? '<p>원래 예보 ' + f.기본손님 + '명 × ' + 수(sns.toString()) + ' = ' + f.손님수 + '명<br>' +
           '손님이 늘어난 만큼 <b>모든 업무의 업무량도 똑같은 배수로 늘어납니다.</b>(정비례)</p>'
         : '<p>손님 1명을 받으려면 열린 업무를 <b>모두</b> 처리해야 합니다. 하나라도 모자라면 그만큼만 받을 수 있어요.</p>') +
    '</div>';
}

function 배정그리기() {
  수치그리기();
  if (st.끝남) { $('s-assign').innerHTML = '<h2 class="title">시즌이 끝났습니다</h2><p class="sub">기록 탭에서 결과를 확인하세요.</p>'; return; }
  배정정리();
  const 열린 = 열린업무목록();
  const p = CG.계획(st, 배정);

  const 직원들 = st.직원.map(s => {
    const t = CAT.직원유형별[s.유형];
    const 맡은 = 배정[s.id] || [];
    const n = 맡은.length;
    const chips = 열린.map(task => {
      const on = 맡은.indexOf(task.id) >= 0;
      const 몫 = on ? CG.처리량(st, s, 맡은, task.id) : null;
      const 보정 = t.보정[task.id];
      return '<button class="chip' + (on ? ' on' : '') + '" style="' + (on ? 'color:' + task.색 : '') + '"' +
        ' onclick="업무토글(\'' + s.id + '\',\'' + task.id + '\')">' + 업무아이콘(task) + esc(task.이름) +
        (보정 ? ' <span style="font-size:11px">×' + 수(보정.toString()) + '</span>' : '') +
        (on ? '<span class="q">' + 수(CG.능력(st, s).toString() + ' ÷ ' + n + (보정 ? ' × ' + 보정.toString() : '') + ' = ' + 몫.toString()) + '</span>' : '') +
        '</button>';
    }).join('');
    return '<div class="staff"><div class="top">' + 그림(t.이미지, t.이름, 'small') +
      '<div><div class="nm">' + esc(s.이름) + '</div>' +
      '<div class="meta">업무능력 ' + CG.능력(st, s).toString() + ' · 맡은 업무 ' + n + '가지' +
      (n ? ' → 업무 하나당 ' + 수(CG.능력(st, s).div(F(n)).toString()) : '') + '</div></div></div>' +
      '<div class="chips">' + chips + '</div>' +
      (n === 0 ? '<div class="warn">아무 업무도 맡지 않았어요.</div>' : '') + '</div>';
  }).join('');

  // 막대 눈금: 예상 손님과 업무별 가능 손님 중 가장 큰 값에 맞춘다 (업무끼리 길이를 비교할 수 있게)
  const 최대 = Math.max(p.예상손님, 1, ...p.업무.map(r => r.가능손님정수));
  const 업무들 = p.업무.map((r, i) => {
    const t = CAT.업무별[r.id];
    const 병목 = p.병목 === r.id && p.가능손님 < p.예상손님;
    const w = Math.min(100, Math.round(r.가능손님정수 / 최대 * 100));
    return '<div class="taskrow' + (병목 ? ' bottleneck' : '') + '" id="tr' + i + '">' +
      '<div class="hd" onclick="document.getElementById(\'tr' + i + '\').classList.toggle(\'open\')">' +
      업무아이콘(t) + '<span class="nm" style="color:' + t.색 + '">' + esc(r.이름) + '</span>' +
      '<span class="need">손님 1명당 ' + 수(r.필요.toString()) + '</span>' +
      (병목 ? '<span class="badge">병목</span>' : '') +
      '<span class="cnt">' + r.가능손님정수 + '명 가능</span><span style="color:var(--dim);font-size:12px">▾</span></div>' +
      '<div class="bar"><i style="width:' + w + '%;background:' + t.색 + '"></i></div>' +
      '<div class="detail">' +
      (r.식.담당.length ? r.식.담당.map(x => '<div>' + 수(esc(x)) + '</div>').join('') : '<div>맡은 직원이 없습니다.</div>') +
      (r.식.합계 ? '<div>합계 ' + 수(r.식.합계) + '</div>' : '') +
      '<div class="fin">받을 수 있는 손님 = 처리량 ÷ 필요 업무량 = ' + 수(r.식.손님) + ' → ' + r.가능손님정수 + '명</div>' +
      '</div></div>';
  }).join('');

  const 부족 = p.가능손님 < p.예상손님;
  $('s-assign').innerHTML =
    '<h2 class="title">' + st.주차 + '주차 업무 배정</h2>' +
    '<p class="sub">직원을 눌러 맡길 업무를 고르세요. <b>업무를 여러 가지 맡길수록 업무 하나당 처리량은 줄어듭니다.</b></p>' +
    예보HTML() +
    '<div class="card"><h3>직원 배치</h3><div class="grid g2">' + 직원들 + '</div>' +
    '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn sec sm" onclick="추천배치누르기()">🔎 추천 배치 보기</button>' +
    '<button class="btn sec sm" onclick="탭(\'s-shop\')">🛒 상점에서 보강하기</button></div></div>' +

    '<div class="card"><h3>업무별 받을 수 있는 손님 <span class="sub" style="font-weight:400">(눌러서 계산식 펼치기)</span></h3>' +
    업무들 +
    '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
    '<div><div style="font-size:13px;color:var(--dim)">이번 주 받을 수 있는 손님</div>' +
    '<div style="font-size:26px;font-weight:900;color:' + (부족 ? 'var(--red)' : 'var(--green)') + '">' + p.가능손님 + '명</div>' +
    '<div style="font-size:13px;color:var(--dim)">' + (st.예보.숨김 ? '예약 손님 수는 스스로 계산하세요' : '예상 손님 ' + p.예상손님 + '명') + '</div></div>' +
    '<div style="flex:1"></div>' +
    '<button class="btn big green" onclick="영업하기()">영업 시작 ▶</button></div></div>';
}

/* ══════════════════════════════════════════════════════════════
   카페 그림 — 산 인테리어를 벽과 바닥에 놓아 준다
   ══════════════════════════════════════════════════════════════
   내 카페(홈)와 영업 연출이 같은 그림을 쓴다. 나중에 친구 카페 구경도 이걸 쓰면 된다.
   ────────────────────────────────────────────────────────────── */
function 가게그림(상태, 꼬리표) {
  const 산것 = (상태.인테리어 || []).map(id => CAT.인테리어별[id]).filter(Boolean);
  const 벽 = 산것.filter(d => d.배치 === '벽');
  const 바닥 = 산것.filter(d => d.배치 !== '벽');
  // 물건이 많아지면 작게 그려 한 줄에 들어가게 한다
  const 높이 = n => (n <= 3 ? 82 : n <= 5 ? 66 : n <= 7 ? 54 : 44);
  const 줄 = (목록, cls) => '<div class="' + cls + '">' + 목록.map(d =>
    '<img src="' + esc(CAT.이미지.폴더 + d.이미지) + '" alt="' + esc(d.이름) + '" title="' + esc(d.이름) + '"' +
    ' style="height:' + 높이(목록.length) + 'px" loading="lazy" onerror="this.remove()">').join('') + '</div>';

  // id 를 붙이지 않는다 — 홈 화면과 영업 연출에 같은 그림이 동시에 있을 수 있어서,
  // id 가 겹치면 연출이 숨어 있는 홈 쪽 그림에 손님을 그리게 된다.
  return '<div class="scene">' +
    (꼬리표 ? '<div class="tag">' + esc(꼬리표) + '</div>' : '') +
    (산것.length ? 줄(벽, 'wall') + 줄(바닥, 'floor')
                 : '<div class="empty">아직 텅 빈 카페예요.<br>상점에서 인테리어를 사면 여기에 놓입니다.</div>') +
    '</div>';
}

/* ══════════════════════════════════════════════════════════════
   영업 연출 — 손님이 들어왔다 나가는 모습을 보여 준다
   ══════════════════════════════════════════════════════════════
   받은 손님은 자리에 앉았다가 오른쪽으로 나가고,
   못 받은 손님은 들어오다가 표정이 굳어 돌아 나간다(병목을 눈으로 보게 한다).
   ────────────────────────────────────────────────────────────── */
let 연출중 = null;      // 진행 중인 연출을 끝내는 함수. 인자가 true면 뒷정리만 하고 다음 화면으로 넘어가지 않는다.

function 연출(log, 끝나면) {
  if (연출중) 연출중(true);                 // 앞의 연출이 남아 있으면 조용히 걷어낸다
  const 총시간 = 4200;
  const 느린거싫음 = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (느린거싫음) { 끝나면(); return; }

  const 받은 = log.받은손님, 놓친 = log.놓친손님, 전체 = 받은 + 놓친;
  $('s-play').innerHTML =
    '<h2 class="title">' + log.주차 + '주차 영업 중…</h2>' +
    '<p class="sub">' + esc(st.카페이름 || '내 카페') + '에 손님이 들어옵니다.</p>' +
    가게그림({ 인테리어: (log.인테리어 || (st && st.인테리어) || []) }) +
    '<div class="playbar"><i id="playbar"></i></div>' +
    '<div style="display:flex;align-items:center;gap:10px;margin-top:14px">' +
    '<div style="font-size:14px;color:var(--dim)">받은 손님 <b id="playcount" style="font-size:20px;color:var(--txt)">0</b>명' +
    (전체 ? ' <span style="color:var(--dim)">/ 찾아온 손님 ' + 전체 + '명</span>' : '') + '</div>' +
    '<div style="flex:1"></div><button class="btn sec sm" onclick="연출건너뛰기()">건너뛰기 ▶▶</button></div>';
  화면('s-play');

  const 무대 = $('s-play').querySelector('.scene');
  const 이모지 = (CAT.원본.손님 && CAT.원본.손님.이모지) || ['🧑'];
  const 손님그림 = (CAT.원본.손님 && CAT.원본.손님.이미지) || [];
  const 사람수 = Math.min(14, Math.max(1, 전체));            // 너무 많으면 대표로 몇 명만 걸어다닌다
  const 성공수 = 전체 ? Math.round(사람수 * 받은 / 전체) : 0;
  const 간격 = 총시간 * 0.62 / Math.max(1, 사람수);

  const 애니들 = [];
  for (let i = 0; i < 사람수; i++) 애니들.push(손님하나(무대, i < 성공수, i * 간격, 이모지, 손님그림));

  // 받은 손님 수를 0부터 세어 올린다
  const 시작 = performance.now();
  let 프레임 = null;
  const 세기 = () => {
    const t = Math.min(1, (performance.now() - 시작) / (총시간 * 0.8));
    const n = Math.round(받은 * t);
    const c = $('playcount'), b = $('playbar');
    if (c) c.textContent = n;
    if (b) b.style.width = Math.round(t * 100) + '%';
    if (t < 1) 프레임 = requestAnimationFrame(세기);
  };
  프레임 = requestAnimationFrame(세기);

  const 타이머 = setTimeout(() => 연출건너뛰기(), 총시간);
  연출중 = (뒷정리만) => {
    clearTimeout(타이머);
    if (프레임) cancelAnimationFrame(프레임);
    애니들.forEach(a => { try { a.cancel(); } catch (e) {} });
    if (무대) 무대.querySelectorAll('.guest').forEach(g => g.remove());
    연출중 = null;
    if (!뒷정리만) 끝나면();
  };
}

function 연출건너뛰기() { if (연출중) 연출중(false); }

function 손님하나(무대, 성공, 지연, 이모지, 손님그림) {
  const g = document.createElement('div');
  g.className = 'guest';
  g.innerHTML = 손님그림.length
    ? '<img src="' + esc(CAT.이미지.폴더 + 손님그림[Math.floor(Math.random() * 손님그림.length)]) + '" alt="">'
    : 이모지[Math.floor(Math.random() * 이모지.length)];
  무대.appendChild(g);

  const 폭 = 무대.clientWidth || 320;
  const 자리 = 50 + Math.random() * Math.max(40, 폭 - 150);
  const 시간 = 1700;
  const 길 = 성공
    ? [{ transform: 'translateX(-46px)' },
       { transform: 'translateX(' + 자리 + 'px)', offset: 0.42 },
       { transform: 'translateX(' + 자리 + 'px)', offset: 0.72 },
       { transform: 'translateX(' + (폭 + 46) + 'px)' }]
    : [{ transform: 'translateX(-46px)' },
       { transform: 'translateX(80px)', offset: 0.38 },
       { transform: 'translateX(80px)', offset: 0.58 },
       { transform: 'translateX(-46px)' }];

  const a = g.animate(길, { duration: 시간, delay: 지연, easing: 'ease-in-out', fill: 'both' });
  a.onfinish = () => g.remove();
  if (!성공 && !손님그림.length) setTimeout(() => { if (g.isConnected) g.textContent = '😖'; }, 지연 + 시간 * 0.4);
  return a;
}

/* ══════════════════════════════════════════════════════════════
   영업 결과
   ══════════════════════════════════════════════════════════════ */
function 영업하기() {
  const p = CG.계획(st, 배정);
  if (p.빈업무.length) {
    if (!confirm('아무도 맡지 않은 업무가 있어요. 이대로면 손님을 한 명도 받을 수 없습니다.\n그래도 영업을 시작할까요?')) return;
  } else if (st.예보.숨김) {
    if (!confirm('예약 손님 수를 계산해 보셨나요?\n이대로 영업을 시작할까요?')) return;
  } else if (p.가능손님 < p.예상손님) {
    if (!confirm('이대로 영업하면 ' + (p.예상손님 - p.가능손님) + '명을 놓칩니다.\n그래도 시작할까요?')) return;
  }
  const 그때인테리어 = st.인테리어.slice();   // 연출에 쓸 카페 모습 (영업 뒤에도 그대로)
  const log = CG.영업(st, 배정);
  log.인테리어 = 그때인테리어;
  st._배정 = 배정; 저장();
  클라우드저장(true);              // 한 주가 끝날 때마다 서버에 올린다 (랭킹 갱신 시점)
  연출(log, function () { 결과그리기(log); 화면('s-result'); });
}

function 결과그리기(log) {
  수치그리기();
  const 성공 = log.받은손님 >= log.예상손님;
  // 예전 판에서 저장한 기록에도 안전하게 맞춘다
  const 매출원 = log.매출원 || log.매출;
  const 실지급 = log.실지급 || log.급여;
  const 미지급 = log.미지급 || F(0);
  const 버림 = !매출원.eq(log.매출);
  const 업무표 = log.업무.map(r => {
    const t = CAT.업무별[r.id];
    const 병목 = log.병목 === r.id && !성공;
    return '<div class="taskrow' + (병목 ? ' bottleneck' : '') + '">' +
      '<div class="hd">' + 업무아이콘(t) + '<span class="nm" style="color:' + t.색 + '">' + esc(r.이름) + '</span>' +
      (병목 ? '<span class="badge">여기가 부족했어요</span>' : '') +
      '<span class="cnt">' + r.가능손님정수 + '명</span></div>' +
      '<div class="detail" style="display:block">' +
      '<div class="fin">' + 수(r.식.손님) + '</div></div></div>';
  }).join('');

  const 미션 = log.미션 ? (function () {
    const m = CAT.예약별[log.미션.주차];
    const 우변 = m.총량.sub(m.준비);
    return '<div class="card" style="border-color:' + (log.미션.성공 ? 'var(--green)' : 'var(--red)') + '">' +
      '<h3>' + (log.미션.성공 ? '✅ 예약 주문을 모두 처리했어요' : '❌ 예약 주문이 밀렸어요') + '</h3>' +
      '<div style="font-size:15px;line-height:2.2">' +
      '<div>' + 수(m.준비.toString()) + ' + ' + 수(m.계수.toString()) + ' × x = ' + 수(m.총량.toString()) + '</div>' +
      '<div>' + 수(m.계수.toString()) + ' × x = ' + 수(m.총량.toString()) + ' − ' + 수(m.준비.toString()) + ' = ' + 수(우변.toString()) + '</div>' +
      '<div><b>x = ' + 수(우변.toString()) + ' ÷ ' + 수(m.계수.toString()) + ' = ' + m.답 + '</b> → 예약 손님은 ' + m.답 + '명이었습니다.</div>' +
      '</div></div>';
  })() : '';

  $('s-result').innerHTML =
    '<h2 class="title">' + log.주차 + '주차 영업 결과</h2>' +
    '<div class="card result-hero">' +
    '<div class="n" style="color:' + (성공 ? 'var(--green)' : 'var(--red)') + '">' + log.받은손님 + '명</div>' +
    '<div class="cap">받은 손님 (찾아온 손님 ' + log.예상손님 + '명)</div>' +
    (log.놓친손님 ? '<div class="cap" style="color:var(--red);font-weight:700;margin-top:6px">' +
      조사(esc(log.병목이름), '이', '가') + ' 모자라 ' + log.놓친손님 + '명을 돌려보냈어요</div>' : '') +
    '</div>' +
    미션 +
    '<div class="card"><h3>업무별 처리 결과</h3>' + 업무표 + '</div>' +
    '<div class="card"><h3>이번 주 정산</h3><table class="money">' +
    '<tr><td>손님 1명당 매출<br><span class="sub" style="font-size:12px">(기본 ' +
      (CAT.규칙.손님1명당매출 + st.시설.reduce((a, id) => a + (CAT.시설별[id].매출증가 || 0), 0)) +
      ' × 평판 배수 ' + 분수(CAT.규칙.평판배수[String(log.평판이전)]) + ')</span></td><td>' + 분수(log.단가) + '</td></tr>' +
    '<tr><td>매출 (' + log.받은손님 + '명 × ' + 분수(log.단가) + ' = ' + 분수(매출원) + ')' +
      (버림 ? '<br><span class="sub" style="font-size:12px">코인은 0과 자연수만 쓰므로 소수점 아래는 버립니다</span>' : '') +
      '</td><td class="pos">+' + 분수(log.매출) + '</td></tr>' +
    '<tr><td>직원 급여' +
      (미지급.isPos() ? '<br><span class="sub" style="font-size:12px">가진 돈이 모자라 있는 만큼만 줬습니다</span>' : '') +
      '</td><td class="neg">−' + 분수(실지급) + '</td></tr>' +
    (미지급.isPos()
      ? '<tr><td style="color:var(--red)"><b>못 준 급여 (체불)</b>' +
        '<br><span class="sub" style="font-size:12px">직원들이 실망해 평판이 1 내려갔습니다</span></td>' +
        '<td class="neg">' + 분수(미지급) + '</td></tr>'
      : '') +
    '<tr><td><b>이번 주 순이익</b></td><td class="' + (log.순익.isNeg() ? 'neg' : 'pos') + '"><b>' + 분수(log.순익) + '</b></td></tr>' +
    '<tr><td>보유 코인</td><td>' + 분수(log.코인) + '</td></tr>' +
    '</table></div>' +
    '<div class="card"><h3>평판과 소문</h3>' +
    '<p style="margin:0 0 8px;font-size:15px">평판 <b style="color:var(--gold)">' + 별(log.평판이전) + '</b> → <b style="color:var(--gold)">' + 별(log.평판이후) + '</b>' +
    ' <span class="sub">(' + log.평가 + ')</span></p>' +
    (log.SNS발동
      ? '<p style="margin:0;color:#b3517a;font-weight:700">🔥 SNS에서 화제가 됐어요! 다음 주 손님이 ' + 분수(CAT.규칙.SNS.배수) + '배로 늘어납니다.</p>'
      : '<p style="margin:0" class="sub">SNS 발동 확률은 ' + log.SNS확률 + '%였습니다. (매력도 ' + log.매력도 + ')</p>') +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    (st.끝남
      ? '<button class="btn big gold" onclick="탭(\'s-log\')">시즌 결과 보기 →</button>'
      : '<button class="btn big" onclick="탭(\'s-home\')">' + st.주차 + '주차로 →</button>' +
        '<button class="btn sec big" onclick="탭(\'s-shop\')">상점 들르기</button>') +
    '</div>';
}

/* ══════════════════════════════════════════════════════════════
   상점
   ══════════════════════════════════════════════════════════════ */
function 상점그리기(tab) {
  if (tab) 상점탭 = tab;
  수치그리기();
  const 탭들 = [['hire', '직원 고용'], ['up', '직원 업그레이드'], ['decor', '인테리어'], ['fac', '카페 시설']];
  let 본문 = '';

  if (상점탭 === 'hire') {
    본문 = '<div class="grid g2">' + CAT.직원유형.map(t => {

function 사기(종류, id) {
  let r;
  if (종류 === 'hire') r = CG.고용(st, id);
  if (종류 === 'up') r = CG.업그레이드(st, id);
  if (종류 === 'decor') r = CG.인테리어구매(st, id);
  if (종류 === 'fac') r = CG.시설구매(st, id);
  if (!r.ok) { 알림(r.이유); return; }
  알림('구매했습니다.');
  if (종류 === 'fac' && r.여는업무) 알림('새 업무가 열렸습니다: ' + CAT.업무별[r.여는업무].이름);
  배정정리();
  st._배정 = 배정; 저장(); 클라우드저장();
  상점그리기();
}

      '<button class="btn" onclick="로그인()">구글 로그인</button></div>';

  }

  box.innerHTML = 머리 + '<div class="card"><p class="sub" style="margin:0">불러오는 중…</p></div>';

    console.warn('[랭킹 읽기 실패]', e);
    box.innerHTML = 머리 + '<div class="card"><p style="margin:0 0 10px">랭킹을 불러오지 못했습니다.</p>' +

      '<button class="btn sec sm" style="margin-top:12px" onclick="랭킹그리기()">다시 시도</button></div>';
    return;
  }

  if (!목록.length) {
    box.innerHTML = 머리 + '<div class="card"><p class="sub" style="margin:0">아직 아무도 영업을 마치지 않았습니다.</p></div>';
    return;
  }

  const 메달 = ['🥇', '🥈', '🥉'];
  const 행 = 목록.map((r, i) => {
    const 나 = r.uid === 사용자.uid;
    return '<tr' + (나 ? ' class="me"' : '') + '>' +
      '<td class="medal">' + (메달[i] || (i + 1)) + '</td>' +

        '<small>' + esc(r.name || '') + (나 ? ' · 나' : '') + '</small></td>' +
      '<td>' + (r.finished ? '완주' : (r.week || 1) + '주차') + '</td>' +
      '<td style="color:var(--gold)">' + (r.reputation || 1) + '★</td>' +
      '<td><b>' + 수(String(r.profit != null ? r.profit : '0')) + '</b></td></tr>';
  }).join('');

  const 내순위 = 목록.findIndex(r => r.uid === 사용자.uid);
  box.innerHTML = 머리 +
    '<div class="card"><table class="rank">' +
    '<tr><th>순위</th><th>카페</th><th>진행</th><th>평판</th><th>누적 순이익</th></tr>' + 행 + '</table></div>' +
    (내순위 < 0 ? '<p class="sub">아직 50위 안에 들지 못했습니다. 순이익을 더 쌓아 보세요.</p>'
                : '<p class="sub">내 순위: ' + (내순위 + 1) + '등</p>') +
    '<button class="btn sec sm" onclick="랭킹그리기()">새로고침</button>';

  apiKey:            "AIzaSyAW6nJ_r0PXyWc5II6QzrOuljBsyWhX4dA",
  authDomain:        "online-worksheets.firebaseapp.com",
  databaseURL:       "https://online-worksheets-default-rtdb.firebaseio.com",
  projectId:         "online-worksheets",
  storageBucket:     "online-worksheets.firebasestorage.app",
  messagingSenderId: "404110714320",
  appId:             "1:404110714320:web:cb79c555a383801f3205d5"
};

const app  = initializeApp(FB);
const auth = getAuth(app);
const db   = getFirestore(app);
let 나 = null;

window.CafeCloud = {
  로그인:  () => signInWithPopup(auth, new GoogleAuthProvider()),
  로그아웃: () => signOut(auth),

  /** 요약(랭킹용) + 게임 상태 전체를 문서 하나에 덮어쓴다. */
  저장: async (요약, 상태문자열) => {
    if (!나) return;
    await setDoc(doc(db, 'cafe_students', 나.uid), Object.assign({}, 요약, {
      name: 나.이름,
      state: 상태문자열,
      updatedAt: serverTimestamp()
    }));
  },

  /** 서버에 저장된 내 게임 상태를 되살려 돌려준다. 없으면 null. */
  불러오기: async () => {
    if (!나) return null;
    const snap = await getDoc(doc(db, 'cafe_students', 나.uid));
    if (!snap.exists()) return null;
    const d = snap.data();
    return d.state ? window.CafeGame.불러오기(d.state) : null;
  },

  /** 누적 순이익이 높은 순서로 가져온다. 게임 상태(state 필드)는 빼고 넘긴다. */
  랭킹: async (n) => {
    const q = query(collection(db, 'cafe_students'), orderBy('profitValue', 'desc'), limit(n || 50));
    const snap = await getDocs(q);
    return snap.docs.map(d => {
      const v = d.data();
      delete v.state;
      v.uid = d.id;
      return v;
    });
  }
};

onAuthStateChanged(auth, u => {
  나 = u ? {
    uid: u.uid,
    이름: u.displayName || (u.email || '').split('@')[0] || '학생',
    사진: u.photoURL || ''
  } : null;
  if (typeof window.로그인상태 === 'function') window.로그인상태(나);
});
</script>

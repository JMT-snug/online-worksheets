<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="geometry-v1.0">
<title>도형 이미지 제작</title>
<style>
:root{
  --cream:#faf8f3;--paper:#fff;--rule:#e8e4d9;--rule2:#d6d1c4;
  --ink:#1c1917;--ink2:#44403c;--ink3:#a8a29e;
  --accent:#1d4ed8;--acc-lt:#eff6ff;--acc-dk:#1e40af;
  --green:#15803d;--grn-lt:#dcfce7;
  --red:#b91c1c;--red-lt:#fee2e2;
  --amber:#b45309;--amb-lt:#fef3c7;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;font-size:14px;overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}

/* ── 헤더 ── */
.top{display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;background:var(--paper);border-bottom:1px solid var(--rule);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.brand small{font-size:11px;font-weight:600;color:var(--ink3);margin-left:2px}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--rule);background:var(--cream);cursor:default;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--ink3);display:inline-block;flex:none}
.pill.ok{background:var(--grn-lt);border-color:#86efac;color:#166534}.pill.ok i{background:#16a34a;box-shadow:0 0 0 3px #bbf7d0}
.pill.wait{background:var(--amb-lt);border-color:#fcd34d;color:#92400e}.pill.wait i{background:#d97706;animation:blink 1s infinite}
.pill.off{background:var(--red-lt);border-color:#fca5a5;color:#991b1b;cursor:pointer}.pill.off i{background:#dc2626}
@keyframes blink{50%{opacity:.25}}
.pill u{font-weight:500;text-underline-offset:3px;opacity:.85}
.xbtn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 11px;font-size:13px;color:var(--ink2)}
.xbtn:hover{background:var(--cream)}

/* ── 본문 ── */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:392px minmax(0,1fr);gap:12px;padding:12px}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 1px 2px rgba(28,25,23,.04)}
.card h3{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.3px;margin-bottom:6px}

.cond{padding:9px 13px 10px;flex:none}
.row{display:flex;align-items:center;gap:8px;margin-top:5px}
.row label{width:62px;font-size:12.5px;font-weight:600;color:var(--ink2);flex:none}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;border-right:1px solid var(--rule);background:transparent;padding:5px 11px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.seg button:not(.on):hover:not(:disabled){background:var(--acc-lt)}

.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 13px 6px;display:flex;flex-direction:column;gap:11px}
.msgs::-webkit-scrollbar,.pane::-webkit-scrollbar{width:8px}
.msgs::-webkit-scrollbar-thumb,.pane::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:8px}
.bub{max-width:92%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.bub.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.bub.a{align-self:flex-start;background:var(--cream);border:1px solid var(--rule);border-bottom-left-radius:4px;width:100%;max-width:100%}
.bub.a .t{font-weight:800;font-size:13.5px}
.bub.a .t.err{color:var(--red)}
.bub.a .sum{margin-top:3px;color:var(--ink2);font-size:13px}
.sysmsg{align-self:center;font-size:11.5px;color:var(--ink3);background:#f5f5f4;border-radius:12px;padding:3px 11px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;gap:5px;align-items:flex-start;font-size:12px;line-height:1.4;padding:4px 9px;border-radius:8px;border:1px solid var(--rule2);background:var(--paper);color:var(--ink2)}
.chip b{font-weight:700;white-space:nowrap}
.chip.ok{background:var(--grn-lt);border-color:#86efac;color:#14532d}
.chip.info{background:var(--acc-lt);border-color:#bfdbfe;color:#1e3a8a}
.chip.warn{background:var(--amb-lt);border-color:#fcd34d;color:#78350f}
.chip.err{background:var(--red-lt);border-color:#fca5a5;color:#7f1d1d}
.chip.kept{background:#f5f5f4;color:#57534e}
.sug{margin-top:7px;font-size:12.5px;color:var(--ink2);background:var(--paper);border-left:3px solid var(--amber);padding:6px 9px;border-radius:0 6px 6px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.btn{border:1px solid var(--rule2);background:var(--paper);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.btn:hover{background:var(--acc-lt);border-color:#93c5fd;color:var(--acc-dk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--acc-dk)}
.ex{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.ex button{text-align:left;border:1px dashed #93c5fd;background:var(--acc-lt);color:var(--acc-dk);border-radius:9px;padding:6px 10px;font-size:12.5px;line-height:1.4}
.ex button:hover{background:#dbeafe}
.typing{align-self:flex-start;display:flex;align-items:center;gap:4px;padding:11px 14px;background:var(--cream);border:1px solid var(--rule);border-radius:14px;border-bottom-left-radius:4px}
.typing span{width:7px;height:7px;border-radius:50%;background:#a8a29e;animation:bounce 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.typing em{font-style:normal;font-size:12px;color:var(--ink3);margin-left:6px}

.composer{border-top:1px solid var(--rule);padding:8px 11px 10px;flex:none}
.modebar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.modebar b{font-weight:700}
.quick{display:flex;flex-wrap:nowrap;gap:5px;margin-bottom:7px;overflow-x:auto;padding-bottom:4px}
.quick::-webkit-scrollbar{height:5px}.quick::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:5px}
.quick button{border:1px solid var(--rule2);background:var(--paper);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--ink2);white-space:nowrap;flex:none}
.quick button:hover{background:var(--acc-lt);border-color:#93c5fd;color:var(--acc-dk)}
.inrow{display:flex;gap:7px;align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--rule2);border-radius:10px;padding:8px 10px;font:inherit;font-size:13.5px;line-height:1.5;outline:none;background:var(--cream);min-height:56px;max-height:120px}
textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px #dbeafe}
.send{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;height:56px;font-size:14px;font-weight:700}
.send:hover:not(:disabled){background:var(--acc-dk)}

/* ── 미리보기 ── */
.prev{flex:1.5;min-height:0;display:flex;flex-direction:column}
.ptool{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);flex:none;flex-wrap:wrap}
.ptool .ttl{font-weight:800;font-size:14px}
.ptool .sub{font-size:12px;color:var(--ink3)}
.zoom{display:inline-flex;align-items:center;gap:2px}
.zoom button{border:1px solid var(--rule2);background:var(--paper);width:28px;height:28px;border-radius:7px;font-size:15px;line-height:1;color:var(--ink2)}
.zoom button:hover{background:var(--acc-lt)}
.zoom span{width:46px;text-align:center;font-size:12px;color:var(--ink2)}
.stage{flex:1;min-height:0;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:0 0 var(--r) var(--r)}
.stage.checker{background:conic-gradient(#e7e5e4 25%,#fff 0 50%,#e7e5e4 0 75%,#fff 0) 0 0/20px 20px}
.stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;transition:transform .15s,opacity .2s;display:block}
.stage.busy img{opacity:.35;filter:grayscale(.4)}
.empty{text-align:center;color:var(--ink3);padding:20px;max-width:430px}
.empty .big{font-size:54px;opacity:.55;margin-bottom:6px}
.empty p{font-size:13.5px;line-height:1.6;color:var(--ink2)}
.empty .ex{align-items:stretch;margin-top:14px}
.spin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.55);z-index:3}
.spin .ring{width:38px;height:38px;border:4px solid #dbeafe;border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}
.spin small{color:var(--ink2);font-size:12.5px;font-weight:600}
@keyframes rot{to{transform:rotate(360deg)}}
.cant{border:2px dashed #fca5a5;background:#fff7f7;border-radius:12px;padding:22px 26px;max-width:440px;text-align:center}
.cant .big{font-size:40px}
.cant h4{color:var(--red);margin:4px 0 6px}
.cant p{font-size:13px;color:var(--ink2);line-height:1.6}
.off-card{max-width:480px;text-align:left;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:18px 22px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.off-card h4{font-size:16px;margin-bottom:10px}
.off-card ol{padding-left:20px;font-size:13.5px;line-height:1.9;color:var(--ink2)}
.off-card code{background:var(--cream);border:1px solid var(--rule);border-radius:5px;padding:0 5px;font-size:12.5px}
.off-card .nb{margin-top:10px;font-size:12px;color:var(--ink3);line-height:1.55}

/* ── 탭 ── */
.tabs{flex:1;min-height:210px;display:flex;flex-direction:column}
.tabbar{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--rule);flex:none}
.tabbar button{border:0;background:transparent;padding:9px 12px 8px;font-size:13px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button:hover{color:var(--ink2)}
.tabbar button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabbar .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;font-size:11px;line-height:17px;border-radius:9px;background:var(--amb-lt);color:var(--amber);font-weight:800}
.tabbar .badge.e{background:var(--red-lt);color:var(--red)}
.tabbar .badge.g{background:var(--grn-lt);color:var(--green)}
.pane{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.qbox h5{font-size:12px;color:var(--ink3);margin-bottom:6px;font-weight:700}
.qbox .row label{width:76px}
.slide{display:flex;align-items:center;gap:8px;flex:1}
.slide input[type=range]{flex:1;accent-color:var(--accent)}
.slide em{font-style:normal;width:44px;text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:8px}
.note b{color:var(--green)}
pre.json{font-family:Consolas,'D2Coding',monospace;font-size:12px;line-height:1.55;background:#1c1917;color:#e7e5e4;border-radius:9px;padding:11px 13px;overflow:auto;white-space:pre}
pre.json .k{color:#93c5fd}pre.json .s{color:#86efac}pre.json .n{color:#fcd34d}pre.json .b{color:#f9a8d4}
.copy{position:sticky;float:right;top:0;border:1px solid #57534e;background:#292524;color:#d6d3d1;border-radius:6px;font-size:11.5px;padding:2px 9px}
.iss{border:1px solid var(--rule2);border-left-width:4px;border-radius:8px;padding:8px 11px;margin-bottom:7px;font-size:13px;line-height:1.5}
.iss.error{border-left-color:#dc2626;background:#fff7f7}.iss.warn{border-left-color:#d97706;background:#fffbeb}.iss.info{border-left-color:#2563eb;background:#f8faff}
.iss code{font-size:11.5px;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:0 4px;color:var(--ink3);margin-right:6px}
.iss .sg{margin-top:3px;color:var(--ink2);font-size:12.5px}
.okline{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--grn-lt);border:1px solid #86efac;border-radius:8px;color:#14532d;font-weight:700;font-size:13px;margin-bottom:9px}
details{margin-top:8px;font-size:12.5px;color:var(--ink2)}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
details ul{margin:6px 0 0 18px;line-height:1.7}
.ref{background:var(--cream);border:1px solid var(--rule);border-radius:9px;padding:10px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.7}
.ref small{display:block;color:var(--ink3);font-size:11.5px;margin-bottom:2px;font-weight:700}
.log{font-family:Consolas,'D2Coding',monospace;font-size:12px;line-height:1.75;color:var(--ink2)}
.log div::before{content:attr(data-t);color:var(--ink3);margin-right:9px}

/* ── 아래 막대 ── */
.bar{display:flex;align-items:center;gap:12px;padding:0 16px;height:60px;background:var(--paper);border-top:1px solid var(--rule);flex:none}
.hist{display:flex;align-items:center;gap:6px}
.hist button{border:1px solid var(--rule2);background:var(--paper);border-radius:8px;width:34px;height:34px;font-size:16px;color:var(--ink2)}
.hist button:hover:not(:disabled){background:var(--acc-lt)}
.hist span{font-size:12px;color:var(--ink3);min-width:60px;text-align:center}
.vsep{width:1px;height:30px;background:var(--rule)}
.bar label{font-size:12.5px;color:var(--ink2);font-weight:600}
.bar small{color:var(--ink3);font-size:11.5px}
.go{border:0;background:var(--green);color:#fff;border-radius:10px;padding:0 22px;height:40px;font-size:15px;font-weight:800;box-shadow:0 2px 0 #166534}
.go:hover:not(:disabled){background:#166534}
.go small{display:block;font-size:10.5px;font-weight:500;opacity:.9;margin-top:-1px;color:#fff}
.dl{border:1px solid var(--rule2);background:var(--paper);border-radius:9px;padding:0 14px;height:38px;font-size:13px;font-weight:700;color:var(--ink2)}
.dl:hover:not(:disabled){background:var(--acc-lt)}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#1c1917;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:520px;text-align:center;line-height:1.5}
.toast.show{opacity:1}
.banner{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:35;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;align-items:center;gap:12px}
.banner.show{display:flex}
.banner button{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:8px;padding:3px 10px;font-weight:700;font-size:12.5px}
@media (max-width:900px){body{overflow:auto}.grid{grid-template-columns:1fr;grid-auto-rows:minmax(420px,auto)}.qgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">🧊 도형 이미지 제작 <small>v1.0</small></div>
  <div class="sp"></div>
  <div id="pill" class="pill wait" role="status"><i></i><span id="pillTxt">렌더 서버 확인 중…</span></div>
  <button class="xbtn" id="btnClose" title="이 창 닫기">닫기 ✕</button>
</header>

<main class="grid">
  <section class="col">
    <div class="card cond">
      <h3>이 문항의 조건 <span title="학년과 구하는 값은 AI 가 바꾸지 않아요. 문제에 필요한 길이가 빠졌는지, 그 학년에서 배운 방법으로 풀 수 있는지 대화창 아래에서 알려 드려요." style="cursor:help;font-weight:500">ⓘ</span></h3>
      <div class="row"><label>학년</label>
        <div class="seg" id="segGrade"><button data-v="1">중1</button><button data-v="2">중2</button><button data-v="3">중3</button></div>
      </div>
      <div class="row"><label>구하는 값</label>
        <div class="seg" id="segPurpose"><button data-v="none">없음</button><button data-v="volume">부피</button><button data-v="surface">겉넓이</button><button data-v="both">둘 다</button></div>
      </div>
      <div class="row"><label>그림 종류</label>
        <div class="seg" id="segKind"><button data-v="solid">겨냥도</button><button data-v="net">전개도</button></div>
      </div>
    </div>

    <div class="card chat">
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="modebar"><span id="modeTxt"></span><button class="btn" id="btnMode" style="padding:2px 9px;font-size:12px"></button></div>
        <div class="quick" id="quick"></div>
        <div class="inrow">
          <textarea id="inp" rows="2" placeholder="도형을 말로 설명하세요.&#10;예) 밑면이 한 변 4cm인 정사각형이고 높이가 6cm인 정사각뿔"></textarea>
          <button class="send" id="btnSend">보내기<br><small style="font-weight:500;font-size:10.5px">Enter</small></button>
        </div>
      </div>
    </div>
  </section>

  <section class="col">
    <div class="card prev">
      <div class="ptool">
        <div><div class="ttl" id="pTitle">—</div><div class="sub" id="pSub"></div></div>
        <div class="sp"></div>
        <div class="seg" id="segBg" title="내보낼 이미지의 배경"><button data-v="white">흰 배경</button><button data-v="transparent">투명 배경</button></div>
        <div class="zoom"><button id="zOut" title="줄이기">−</button><span id="zTxt">100%</span><button id="zIn" title="키우기">＋</button><button id="zFit" title="맞춤" style="width:auto;padding:0 8px;font-size:12px">맞춤</button></div>
      </div>
      <div class="stage" id="stage"></div>
    </div>
    <div class="card tabs">
      <div class="tabbar" id="tabbar"></div>
      <div class="pane" id="pane"></div>
    </div>
  </section>
</main>

<footer class="bar">
  <div class="hist"><button id="btnUndo" title="이전 그림으로">↶</button><span id="histTxt">그림 없음</span><button id="btnRedo" title="다음 그림으로">↷</button></div>
  <div class="vsep"></div>
  <label>이미지 크기</label>
  <div class="seg" id="segSize"><button data-v="small">작게</button><button data-v="normal">보통</button><button data-v="large">크게</button></div>
  <small id="sizeTxt"></small>
  <div class="sp"></div>
  <small id="ctx"></small>
  <button class="dl" id="btnPng">⬇ PNG 저장</button>
  <button class="go" id="btnGo">📥 문항에 넣기<small>「도형 제작」 이미지로 첨부돼요</small></button>
</footer>

<div class="toast" id="toast"></div>
<div class="banner" id="banner"><span>✅ 문항에 넣었어요 — 편집기에서 <b>[적용]</b>을 눌러야 저장돼요.</span><button id="banClose">이 창 닫기</button><button id="banStay">계속 고치기</button></div>

<script>
'use strict';
/* ═══════════════ 설정 ═══════════════ */
const AI_URL   = 'https://script.google.com/macros/s/AKfycbxlfk09F9LFEwl7MUeUg3ujfoNOjJomX28SNyjc9lnDBJYJYebBudsxqQtuVk9KZ1Wp/exec';   // edit 의 AI_WEBAPP_URL 과 같은 웹앱(액션 geometryAi)
const AI_TOKEN = 'snug-ai-assist';

async function local(path, body, ms) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 120000);
  try {
    const r = await fetch(LOCAL + path, body === undefined ? { signal: ctl.signal } : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}

async function connect() {
  const my = ++connectSeq, t0 = Date.now();

  const timer = setInterval(() => { if (my !== connectSeq) { clearInterval(timer); return; } const s = (Date.now() - t0) / 1000; S.waitShown = s > 1.8; S.countdown = Math.max(0, 25 - Math.floor(s)); renderTop(); }, 500);
  try {
    const r = await local('/ping', undefined, 25000);
    if (my !== connectSeq) return;
    if (r && r.ok) { S.server = 'ok'; S.info = r; logp('렌더 서버 연결됨 (엔진 ' + (r.engine || '?') + ' · Manim ' + (r.manim || '?') + ')'); } else S.server = 'off';
  } catch (e) { if (my === connectSeq) { S.server = 'off'; logp('렌더 서버 연결 실패: ' + (e && e.name === 'AbortError' ? '시간 초과(25초)' : '접속 거부·차단')); } }
  clearInterval(timer);

}
async function callAi(payload) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 150000), t0 = Date.now();
  try {
    const r = await fetch(AI_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: AI_TOKEN, action: 'geometryAi' }, payload)), signal: ctl.signal });
    const j = await r.json();
    logp('AI(' + payload.mode + ') ' + ((Date.now() - t0) / 1000).toFixed(1) + '초' + (j.ok ? '' : ' — 오류: ' + String(j.error).slice(0, 80)));
    if (!j.ok) throw new Error(j.error || 'AI 오류');

function shapeName(sh) {
  const d = sh.dims || {};
  if (sh.type === 'cuboid' && d.a != null) return '정육면체';
  const sq = (d.base === 'rect') && (d.b == null || d.b === d.a);
  if (sh.type === 'prism' && sq) return '정사각기둥';
  if (sh.type === 'pyramid' && sq) return '정사각뿔';
  if (sh.type === 'prism' && (d.base || 'regular') === 'regular' && NKO[d.n || 3]) return '정' + NKO[d.n || 3] + '각기둥';
  if (sh.type === 'pyramid' && (d.base || 'regular') === 'regular' && NKO[d.n || 4]) return '정' + NKO[d.n || 4] + '각뿔';
  if (sh.type === 'frustum_pyramid' && NKO[d.n || 4]) return '정' + NKO[d.n || 4] + '각뿔대';
  return KO[sh.type] || sh.type;
}
const nfmt = v => (Math.round(v * 100) / 100).toString();
function summarize(spec) {
  const parts = spec.shapes.map(sh => {
    const d = sh.dims || {};
    const dd = Object.keys(d).filter(k => typeof d[k] === 'number' && k !== 'n').slice(0, 4).map(k => (DIMKO[k] || k) + ' ' + nfmt(d[k]) + (k === 'base_area' ? ' cm²' : ' cm'));
    return '<b>' + esc(shapeName(sh)) + '</b>' + (dd.length ? ' · ' + esc(dd.join(' · ')) : '');
  });
  let s = parts.join(' + ');
  if (spec.section) s += ' · 단면';
  if (spec.kind === 'net') s += ' · 전개도';
  return s;
}
function titleOf(spec) {
  const names = spec.shapes.map(shapeName).join(' + ');
  return names + (spec.kind === 'net' ? ' — 전개도' : spec.section ? ' — 단면' : '');
}
function dimNums(spec) {
  const out = [];
  (spec.shapes || []).forEach(sh => Object.keys(sh.dims || {}).forEach(k => { if (typeof sh.dims[k] === 'number') out.push(String(sh.dims[k])); }));
  return out.join(' ');
}

const welcomeMsg = () => ({ role: 'a', title: '🧊 어떤 도형을 만들까요?', text: '도형을 <b>말로</b> 설명해 주세요. 입체의 종류와 길이를 적으면 돼요. 두 도형을 쌓거나 안에 넣고, 자르고, 전개도로 펼치는 것도 말로 할 수 있어요.', examples: true });

/* ═══════════════ 편집기와 주고받기 ═══════════════ */
function post(msg) { if (hasOpener()) { try { window.opener.postMessage(msg, OPENER_ORIGIN); } catch (e) { toast('편집기 창에 연결하지 못했어요.'); } } }
window.addEventListener('message', ev => {
  if (!ORIGINS_OK.includes(ev.origin) && !(location.protocol === 'file:' && ev.origin === 'null')) return;
  if (ev.source !== window.opener) return;
  const d = ev.data || {};
  if (d.type === 'geometry-init') {
    S.label = d.label || '';
    if (d.grade >= 1 && d.grade <= 3) S.grade = d.grade;
    let spec = d.spec;
    if (typeof spec === 'string') { try { spec = JSON.parse(spec); } catch (e) { spec = null; } }
    renderCond();
    if (spec && spec.shapes && spec.shapes.length) restore({ grade: S.grade, spec });
    else { renderCond(); }
  }
});
function sendToQuestion() {
  const f = S.fig; if (!f || S.cant || S.busy) return;
  post({ type: 'geometry-image', dataUrl: 'data:image/png;base64,' + f.png, spec: JSON.stringify(S.spec) });
  S.sent = true; $('#banner').classList.add('show'); logp('편집기 문항에 넣음');
}
function savePng() {
  const f = S.fig; if (!f) return;
  const a = document.createElement('a'); a.href = 'data:image/png;base64,' + f.png;
  a.download = '도형_' + f.title.replace(/[^\w가-힣]+/g, '_') + (S.bg === 'transparent' ? '_투명' : '') + '.png';
  document.body.appendChild(a); a.click(); a.remove(); toast('PNG 파일을 저장했어요.');
}


/* ═══════════════ 흔한 명령은 AI 없이 바로 ═══════════════
   「오른쪽으로 20도」「흑백으로」「점선으로」 같은 시점·꾸밈 명령은 규칙으로 정확하게 처리한다(즉시·무료·항상 같은 결과, 길이는 절대 안 건드림).
   빠른 AI 모델이 설명만 쓰고 값을 안 바꾸거나 이상한 값(depthAngle 360)을 내는 일이 있어서다(2026-11-10). 길이·이름·표시·구조·복잡한 말은 AI 가 맡는다. */
const clampN = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
function quickParse(text, spec) {
  const t = String(text).replace(/\s+/g, ' ').trim();
  if (!spec || t.length > 46) return null;
  if (/(각뿔|원뿔|원기둥|각기둥|직육면체|정육면체|반구|뿔대|구의|전개도|단면|꼭짓점|이름|높이|반지름|모선|cm|센티|\d\s*번)/.test(t) && !/(오른쪽|왼쪽)(으로)?\s*\d*\s*도/.test(t)) return null;
  const ops = [];
  const ortho = () => ((spec.view || {}).projection || 'oblique') === 'ortho';
  let m;
  if (/(돌려|돌리|회전|틀어|기울)/.test(t) && (m = t.match(/(오른쪽|왼쪽)(?:으로)?\s*(\d+)?\s*도?/))) {
    const n = (m[2] ? +m[2] : 20) * (m[1] === '오른쪽' ? 1 : -1);
    ops.push([(n > 0 ? '오른쪽으로 ' : '왼쪽으로 ') + Math.abs(n) + '° 돌렸어요', sp => { const v = Object.assign({}, sp.view); if (v.projection === 'ortho') v.yaw = clampN((v.yaw || 0) + n, -180, 180); else v.depthAngle = clampN((v.depthAngle == null ? 45 : v.depthAngle) + n, -45, 135); sp.view = v; }]);
  }
  if (/(위에서|내려다|밑면.{0,4}넓|윗면.{0,4}넓|위쪽에서)/.test(t) && !/(아래에서|올려다)/.test(t)) ops.push(['위에서 더 내려다보이게 했어요', sp => { const v = Object.assign({}, sp.view); if (v.projection === 'ortho') v.pitch = clampN((v.pitch || 20) + 15, 3, 85); else v.depthScale = clampN((v.depthScale == null ? .5 : v.depthScale) + .2, .1, 1); sp.view = v; }]);
  if (/(아래에서|옆에서|올려다|납작하게)/.test(t)) ops.push(['더 옆에서 보이게 했어요', sp => { const v = Object.assign({}, sp.view); if (v.projection === 'ortho') v.pitch = clampN((v.pitch || 20) - 15, 3, 85); else v.depthScale = clampN((v.depthScale == null ? .5 : v.depthScale) - .2, .1, 1); sp.view = v; }]);
  if (/(기본|처음|원래).{0,3}시점/.test(t)) ops.push(['시점을 기본으로 되돌렸어요', sp => { delete sp.view; }]);
  if (/정사영/.test(t)) ops.push(['정사영으로 바꿨어요', sp => { sp.view = Object.assign({}, sp.view, { projection: 'ortho' }); }]);
  if (/(사각 ?투영|교과서(식|처럼)?)/.test(t)) ops.push(['사각 투영(교과서식)으로 바꿨어요', sp => { sp.view = Object.assign({}, sp.view, { projection: 'oblique' }); }]);
  const st = (k, v, d) => ops.push([d, sp => { sp.style = Object.assign({}, sp.style, { [k]: v }); }]);
  if (/(흑백|인쇄)/.test(t)) st('color', 'bw', '흑백(인쇄용)으로 바꿨어요');
  else if (/(컬러|색으로|색 모드|색깔로|색상으로)/.test(t)) st('color', 'color', '색으로 바꿨어요');
  if (/(가려진|뒤쪽|안 ?보이는|보이지 않는|숨은).{0,8}(없애|지워|숨겨|빼)|숨겨/.test(t)) st('hidden', 'none', '가려진 선을 숨겼어요');
  else if (/점선/.test(t) && !/점선 ?호/.test(t) || /(가려진|뒤쪽|안 ?보이는|보이지 않는|숨은).{0,8}(보이게|표시)/.test(t)) st('hidden', 'dashed', '가려진 선을 점선으로 보이게 했어요');
  if (/배경/.test(t)) { if (/투명/.test(t)) ops.push(['배경을 투명으로 바꿨어요', null, 'bg', 'transparent']); else if (/(흰|하얀)/.test(t)) ops.push(['배경을 흰색으로 바꿨어요', null, 'bg', 'white']); }
  else if (/투명/.test(t)) st('faces', 'none', '면을 투명하게 했어요');
  else if (/(연하게|색칠|칠해|채워)/.test(t)) st('faces', 'light', '면을 연하게 칠했어요');
  if (/화살표/.test(t)) st('dimArc', 'arrow', '길이 표시를 화살표로 바꿨어요');
  else if (/점선 ?호/.test(t)) st('dimArc', 'arc', '길이 표시를 점선 호로 바꿨어요');
  else if (/글자만/.test(t)) st('dimArc', 'none', '길이 표시를 글자만으로 바꿨어요');
  if (/글자.{0,5}(크게|키워)/.test(t)) ops.push(['글자를 키웠어요', sp => { const f = (sp.style || {}).fontScale || 1; sp.style = Object.assign({}, sp.style, { fontScale: clampN(Math.round(f * 125) / 100, .6, 2) }); }]);
  if (/글자.{0,5}(작게|줄여)/.test(t)) ops.push(['글자를 줄였어요', sp => { const f = (sp.style || {}).fontScale || 1; sp.style = Object.assign({}, sp.style, { fontScale: clampN(Math.round(f * 80) / 100, .6, 2) }); }]);
  if (!ops.length) return null;
  return { descs: ops.map(o => o[0]), bg: (ops.find(o => o[2] === 'bg') || [])[3] || null, mutate: sp => ops.forEach(o => o[1] && o[1](sp)), touchesView: ops.some(o => /돌렸|내려다|옆에서|시점|정사영|사각 투영/.test(o[0])) };
}

/* ═══════════════ 이벤트 ═══════════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.ex != null) { ask(EXAMPLES[+t.dataset.ex], true); return; }
  if (t.dataset.q != null) { $('#inp').value = QUICK[+t.dataset.q][1]; $('#inp').focus(); toast('Enter 를 누르면 보내요 — 문장을 고쳐서 보내도 돼요.'); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; renderTabs(); return; }
  if (t.dataset.act) { const [i, j] = t.dataset.act.split(':').map(Number); actFn(S.msgs[i].acts[j]); return; }
  if (t.dataset.act2 === 'viewreset') { redraw(sp => { delete sp.view; }, '기본 시점으로 다시 그리는 중…', '시점을 기본으로 되돌렸어요'); return; }
  if (t.dataset.copy) { navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(S.spec, null, 2)); toast('사양 JSON 을 복사했어요.'); return; }
  if (t.id === 'btnRetry') { connect(); return; }
  if (t.id === 'btnDirect') { location.href = LOCAL + '/geometry.html' + (hasOpener() ? '?o=' + encodeURIComponent(OPENER_ORIGIN === '*' ? '' : OPENER_ORIGIN) : ''); return; }
  if (t.closest('#segGrade')) { S.grade = +t.dataset.v; renderCond(); revalidate('학년을 중' + S.grade + ' 으로 바꿨어요'); return; }
  if (t.closest('#segPurpose')) { S.purpose = t.dataset.v; renderCond(); revalidate('구하는 값을 바꿨어요'); return; }
  if (t.closest('#segKind')) { const k = t.dataset.v; if (!S.spec) { S.kind = k; renderCond(); toast(k === 'net' ? '「…를 전개도로 그려줘」라고 말하면 전개도로 그려요.' : ''); return; } if (k === (S.spec.kind || 'solid')) return; S.kind = k; redraw(sp => { sp.kind = k; if (k === 'net' && !sp.net) sp.net = { layout: 'auto', fold: 'dashed', glueMarks: false }; }, k === 'net' ? '전개도로 펼치는 중…' : '겨냥도로 그리는 중…', k === 'net' ? '전개도로 바꿨어요(길이는 그대로)' : '겨냥도로 바꿨어요'); return; }
  if (t.closest('#segBg')) { S.bg = t.dataset.v; renderCond(); renderStage(); if (S.spec) redraw(() => { }, '배경을 바꿔 다시 그리는 중…'); return; }
  if (t.closest('#segSize')) { S.size = t.dataset.v; renderCond(); if (S.spec) redraw(() => { }, '크기를 바꿔 다시 그리는 중…'); return; }
  if (t.closest('[data-proj]')) { const p = t.dataset.v; redraw(sp => { sp.view = Object.assign({}, sp.view, { projection: p }); }, '투영을 바꿔 다시 그리는 중…', p === 'ortho' ? '정사영으로 바꿨어요(길이는 그대로)' : '사각 투영으로 바꿨어요(길이는 그대로)'); return; }
  if (t.closest('[data-ctrl]')) { const k = t.closest('[data-ctrl]').dataset.ctrl, v = t.dataset.v; redraw(sp => { sp.style = Object.assign({}, sp.style, { [k]: v }); }, '꾸밈을 바꿔 다시 그리는 중…'); return; }
});
function actFn(a) {
  if (a.fn === 'refill') { $('#inp').value = a.val || ''; $('#inp').focus(); S.forceNew = !S.spec ? false : S.forceNew; toast('말을 고쳐서 Enter 로 보내세요.'); }
  else if (a.fn === 'aifix' && S.lastFail) {
    const lf = S.lastFail; guarded(async () => {
      const ctx = lf.ctx; let r = { ok: false, stage: 'validate', issues: lf.errs, spec: lf.spec };
      const fx = await fixLoop(ctx, lf.spec, r, 1); r = fx.r;
      if (r.ok) { if (ctx.editing) S.texts.push(ctx.text); else S.texts = [ctx.text]; S.trusted = dimNums(r.spec); commit(r, '고치기'); S.msgs.push(cardOk(r, ctx)); S.forceNew = false; }
      else { showCant(r, ctx); S.msgs.push(cardFail(r, ctx)); }
    }, 'AI 가 오류를 고치는 중…');
  } else if (a.fn === 'again') { if (S.lastText) { S.msgs.pop(); ask(S.lastText); } }
}
document.addEventListener('input', e => {
  const s = e.target.dataset && e.target.dataset.sl; if (!s) return;
  const el = $('#v-' + s); if (el) el.textContent = e.target.value + (s === 'font' ? '%' : s === 'b' && !viewCtl().ortho ? '%' : '°');
});
document.addEventListener('change', e => {
  const s = e.target.dataset && e.target.dataset.sl; if (!s) return;
  const val = +e.target.value;
  if (s === 'font') redraw(sp => { sp.style = Object.assign({}, sp.style, { fontScale: val / 100 }); }, '글자 크기를 바꿔 다시 그리는 중…');
  else { const c = viewCtl(); const key = (s === 'a' ? c.a : c.b).key;
    redraw(sp => { const v = Object.assign({}, sp.view); v[key] = key === 'depthAngle' ? 45 + val : key === 'depthScale' ? val / 100 : val; sp.view = v; }, '시점을 바꿔 다시 그리는 중…'); }
});
$('#btnSend').onclick = () => { const v = $('#inp').value.trim(); if (v) { $('#inp').value = ''; ask(v); } };
$('#inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#btnSend').click(); } });
$('#btnMode').onclick = () => { S.forceNew = !S.forceNew; renderMsgs(); $('#inp').focus(); };
$('#zIn').onclick = () => { S.zoom = Math.min(3, S.zoom + .25); renderStage(); };
$('#zOut').onclick = () => { S.zoom = Math.max(.25, S.zoom - .25); renderStage(); };
$('#zFit').onclick = () => { S.zoom = 1; renderStage(); };
function gotoHist(i) { const h = S.hist[i]; if (!h) return; S.hi = i; S.spec = clone(h.spec); S.fig = h.fig; S.cant = null; S.kind = h.spec.kind === 'net' ? 'net' : 'solid'; S.purpose = h.spec.purpose || 'none'; S.grade = h.spec.grade || S.grade; S.trusted = dimNums(h.spec); render(); }
$('#btnUndo').onclick = () => { if (S.hi > 0) gotoHist(S.hi - 1); };
$('#btnRedo').onclick = () => { if (S.hi < S.hist.length - 1) gotoHist(S.hi + 1); };
$('#btnGo').onclick = sendToQuestion;
$('#btnPng').onclick = savePng;
$('#banClose').onclick = () => { window.close(); setTimeout(() => toast('이 창은 직접 닫아 주세요.'), 400); };
$('#banStay').onclick = () => $('#banner').classList.remove('show');
$('#btnClose').onclick = () => { window.close(); setTimeout(() => toast('이 창은 직접 닫아 주세요.'), 400); };
$('#pill').onclick = () => { if (S.server === 'off') connect(); };

/* ═══════════════ 시작 ═══════════════ */
S.msgs = [welcomeMsg()];
render();
connect();
if (hasOpener()) post({ type: 'geometry-ready' });      // 편집기가 학년·저장된 사양을 geometry-init 으로 돌려준다
</script>
</body>

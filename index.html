<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수학 학습지+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#faf8f3; --paper:#fff; --rule:#e8e4d9;
  --ink:#1c1917; --ink2:#44403c; --ink3:#a8a29e;
  --accent:#1d4ed8; --acc-lt:#eff6ff;
  --green:#15803d; --grn-lt:#dcfce7;
  --red:#b91c1c; --red-lt:#fee2e2;
  --amber:#b45309; --amb-lt:#fef3c7;
  --r:10px;
  --g1:#1d4ed8; --g2:#15803d; --g3:#b91c1c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:var(--ink);height:52px;display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{font-weight:900;font-size:18px;color:#fff;letter-spacing:-.5px;flex:1}
.logo em{color:#60a5fa;font-style:normal}
#hdr-user{display:none;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.65)}
#hdr-avatar{width:28px;height:28px;border-radius:50%;display:none}
.hdr-btn{padding:4px 11px;border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.hdr-btn:hover{background:rgba(255,255,255,.18)}
.hdr-teacher{background:var(--accent);border-color:var(--accent)}

/* PAGE SYSTEM — all hidden by default */
.page{display:none!important}
.page.active{display:block!important}
#login-page.active{display:flex!important;align-items:center;justify-content:center;min-height:calc(100vh - 52px);padding:40px 20px}

/* LOGIN */
.login-wrap{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:52px 44px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.07)}
.login-mark{width:72px;height:72px;border-radius:18px;background:var(--acc-lt);border:2px solid #bfdbfe;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 24px}
.login-wrap h1{font-size:24px;font-weight:900;margin-bottom:6px}
.login-wrap p{color:var(--ink3);font-size:14px;margin-bottom:36px;line-height:1.7}
.btn-goog{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.btn-goog:hover{border-color:var(--accent);background:var(--acc-lt)}
.btn-goog svg{width:20px;height:20px;flex-shrink:0}

/* DASHBOARD */
#dash-page.active{display:block!important}
#dash-page>main{max-width:1120px;margin:0 auto;padding:32px 24px}
.dash-greet{font-size:24px;font-weight:900;margin-bottom:4px}
.dash-sub{color:var(--ink3);font-size:14px;margin-bottom:28px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}

/* Category colors */
.cat-수와연산{background:#dbeafe;color:#1e40af}
.cat-변화와관계{background:#dcfce7;color:#166534}
.cat-도형과측정{background:#fef3c7;color:#92400e}
.cat-자료와가능성{background:#fce7f3;color:#9d174d}

/* ── MATRIX LAYOUT ── */
.curriculum-matrix{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.matrix-table{width:100%;border-collapse:separate;border-spacing:0;min-width:620px;table-layout:fixed}
.matrix-table colgroup col.col-label{width:90px}
.matrix-table colgroup col.col-grade{width:calc((100% - 90px) / 3)}

/* Column headers (학년) */
.matrix-col-head{
  padding:12px 16px;font-size:13px;font-weight:900;
  text-align:center;border-bottom:2px solid currentColor;
  position:sticky;top:52px;z-index:10;background:var(--cream);
  white-space:nowrap;
}
.matrix-col-head.g1{color:var(--g1);border-color:var(--g1)}
.matrix-col-head.g2{color:var(--g2);border-color:var(--g2)}
.matrix-col-head.g3{color:var(--g3);border-color:var(--g3)}
.matrix-col-head.label{color:var(--ink3);border-color:var(--rule);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding-left:0;position:sticky;left:0;background:var(--cream);z-index:15}

/* Row headers (영역) */
.matrix-row-head{
  padding:8px 12px 8px 0;
  vertical-align:top;
  width:90px;
  min-width:90px;
  position:sticky;
  left:0;
  background:var(--cream);
  z-index:5;
}
.row-head-inner{
  display:flex;align-items:flex-start;gap:8px;
  padding-top:4px;
}
.row-head-bar{width:3px;min-height:40px;border-radius:2px;flex-shrink:0;margin-top:2px}
.row-head-text{font-size:12px;font-weight:700;line-height:1.4;word-break:keep-all}

/* Matrix cells */
.matrix-cell{
  padding:6px 6px 6px 8px;
  vertical-align:top;
  border-left:1px solid var(--rule);
  width:calc((100% - 90px) / 3);
}

/* WS item inside cell */
.ws-item{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:8px;
  padding:12px 14px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:box-shadow .15s,transform .15s;
  margin-bottom:6px;
  border-left-width:3px;
}
.ws-item:last-child{margin-bottom:0}
.ws-item:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}
.ws-item.empty{opacity:.55;cursor:default;border-left-color:var(--rule)!important}
.ws-item.empty:hover{box-shadow:none;transform:none}
.ws-item-title{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.35;word-break:keep-all}
.ws-item-status{font-size:11px;color:var(--ink3)}
.ws-item-done{color:var(--green);font-weight:700}
.ws-item-partial{color:var(--amber);font-weight:700}
.ws-item-coming{font-size:11px;color:var(--ink3);font-style:italic}
.ws-mini-bar{height:3px;border-radius:2px;margin-top:6px;background:var(--rule);overflow:hidden}
.ws-mini-fill{height:100%;border-radius:2px;transition:width .4s}

/* Row separator */
.matrix-row-sep td{padding:0;height:8px}
.matrix-row-sep td+td{border-left:1px solid var(--rule)}

/* Progress dot */
.ws-status{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.s-done{background:var(--grn-lt);color:var(--green)}
.s-partial{background:var(--amb-lt);color:var(--amber)}
.ws-coming-text{font-size:12px;color:var(--ink3);font-style:italic}
.prog-bar-bg{background:var(--rule);border-radius:4px;height:6px;margin-bottom:8px}
.prog-bar{height:6px;border-radius:4px;transition:width .4s}
.ws-stats{display:flex;gap:14px;font-size:12px}
.ws-stat{display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%}
.dot-g{background:var(--green)}.dot-a{background:var(--amber)}

/* QUIZ PAGE */
#quiz-page.active{display:block!important;background:var(--cream);min-height:calc(100vh - 52px)}
#quiz-page>.quiz-shell{max-width:1080px;margin:0 auto;padding:24px 20px}
.quiz-topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.btn-back{padding:6px 14px;border-radius:6px;font-size:13px;background:var(--paper);border:1.5px solid var(--rule);color:var(--ink2);cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-back:hover{background:var(--rule)}
.quiz-ws-title{font-weight:700;font-size:16px;flex:1}
.q-counter{font-size:13px;color:var(--ink3);white-space:nowrap}
.q-progress-strip{display:flex;gap:4px;margin-bottom:20px}
.q-dot{flex:1;height:5px;border-radius:3px;background:var(--rule);transition:background .3s}
.q-dot.done{background:var(--green)}.q-dot.current{background:var(--accent)}
.quiz-cols{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:760px){.quiz-cols{grid-template-columns:1fr}}
.quiz-left{display:flex;flex-direction:column;gap:14px}
.problem-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:24px}
.problem-card .q-num{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.problem-card .q-text{font-size:18px;font-weight:700;line-height:1.55;font-family:'Gowun Dodum',serif}
.canvas-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.canvas-toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--cream);flex-wrap:wrap}
.canvas-toolbar-label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.tool-btn{width:32px;height:32px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .1s,border-color .1s;padding:0}
.tool-btn:hover{background:var(--rule)}.tool-btn.active{background:var(--acc-lt);border-color:var(--accent)}
.color-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s,border-color .1s;flex-shrink:0}
.color-swatch:hover{transform:scale(1.15)}.color-swatch.active{border-color:var(--ink)}
.stroke-slider{-webkit-appearance:none;appearance:none;width:70px;height:4px;border-radius:2px;background:var(--rule);outline:none;cursor:pointer}
.stroke-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);cursor:pointer}
.divider-v{width:1px;height:22px;background:var(--rule);margin:0 2px}
#draw-canvas{display:block;width:100%;cursor:crosshair;touch-action:none;background:#fffef9;background-image:repeating-linear-gradient(transparent,transparent 27px,#e5e0d5 27px,#e5e0d5 28px)}
.quiz-right{display:flex;flex-direction:column;gap:14px}
.answer-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:20px}
.answer-card .a-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
.choices-list{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);font-size:15px;font-family:inherit;cursor:pointer;text-align:left;width:100%;transition:border-color .12s,background .12s;position:relative;overflow:hidden}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--acc-lt)}
.choice-idx{width:26px;height:26px;border-radius:50%;background:var(--rule);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:background .12s,color .12s}
.choice.correct{border-color:var(--green);background:var(--grn-lt)}
.choice.correct .choice-idx{background:var(--green);color:#fff}
.choice.wrong{border-color:var(--red);background:var(--red-lt)}
.choice.wrong .choice-idx{background:var(--red);color:#fff}
.choice:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
.shake{animation:shake .45s ease}
.feedback-strip{display:none;padding:10px 14px;border-radius:7px;font-size:14px;font-weight:500;margin-top:10px;align-items:center;gap:8px}
.feedback-strip.show{display:flex}
.fb-correct{background:var(--grn-lt);color:var(--green)}.fb-wrong{background:var(--red-lt);color:var(--red)}
.attempt-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);padding:8px 14px;background:var(--cream);border:1px solid var(--rule);border-radius:8px}
.attempt-num{font-weight:700;color:var(--amber)}
.btn-clear-canvas{padding:8px 16px;border-radius:7px;border:1.5px solid var(--rule);background:var(--paper);font-size:13px;font-family:inherit;cursor:pointer;color:var(--ink2)}
.btn-clear-canvas:hover{background:var(--rule)}

/* RESULT */
#result-page.active{display:block!important}
#result-page main{max-width:680px;margin:0 auto;padding:32px 20px}
.result-hero{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:40px;text-align:center;margin-bottom:20px}
.score-ring{width:120px;height:120px;border-radius:50%;border:5px solid var(--accent);background:var(--acc-lt);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px}
.score-big{font-size:38px;font-weight:900;color:var(--accent);line-height:1}
.score-of{font-size:14px;color:var(--ink3)}
.result-msg{font-size:22px;font-weight:900;margin-bottom:6px}
.result-sub{color:var(--ink3);font-size:14px}
.result-list{display:flex;flex-direction:column;gap:1px;margin-top:24px}
.result-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule);text-align:left}
.r-icon{font-size:18px;flex-shrink:0;width:22px;text-align:center}
.r-body{flex:1;font-size:14px}
.r-qnum{font-size:11px;color:var(--ink3);font-weight:700;margin-bottom:2px}
.r-tries{font-size:12px;color:var(--amber);margin-top:3px}
.btn-row{display:flex;gap:12px;justify-content:center}
.btn-main{padding:12px 28px;border-radius:8px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--accent);border:none;color:#fff}
.btn-main:hover{opacity:.88}
.btn-sec{padding:12px 24px;border-radius:8px;font-size:15px;font-family:inherit;cursor:pointer;background:var(--paper);border:1.5px solid var(--rule);color:var(--ink2)}
.btn-sec:hover{background:var(--rule)}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fade-up .25s ease}
</style>
</head>
<body>

<header>
  <div class="logo">수학 학습지<em>+</em></div>
  <div id="hdr-user">
    <img id="hdr-avatar" alt="">
    <span id="hdr-name"></span>
    <a href="teacher.html" class="hdr-btn hdr-teacher" id="hdr-teacher-link" style="display:none">관리</a>
    <button class="hdr-btn" id="btn-logout">로그아웃</button>
  </div>
</header>

<!-- LOGIN -->
<div id="login-page" class="page active">
  <div class="login-wrap">
    <div class="login-mark">📐</div>
    <h1>수학 온라인 학습지</h1>
    <p>학교 Google 계정으로 로그인하면<br>학습지를 풀 수 있어요.</p>
    <button class="btn-goog" id="btn-login">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google 계정으로 로그인
    </button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash-page" class="page">
  <main>
    <div class="dash-greet" id="dash-greet">안녕하세요!</div>
    <div class="dash-sub">학습할 단원을 선택하세요.</div>
    <div class="curriculum-matrix">
      <table class="matrix-table" id="matrix-table">
        <!-- JS로 렌더링 -->
      </table>
    </div>
  </main>
</div>

<!-- QUIZ -->
<div id="quiz-page" class="page">
  <div class="quiz-shell">
    <div class="quiz-topbar">
      <button class="btn-back" id="btn-back">← 목록</button>
      <span class="quiz-ws-title" id="quiz-ws-title"></span>
      <span class="q-counter" id="q-counter"></span>
    </div>
    <div class="q-progress-strip" id="q-progress-strip"></div>
    <div class="quiz-cols">
      <div class="quiz-left">
        <div class="problem-card">
          <div class="q-num" id="q-num">문제 1</div>
          <div class="q-text" id="q-text"></div>
        </div>
        <div class="canvas-card">
          <div class="canvas-toolbar">
            <span class="canvas-toolbar-label">풀이 공간</span>
            <button class="tool-btn active" id="tool-pen" title="펜">✏️</button>
            <button class="tool-btn" id="tool-eraser" title="지우개">🧹</button>
            <div class="divider-v"></div>
            <span class="color-swatch active" data-color="#1c1917" style="background:#1c1917"></span>
            <span class="color-swatch" data-color="#1d4ed8" style="background:#1d4ed8"></span>
            <span class="color-swatch" data-color="#15803d" style="background:#15803d"></span>
            <span class="color-swatch" data-color="#b91c1c" style="background:#b91c1c"></span>
            <span class="color-swatch" data-color="#92400e" style="background:#92400e"></span>
            <div class="divider-v"></div>
            <input type="range" class="stroke-slider" id="stroke-size" min="1" max="18" value="3">
            <div class="divider-v"></div>
            <button class="btn-clear-canvas" id="btn-clear">지우기</button>
          </div>
          <canvas id="draw-canvas" height="280"></canvas>
        </div>
      </div>
      <div class="quiz-right">
        <div class="answer-card fade-up">
          <div class="a-label">정답 선택</div>
          <div class="choices-list" id="choices-list"></div>
          <div class="feedback-strip" id="feedback-strip">
            <span class="fb-icon" id="fb-icon"></span>
            <span id="fb-text"></span>
          </div>
        </div>
        <div class="attempt-badge" id="attempt-badge" style="display:none">
          🔄 이번 문제 시도: <span class="attempt-num" id="attempt-num">0</span>회
        </div>
      </div>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result-page" class="page">
  <main>
    <div class="result-hero">
      <div class="score-ring">
        <span class="score-big" id="r-score">0</span>
        <span class="score-of" id="r-of">/ 0</span>
      </div>
      <div class="result-msg" id="r-msg"></div>
      <div class="result-sub" id="r-sub"></div>
      <div class="result-list" id="r-list"></div>
    </div>
    <div class="btn-row">
      <button class="btn-sec" id="btn-retry">다시 풀기</button>
      <button class="btn-main" id="btn-home">목록으로</button>
    </div>
  </main>
</div>

const CAT_CLASS = {
  "수와 연산":"cat-수와연산","변화와 관계":"cat-변화와관계",
  "도형과 측정":"cat-도형과측정","자료와 가능성":"cat-자료와가능성"
};
const GRADE_COLOR = {1:"#1d4ed8",2:"#15803d",3:"#b91c1c"};

const fbApp = initializeApp(FB);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);

let user = null, wsProgress = {}, curWS = null;
let curQIdx = 0, attempts = [], answered = [];

/* ── PAGE SWITCH ── */
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

/* ── AUTH ── */
document.getElementById("btn-login").addEventListener("click", async () => {
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(auth, p); }
  catch(e) { alert("로그인 오류: " + e.message); }
});
document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, async u => {
  if (!u) { showPage("login-page"); updateHeader(null); return; }
  user = u;
  updateHeader(u);
  await loadDash();
});

function updateHeader(u) {
  const hi = document.getElementById("hdr-user");
  if (!u) { hi.style.display = "none"; return; }
  hi.style.display = "flex";
  const av = document.getElementById("hdr-avatar");
  if (u.photoURL) { av.src = u.photoURL; av.style.display = "block"; }
  document.getElementById("hdr-name").textContent = u.displayName || u.email;
  document.getElementById("hdr-teacher-link").style.display =
    TEACHER_EMAILS.includes(u.email) ? "inline-flex" : "none";
}

/* ── DASHBOARD ── */
async function loadDash() {
  showPage("dash-page");
  const name = user.displayName?.split(" ")[0] || "학생";
  document.getElementById("dash-greet").textContent = `안녕하세요, ${name}님! 👋`;
  wsProgress = {};
  try {
    for (const ws of WORKSHEETS) {
      if (!ws.questions.length) continue;
      const snap = await getDoc(doc(db,"results",user.uid,"worksheets",ws.id));
      if (snap.exists()) wsProgress[ws.id] = snap.data();
    }
  } catch(e) { console.warn("진도 로드 실패:", e.message); }
  renderCards();
}

/* ── MATRIX RENDER ── */
const CATEGORIES = ["수와 연산","변화와 관계","도형과 측정","자료와 가능성"];
const GRADES = [1,2,3];
const GRADE_LABEL = {1:"🔵 1학년",2:"🟢 2학년",3:"🔴 3학년"};
const GRADE_CLASS = {1:"g1",2:"g2",3:"g3"};
const CAT_COLOR = {
  "수와 연산":  {bar:"#1e40af", bg:"#dbeafe", text:"#1e40af"},
  "변화와 관계":{bar:"#166534", bg:"#dcfce7", text:"#166534"},
  "도형과 측정":{bar:"#92400e", bg:"#fef3c7", text:"#92400e"},
  "자료와 가능성":{bar:"#9d174d",bg:"#fce7f3", text:"#9d174d"},
};

function renderCards() {
  const tbl = document.getElementById("matrix-table");
  tbl.innerHTML = "";

  // ── COLGROUP ──
  const cg = document.createElement("colgroup");
  const cl = document.createElement("col"); cl.className="col-label"; cg.appendChild(cl);
  GRADES.forEach(()=>{ const c=document.createElement("col"); c.className="col-grade"; cg.appendChild(c); });
  tbl.appendChild(cg);

  // ── THEAD: 학년 헤더 ──
  const thead = tbl.createTHead();
  const hrow = thead.insertRow();
  // 빈 코너셀 (영역 레이블 열)
  const corner = document.createElement("th");
  corner.className = "matrix-col-head label";
  corner.textContent = "영역 / 학년";
  hrow.appendChild(corner);
  GRADES.forEach(g => {
    const th = document.createElement("th");
    th.className = `matrix-col-head ${GRADE_CLASS[g]}`;
    th.textContent = GRADE_LABEL[g];
    hrow.appendChild(th);
  });

  // ── TBODY: 영역 행 ──
  const tbody = tbl.createTBody();
  CATEGORIES.forEach((cat, ci) => {
    if (ci > 0) {
      // 행 구분선
      const sepRow = tbody.insertRow();
      sepRow.className = "matrix-row-sep";
      for (let i = 0; i <= GRADES.length; i++) sepRow.insertCell();
    }

    const row = tbody.insertRow();
    const cc = CAT_COLOR[cat];

    // 영역 레이블 셀
    const rhCell = row.insertCell();
    rhCell.className = "matrix-row-head";
    rhCell.innerHTML = `<div class="row-head-inner">
      <div class="row-head-bar" style="background:${cc.bar};min-height:60px"></div>
      <div class="row-head-text" style="color:${cc.text}">${cat}</div>
    </div>`;

    // 학년별 셀
    GRADES.forEach(g => {
      const cell = row.insertCell();
      cell.className = "matrix-cell";

      const items = WORKSHEETS.filter(ws => ws.grade===g && ws.category===cat);
      if (!items.length) {
        cell.innerHTML = `<div style="height:40px;display:flex;align-items:center;justify-content:center;color:var(--rule);font-size:20px">—</div>`;
        return;
      }

      items.forEach(ws => {
        const prog  = wsProgress[ws.id];
        const total = ws.questions.length;
        const empty = total === 0;
        const solved= prog?.solvedQuestions || 0;
        const done  = !!(prog?.completedAt);
        const rate  = prog?.correctRate ?? 0;
        const pct   = total ? Math.round(solved/total*100) : 0;
        const barC  = rate>=80?"var(--green)":rate>=60?"var(--amber)":"var(--red)";
        const gc    = GRADE_COLOR[g];

        const item = document.createElement("div");
        item.className = "ws-item" + (empty?" empty":"");
        item.style.borderLeftColor = empty ? "var(--rule)" : gc;

        let statusHtml = "";
        if (!empty) {
          if (done)       statusHtml = `<span class="ws-status s-done">완료</span>`;
          else if(solved) statusHtml = `<span class="ws-status s-partial">${solved}/${total}</span>`;
        }

        let bottomHtml = "";
        if (empty) {
          bottomHtml = `<div class="ws-item-coming">준비 중</div>`;
        } else if (done || solved > 0) {
          bottomHtml = `<div class="ws-mini-bar"><div class="ws-mini-fill" style="width:${pct}%;background:${barC}"></div></div>
            <div style="font-size:11px;color:var(--ink3);margin-top:3px">${rate}% · ${prog?.totalAttempts??0}회</div>`;
        } else {
          bottomHtml = `<div style="font-size:11px;color:var(--ink3)">미시작</div>`;
        }

        item.innerHTML = `${statusHtml}<div class="ws-item-title">${ws.title}</div>${bottomHtml}`;
        if (!empty) item.addEventListener("click", () => startQuiz(ws));
        cell.appendChild(item);
      });
    });
  });
}

/* ── QUIZ ── */
function startQuiz(ws) {
  curWS=ws; curQIdx=0;
  attempts=new Array(ws.questions.length).fill(0);
  answered=new Array(ws.questions.length).fill(false);
  showPage("quiz-page");
  document.getElementById("quiz-ws-title").textContent=ws.title;
  buildStrip(); renderQuestion();
}
function buildStrip() {
  const s=document.getElementById("q-progress-strip"); s.innerHTML="";
  curWS.questions.forEach((_,i)=>{
    const d=document.createElement("div");
    d.className="q-dot"+(i===0?" current":" locked");
    d.id="qdot-"+i; s.appendChild(d);
  });
}
function updateStrip() {
  curWS.questions.forEach((_,i)=>{
    const d=document.getElementById("qdot-"+i); if(!d) return;
    d.className="q-dot "+(answered[i]?"done":i===curQIdx?"current":"locked");
  });
}
function renderQuestion() {
  const q=curWS.questions[curQIdx], len=curWS.questions.length;
  document.getElementById("q-num").textContent=`문제 ${curQIdx+1}`;
  document.getElementById("q-text").textContent=q.text;
  document.getElementById("q-counter").textContent=`${curQIdx+1} / ${len}`;
  updateStrip(); clearCanvas();
  const list=document.getElementById("choices-list"); list.innerHTML="";
  q.choices.forEach((c,i)=>{
    const btn=document.createElement("button");
    btn.className="choice";
    btn.innerHTML=`<span class="choice-idx">${i+1}</span><span>${c}</span>`;
    btn.addEventListener("click",()=>handleAnswer(i));
    list.appendChild(btn);
  });
  document.getElementById("feedback-strip").className="feedback-strip";
  const ab=document.getElementById("attempt-badge");
  ab.style.display=attempts[curQIdx]>0?"flex":"none";
  document.getElementById("attempt-num").textContent=attempts[curQIdx];
}
function handleAnswer(sel) {
  const q=curWS.questions[curQIdx], ok=sel===q.answer;
  attempts[curQIdx]++;
  const btns=document.querySelectorAll(".choice");
  btns.forEach(b=>b.disabled=true);
  document.getElementById("attempt-badge").style.display="flex";
  document.getElementById("attempt-num").textContent=attempts[curQIdx];
  if (ok) {
    answered[curQIdx]=true;
    btns[sel].classList.add("correct");
    showFb(true,"정답입니다! 🎉"); updateStrip();
    setTimeout(()=>{
      if (curQIdx<curWS.questions.length-1){
        curQIdx++; renderQuestion();
        const ac=document.querySelector(".answer-card");
        ac.classList.remove("fade-up"); void ac.offsetWidth; ac.classList.add("fade-up");
      } else { finishQuiz(); }
    },900);
  } else {
    btns[sel].classList.add("wrong");
    document.querySelector(".answer-card").classList.add("shake");
    showFb(false,"틀렸어요. 다시 도전해보세요! 💪");
    setTimeout(()=>{
      document.querySelector(".answer-card").classList.remove("shake");
      btns.forEach(b=>{b.disabled=false;b.classList.remove("wrong");});
      document.getElementById("feedback-strip").className="feedback-strip";
    },1100);
  }
}
function showFb(ok,msg){
  const s=document.getElementById("feedback-strip");
  s.className="feedback-strip show "+(ok?"fb-correct":"fb-wrong");
  document.getElementById("fb-icon").textContent=ok?"✅":"❌";
  document.getElementById("fb-text").textContent=msg;
}

async function finishQuiz(){
  showPage("result-page");
  const total=curWS.questions.length;
  const tries=attempts.reduce((s,a)=>s+a,0);
  const rate=100;
  document.getElementById("r-score").textContent=total;
  document.getElementById("r-of").textContent=`/ ${total}`;
  document.getElementById("r-msg").textContent=
    tries===total?"완벽! 모두 첫 번째에 맞췄어요 🏆":
    tries<=total+2?"훌륭해요! 🎉":"끝까지 포기하지 않았어요! 💪";
  document.getElementById("r-sub").textContent=`총 ${tries}번 시도`;
  const list=document.getElementById("r-list"); list.innerHTML="";
  curWS.questions.forEach((q,i)=>{
    const row=document.createElement("div"); row.className="result-row";
    row.innerHTML=`<span class="r-icon">✅</span>
      <div class="r-body"><div class="r-qnum">문제 ${i+1}</div><div>${q.text}</div>
      ${attempts[i]>1?`<div class="r-tries">⟳ ${attempts[i]}번 만에 정답</div>`:""}</div>`;
    list.appendChild(row);
  });
  try {
    const perQ={};
    curWS.questions.forEach((q,i)=>{ perQ[q.id]={attempts:attempts[i]}; });
    await setDoc(doc(db,"results",user.uid,"worksheets",curWS.id),{
      studentEmail:user.email, studentName:user.displayName||"",
      worksheetId:curWS.id, worksheetTitle:curWS.title,
      solvedQuestions:total, totalAttempts:tries, correctRate:rate,
      perQuestion:perQ, completedAt:serverTimestamp(),
    },{merge:true});
    wsProgress[curWS.id]={solvedQuestions:total,totalAttempts:tries,correctRate:rate,completedAt:true};
  } catch(e){ console.error("저장 오류:",e); }
}

document.getElementById("btn-retry").addEventListener("click",()=>startQuiz(curWS));
document.getElementById("btn-home").addEventListener("click",loadDash);
document.getElementById("btn-back").addEventListener("click",loadDash);

/* ── CANVAS ── */
const canvas=document.getElementById("draw-canvas");
const ctx=canvas.getContext("2d");
let drawing=false, penColor="#1c1917", penSize=3, eraser=false, lastX=0, lastY=0;
function resizeCanvas(){
  const w=canvas.parentElement.clientWidth;
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  canvas.width=w; canvas.height=280;
  ctx.putImageData(img,0,0); setCtx();
}
function setCtx(){
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle=eraser?"#fffef9":penColor;
  ctx.lineWidth=eraser?penSize*4:penSize;
}
function getPos(e){
  const r=canvas.getBoundingClientRect();
  const sx=canvas.width/r.width, sy=canvas.height/r.height;
  return e.touches
    ? [(e.touches[0].clientX-r.left)*sx,(e.touches[0].clientY-r.top)*sy]
    : [(e.clientX-r.left)*sx,(e.clientY-r.top)*sy];
}
function startDraw(e){
  e.preventDefault(); drawing=true;
  [lastX,lastY]=getPos(e);
  ctx.beginPath(); ctx.arc(lastX,lastY,(eraser?penSize*4:penSize)/2,0,Math.PI*2);
  ctx.fillStyle=ctx.strokeStyle; ctx.fill();
}
function draw(e){
  if(!drawing) return; e.preventDefault();
  const [x,y]=getPos(e); setCtx();
  ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
  lastX=x; lastY=y;
}
function clearCanvas(){ ctx.clearRect(0,0,canvas.width,canvas.height); }
canvas.addEventListener("mousedown",startDraw);
canvas.addEventListener("mousemove",draw);
canvas.addEventListener("mouseup",()=>drawing=false);
canvas.addEventListener("mouseleave",()=>drawing=false);
canvas.addEventListener("touchstart",startDraw,{passive:false});
canvas.addEventListener("touchmove",draw,{passive:false});
canvas.addEventListener("touchend",()=>drawing=false);
document.getElementById("tool-pen").addEventListener("click",()=>{
  eraser=false;
  document.getElementById("tool-pen").classList.add("active");
  document.getElementById("tool-eraser").classList.remove("active"); setCtx();
});
document.getElementById("tool-eraser").addEventListener("click",()=>{
  eraser=true;
  document.getElementById("tool-eraser").classList.add("active");
  document.getElementById("tool-pen").classList.remove("active"); setCtx();
});
document.getElementById("btn-clear").addEventListener("click",clearCanvas);
document.querySelectorAll(".color-swatch").forEach(sw=>{
  sw.addEventListener("click",()=>{
    eraser=false; penColor=sw.dataset.color;
    document.querySelectorAll(".color-swatch").forEach(s=>s.classList.remove("active"));
    sw.classList.add("active");
    document.getElementById("tool-pen").classList.add("active");
    document.getElementById("tool-eraser").classList.remove("active"); setCtx();
  });
});
document.getElementById("stroke-size").addEventListener("input",e=>{
  penSize=parseInt(e.target.value); setCtx();
});
resizeCanvas(); setCtx();
window.addEventListener("resize",resizeCanvas);
</script>

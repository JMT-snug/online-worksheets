<!-- MathJax: LaTeX 수식 렌더링 -->
<script>
/* 오류 신고용 콘솔 링 버퍼: 페이지 시작부터 콘솔 출력·JS 오류를 최근 150개까지 기록 (🚨 신고 시 함께 저장) */
window._errlog=[];
(function(){
  const MAX=150;
  const push=(l,args)=>{ try{
    const m=args.map(a=>{ try{ return typeof a==='string'?a:JSON.stringify(a); }catch(e){ return String(a); } }).join(' ').slice(0,500);
    window._errlog.push({t:new Date().toISOString().slice(11,19),l,m});
    if(window._errlog.length>MAX) window._errlog.shift();
  }catch(e){} };
  ['log','warn','error','info'].forEach(l=>{ const o=console[l].bind(console); console[l]=function(...a){ push(l,a); o(...a); }; });
  window.addEventListener('error',e=>push('uncaught',[(e.message||'')+' @'+String(e.filename||'').split('/').pop()+':'+(e.lineno||'')]));
  window.addEventListener('unhandledrejection',e=>push('unhandled',[String((e.reason&&e.reason.message)||e.reason).slice(0,300)]));
})();
</script>
<script>
/* 버전 문자열은 <meta name="app-version">을 단일 출처로 읽는다.
   예전에는 여기에 숫자를 따로 적어 두 곳이 어긋날 수 있었고(실제로 meta 8.31 vs VERSION 8.30),
   그러면 ensureLatestVersion이 자기 자신을 "새 버전"으로 판정해
   학습지에 들어갈 때마다 새로고침 안내가 떴다. */
const VERSION = (document.querySelector('meta[name="app-version"]')?.content||"").trim() || "8.32";
document.addEventListener("DOMContentLoaded",()=>{const v=document.getElementById("hdr-version");if(v)v.textContent="v"+VERSION;}); // v[시스템변경].[오류수정] (학습지 추가/수정은 edit.html에서 Firestore로 관리)

window.MathJax = {
  tex: { inlineMath: [['\\(','\\)'],['$','$']], displayMath: [['\\[','\\]']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] },
  startup: { typeset: false }
};
</script>

<style>
:root {
  --cream:#faf8f3; --paper:#fff; --rule:#e8e4d9;
  --ink:#1c1917; --ink2:#44403c; --ink3:#a8a29e;
  --accent:#1d4ed8; --acc-lt:#eff6ff;
  --green:#15803d; --grn-lt:#dcfce7;
  --red:#b91c1c; --red-lt:#fee2e2;
  --amber:#b45309; --amb-lt:#fef3c7;
  --r:10px;
  --g1:#1d4ed8; --g2:#15803d; --g3:#b91c1c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}


/* ── 통일 헤더 (grid 3열) ── */
header{display:grid !important;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hdr-left{display:flex;gap:6px;align-items:center;justify-self:start;flex-wrap:nowrap}
.hdr-center{display:flex;gap:8px;align-items:center;justify-self:center;white-space:nowrap}
.hdr-right{display:flex !important;gap:6px;align-items:center;justify-self:end;flex-wrap:nowrap}
.hdr-nav{display:inline-flex;gap:4px}
.hdr-nav .hdr-btn{padding:5px 10px;font-size:12px}
.hdr-sep{width:1px;height:20px;background:currentColor;opacity:.15;margin:0 4px}

/* ── 그래프 채점 알림 종 ── */
.hdr-bell-wrap{position:relative;display:inline-flex;align-items:center}
.hdr-bell-btn{position:relative;font-size:15px;padding:4px 9px}
.bell-count{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:800;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--ink)}
.bell-panel{display:none;position:absolute;top:calc(100% + 8px);right:0;width:300px;max-height:70vh;overflow-y:auto;background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:300;color:var(--ink);text-align:left;padding:6px}
.bell-panel.show{display:block}
.bell-head{font-size:12px;font-weight:800;color:var(--ink2);padding:8px 10px 6px}
.bell-empty{font-size:13px;color:var(--ink3);padding:22px 12px;text-align:center}
.bell-item{padding:9px 10px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--rule)}
.bell-item:last-of-type{border-bottom:none}
.bell-item:hover{background:var(--acc-lt)}
.bell-item-top{font-size:13px;color:var(--ink);font-weight:600}
.bell-item-mark{font-size:12px;color:var(--ink2);margin-top:2px}
.bell-fb{font-size:12px;color:var(--ink2);margin-top:3px;background:var(--acc-lt);border-radius:6px;padding:4px 7px;white-space:normal;word-break:break-word}
.bell-clear{text-align:center;font-size:12px;color:var(--accent);font-weight:700;padding:9px;cursor:pointer;border-top:1px solid var(--rule);margin-top:2px}
.bell-clear:hover{background:var(--acc-lt);border-radius:0 0 8px 8px}
.notif-dot-in{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:middle;animation:notifPulse 1.6s infinite}
@keyframes notifPulse{0%,100%{opacity:1}50%{opacity:.35}}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:var(--ink);height:52px;display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{font-weight:900;font-size:18px;color:#fff;letter-spacing:-.5px;flex:1}
.logo em{color:#60a5fa;font-style:normal}
#hdr-user{display:none;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.65)}
#hdr-avatar{width:28px;height:28px;border-radius:50%;display:none}
.hdr-btn{padding:4px 11px;border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.hdr-btn:hover{background:rgba(255,255,255,.18)}
.hdr-teacher{background:var(--accent);border-color:var(--accent)}
#hdr-pen-only.active{background:#4c1d95;border-color:#8b5cf6;color:#e9d5ff}

/* ── 🚨 오류 신고 ── */
#bugrep-fab{position:fixed;right:14px;bottom:14px;z-index:8000;display:none;align-items:center;gap:5px;padding:9px 14px;border-radius:22px;border:none;background:#111827;color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:.8;transition:opacity .15s,transform .15s}
#bugrep-fab:hover{opacity:1;transform:translateY(-1px)}
#bugrep-overlay{position:fixed;inset:0;z-index:9000;cursor:crosshair;background:rgba(59,130,246,.05)}
#bugrep-banner{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:9001;background:#111827;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap}
#bugrep-mark{position:fixed;z-index:9002;width:56px;height:56px;border:3px solid #ef4444;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(239,68,68,.25)}
#bugrep-form{position:fixed;z-index:9003;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:18px;width:min(92vw,380px);color:#1f2937}
#bugrep-form textarea{width:100%;height:70px;border:1.5px solid #e5e7eb;border-radius:8px;padding:8px;font-family:inherit;font-size:13px;resize:none;box-sizing:border-box}

/* PAGE SYSTEM — all hidden by default */
.page{display:none!important}
.page.active{display:block!important}
#login-page.active{display:flex!important;align-items:center;justify-content:center;min-height:calc(100vh - 52px);padding:40px 20px}

/* LOGIN */
.login-wrap{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:52px 44px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.07)}
.login-mark{width:72px;height:72px;border-radius:18px;background:var(--acc-lt);border:2px solid #bfdbfe;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 24px}
.login-wrap h1{font-size:24px;font-weight:900;margin-bottom:6px}
.login-wrap p{color:var(--ink3);font-size:14px;margin-bottom:36px;line-height:1.7}
.btn-goog{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.btn-goog:hover{border-color:var(--accent);background:var(--acc-lt)}
.btn-goog svg{width:20px;height:20px;flex-shrink:0}

/* DASHBOARD */
#dash-page.active{display:block!important}
#dash-page>main{max-width:1120px;margin:0 auto;padding:32px 24px}
.dash-greet{font-size:24px;font-weight:900;margin-bottom:4px}
.dash-sub{color:var(--ink3);font-size:14px;margin-bottom:28px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}

/* ── MATRIX: table 기반, sticky 없음 ── */
.matrix-wrap{width:100%;overflow-x:auto}
.matrix-tbl{width:100%;border-collapse:collapse;min-width:540px}

/* 학년 헤더 */
.mth{padding:10px 10px 8px;text-align:center;font-size:13px;font-weight:900;
  border-bottom:2px solid;white-space:nowrap;background:var(--cream)}
.mth-label{text-align:left;font-size:10px;font-weight:700;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.06em;border-bottom-color:var(--rule);width:88px}
.mth-g1{color:var(--g1);border-bottom-color:var(--g1)}
.mth-g2{color:var(--g2);border-bottom-color:var(--g2)}
.mth-g3{color:var(--g3);border-bottom-color:var(--g3)}

/* 영역 행 */
.mtr{border-bottom:1px solid var(--rule)}
.mtr:last-child{border-bottom:none}

/* 영역 레이블 셀 */
.mtd-label{padding:12px 10px 12px 0;vertical-align:top;width:88px;min-width:88px}
.lbl-inner{display:flex;align-items:flex-start;gap:6px}
.lbl-bar{width:3px;border-radius:2px;flex-shrink:0;min-height:32px;margin-top:3px}
.lbl-text{font-size:12px;font-weight:700;line-height:1.4;word-break:keep-all}

/* 학년 데이터 셀 */
.mtd{padding:8px 6px;vertical-align:top;border-left:1px solid var(--rule)}

/* 단원 카드 */
.ws-item{background:var(--paper);border:1px solid var(--rule);border-left-width:3px;
  border-radius:8px;padding:11px 12px;cursor:pointer;position:relative;
  margin-bottom:6px;transition:box-shadow .15s,transform .15s}
.ws-item:last-child{margin-bottom:0}
.ws-item:hover{box-shadow:0 3px 12px rgba(0,0,0,.09);transform:translateY(-1px)}
.ws-item.empty{opacity:.5;cursor:default;border-left-color:var(--rule)!important}
.ws-item.empty:hover{box-shadow:none;transform:none}
.ws-item-title{font-size:13px;font-weight:700;line-height:1.35;word-break:keep-all;margin-bottom:3px}
.ws-item-sub{font-size:11px;color:var(--ink3)}
.ws-item-sub.coming{font-style:italic}
.ws-mini-bar{height:3px;border-radius:2px;margin-top:5px;background:var(--rule);overflow:hidden}
.ws-mini-fill{height:100%;border-radius:2px}
.ws-status{position:absolute;top:9px;right:9px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px}
.s-done{background:var(--grn-lt);color:var(--green)}
.s-partial{background:var(--amb-lt);color:var(--amber)}
.dot{width:7px;height:7px;border-radius:50%}
.dot-g{background:var(--green)}.dot-a{background:var(--amber)}

/* QUIZ PAGE */
#quiz-page.active{display:block!important;background:var(--cream);min-height:calc(100vh - 52px)}
#quiz-page>.quiz-shell{max-width:1100px;margin:0 auto;padding:20px 20px}
.quiz-topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.btn-back{padding:6px 14px;border-radius:6px;font-size:13px;background:var(--paper);border:1.5px solid var(--rule);color:var(--ink2);cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-back:hover{background:var(--rule)}
.quiz-ws-title{font-weight:700;font-size:15px;flex:1}
.q-progress-strip{display:flex;gap:3px;margin-bottom:14px}
.q-dot{flex:1;min-height:26px;border-radius:6px;background:var(--rule);transition:background .3s,color .3s;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#94a3b8;user-select:none}
.q-dot.current{background:var(--accent);color:#fff!important}
.q-dot.done{background:#16a34a;color:#fff!important}
.q-dot.locked{background:var(--rule);color:#94a3b8}
.q-dot.link-dot{background:#dbeafe;color:#2563eb;font-size:13px}
.q-dot.link-dot.current{background:var(--accent);color:#fff!important}
.q-dot.link-dot.done{background:#16a34a;color:#fff!important}
.q-dot.done{background:var(--green)}.q-dot.current{background:var(--accent)}
/* 좌우 분할 */
.quiz-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:720px){.quiz-cols{grid-template-columns:1fr}}
/* 왼쪽: 문제+입력 */
.quiz-left{display:flex;flex-direction:column;gap:0}
.problem-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r) var(--r) 0 0;padding:18px 18px 14px}
.problem-card .q-num{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.q-diff{color:var(--amber);font-size:11px}
.problem-card .q-text{font-size:16px;font-weight:400;line-height:1.7}
.problem-card .eq{color:var(--ink);font-size:18px;line-height:1.8}
/* 수식 입력 영역 */
.math-input-card{background:var(--paper);border:1px solid var(--rule);border-top:none;border-radius:0 0 var(--r) var(--r);padding:12px 14px 14px}
.ans-hint{font-size:10px;color:var(--ink3);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.ans-hint strong{color:var(--ink2);font-size:12px}
/* 답 표시창 */
.ans-display{min-height:56px;padding:8px 16px;border:1.5px solid var(--rule);
  border-radius:12px 12px 0 0;background:var(--paper);
  cursor:text;display:flex;align-items:center;
  transition:border-color .15s;overflow-x:auto}
.ans-display.focused{border-color:var(--accent)}
.ans-cur{color:var(--accent);animation:blink 1s infinite;font-weight:300;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
/* 분수 칩 */
.chip-frac{display:inline-flex;flex-direction:column;align-items:center;
  font-family:'Courier New',monospace;font-size:14px;line-height:1;
  vertical-align:middle;margin:0 3px;
  border:1.5px solid var(--accent);border-radius:6px;overflow:hidden;background:var(--acc-lt)}
.chip-frac .fn{padding:3px 8px;border-bottom:1.5px solid var(--accent);
  min-width:22px;text-align:center;font-weight:700}
.chip-frac .fd{padding:3px 8px;min-width:22px;text-align:center;font-weight:700}
.chip-frac .fn.ap{background:#fff;outline:2px solid var(--accent);outline-offset:-1px}
.chip-frac .fd.ap{background:#fff;outline:2px solid var(--accent);outline-offset:-1px}
/* 문제 텍스트 안 수직 분수 */
.math-u{text-decoration:underline;text-underline-offset:3px}
.frac-inline{display:inline-flex;flex-direction:column;align-items:center;
  font-family:'Courier New',monospace;font-size:15px;line-height:1.1;
  vertical-align:middle;margin:0 3px;color:inherit}
.frac-inline .fi-n{border-bottom:1.5px solid currentColor;padding:0 4px;min-width:16px;text-align:center;font-weight:700}
.frac-inline .fi-d{padding:0 4px;min-width:16px;text-align:center;font-weight:700}
/* 지수 칩 */
.chip-exp{display:inline-flex;align-items:flex-start;font-family:'Courier New',monospace;vertical-align:middle;margin:0 1px}
.chip-exp .base{font-size:17px;line-height:1}
.chip-exp .expo{font-size:11px;color:#fff;background:var(--accent);border-radius:3px;padding:1px 4px;min-width:14px;text-align:center;margin-top:-10px}
.chip-exp .expo.ap{background:var(--amber)}
/* 일반 토큰 */
.tok{font-family:'Courier New',monospace;font-size:17px;vertical-align:middle}
/* 키패드 */
/* ── poly-quiz 스타일 키패드 ── */
.kbd-wrap{background:var(--cream);border:1px solid var(--rule);border-top:none;border-radius:0 0 var(--r) var(--r);padding:7px}
.kbd-var-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.kbd-var-row .kb{flex:1;min-width:36px;font-size:1.1rem}
.kb.enter{background:var(--accent);color:#fff;font-weight:700;grid-column:auto}
.kbd-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.kb{background:var(--paper);border:1px solid var(--rule);border-radius:7px;
  padding:9px 3px;color:var(--ink);font-size:1rem;font-family:'Courier New',monospace;
  cursor:pointer;text-align:center;transition:all .08s;user-select:none;
  box-shadow:0 1px 3px rgba(0,0,0,.08);min-height:40px;
  display:flex;align-items:center;justify-content:center;}
.kb:hover{background:var(--acc-lt);}
.kb:active{transform:scale(.93);box-shadow:none;}
.kb.v{color:var(--accent);font-weight:700;}
.kb.op{color:var(--amber);}
.kb.ac{background:var(--red-lt);color:var(--red);border-color:#fca5a5;}
.kb.sub{grid-column:span 6;background:var(--accent);border-color:var(--accent);
  color:#fff;font-size:.95rem;font-weight:700;font-family:inherit;padding:11px;}
.kb.w2{grid-column:span 2;}
.kb.w3{grid-column:span 3;}
/* 분수 미리보기 */
.frac-prev{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;font-size:9px;font-family:'Courier New',monospace}
.frac-prev .fn{border-bottom:1.5px solid currentColor;padding:0 2px;min-width:10px;text-align:center}
.frac-prev .fd{padding:0 2px;min-width:10px;text-align:center}
.exp-prev{display:inline-flex;align-items:flex-start;font-family:'Courier New',monospace;font-size:12px}
.exp-prev sup{font-size:7px;margin-top:-1px;border:1px solid currentColor;border-radius:2px;padding:0 2px}
/* 제출 */
.ans-btns{display:flex;gap:8px;margin-top:8px}
.btn-submit{flex:2;padding:9px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-submit:hover{opacity:.85}
.btn-clr-ans{flex:1;padding:9px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink3);font-size:13px;cursor:pointer;font-family:inherit}
/* 피드백 */
.feedback-strip{display:none;margin-top:8px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:700;align-items:center;gap:7px}
.feedback-strip.show{display:flex}
.fb-correct{background:var(--grn-lt);color:var(--green)}.fb-wrong{background:var(--red-lt);color:var(--red)}
.attempt-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-top:6px}
.attempt-num{font-weight:700;color:var(--amber)}
/* 오른쪽: 그림판 */
.canvas-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;position:sticky;top:72px}
.canvas-toolbar{display:flex;align-items:center;gap:3px;padding:6px 8px;border-bottom:1px solid var(--rule);background:var(--cream);flex-wrap:nowrap;overflow:hidden}
.canvas-toolbar-label{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.tool-btn{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0}
.tool-btn.active{background:var(--acc-lt);border-color:var(--accent)}
.color-swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.color-swatch.active{border-color:var(--ink)}
.stroke-slider{-webkit-appearance:none;appearance:none;width:60px;height:4px;border-radius:2px;background:var(--rule);outline:none;cursor:pointer}
.stroke-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);cursor:pointer}
.divider-v{width:1px;height:20px;background:var(--rule);margin:0 2px}
#draw-canvas{display:block;width:100%;cursor:crosshair;touch-action:none;background:#fffef9;background-image:repeating-linear-gradient(transparent,transparent 27px,#e5e0d5 27px,#e5e0d5 28px)}

/* L자 연습장 — 문제 영역 위에도 그릴 수 있음 */
.quiz-left{display:flex;flex-direction:column;min-height:600px}
.quiz-left > .problem-card{flex-shrink:0}
.quiz-left > .problem-card.mq{min-height:280px}  /* 선택형: 문제/필기 영역 고정 확보 */
.quiz-left > .math-input-card{margin-top:auto}
.quiz-left > .step3-wrap{margin-top:auto}

.quiz-left{position:relative}
#problem-canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair;background:transparent;border:1px solid var(--rule);border-radius:var(--r);z-index:3}
.quiz-left > .problem-card{position:relative;z-index:1;pointer-events:none;background:transparent;border:none;box-shadow:none}
.quiz-left > .problem-card img{pointer-events:none}
.quiz-left > .math-input-card,
.quiz-left > .step3-wrap,
.quiz-left > .canvas-card{position:relative;z-index:4;pointer-events:auto;background:var(--paper)}

@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.shake{animation:shake .4s ease}

/* RESULT */
#result-page.active{display:block!important}
#result-page main{max-width:680px;margin:0 auto;padding:32px 20px}
.result-hero{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:40px;text-align:center;margin-bottom:20px}
.score-ring{width:120px;height:120px;border-radius:50%;border:5px solid var(--accent);background:var(--acc-lt);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px}
.score-big{font-size:38px;font-weight:900;color:var(--accent);line-height:1}
.score-of{font-size:14px;color:var(--ink3)}
.result-msg{font-size:22px;font-weight:900;margin-bottom:6px}
.result-sub{color:var(--ink3);font-size:14px}
.result-list{display:flex;flex-direction:column;gap:1px;margin-top:24px}
.result-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule);text-align:left}
.r-icon{font-size:18px;flex-shrink:0;width:22px;text-align:center}
.r-body{flex:1;font-size:14px}
.r-qnum{font-size:11px;color:var(--ink3);font-weight:700;margin-bottom:2px}
.r-tries{font-size:12px;color:var(--amber);margin-top:3px}
.btn-row{display:flex;gap:12px;justify-content:center}
.btn-main{padding:12px 28px;border-radius:8px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--accent);border:none;color:#fff}
.btn-main:hover{opacity:.88}
.btn-sec{padding:12px 24px;border-radius:8px;font-size:15px;font-family:inherit;cursor:pointer;background:var(--paper);border:1.5px solid var(--rule);color:var(--ink2)}
.btn-sec:hover{background:var(--rule)}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fade-up .25s ease}

/* ── 섹션 헤더 ── */
.section-banner{padding:10px 18px;border-radius:var(--r);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.section-banner.review{background:var(--amb-lt);border:1px solid var(--amber)}
.section-banner.concept{background:var(--acc-lt);border:1px solid var(--accent)}
.section-banner.practice{background:var(--grn-lt);border:1px solid var(--green)}
.section-banner .s-icon{font-size:18px}
.section-banner .s-label{font-size:13px;font-weight:700}
.section-banner .s-desc{font-size:12px;color:var(--ink3);margin-left:auto}

/* ── 개념학습 카드 ── */
.concept-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:0}
.concept-section-title{font-size:13px;font-weight:700;padding:12px 16px 0;color:var(--ink2);display:flex;align-items:center;gap:6px}
.concept-section-title::before{content:'';display:inline-block;width:3px;height:14px;border-radius:2px;background:var(--accent)}
.concept-body{padding:12px 16px 14px;font-size:14px;line-height:2}
.concept-body .c-line{margin-bottom:4px;display:flex;align-items:baseline;flex-wrap:wrap;gap:3px}
/* 예시 박스 */
.example-box{background:var(--cream);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px}
.example-box .ex-title{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.example-eq{font-family:'Courier New',monospace;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.example-eq .arrow{color:var(--ink3);font-size:12px}
.example-eq .label{font-size:11px;color:var(--ink3);border-bottom:1px solid var(--ink3)}
/* 빈칸 */
.blank{display:inline-flex;align-items:center;justify-content:center;
  min-width:60px;height:26px;border-bottom:1.5px solid var(--ink);
  font-weight:700;color:var(--accent);cursor:pointer;
  background:transparent;border-radius:0;padding:0 4px;
  font-family:'Noto Sans KR',sans-serif;font-size:14px;
  position:relative}
.blank input{position:absolute;inset:0;width:100%;height:100%;
  border:none;background:transparent;text-align:center;
  font-weight:700;color:var(--accent);font-size:14px;
  font-family:'Noto Sans KR',sans-serif;outline:none;cursor:pointer}
.blank.correct{border-bottom-color:var(--green);background:var(--grn-lt)}
.blank.correct input{color:var(--green)}
.blank.wrong{border-bottom-color:var(--red);background:var(--red-lt)}
.blank.wrong input{color:var(--red)}
/* 개념 답안 제출 */
.concept-submit-row{padding:0 16px 14px;display:flex;align-items:center;gap:10px}
.btn-concept-check{padding:8px 20px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.concept-fb{font-size:13px;font-weight:700}
.concept-fb.ok{color:var(--green)}.concept-fb.ng{color:var(--red)}
/* 예제 풀이 카드 */
.example-solve-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.example-solve-head{padding:10px 16px;background:var(--cream);border-bottom:1px solid var(--rule);font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.example-solve-body{padding:14px 16px;font-size:14px;line-height:1.8}
.example-solve-body .eq{font-family:'Courier New',monospace;font-size:15px;color:var(--ink)}
.example-solve-body .step{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.example-solve-body .step-num{font-size:11px;font-weight:700;color:var(--ink3);min-width:20px}
/* 단답형 예제 입력 */
.example-ans-row{display:flex;align-items:center;gap:10px;padding:10px 16px 14px}
.example-ans-label{font-size:13px;font-weight:700;color:var(--ink2)}
.example-ans-input{width:80px;height:34px;border:1.5px solid var(--rule);border-radius:7px;text-align:center;font-size:16px;font-family:'Courier New',monospace;font-weight:700;color:var(--ink)}
.example-ans-input:focus{outline:none;border-color:var(--accent)}
.btn-ex-check{padding:7px 16px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.ex-fb{font-size:13px;font-weight:700}
.ex-fb.ok{color:var(--green)}.ex-fb.ng{color:var(--red)}

/* ── multi 타입: 동류항 선택 ── */
.multi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.multi-grid.cols4{grid-template-columns:repeat(4,1fr)}
.multi-grid.cols3{grid-template-columns:repeat(3,1fr)}
.multi-grid.cols2{grid-template-columns:repeat(2,1fr)}
.multi-grid.cols1{grid-template-columns:1fr}
.multi-grid.cols1 .multi-opt{text-align:left;justify-content:flex-start;padding:10px 14px}
.multi-opt{background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;
  padding:8px 4px;font-size:14px;font-family:'Courier New',monospace;
  color:var(--ink);cursor:pointer;text-align:center;
  transition:all .12s;user-select:none;min-height:40px;
  display:flex;align-items:center;justify-content:center;}
.multi-opt:hover{border-color:var(--accent)}
.multi-opt.sel{background:var(--acc-lt);border-color:var(--accent);color:var(--accent);font-weight:700}
.multi-opt.ok{background:var(--grn-lt);border-color:var(--green);color:var(--green)}
.multi-opt.ng{background:var(--red-lt);border-color:var(--red);color:var(--red)}
.btn-multi-submit{width:100%;padding:10px;border-radius:8px;border:none;
  background:var(--accent);color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-top:4px}

/* ── 3단계 풀이 (활용2용) ── */
.step3-wrap{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.step3-tabs{display:flex;border-bottom:1px solid var(--rule)}
.step3-tab{flex:1;padding:9px;font-size:12px;font-weight:700;text-align:center;
  cursor:pointer;color:var(--ink3);background:var(--cream);border:none;
  transition:background .15s,color .15s;font-family:inherit}
.step3-tab.active{background:var(--paper);color:var(--accent);border-bottom:2px solid var(--accent)}
.step3-tab.done{color:var(--green)}
.step3-tab.locked{opacity:.4;cursor:default}
.step3-body{padding:14px 16px}
.step3-label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:0;line-height:1.6}
.step3-hint{font-size:12px;color:var(--ink3);margin-bottom:8px;background:var(--cream);padding:6px 10px;border-radius:6px}
/* word input for step3 */
.word-inp-full{width:100%;height:38px;font-size:15px;font-weight:700;
  border:1.5px solid var(--accent);border-radius:8px;
  padding:0 12px;font-family:inherit;color:var(--ink);
  background:var(--paper);outline:none;box-sizing:border-box;margin-bottom:8px}

/* ── unit-page 학습지 목록 카드 ── */
.ws-list-card{
  background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);
  padding:14px 20px;margin-bottom:10px;cursor:pointer;
  display:grid;
  grid-template-columns:40px 1fr auto auto;
  grid-template-rows:auto auto;
  align-items:center;gap:0 14px;
  transition:box-shadow .15s,transform .15s;
  position:relative;overflow:hidden;
}
.ws-list-card::before{content:'';position:absolute;left:0;top:0;bottom:0;
  width:4px;background:var(--accent);opacity:0;transition:opacity .15s}
.ws-list-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.09);transform:translateY(-1px)}
.ws-list-card:hover::before{opacity:1}
.ws-list-card.empty{opacity:.55;cursor:default;pointer-events:none}
.wslc-icon{width:44px;height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  background:var(--acc-lt)}
.wslc-body{min-width:0;grid-column:2;grid-row:1}
.wslc-title{font-size:15px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wslc-meta{font-size:12px;color:var(--ink3)}
.wslc-icon{grid-column:1;grid-row:1/3;align-self:center;font-size:22px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.teacher-cls-row{display:flex;flex-wrap:wrap;gap:4px;padding-top:6px;grid-column:2/5;grid-row:2;align-items:center}
.cls-tog{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;border:1.5px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;transition:all .15s;font-family:inherit}
.cls-tog:hover{opacity:.8}
/* 잠금=빨강 / 열림=초록 (두 상태 모두 완료율 따라 왼쪽부터 채움: <30% 없음, 30~50% 1/3, 50~80% 2/3, 80%↑ 전체) */
.cls-tog.cls-locked{color:#b91c1c;border-color:#dc2626}
.cls-tog.cls-open{color:#15803d;border-color:#15803d}
.cls-tog.fill-0{background:transparent}
.cls-tog.cls-open.fill-1{background:linear-gradient(90deg,#86efac 0 33.3%,transparent 33.3%)}
.cls-tog.cls-open.fill-2{background:linear-gradient(90deg,#86efac 0 66.6%,transparent 66.6%)}
.cls-tog.cls-open.fill-3{background:#86efac}
.cls-tog.cls-locked.fill-1{background:linear-gradient(90deg,#fca5a5 0 33.3%,transparent 33.3%)}
.cls-tog.cls-locked.fill-2{background:linear-gradient(90deg,#fca5a5 0 66.6%,transparent 66.6%)}
.cls-tog.cls-locked.fill-3{background:#fca5a5}
/* ── 파트 잠금 ── */
.q-progress-strip.has-parts{display:grid;gap:3px}
.strip2-part{padding:3px 6px;border-radius:6px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px}
.strip2-part.open{background:#e0e7ff;color:#4338ca}
.strip2-part.locked{background:#f1f5f9;color:#94a3b8}
.strip2-part.none{background:transparent}
.strip2-part.clickable{cursor:pointer}
.strip2-part.clickable:hover{filter:brightness(.95)}
#part-pop{position:fixed;z-index:10000;background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:12px;min-width:210px;max-width:280px}
.q-dot.part-locked{opacity:.3;pointer-events:none;filter:grayscale(1)}
#q-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#q-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.part-matrix{width:100%;display:flex;flex-direction:column;gap:4px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--rule)}
.part-matrix-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.part-matrix-name{font-size:11px;font-weight:700;color:#4338ca;min-width:64px}
.cls-tog.cls-mini{padding:2px 7px;font-size:10px;border-radius:9px}
.teacher-ws-note{font-size:11px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.wslc-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrapgrid-column:3;grid-row:1;align-self:center;white-space:nowrap}
/* 단원 셀 배지 (학습지 수) */
.unit-ws-badge{position:absolute;top:8px;right:8px;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;
  background:var(--accent);color:#fff}
#unit-page.active{display:block!important}


/* 용어 학습 선택지 버튼 */
.vq-choice{width:100%;padding:14px 12px;border-radius:10px;border:1.5px solid var(--rule);
  background:var(--paper);cursor:pointer;font-size:13px;font-family:inherit;
  text-align:left;line-height:1.5;word-break:keep-all;
  transition:background .12s,border-color .12s;color:var(--ink)}
.vq-choice:hover:not(:disabled){background:var(--acc-lt);border-color:var(--accent)}
.vq-choice:disabled{cursor:default}
/* ── 교사 진도 체크 패널 ── */
#t-progress-btn{position:fixed;bottom:24px;right:24px;z-index:900;
  background:var(--accent);color:#fff;border:none;border-radius:50%;
  width:52px;height:52px;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);
  display:none;align-items:center;justify-content:center}
#t-progress-panel{position:fixed;right:0;top:0;height:100%;width:min(420px,95vw);
  background:var(--paper);border-left:1px solid var(--rule);z-index:950;
  transform:translateX(100%);transition:transform .25s;overflow:hidden;
  display:flex;flex-direction:column}
#t-progress-panel.open{transform:translateX(0)}
.tp-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;
  border-bottom:1px solid var(--rule);flex-shrink:0}
.tp-title{font-size:15px;font-weight:700;flex:1}
.tp-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink3);padding:4px}
.tp-body{flex:1;overflow-y:auto;padding:12px 16px}
.tp-ws-card{margin-bottom:14px;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tp-ws-title{font-size:13px;font-weight:700;padding:8px 12px;background:var(--cream)}
.tp-class-row{display:grid;grid-template-columns:60px 1fr auto;gap:6px;
  align-items:center;padding:5px 12px;border-top:1px solid var(--rule)}
.tp-cls-label{font-size:12px;font-weight:600;color:var(--ink3)}
.tp-bar-bg{background:var(--rule);border-radius:4px;height:8px;overflow:hidden}
.tp-bar-fill{height:100%;border-radius:4px;transition:width .3s}
.tp-cls-num{font-size:12px;font-weight:700;min-width:40px;text-align:right}
.tp-refresh{font-size:11px;color:var(--ink3);padding:8px 16px;text-align:right;flex-shrink:0}
</style>
</head>
<body>

<header>
  <div class="hdr-left">
    <button class="hdr-btn hdr-teacher" id="hdr-sync-progress" style="display:none" onclick="syncAutoProgress()" title="모든 학습지의 학급별 완료율을 다시 계산합니다">📊 진도 동기화</button>
    <a class="hdr-btn" id="hdr-manual" style="display:none" target="_blank" rel="noopener" title="사용 방법 안내">📖 매뉴얼</a>
    <button class="hdr-btn" id="hdr-pen-only" onclick="togglePenOnlyMode()"
      title="켜면 그림 그리기 캔버스에서 손가락 터치는 무시됩니다(필기 중 손바닥 오터치 방지). 펜이 고장났으면 꺼 주세요.">✏️ 펜 전용</button>
  </div>
  <div class="hdr-center">
    <div class="logo" style="margin:0">수학 학습지<em>+</em></div>
    <span id="hdr-version" style="font-size:10px;font-weight:400;color:var(--ink3);opacity:0.5;font-family:monospace"></span>
  </div>
  <div class="hdr-right" id="hdr-user">
    <div class="hdr-nav">
      <a href="teacher.html" class="hdr-btn hdr-teacher" id="hdr-teacher-link" style="display:none">관리</a>
      <a href="scoring.html" class="hdr-btn hdr-teacher" id="hdr-scoring-link" style="display:none">채점</a>
      <a href="edit.html" class="hdr-btn hdr-teacher" id="hdr-edit-link" style="display:none">편집</a>
      <a href="report.html" class="hdr-btn hdr-teacher" id="hdr-report-link" style="display:none" title="오류 신고 목록 (기본 교사 전용)">신고</a>
    </div>
    <div class="hdr-bell-wrap" id="hdr-bell-wrap" style="display:none">
      <button class="hdr-btn hdr-bell-btn" id="hdr-bell" title="채점 알림">🔔<span id="hdr-bell-count" class="bell-count" style="display:none"></span></button>
      <div class="bell-panel" id="hdr-bell-panel"></div>
    </div>
    <div class="hdr-sep"></div>
    <img id="hdr-avatar" alt="">
    <span id="hdr-name"></span>
    <button class="hdr-btn" id="btn-logout">로그아웃</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadString, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const FB = {
  apiKey:            "AIzaSyAW6nJ_r0PXyWc5II6QzrOuljBsyWhX4dA",
  authDomain:        "online-worksheets.firebaseapp.com",
  projectId:         "online-worksheets",
  storageBucket:     "online-worksheets.firebasestorage.app",
  messagingSenderId: "404110714320",
  appId:             "1:404110714320:web:cb79c555a383801f3205d5"
};
const ALLOWED_DOMAINS = [];
const BASE_TEACHER_EMAILS = ["rapidwing@snu-g.ms.kr", "mint0026@snu-g.ms.kr"]; // 전체 권한 교사
const TEACHER_EMAILS  = [...BASE_TEACHER_EMAILS]; // + config/teachers의 학급 담당 교사 (loadExtraTeachers가 병합)
// 담당 교사 권한 범위: null=전체 권한(기본 교사), Set=담당 학급 이름만 잠금 조작 가능 (loadTeacherData에서 계산)
let myClassNames = null;
function isScopedTeacher(){ return !!(user && TEACHER_EMAILS.includes(user.email) && myClassNames!==null); }
function canManageClass(name){ return !myClassNames || myClassNames.has(name); }
// Storage 버킷이 프로젝트에 없음 (Spark 요금제 — 신규 버킷 생성 불가). 오답 이미지 업로드는
// 처음부터 실패해 왔으므로 비활성화. Blaze 전환 후 버킷 생성 시 true로 변경.
const STORAGE_ENABLED = false;


/* ── UNITS: 단원 정의 ── */
const CAT_CLASS = {
  "수와 연산":"cat-수와연산","변화와 관계":"cat-변화와관계",
  "도형과 측정":"cat-도형과측정","자료와 가능성":"cat-자료와가능성"
};
const GRADE_COLOR = {1:"#1d4ed8",2:"#15803d",3:"#b91c1c"};

const fbApp   = initializeApp(FB);
const auth    = getAuth(fbApp);
const db      = initializeFirestore(fbApp,{localCache:persistentLocalCache()});
const storage = getStorage(fbApp);

let user = null, wsProgress = {}, curWS = null;
window._dbg=()=>({curWS,curQIdx,answered,attempts,wrongAnswers,_wsDataLoaded});
let _wsDataLoaded = false; // Firestore 데이터 로드 완료 전 저장 방지
let teacherClasses = [];   // 학급 목록 [{key, name, students:[]}] (모든 교사 문서 병합)
let classStudents = {};    // className → [학생 이메일(소문자)]
let teacherProgress = {};  // wsId → {className: bool}
let curQIdx = 0, attempts = [], answered = [];
let wrongAnswers = []; // per question: array of wrong inputs
/* 일반 학습지에서 정답으로 인정된 최종 제출 답안 (재채점용).
   시험지는 examAnswer를 저장하지만 일반 학습지는 오답(wrongInputs)만 남겨
   채점 규칙이 바뀌어도 다시 판정할 근거가 없었다. */
let lastAnswers = [], lastAnswerTokens = [];
function recordAnswer(idx, val, tokens){
  lastAnswers[idx] = val;
  if(Array.isArray(tokens) && tokens.length){
    try{ lastAnswerTokens[idx] = JSON.stringify(tokens); }catch(e){}
  }
}

/* ── PAGE SWITCH ── */
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
  // 새로고침 복원용 상태 저장
  try{ sessionStorage.setItem('lastPage', id); }catch(e){}
}

/* ── AUTH ── */
document.getElementById("btn-login").addEventListener("click", async () => {
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(auth, p); }
  catch(e) { alert("로그인 오류: " + e.message); }
});
document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

// 로그인 화면 버전 표시
document.addEventListener('DOMContentLoaded', ()=>{
  const engineVer = typeof VERSION!=='undefined' ? VERSION : '';
  const wsVer = '';  // Firestore 로드 방식으로 전환, JS 버전 불필요
  const ver = engineVer ? 'v'+engineVer+(wsVer ? ' · ws'+wsVer : '') : '';
  const _lv=document.getElementById('login-ver');
  if(_lv) _lv.textContent=ver;
  const _hv=document.getElementById('hdr-version');
  if(_hv) _hv.textContent=ver;
});


/* ── Firestore에서 학습지 로드 ── */
let UNITS = [], WORKSHEETS = [];

/* config/teachers 문서(마스터가 teacher.html 학급 관리에서 지정한 담당 교사)를 읽어 TEACHER_EMAILS에 병합 */
async function loadExtraTeachers(){
  try{
    const snap = await getDoc(doc(db,"config","teachers"));
    if(snap.exists()){
      (snap.data().emails||[]).forEach(e=>{
        e=String(e).toLowerCase();
        if(e && !TEACHER_EMAILS.includes(e)) TEACHER_EMAILS.push(e);
      });
    }
  }catch(e){ console.warn("[교사 목록 로드 실패 — 기본 목록 사용]", e.message); }
}
/* 오류 신고 전송 설정 (report.html에서 기본 교사가 저장 → config/errorReports)
   webAppUrl: Apps Script 웹앱 주소 (스크린샷을 교사 Drive 폴더 + 스프레드시트에 저장) */
async function loadErrorReportConfig(){
  try{
    const snap = await getDoc(doc(db,"config","errorReports"));
    const d = snap.exists() ? snap.data() : {};
    window._errWebApp = d.webAppUrl || null;
    window._errToken  = d.token || 'snug-error-report';
    if(!window._errWebApp) console.log('[오류신고] 신고 서버 미설정 → 스크린샷은 Firestore에 저장');
  }catch(e){ window._errWebApp=null; console.warn('[오류신고] 설정 읽기 실패:', e.message); }
}
async function loadTeacherData(){
  if(!user || !TEACHER_EMAILS.includes(user.email)) return;
  try{
    // 모든 교사 문서 병합 (반별 잠금은 두 교사의 학급을 모두 알아야 함)
    let docsData=[];
    try{
      const allSnap=await getDocs(collection(db,"teacher_data"));
      docsData=allSnap.docs.map(d=>d.data());
    }catch(eAll){
      // 규칙상 컬렉션 읽기 불가 시 본인 문서만 폴백
      const cSnap=await getDoc(doc(db,"teacher_data",user.uid));
      if(cSnap.exists()) docsData=[cSnap.data()];
    }
    if(!docsData.length){ console.warn('[teacherData] teacher_data 문서 없음'); return; }

    const byName={};           // name → {key,name,students:Set}
    teacherProgress={};
    window.teacherAutoProgress={};
    window.teacherClassRates={};   // wsId → {className: 완료율 %}
    for(const data of docsData){
      for(const [k,c] of Object.entries(data.classes||{})){
        const name=`${c.year}/${c.grade}학년 ${c.classNum}반`;
        if(!byName[name]) byName[name]={key:k,name,students:new Set()};
        (c.students||[]).forEach(e=>byName[name].students.add(String(e).toLowerCase()));
        if(c.teacher) byName[name].teacher=String(c.teacher).toLowerCase(); // 담당 교사
      }
      // 진도 체크 데이터 병합 (둘 중 하나라도 완료면 완료)
      for(const [wsId,m] of Object.entries(data.teacherProgress||{})){
        if(!teacherProgress[wsId]) teacherProgress[wsId]={};
        for(const [cn,v] of Object.entries(m||{})) teacherProgress[wsId][cn]=teacherProgress[wsId][cn]||!!v;
      }
      for(const [wsId,m] of Object.entries(data.teacherAutoProgress||{})){
        if(!window.teacherAutoProgress[wsId]) window.teacherAutoProgress[wsId]={};
        for(const [cn,v] of Object.entries(m||{})) window.teacherAutoProgress[wsId][cn]=window.teacherAutoProgress[wsId][cn]||!!v;
      }
      // 완료율 병합 (충돌 시 큰 값)
      for(const [wsId,m] of Object.entries(data.teacherClassRates||{})){
        if(!window.teacherClassRates[wsId]) window.teacherClassRates[wsId]={};
        for(const [cn,v] of Object.entries(m||{})) window.teacherClassRates[wsId][cn]=Math.max(window.teacherClassRates[wsId][cn]||0, v||0);
      }
    }
    teacherClasses=Object.values(byName)
      .map(c=>({key:c.key,name:c.name,students:[...c.students]}))
      .sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    classStudents={};
    teacherClasses.forEach(c=>{ classStudents[c.name]=c.students; });
    // 담당 교사(기본 교사 아님)는 자기 담당 학급만 잠금 조작 가능
    myClassNames = BASE_TEACHER_EMAILS.includes(user.email) ? null

async function loadCurriculum(){
  try{
    const [uSnap, wSnap] = await Promise.all([
      getDocs(query(collection(db,'units'), orderBy('order'))),
      getDocs(collection(db,'curriculum'))
    ]);
    UNITS = uSnap.docs.map(d=>({...d.data()}));
    WORKSHEETS = wSnap.docs
      .map(d=>({...d.data()}))
      .filter(ws=>['published','draft','locked'].includes(ws.status)||!ws.status) // published 또는 status 없는 것
      .sort((a,b)=>(a.order??99)-(b.order??99));
    // questions 없는 경우 빈 배열 보정
    WORKSHEETS.forEach(ws=>{ if(!ws.questions) ws.questions=[]; if(!ws.vocab) ws.vocab=[]; });
    console.log(`[커리큘럼] 단원 ${UNITS.length}개, 학습지 ${WORKSHEETS.length}개`);
  }catch(e){
    console.error('[커리큘럼 로드 실패]', e.message);
  }
}

const GRADES = [1,2,3];
const CAT_COLOR = {
  "수와 연산":    {bar:"#1e40af", text:"#1e40af"},
  "변화와 관계":  {bar:"#166534", text:"#166534"},

/* 진도율 대상 여부: 일반 학습지 + 진도율 반영 ON만 (VOCA·시험지 제외) */
const countsForProgress = ws => {
  if(!ws) return false;
  if(ws.type==="vocab" || ws.type==="exam") return false;
  if(Array.isArray(ws.vocab) && ws.vocab.length) return false; // type 미설정 구 VOCA 방어
  if(ws.includeInProgress===false) return false;               // 진도율 반영 OFF
  return true;
};

/* 단원의 진도 요약 계산 */
function unitProgress(unit) {
  // vocab 포함 전체 학습지 (hasSheets/표시용 개수 판단)
  const allSheets = WORKSHEETS.filter(ws=>ws.unitId===unit.id &&
    (ws.type==="vocab" || (ws.questions?.length??0)>0));
  const hasSheets = allSheets.length>0;
  // 진도율은 일반 학습지(진도율 반영 ON)만 집계
  const progSheets = allSheets.filter(countsForProgress);
  const total = progSheets.length;
  const done = progSheets.filter(ws=>!!wsProgress[ws.id]?.completedAt).length;
  return {total, done, hasSheets, allCount: allSheets.length};
}

/* 단원 셀 아이템 생성 */
function makeUnitItem(unit) {
  const gc = GRADE_COLOR[unit.grade];
  const prog = unitProgress(unit);

  const item = document.createElement("div");
  item.className = "ws-item" + (!prog.hasSheets?" empty":"");
  item.style.borderLeftColor = prog.hasSheets ? gc : "var(--rule)";

  let badge = "";
  if(prog.total>0) {
    badge = `<span class="unit-ws-badge">${prog.done}/${prog.total}</span>`;
  }

  let statusHtml = "";
  if(prog.total>0) {
    if(prog.done===prog.total) statusHtml=`<span class="ws-status s-done">완료</span>`;
    else if(prog.done>0)      statusHtml=`<span class="ws-status s-partial">${prog.done}/${prog.total}</span>`;
  }

  const hasNew = !!(window._newGradeWs && WORKSHEETS.some(w=>w.unitId===unit.id && window._newGradeWs.has(w.id)));
  item.innerHTML = `
    ${badge}
    ${statusHtml}
    <div class="ws-item-title">${hasNew?'<span class="notif-dot-in" title="새 채점 결과"></span>':''}${unit.title}</div>
    <div class="ws-item-sub">${prog.hasSheets ? `학습지 ${prog.allCount}개` : "준비 중"}</div>`;

  if(prog.hasSheets) {
    item.addEventListener("click", ()=>showUnitPage(unit));
  }
  return item;
}

function renderCards() {

/* ══════════ 그래프 채점 알림 (v7.4) ══════════
   - 로그인 시 이미 로드된 wsProgress.perQuestion 데이터만 사용 → Firestore 추가 비용 0
   - '본 것' 여부는 localStorage에 시그니처(정답여부+피드백해시+교사필기유무)로 저장
   - 그래프 문제(q.type==='graph')가 새로 채점/수정되면 종 배지·카드 점으로 알림 */
function _escHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function _fbHash(s){let h=0;s=String(s||'');for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return h;}
function _gradeSig(pq){
  if(!pq) return null;
  const graded=(pq.correct===true||pq.correct===false);
  if(!graded && !pq.feedback && !pq.teacherDrawing) return null; // 아직 채점 안 됨
  return (pq.correct===true?'o':pq.correct===false?'x':'-')+'|'+_fbHash(pq.feedback)+'|'+(pq.teacherDrawing?'d':'-');
}
function _gradeSeenKey(){return 'gradeSeen::'+((user&&user.email)||'');}
function _loadGradeSeen(){try{return JSON.parse(localStorage.getItem(_gradeSeenKey())||'null');}catch(e){return null;}}
function _saveGradeSeen(m){try{localStorage.setItem(_gradeSeenKey(),JSON.stringify(m));}catch(e){}}

/* 현재 채점된 그래프 문제 수집 */
function _collectGradedGraphs(){
  const out=[];
  for(const ws of WORKSHEETS){
    const prog=wsProgress[ws.id];
    if(!prog||!prog.perQuestion) continue;
    let realN=0;
    ws.questions.forEach(q=>{
      if(q.type!=='link') realN++;
      if(q.type!=='graph') return;
      const sig=_gradeSig(prog.perQuestion[q.id]);
      if(!sig) return;
      out.push({key:ws.id+'::'+q.id, wsId:ws.id, qId:q.id, ws, qNum:realN, pq:prog.perQuestion[q.id], sig});
    });
  }
  return out;
}
/* 안 본 새 채점 목록 */
function computeNewGrades(){
  const graded=_collectGradedGraphs();
  const seen=_loadGradeSeen();
  if(seen===null){ // 최초 실행: 기존 채점은 모두 '본 것'으로 시드 (과거 알림 폭탄 방지)
    const base={}; graded.forEach(g=>base[g.key]=g.sig);
    _saveGradeSeen(base);
    return [];
  }
  return graded.filter(g=>seen[g.key]!==g.sig);
}
/* 본 것으로 표시 (wsId 지정 시 해당 학습지만) */
function markGradesSeen(wsId){
  const graded=_collectGradedGraphs();
  const seen=_loadGradeSeen()||{};
  graded.forEach(g=>{ if(!wsId||g.wsId===wsId) seen[g.key]=g.sig; });
  _saveGradeSeen(seen);
}
/* 알림 상태 재계산 + 종 렌더 */
function refreshGradeNotif(){
  window._newGrades=computeNewGrades();
  window._newGradeWs=new Set(window._newGrades.map(g=>g.wsId));
  renderGradeBell();
}
function renderGradeBell(){
  const wrap=document.getElementById('hdr-bell-wrap');
  const cnt=document.getElementById('hdr-bell-count');
  const panel=document.getElementById('hdr-bell-panel');
  if(!wrap||!cnt||!panel) return;
  if(!user){ wrap.style.display='none'; return; }
  wrap.style.display='inline-flex';
  const list=window._newGrades||[];
  if(list.length){ cnt.style.display='inline-block'; cnt.textContent=list.length>99?'99+':list.length; }
  else { cnt.style.display='none'; cnt.textContent=''; }
  if(!list.length){ panel.innerHTML='<div class="bell-empty">🔔 새 채점 알림이 없어요</div>'; return; }
  panel.innerHTML='<div class="bell-head">✍️ 그래프 채점 알림</div>'+
    list.map((g,i)=>{
      const mark=g.pq.correct===true?'⭕ 정답':g.pq.correct===false?'❌ 오답':'📝 확인 요망';
      const fb=g.pq.feedback?`<div class="bell-fb">💬 ${_escHtml(g.pq.feedback)}</div>`:'';
      return `<div class="bell-item" data-i="${i}">
        <div class="bell-item-top"><b>${_escHtml(g.ws.title)}</b> · ${g.qNum}번 그래프</div>
        <div class="bell-item-mark">${mark}</div>${fb}</div>`;
    }).join('')+
    '<div class="bell-clear" id="bell-clear">모두 읽음 표시</div>';
  panel.querySelectorAll('.bell-item').forEach(el=>{
    el.addEventListener('click',()=>openGradeNotif((window._newGrades||[])[+el.dataset.i]));
  });
  const cl=panel.querySelector('#bell-clear');
  if(cl) cl.addEventListener('click',()=>{

    if(document.getElementById('dash-page').classList.contains('active')) renderCards();
    if(document.getElementById('unit-page').classList.contains('active')&&window._currentUnit) showUnitPage(window._currentUnit);
    panel.classList.remove('show');
  });
}

/* 교사 계정 여부 (미리보기 풀이는 records에 저장하지 않음) */
function isTeacherAcct(){ return !!(user && TEACHER_EMAILS.includes(user.email)); }

/* 반별 잠금 판정: locked 상태면 allowedEmails(해제된 반들의 학생 합집합)에 있어야 접근 가능 */
function wsBlockedFor(ws, email){
  if(!ws) return false;
  if(email && TEACHER_EMAILS.includes(email)) return false; // 교사는 항상 접근
  if(ws.status==='draft') return true;
  if(ws.status!=='locked') return false;
  const allowed=(ws.allowedEmails||[]).map(e=>String(e).toLowerCase());
  return !allowed.includes(String(email||'').toLowerCase());
}

/* 해제된 반 목록으로 allowedEmails 재계산 */
function calcAllowedEmails(unlockedClasses){
  const set=new Set();
  Object.keys(unlockedClasses||{}).filter(n=>unlockedClasses[n]).forEach(n=>{
    (classStudents[n]||[]).forEach(e=>set.add(e));
  });
  return [...set];
}

/* ── 파트(학습지 구간) 잠금 ──
   문항의 partStart:{id,name} 마커가 새 파트의 시작.
   첫 마커 이전 문항은 파트 없음(항상 열림).
   파트별 해제: curriculum/{wsId}.partUnlocked[pid]={반:true} + partAllowed[pid]=[이메일] */
function getParts(ws){
  if(!Array.isArray(ws?.questions)) return null;
  const parts=[];
  ws.questions.forEach((q,i)=>{
    if(q.partStart&&q.partStart.id) parts.push({id:q.partStart.id,name:q.partStart.name||'파트',from:i});
  });
  return parts.length?parts:null;
}
function qPartId(ws,idx){
  const parts=getParts(ws); if(!parts) return null;
  let cur=null;
  for(const p of parts){ if(p.from<=idx) cur=p.id; else break; }
  return cur;
}
function partOpenFor(ws,partId,email){
  if(!partId) return true;                                  // 파트 미지정 문항: 항상 열림
  if(ws.status!=='locked') return true;                     // 파트 잠금은 반별 잠금 모드에서만 작동 (전체 공개 = 전부 열림)
  if(email&&TEACHER_EMAILS.includes(email)) return true;    // 교사: 항상 열림
  const arr=(ws.partAllowed?.[partId]||[]).map(e=>String(e).toLowerCase());
  return arr.includes(String(email||'').toLowerCase());
}
function qLockedFor(ws,idx,email){ return !partOpenFor(ws,qPartId(ws,idx),email); }

/* 하단 토스트 (퀴즈 화면 안내용) */
function qToast(msg){
  let t=document.getElementById('q-toast');
  if(!t){ t=document.createElement('div'); t.id='q-toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600);
}

/* 파트 잠금 실시간 감시: 학습지를 여는 동안 curriculum 문서 구독 */
let _wsUnsub=null;
function stopWsWatch(){ if(_wsUnsub){ try{_wsUnsub();}catch(e){} _wsUnsub=null; } try{closePartPop();}catch(e){} }
function watchWs(ws){
  stopWsWatch();
  if(!getParts(ws)) return; // 파트 있는 학습지만 감시
  _wsUnsub=onSnapshot(doc(db,'curriculum',ws.id),snap=>{
    try{
      if(!snap.exists()||!curWS||curWS.id!==ws.id) return;
      const d=snap.data();
      const beforeOpen=new Set((getParts(ws)||[]).filter(p=>partOpenFor(ws,p.id,user?.email)).map(p=>p.id));
      const changed=JSON.stringify(d.partAllowed||{})!==JSON.stringify(ws.partAllowed||{}) || d.status!==ws.status;
      ws.partAllowed=d.partAllowed||{};
      ws.partUnlocked=d.partUnlocked||{};
      ws.unlockedClasses=d.unlockedClasses||{};
      ws.allowedEmails=d.allowedEmails||[];
      ws.status=d.status;
      if(!changed) return;
      const parts=getParts(ws)||[];
      const newlyOpen=parts.filter(p=>!beforeOpen.has(p.id)&&partOpenFor(ws,p.id,user?.email));
      const newlyLocked=parts.filter(p=>beforeOpen.has(p.id)&&!partOpenFor(ws,p.id,user?.email));
      updateStrip(); refreshPartPop();
      if(newlyOpen.length) qToast('🔓 "'+newlyOpen.map(p=>p.name).join(', ')+'" 파트가 열렸어요!');
      else if(newlyLocked.length) qToast('🔒 "'+newlyLocked.map(p=>p.name).join(', ')+'" 파트가 잠겼어요');
      // 현재 문항이 잠겼으면 열린 문항으로 이동
      if(qLockedFor(ws,curQIdx,user?.email)){
        let target=-1;
        ws.questions.forEach((q,i)=>{ if(target<0&&!qLockedFor(ws,i,user?.email)&&!answered[i]) target=i; });
        if(target<0) ws.questions.forEach((q,i)=>{ if(target<0&&!qLockedFor(ws,i,user?.email)) target=i; });
        if(target>=0){ curQIdx=target; renderQuestion(); }
      }
    }catch(e){ console.warn('[watchWs]',e); }
  },err=>console.warn('[watchWs 오류]',err.message));
}

/* 반별 잠금 토글 (학급 버튼 클릭)
   파트가 있는 학습지: 반 해제 시 첫 파트만 자동 해제 (나머지 파트는 문제 화면에서 해제),
   반 잠금 시 그 반의 모든 파트 해제 상태 제거 */
window.toggleClassLock=async function(wsId, clsName){
  const ws=WORKSHEETS.find(w=>w.id===wsId); if(!ws) return;
  if(ws.status==='draft'){ alert('준비 중(draft) 학습지는 edit에서 발행 후 잠금을 설정하세요.'); return; }
  if(isScopedTeacher()){
    if(!canManageClass(clsName)){ alert('담당 학급이 아닙니다.'); return; }
    // published→locked 전환은 다른 반 상태까지 일괄 변경하므로 기본 교사 전용
    if(ws.status!=='locked'){ alert('현재 전체 공개 상태입니다.\n반별 잠금 시작(전체 공개→잠금 전환)은 기본 교사 계정만 가능합니다.'); return; }
  }
  let newStatus=ws.status, newUnlocked;
  const parts=getParts(ws);
  const pu=JSON.parse(JSON.stringify(ws.partUnlocked||{}));
  const setCls=(pid,cls,on)=>{ if(!pu[pid])pu[pid]={}; if(on)pu[pid][cls]=true; else delete pu[pid][cls]; };
  if(ws.status==='locked'){
    newUnlocked={...(ws.unlockedClasses||{})};
    if(newUnlocked[clsName]){
      delete newUnlocked[clsName];                          // 해제 → 잠금
      if(parts) parts.forEach(p=>setCls(p.id,clsName,false));
    } else {
      newUnlocked[clsName]=true;                            // 잠금 → 해제: 첫 파트만 열림
      if(parts) parts.forEach((p,i)=>setCls(p.id,clsName,i===0));
    }
  }else{
    // 전체 공개 상태에서 클릭 → 해당 반만 잠금 (나머지 반은 전부 열린 상태 유지)
    newStatus='locked';
    newUnlocked={};
    teacherClasses.forEach(c=>{
      if(c.name!==clsName){
        newUnlocked[c.name]=true;
        if(parts) parts.forEach(p=>setCls(p.id,c.name,true)); // 공개 때의 접근 유지: 모든 파트 열림
      } else if(parts) parts.forEach(p=>setCls(p.id,c.name,false));
    });
  }
  const newAllowed=calcAllowedEmails(newUnlocked);
  const updates={status:newStatus,unlockedClasses:newUnlocked,allowedEmails:newAllowed};
  if(parts){
    const pa={};
    parts.forEach(p=>{ pa[p.id]=calcAllowedEmails(pu[p.id]||{}); });
    updates.partUnlocked=pu; updates.partAllowed=pa;
  }
  try{
    await updateDoc(doc(db,'curriculum',wsId),updates);
    ws.status=newStatus; ws.unlockedClasses=newUnlocked; ws.allowedEmails=newAllowed;
    if(parts){ ws.partUnlocked=updates.partUnlocked; ws.partAllowed=updates.partAllowed; }
    if(window._currentUnit) showUnitPage(window._currentUnit);
  }catch(e){ alert('저장 실패: '+e.message); }
};

async function _loadH2C(){
  if(window.html2canvas) return true;
  try{
    await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    return true;
  }catch(e){ console.warn('[오류신고] html2canvas 로드 실패'); return false; }
}
function _dataUrlToBlob(d){
  const parts=d.split(',');
  const mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(parts[1]), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
/* 캔버스를 목표 용량 이하 JPEG로 축소 (Firestore 폴백은 문서 1MB 제한 때문에 더 빡빡하게) */
function _canvasToJpeg(canvas, maxW, limit){
  let out=canvas;
  if(canvas.width>maxW){
    const s=maxW/canvas.width, c2=document.createElement('canvas');
    c2.width=maxW; c2.height=Math.round(canvas.height*s);
    c2.getContext('2d').drawImage(canvas,0,0,c2.width,c2.height);
    out=c2;
  }
  let q=0.75, d=out.toDataURL('image/jpeg',q);
  while(d.length>limit && q>0.35){ q-=0.1; d=out.toDataURL('image/jpeg',q); }
  if(d.length>limit){
    const c3=document.createElement('canvas');
    c3.width=Math.round(out.width/2); c3.height=Math.round(out.height/2);
    c3.getContext('2d').drawImage(out,0,0,c3.width,c3.height);
    d=c3.toDataURL('image/jpeg',0.6);
  }
  return d;
}
window.sendBugReport=async function(){
  const btn=document.getElementById('bugrep-send'); if(btn){ btn.disabled=true; btn.textContent='캡처 중…'; }
  const desc=(document.getElementById('bugrep-desc')?.value||'').trim();
  const pt=_bugPt||{x:0,y:0};

  // 1) 화면 캡처 + 클릭 위치 표시
  let canvas=null;
  try{
    if(await _loadH2C()){
      canvas=await html2canvas(document.body,{
        x:scrollX, y:scrollY, width:innerWidth, height:innerHeight,
        windowWidth:innerWidth, windowHeight:innerHeight,
        useCORS:true, logging:false,
        ignoreElements:el=>String(el.id||'').startsWith('bugrep') // 신고 UI는 캡처 제외
      });
      const r=canvas.width/innerWidth, ctx=canvas.getContext('2d');
      ctx.strokeStyle='#ef4444'; ctx.lineWidth=4*r;
      ctx.beginPath(); ctx.arc(pt.x*r,pt.y*r,28*r,0,Math.PI*2); ctx.stroke();
    }
  }catch(e){ console.warn('[오류신고] 캡처 실패:',e.message); } // 캡처 실패해도 신고는 저장

  const base={
    createdAt:new Date().toISOString(), status:'open',
    email:user?.email||'', page:'index', version:(typeof VERSION!=='undefined'?VERSION:''),
    url:location.href, userAgent:navigator.userAgent,
    viewport:{w:innerWidth,h:innerHeight}, click:pt,
    wsId:curWS?.id||null, wsTitle:curWS?.title||null, qIdx:(typeof curQIdx==='number'?curQIdx:null),
    description:desc,
    consoleLog:(window._errlog||[]).slice(-100)
  };

  // 2) 스크린샷 저장 — Apps Script 웹앱(교사 Drive 폴더+스프레드시트) 우선, 실패하면 Firestore에 축소 저장
  let driveFileId=null, driveUrl=null, shot='', shotNote='';
  if(canvas && window._errWebApp){
    if(btn) btn.textContent='전송 중…';
    try{
      const res=await fetch(window._errWebApp,{
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },  // 단순 요청(프리플라이트 없음)
        body: JSON.stringify({ ...base, token:window._errToken, image:_canvasToJpeg(canvas,1400,1500000) })
      });
      const out=await res.json();
      if(out && out.ok){ driveFileId=out.fileId||null; driveUrl=out.fileUrl||null; }
      else throw new Error(out?.error||'서버 응답 오류');
    }catch(e){
      console.warn('[오류신고] 신고 서버 전송 실패 → Firestore 저장:',e.message);
      shotNote='신고 서버 전송 실패';
    }
  }
  if(canvas && !driveUrl){
    shot=_canvasToJpeg(canvas,1000,800000);            // Firestore 문서 1MB 제한 대비
    if(shot.length>900000){ shot=''; shotNote='스크린샷이 너무 커서 저장하지 못했습니다'; }
  }

  // 3) 신고 목록용 문서 저장 (report.html이 읽음)
  try{
    await setDoc(doc(collection(db,'error_reports')), { ...base, screenshot:shot, screenshotNote:shotNote, driveFileId, driveUrl });
    _bugCleanup();
    alert('🚨 신고가 접수되었습니다. 감사합니다!');
  }catch(e){ _bugCleanup(); alert('신고 저장에 실패했습니다: '+e.message); }
};

      const _done=data.isComplete||data.completedAt||data.passed||(data.totalCount>0&&data.answeredCount>=data.totalCount);
      if(!_done) return;
      if(!cls||!wsId) return;
      if(!wsClassDoneSet[wsId]) wsClassDoneSet[wsId]={};
      if(!wsClassDoneSet[wsId][cls]) wsClassDoneSet[wsId][cls]=new Set();
      wsClassDoneSet[wsId][cls].add(email);
    });
    const wsClassDone={};   // wsId → {className: count}
    for(const [wsId,byCls] of Object.entries(wsClassDoneSet)){
      wsClassDone[wsId]={};
      for(const [cls,set] of Object.entries(byCls)) wsClassDone[wsId][cls]=set.size;
    }

    // 학급별 완료율(%) = 완료 학생수 / 학급 전체 학생수
    // ★ 완료자가 한 명도 없는 학습지도 0%로 기록한다 ★
    //   (예전에는 wsClassDone에 있는 학습지만 저장 → 완료자가 없거나 동기화 이후 새로 만든
    //    학습지는 키 자체가 없어서 버튼이 '완료율 없음' 상태로 남았다)
    const newRates={};
    for(const w of WORKSHEETS){
      newRates[w.id]={};
      for(const [cls,total] of Object.entries(classTotal)){
        if(!total) continue;
        const done=wsClassDone[w.id]?.[cls]||0;
        newRates[w.id][cls]=Math.round(done/total*100);
      }
    }

    // 2/3 이상이면 teacherAutoProgress 갱신 (진도율 대상만 — 단원 진도 뱃지용)
    const newAutoProg={};
    for(const [wsId, byCls] of Object.entries(wsClassDone)){
      if(!progWsIds.has(wsId)) continue;
      newAutoProg[wsId]={};
      for(const [cls, done] of Object.entries(byCls)){
        const total=classTotal[cls]||0;
        if(total>0 && done/total>=2/3) newAutoProg[wsId][cls]=true;
      }
    }

    // Firestore 저장
    console.log('[sync] classTotal:', classTotal);
    console.log('[sync] wsClassDone:', wsClassDone);
    // 학급별 비율 상세
    for(const [wsId,byCls] of Object.entries(wsClassDone)){
      const detail=Object.entries(byCls).map(([c,d])=>`${c}:${d}/${classTotal[c]||0}=${((d/(classTotal[c]||1))*100).toFixed(0)}%`).join(', ');
      console.log(`  ${wsId}:`, detail);
    }
    console.log('[sync] newAutoProg:', newAutoProg);
    // merge:true는 맵을 깊게 병합해 예전 완료율이 남는다(삭제된 기록·바뀐 ID가 그대로 유지) → updateDoc으로 필드 전체 교체
    const _tdRef=doc(db,'teacher_data',user.uid);
    try{ await updateDoc(_tdRef,{teacherAutoProgress:newAutoProg,teacherClassRates:newRates}); }
    catch(e){ await setDoc(_tdRef,{teacherAutoProgress:newAutoProg,teacherClassRates:newRates},{merge:true}); }
    // 로컬 상태는 병합 갱신 (다른 교사 문서에서 온 데이터 유지, 본인 학급만 갱신)
    const _myClasses=new Set(Object.keys(classTotal));
    const _mergeLocal=(store,fresh)=>{
      const merged=store||{};
      for(const wsMap of Object.values(merged)){ for(const cn of Object.keys(wsMap)){ if(_myClasses.has(cn)) delete wsMap[cn]; } }
      for(const [wsId,m] of Object.entries(fresh)){ merged[wsId]={...(merged[wsId]||{}),...m}; }
      return merged;
    };
    window.teacherAutoProgress=_mergeLocal(window.teacherAutoProgress,newAutoProg);
    window.teacherClassRates=_mergeLocal(window.teacherClassRates,newRates);

    // 화면 갱신 - 현재 표시 중인 학습지 카드 다시 그리기
    const totalAuto=Object.values(newAutoProg).reduce((s,o)=>s+Object.keys(o).length,0);
    alert(`✅ 진도 동기화 완료\n자동 완료: ${Object.keys(newAutoProg).length}개 학습지, ${totalAuto}개 학급`);
    // 현재 표시 중인 학습지 목록만 다시 그림 (새로고침 불필요)
    if(window._currentUnit && document.getElementById('unit-page').classList.contains('active')){
      showUnitPage(window._currentUnit);
    }
  }catch(e){
    alert('동기화 실패: '+e.message);
    console.error('[syncAutoProgress]',e);
  }finally{
    btn.disabled=false; btn.textContent=orig;
  }
};

function showUnitPage(unit) {

  const cc = CAT_COLOR[unit.category]||{text:"var(--accent)"};

    grid.innerHTML=`<div style="color:var(--ink3);font-size:14px;padding:20px 0">등록된 학습지가 없습니다.</div>`;
  } else {
    sheets.forEach(ws => {

      const inProg = !!(prog && !prog.isComplete && !(ws.type==="vocab" && prog?.passed));

      const rate  = prog?.correctRate ?? 0;
      const isDraft  = ws.status === "draft";
      const isLocked = ws.status === "locked";
      const isTeacher = user && TEACHER_EMAILS.includes(user.email);
      const isBlocked = wsBlockedFor(ws, user?.email); // 반별 잠금: 해제된 반 학생은 통과, 교사는 항상 통과

      let badgeHtml = "";
      const tPrev = isTeacher ? ' · 교사 미리보기' : '';
      const unlockedCnt = isLocked ? Object.values(ws.unlockedClasses||{}).filter(Boolean).length : 0;
      if(isLocked && isBlocked) badgeHtml=`<span class="wslc-badge" style="background:#fef3c7;color:#b45309">🔒 잠금</span>`;
      else if(isLocked && isTeacher) badgeHtml=`<span class="wslc-badge" style="background:#fef3c7;color:#b45309">🔒 잠금${unlockedCnt?` · ${unlockedCnt}반 해제`:''}${tPrev}</span>`;
      else if(isDraft) badgeHtml=`<span class="wslc-badge" style="background:#f1f5f9;color:#64748b">📝 준비 중${tPrev}</span>`;
      else if(done)    badgeHtml=`<span class="wslc-badge s-done">완료</span>`;
      else if(inProg)  badgeHtml=`<span class="wslc-badge s-partial">진행 중 (${prog.answeredCount||0}/${prog.totalCount||0})</span>`;
      else if(empty)   badgeHtml=`<span class="wslc-badge" style="background:var(--rule);color:var(--ink3)">준비 중</span>`;
      else             badgeHtml=`<span class="wslc-badge" style="background:var(--acc-lt);color:var(--accent)">미시작</span>`;

      const card = document.createElement("div");
      card.className = "ws-list-card" + (empty||isBlocked?" empty":"");
      if(isBlocked) card.style.cssText="opacity:.55;cursor:not-allowed;filter:grayscale(.4)";
      card.innerHTML = `
        <div class="wslc-icon" style="background:${gc}18;color:${gc}">📄</div>
        <div class="wslc-body">
          <div class="wslc-title">${(window._newGradeWs&&window._newGradeWs.has(ws.id))?'<span class="notif-dot-in" title="새 채점 결과"></span>':''}${ws.title}</div>
          <div class="wslc-meta">${ws.type==="vocab"
              ? ((wsProgress[ws.id]?.passCount||0)>=1
                  ? `✅ ${wsProgress[ws.id].passCount}회 PASS`
                  : "미완료")
              : ws.type==="exam"
              ? `📝 시험지 · ${ws.questions.length}문항${ws.timeLimit?` · ${ws.timeLimit}분`:''}${done?' · 완료':inProg?` · 진행 중`:''}`
              : ws.questions.length+"문제"+(done?` · 완료`:inProg?` · ${prog.answeredCount||0}/${prog.totalCount||ws.questions.length} 정답`:"")}
          </div>
        </div>
        ${badgeHtml}`;

      // 교사 UI: 전체 잠금 버튼 + 학급별 잠금/진도 3단계 버튼
      if(isTeacher){
        const progress=teacherProgress[ws.id]||{};
        const row=document.createElement('div');
        row.className='teacher-cls-row';
        // 전체 잠금 토글 버튼
        const lockBtn=document.createElement('button');
        const isNowLocked=(ws.status==='locked');
        const isNowDraft=(ws.status==='draft');
        const scoped=isScopedTeacher(); // 담당 교사: 전체 토글 불가, 담당 학급 버튼만
        lockBtn.textContent=isNowLocked?'🔒 전체 잠금':(isNowDraft?'📝 준비 중':'🔓 전체 공개');
        lockBtn.title=scoped?'전체 잠금/공개는 기본 교사 전용':(isNowLocked?'클릭하면 전체 공개 (반별 해제도 초기화)':(isNowDraft?'edit에서 변경하세요':'클릭하면 전체 잠금'));
        lockBtn.style.cssText=`padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;border:1.5px solid;cursor:${(isNowDraft||scoped)?'default':'pointer'};font-family:inherit;background:${isNowLocked?'#fef3c7':isNowDraft?'#f1f5f9':'#f0fdf4'};color:${isNowLocked?'#b45309':isNowDraft?'#64748b':'#15803d'};border-color:${isNowLocked?'#b45309':isNowDraft?'#94a3b8':'#15803d'}${scoped?';opacity:.5':''}`;
        if(!isNowDraft && !scoped) lockBtn.onclick=(e)=>{e.stopPropagation();window.toggleWsLock(ws.id,lockBtn);};
        row.appendChild(lockBtn);

        // 학급별 버튼: 모든 학습지 유형에 표시 (시험지/VOCA도 반별 잠금 대상)
        // 색: 잠금=빨강 / 열림=초록. 열림 버튼은 학급 완료율(완료 학생수/전체 학생수)에 따라
        // <30% 테두리만, 30~50% 1/3 채움, 50~80% 2/3 채움, 80%↑ 전체 채움
        if(teacherClasses.length){
          let lockedCnt=0, doneCnt=0;
          teacherClasses.forEach(({name})=>{
            const clsLocked = isNowDraft || (isNowLocked && !(ws.unlockedClasses||{})[name]);
            // 완료율: 진도 동기화 데이터 우선, 없으면 구 완료 체크(수동=100, 자동 2/3↑=67)로 근사
            let rate=window.teacherClassRates?.[ws.id]?.[name];
            if(rate===undefined) rate=progress[name]===true?100:window.teacherAutoProgress?.[ws.id]?.[name]===true?67:0;
            const fill=rate>=80?3:rate>=50?2:rate>=30?1:0;
            if(clsLocked) lockedCnt++;
            if(fill===3) doneCnt++;
            const btn=document.createElement('button');
            btn.className=`cls-tog ${clsLocked?'cls-locked':'cls-open'} fill-${fill}`;
            btn.textContent=(clsLocked?'🔒 ':'')+name.replace(/\d+\//,'').replace('학년 ','학년\n');
            const mine=canManageClass(name); // 담당 교사는 자기 학급만 조작 가능
            btn.title=mine?`${name}: ${clsLocked?'잠금':'열림'} · 완료율 ${rate}% — 클릭하면 ${clsLocked?'해제':'잠금'}`:`${name}: 담당 학급이 아닙니다 (조회만 가능)`;
            if(!mine){ btn.style.opacity='.35'; btn.style.cursor='default'; }
            if(!isNowDraft && mine) btn.onclick=(e)=>{ e.stopPropagation(); window.toggleClassLock(ws.id,name); };
            row.appendChild(btn);
          });
          const note=document.createElement('div');
          note.className='teacher-ws-note';
          const parts=[];
          if(lockedCnt) parts.push(`🔒 ${lockedCnt}반 잠금`);
          if(doneCnt) parts.push(`✅ ${doneCnt}반 완료(80%↑)`);
          note.textContent=parts.length?parts.join(' · '):'학급별 잠금/완료율 (클릭=잠금 토글)';
          row.appendChild(note);
        } else {
          const loadingSpan=document.createElement('span');
          loadingSpan.style.cssText='font-size:11px;color:var(--ink3)';
          loadingSpan.textContent='⏳ 학급 정보 로드 중…';
          row.appendChild(loadingSpan);
        }
        // 파트 있는 학습지: 안내만 표시 (파트별 해제는 학습지를 열어서 진행)
        const wsPartList=getParts(ws);
        if(wsPartList){
          const hint=document.createElement('span');
          hint.style.cssText='font-size:10px;color:#4338ca;font-weight:600';
          hint.textContent=`🧩 ${wsPartList.length}개 파트 (반 해제 시 첫 파트 열림 · 나머지는 학습지 안에서)`;
          row.appendChild(hint);
        }
        card.appendChild(row);
      }
      if(!empty && !isBlocked) card.addEventListener("click", ()=> ws.type==="vocab" ? startVocabQuiz(ws) : startQuiz(ws));
      grid.appendChild(card);
    });
  }

  showPage("unit-page");
}

const DIFFS=["","★","★★","★★★","★★★★","★★★★★"];

/* multi 보기 렌더링: 라벨+(수식) */
function renderOption(opt){
  if(!opt) return opt;
  // 이미 LaTeX(\()나 HTML(<span)이 있으면 그대로 (교사가 edit에서 직접 수식 지정한 경우)
  if(opt.includes('\\(') || opt.includes('<span')) return opt;
  const m = opt.match(/^([ㄱ-ㄹ]\.\s*|\([0-9]\)\s*)([\s\S]*)$/);
  const lbl = m ? m[1] : '', raw = m ? m[2] : opt;
  // 한글이 포함된 선지는 일반 텍스트로 표시 — 통째로 수식(\(...\))에 넣으면
  // MathJax가 수학 변수처럼 이탤릭·문자별 배치로 렌더해 글이 기울고 자간이 깨짐
  if(/[가-힣]/.test(raw)) return opt;
  let t = raw.replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3');
  t = t.replace(/\(([^)]+)\)\/([0-9a-zA-Z^]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
  t = t.replace(/([a-zA-Z][a-zA-Z0-9^]*)\/([0-9]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
  t = t.replace(/([0-9]+)\/([0-9]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
  return lbl + `\\(${t}\\)`;
}
/* 선택지 보이는 글자수 추정 (LaTeX/HTML 제거) — 2x2 vs 1열 판단용 */
function optVisibleLen(opt){
  if(!opt) return 0;
  return String(opt)
    .replace(/<[^>]*>/g,'')          // HTML 태그
    .replace(/\\\(|\\\)/g,'')        // \( \)
    .replace(/\\[a-zA-Z]+/g,' ')     // \frac 등 명령
    .replace(/[{}$^_]/g,'')          // LaTeX 기호
    .trim().length;
}
/* 인접 LaTeX 블록 병합: \(A\)X\(B\) → \(AXB\) (X에 한글 없을 때) */

/* ── 수식 렌더링 ──────────────────────────────
   단순화된 파이프라인: processText → MathJax
   데이터 형식 규칙:
   · 수식: \( ... \) LaTeX inline
   · 줄바꿈: <br>
   · 분수: \(\frac{a}{b}\)
   ─────────────────────────────────────────── */

function processText(text){
  if(!text) return text;
  // 줄바꿈 통일
  return text.replace(/\n/g,'<br>');
}

// 하위호환 별칭 (기존 코드에서 사용)
function mathStyle(text){ return processText(text); }
function mergeLaTeX(text){ return text; }

const mathVars = s => s;
/* 수식 텍스트 렌더링:
   - 순수 수식 → \( LaTeX \) MathJax
   - 한글 포함 → 줄별 처리 (한글줄=mathStyle, 수식줄=LaTeX)
   - HTML 포함 → mathStyle만 적용
*/
function fracText(text){
  if(!text) return text;
  // LaTeX 정규화: 모든 이중 백슬래시 → 단일 (\\frac, \\(, \\) 등)

  // 중복 줄바꿈 정리: <br> 주변 \n 제거 (저장된 <br>\n 중복 방지)
  text = text.replace(/<br\s*\/?>\s*\n/gi,'<br>');
  text = text.replace(/\n\s*<br\s*\/?>/gi,'<br>');
  // 줄바꿈 통일: \n(뉴라인) → <br>
  text = text.replace(/\n/g,'<br>');

  const hasBr = /<br\s*\/?>/i.test(text);
  const hasKo = /[가-힣]/.test(text);

  // <br>로 분리되는 경우: 줄별 처리
  if(hasBr && hasKo){
    const lines = text.split(/<br\s*\/?>/i);
    return lines.map(line=>{
      const t2 = line.trim();
      if(!t2) return '';
      // HTML 태그 포함 줄: mathStyle만 (table, span, strong, u, img 등 모두 포함)
      if(/<[a-zA-Z]/.test(t2)) return mergeLaTeX(mathStyle(t2));
      // 한글 없는 순수 수식 줄 (화살표/기호로 시작하면 제외)
      if(!/[가-힣]/.test(t2) && !/^[→⟹∴·]/.test(t2)){
        // 이미 \( 있으면 이중 래핑 방지
        if(t2.includes('\\(')) return mergeLaTeX(mathStyle(t2));
        const lm = t2.match(/^(\([0-9]\)\s*)([\s\S]*)$/);
        if(lm){
          let expr = lm[2].replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3');
          expr = expr.replace(/\(([^)]+)\)\/([0-9a-zA-Z^]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
          expr = expr.replace(/([a-zA-Z][a-zA-Z0-9^]*)\/([0-9]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
          expr = expr.replace(/([0-9]+)\/([0-9]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
          return lm[1]+`\\(${expr}\\)`;
        }
        let expr = t2.replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3');
        expr = expr.replace(/\(([^)]+)\)\/([0-9a-zA-Z^]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
        expr = expr.replace(/([a-zA-Z][a-zA-Z0-9^]*)\/([0-9]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
        return `\\(${expr}\\)`;
      }
      // 한글 줄: 분수 변환 후 mathStyle
      let t=line;
      t=t.replace(/\(([^)]+)\)\/([0-9]+)/g,(_,n,d)=>fracSpan(n,d));
      t=t.replace(/([0-9]*[a-zA-Z])\/([0-9]+)/g,(_,n,d)=>fracSpan(n,d));
      t=t.replace(/([0-9]+)\/([0-9]+)/g,(_,n,d)=>fracSpan(n,d));
      return mathStyle(t);
    }).join('<br>');
  }

  // HTML 단일 줄
  if(/<[a-zA-Z]/.test(text)) return mergeLaTeX(mathStyle(text));

  // 한글 단일 줄: 앞 수식 prefix 처리
  if(hasKo){
    if(text.includes('\\(')) return mergeLaTeX(mathStyle(text));
    const firstKo = text.search(/[가-힣]/);
    if(firstKo > 0){
      const prefix=text.slice(0,firstKo).trim();
      const rest=text.slice(firstKo);
      // 숫자+단위(km, m, cm, %, 등)만으로 이루어진 prefix는 LaTeX 미적용
      // 예: "800원" → prefix="800", "50 km" → prefix="50 km" → 폰트 불일치 방지
      const numUnitOnly = /^[\d\s.,]+(km|cm|mm|m|g|kg|%)?$/i.test(prefix);
      if(prefix && !numUnitOnly && !/[가-힣]/.test(prefix) && !prefix.includes('\\(')){
        let expr=prefix.replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3');
        expr=expr.replace(/([a-zA-Z][a-zA-Z0-9^]*)\/([0-9]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
        return `\\(${expr}\\)`+mathStyle(rest);
      }
    }
    let t=text;
    t=t.replace(/\(([^)]+)\)\/([0-9]+)/g,(_,n,d)=>fracSpan(n,d));
    t=t.replace(/([0-9]*[a-zA-Z])\/([0-9]+)/g,(_,n,d)=>fracSpan(n,d));
    return mathStyle(t);
  }

  // 순수 수식 → LaTeX
  if(text.includes('\\(')) return mergeLaTeX(mathStyle(text));
  let t=text.replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3');
  t=t.replace(/\(([^)]+)\)\/([0-9a-zA-Z^]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
  t=t.replace(/([a-zA-Z][a-zA-Z0-9^]*)\/([0-9]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
  t=t.replace(/([0-9]+)\/([0-9]+)/g,(_,n,d)=>`\\frac{${n}}{${d}}`);
  return `\\( ${t} \\)`;
}

function fracSpan(n, d){
  return `\\(\\frac{${n}}{${d}}\\)`;
}

/* MathJax 재렌더링 — 로드 안 됐으면 최대 2초 대기 후 재시도 */
function renderMath(el, retry=0){
  if(window.MathJax && MathJax.typesetPromise){
    // typesetClear 제거: 깜빡임 및 재렌더링 버그 방지
    MathJax.typesetPromise([el]).catch(e=>{}); // DOM 변경으로 인한 오류 무시
  } else if(retry < 30){
    setTimeout(()=>renderMath(el, retry+1), 150);
  }
}

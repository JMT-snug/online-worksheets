// Firestore curriculum에서 학습지 로드 (edit.html에서 만든 것 포함)
async function loadCurriculum(){
  try{
    const [uSnap,wSnap]=await Promise.all([
      getDocs(query(collection(db,'units'),orderBy('order'))),
      getDocs(collection(db,'curriculum'))
    ]);
    const units=uSnap.docs.map(d=>({...d.data()}));
    const sheets=wSnap.docs.map(d=>({...d.data()}))
      .sort((a,b)=>(a.order??99)-(b.order??99));
    sheets.forEach(ws=>{ if(!ws.questions) ws.questions=[]; if(!ws.vocab) ws.vocab=[];
      if(ws.questions && !ws.qCount) ws.qCount=ws.questions.filter(q=>q.type!=="link").length; });
    if(sheets.length) WORKSHEETS=sheets;   // Firestore 우선 (없으면 정적 worksheets.js 유지)
    if(units.length){ UNITS=units; units.forEach(u=>UNIT_MAP[u.id]=u); }  // UNIT_MAP 병합(학년/영역 조회용)
    console.log(`[teacher 커리큘럼] 단원 ${units.length}개, 학습지 ${sheets.length}개 (Firestore)`);
  }catch(e){ console.warn('[커리큘럼 로드 실패 → 정적 worksheets.js 사용]', e.message); }
}

async function loadAll(){
  document.getElementById("content").innerHTML='<div class="loading">데이터 불러오는 중…</div>';
  allData={};
  try{
    progressData={};
    const snap=await getDocs(collectionGroup(db,"worksheets"));
    snap.forEach(d=>{
      const parts=d.ref.path.split("/");
      const col=parts[0], uid=parts[1], wsId=parts[3];
      if(col==="records"){                        // 새 통합 구조
        if(!allData[uid]) allData[uid]={};
        allData[uid][wsId]=d.data();
      } else if(col==="results"){                 // 구 완료 데이터
        if(!allData[uid]) allData[uid]={};
        if(!allData[uid][wsId]) allData[uid][wsId]=d.data(); // records 우선
      } else if(col==="progress"){                // 구 진행 중 데이터
        if(!progressData[uid]) progressData[uid]={};
        progressData[uid][wsId]=d.data();
      }
    });
  }catch(e){ console.error("Firestore 오류:",e); }
  try{
    const cSnap=await getDoc(doc(db,"teacher_data",tUser.uid));
    if(cSnap.exists()) classes=cSnap.data().classes||{};
  }catch(e){ classes={}; }
  buildSidebar();
  renderOverview();
}

const GCOL={1:"#1d4ed8",2:"#15803d",3:"#b91c1c"};
const GRADE_LABEL={1:"🔵 1학년",2:"🟢 2학년",3:"🔴 3학년"};
const sbGradeOpen={1:true,2:true,3:true};
const sbUnitOpen={};

function buildSidebar(){
  const nav=document.getElementById("sidebar");
  let h=`
    <div class="sb-section">메뉴</div>
    <div class="sb-item ${selView==='overview'?'active':''}" data-view="overview">📊 전체 현황</div>
    <div class="sb-item ${selView==='students'||selView.startsWith('stu:')?'active':''}" data-view="students">👤 학생별 조회</div>
    <div class="sb-item ${selView==='classes'?'active':''}" data-view="classes">🏫 학급 관리</div>
    <div class="sb-section" style="margin-top:8px">학습지</div>`;
  [1,2,3].forEach(grade=>{
    const gc=GCOL[grade];
    const gradeOpen=sbGradeOpen[grade]!==false;
    h+=`
      <div class="sb-grade-header" data-grade="${grade}">
        <span class="sb-grade-dot" style="background:${gc}"></span>
        <span>${GRADE_LABEL[grade]}</span>
        <span class="sb-chevron ${gradeOpen?'open':''}">›</span>
      </div>
      <div class="sb-unit-group" id="grade-group-${grade}" style="max-height:${gradeOpen?'2000px':'0'}">`;
    const gradeUnits=UNITS.filter(u=>u.grade===grade);
    gradeUnits.forEach(unit=>{
      const uKey=`${grade}-${unit.id}`;
      const unitOpen=sbUnitOpen[uKey]!==false;
      const sheets=WORKSHEETS.filter(ws=>ws.unitId===unit.id);
      if(!sheets.length) return;
      h+=`
        <div class="sb-unit-header" data-ukey="${uKey}">
          <span style="font-size:11px">📂</span>
          <span>${unit.title}</span>
          <span class="sb-unit-chevron ${unitOpen?'open':''}">›</span>
        </div>
        <div class="sb-ws-group" id="unit-group-${uKey}" style="max-height:${unitOpen?'1000px':'0'}">`;
      sheets.forEach(ws=>{
        const done=Object.values(allData).filter(d=>isRecDone(d[ws.id])).length;
        h+=`
          <div class="sb-ws-item ${selView===ws.id?'active':''}" data-view="${ws.id}">
            <span class="sb-ws-dot"></span>
            <span style="flex:1">${ws.title}</span>
            <span class="sb-count">${done}</span>
          </div>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  nav.innerHTML=h;
  nav.querySelectorAll(".sb-item[data-view]").forEach(el=>{
    el.addEventListener("click",()=>navigate(el.dataset.view));
  });
  nav.querySelectorAll(".sb-ws-item[data-view]").forEach(el=>{
    el.addEventListener("click",()=>navigate(el.dataset.view));
  });
  nav.querySelectorAll(".sb-grade-header").forEach(el=>{
    el.addEventListener("click",()=>{
      const g=parseInt(el.dataset.grade);
      sbGradeOpen[g]=!sbGradeOpen[g];
      const group=document.getElementById("grade-group-"+g);
      const chevron=el.querySelector(".sb-chevron");
      if(sbGradeOpen[g]){group.style.maxHeight="2000px";chevron.classList.add("open");}
      else{group.style.maxHeight="0";chevron.classList.remove("open");}
    });
  });
  nav.querySelectorAll(".sb-unit-header").forEach(el=>{
    el.addEventListener("click",()=>{
      const uKey=el.dataset.ukey;
      sbUnitOpen[uKey]=!sbUnitOpen[uKey];
      const group=document.getElementById("unit-group-"+uKey);
      const chevron=el.querySelector(".sb-unit-chevron");
      if(sbUnitOpen[uKey]!==false){group.style.maxHeight="1000px";chevron.classList.add("open");}
      else{group.style.maxHeight="0";chevron.classList.remove("open");}
    });
  });
}

function navigate(view){
  selView=view;
  buildSidebar();
  if(view==="overview") renderOverview();
  else if(view==="classes") renderClasses();
  else if(view==="students") renderStudents();
  else if(view.startsWith("stu:")) renderStudentDetail(view.slice(4));
  else renderWS(view);
}
window.navigate=navigate;

// ── 학생별 조회: 공용 문항 셀 렌더 ──
function perQCells(r, uid){
  if(!r || !r.perQuestion) return '<span style="color:var(--ink3);font-size:12px">기록 없음</span>';
  window._qd=window._qd||{};
  const cells=Object.entries(r.perQuestion).sort().map(([qid,v])=>{
    const wc=(v.wrongInputs||[]).length;
    const att=v.attempts||0;
    const isCorrect = v.correct!==undefined ? v.correct===true : (wc===0);
    const unanswered = (v.correct===false) && wc===0 && att===0;
    let col, mark, ttl;
    if(unanswered){ col="var(--ink3)"; mark="—"; ttl=`${fmtQid(qid)}: 미응답`; }
    else if(isCorrect){ col="var(--green)"; mark=wc>0?`✓(${wc})`:"✓"; ttl=`${qid}: 정답${wc>0?` (오답 ${wc}회 후)`:""}`; }
    else { col=wc>=2?"var(--red)":"var(--amber)"; mark=`${wc}회`; ttl=`${fmtQid(qid)}: 오답 ${wc}회`; }
    const dkey=(uid||r.uid||"x")+"_"+qid;
    window._qd[dkey]={studentName:r.studentName||"-",qid,attempts:att||(isCorrect?1:0),wrong:wc,correct:isCorrect,unanswered,wrongInputs:v.wrongInputs||[],canvasImage:v.canvasImage||null};
    return `<div class="qcell" onclick="showQDetail('${dkey}')" title="${ttl}"><span class="qcell-id" style="color:${col}">${fmtQid(qid)}</span><span class="qcell-try" style="color:${col}">${mark}</span></div>`;
  }).join("");
  return `<div style="display:flex;flex-wrap:wrap;gap:3px">${cells}</div>`;
}

// ── 학생 목록 ──
let _stuSort="class", _stuClass="", _stuSearch="";
function studentList(){
  return Object.entries(allData).map(([uid,wsMap])=>{
    const recs=Object.values(wsMap);
    const any=recs.find(r=>r.studentName)||recs[0]||{};
    const email=any.studentEmail||"-";
    const total=recs.length;
    const done=recs.filter(isRecDone).length;
    const rates=recs.filter(r=>typeof r.correctRate==="number").map(r=>r.correctRate);
    const avg=rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length):null;
    return {uid,name:any.studentName||"-",email,cls:findClass(email)||"-",total,done,avg};
  });
}

function renderStudents(){
  selView="students";
  const list=studentList();
  let students=[...list];
  // 학급 필터
  if(_stuClass) students=students.filter(s=>s.cls===_stuClass);
  // 이름/이메일 검색
  if(_stuSearch){ const kw=_stuSearch.toLowerCase();
    students=students.filter(s=>(s.name||"").toLowerCase().includes(kw)||(s.email||"").toLowerCase().includes(kw)); }
  // 정렬
  if(_stuSort==="class") students.sort((a,b)=>(""+a.cls).localeCompare(""+b.cls,"ko")||(""+a.name).localeCompare(""+b.name,"ko"));
  else if(_stuSort==="name") students.sort((a,b)=>(""+a.name).localeCompare(""+b.name,"ko"));
  else if(_stuSort==="done") students.sort((a,b)=>b.done-a.done);
  else if(_stuSort==="rate") students.sort((a,b)=>(b.avg??-1)-(a.avg??-1));

  const totalStu=list.length;
  const filtered=students;
  // 학급 목록 (필터 드롭다운용)
  const allClasses=[...new Set(list.map(s=>s.cls).filter(c=>c&&c!=="-"))].sort((a,b)=>a.localeCompare(b,"ko"));
  const rows=filtered.map(s=>`
    <tr style="cursor:pointer" onclick="navigate('stu:${s.uid}')">
      <td><strong>${s.name}</strong></td>
      <td style="font-size:12px;color:var(--ink3)">${s.email}</td>
      <td style="font-size:12px">${s.cls}</td>
      <td style="text-align:center"><span class="tries-badge ${s.done>0?'tries-1':'tries-many'}">${s.done}개</span></td>
      <td>${s.avg!=null?rateBar(s.avg):'<span style="color:var(--ink3)">-</span>'}</td>
      <td style="text-align:center;color:var(--accent);font-size:12px;font-weight:600">상세 →</td>
    </tr>`).join("");

  document.getElementById("content").innerHTML=`
    <div class="card">
      <div class="card-hdr" style="flex-wrap:wrap;gap:8px">
        <span class="card-title">👤 학생별 조회 <span style="color:var(--ink3);font-weight:400">· ${filtered.length}명${_stuSearch||_stuClass?` / 전체 ${totalStu}명`:''}</span></span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="stu-search" type="text" placeholder="이름·이메일 검색" value="${_stuSearch}"
            oninput="_stuSearch=this.value;renderStudents()"
            style="padding:6px 10px;border:1px solid var(--rule);border-radius:8px;font-size:13px;width:160px">
          <select onchange="_stuClass=this.value;renderStudents()" style="padding:6px 10px;border:1px solid var(--rule);border-radius:8px;font-size:13px">
            <option value="" ${!_stuClass?'selected':''}>전체 학급</option>
            ${allClasses.map(c=>`<option value="${c}" ${_stuClass===c?'selected':''}>${c}</option>`).join('')}
          </select>
          <select onchange="_stuSort=this.value;renderStudents()" style="padding:6px 10px;border:1px solid var(--rule);border-radius:8px;font-size:13px">
            <option value="class" ${_stuSort==='class'?'selected':''}>학급 순</option>
            <option value="name"  ${_stuSort==='name'?'selected':''}>이름 순</option>
            <option value="done"  ${_stuSort==='done'?'selected':''}>완료 많은 순</option>
            <option value="rate"  ${_stuSort==='rate'?'selected':''}>정답률 높은 순</option>
          </select>
        </div>
      </div>
      <table class="data-table">
        <thead><tr><th>이름</th><th>이메일</th><th>학급</th><th style="text-align:center">완료 학습지</th><th>평균 정답률</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:var(--ink3);padding:30px">학생 데이터가 없습니다</td></tr>'}</tbody>
      </table>
    </div>`;
}
window.renderStudents=renderStudents;

// ── 학생 상세: 한 학생의 모든 학습지 ──
function renderStudentDetail(uid){
  selView="stu:"+uid;
  const wsMap=allData[uid]||{};
  const recs=Object.values(wsMap);
  const any=recs.find(r=>r.studentName)||recs[0]||{};
  const name=any.studentName||"-", email=any.studentEmail||"-", cls=findClass(email)||"-";
  const done=recs.filter(isRecDone).length;
  const rates=recs.filter(r=>typeof r.correctRate==="number").map(r=>r.correctRate);
  const avg=rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length):null;
  const totalTries=recs.reduce((s,r)=>s+getAttempts(r),0);

  // 학습지별 행 (WORKSHEETS 정의 순서, 학생이 시작한 것만)
  const ordered=WORKSHEETS.filter(ws=>wsMap[ws.id]);
  const startedIds=new Set(ordered.map(w=>w.id));
  // WORKSHEETS에 없지만 기록이 있는 경우(삭제된 학습지 등)
  Object.keys(wsMap).forEach(id=>{ if(!startedIds.has(id)){ ordered.push({id,title:wsMap[id].worksheetTitle||id,unitId:wsMap[id].unitId}); } });

  const rows=ordered.map(ws=>{
    const r=wsMap[ws.id]; if(!r) return "";
    const dn=isRecDone(r);
    const rate=r.correctRate ?? (r.totalCount?Math.round((r.answeredCount||0)/r.totalCount*100):0);
    const tries=getAttempts(r);
    const unit=UNIT_MAP[ws.unitId]?.title||"-";
    const ts=formatDate(r.completedAt||r.lastUpdated);
    const statusBadge=dn
      ? `<span style="color:var(--green);font-weight:600">✅ 완료</span>`
      : `<span style="color:var(--amber);font-weight:600">⏳ 진행 중 (${r.answeredCount||0}/${r.totalCount||"?"})</span>`;
    return `<tr>
      <td><strong>${ws.title||"-"}</strong><br><span style="font-size:11px;color:var(--ink3)">${unit}</span></td>
      <td style="font-size:12px">${statusBadge}<br><span style="font-size:11px;color:var(--ink3)">${ts}</span></td>
      <td>${rate!=null?rateBar(rate):'-'}</td>
      <td style="text-align:center"><span class="tries-badge ${tries===0?'tries-1':tries<=3?'tries-2':'tries-many'}">${tries}회</span></td>
      <td style="min-width:200px">${perQCells(r,uid)}</td>
    </tr>`;
  }).join("");

  document.getElementById("content").innerHTML=`
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">👤 ${name} <span style="color:var(--ink3);font-weight:400">· ${cls} · ${email}</span></span>
        <button class="btn" onclick="navigate('students')">← 학생 목록</button>
      </div>
      <div class="summary-row" style="margin-bottom:16px">
        <div class="sum-card"><div class="sum-label">완료 학습지</div><div class="sum-num">${done}<span style="font-size:14px;color:var(--ink3)">/${recs.length}</span></div></div>
        <div class="sum-card"><div class="sum-label">평균 정답률</div><div class="sum-num" style="color:${avg!=null&&avg>=70?'var(--green)':'var(--amber)'}">${avg!=null?avg+'%':'-'}</div></div>
        <div class="sum-card"><div class="sum-label">총 시도</div><div class="sum-num">${totalTries}<span style="font-size:14px;color:var(--ink3)">회</span></div></div>
      </div>
      <table class="data-table">
        <thead><tr><th>학습지</th><th>상태</th><th>정답률</th><th style="text-align:center">시도</th><th>문항별 (클릭=상세)</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:var(--ink3);padding:30px">기록이 없습니다</td></tr>'}</tbody>
      </table>
    </div>`;
}
window.renderStudentDetail=renderStudentDetail;

// ── Fix 2: renderOverview - ws.grade/category → wsGrade/wsCategory 함수 사용 ──
function renderOverview(){
  const students=Object.keys(allData).length;
  let totalSub=0,totalTries=0,totalPct=0,pctN=0;
  Object.values(allData).forEach(d=>Object.values(d).forEach(r=>{
    totalSub++; totalTries+=getAttempts(r);
    if(r.correctRate!=null){totalPct+=r.correctRate;pctN++;}
  }));
  const avgPct=pctN?Math.round(totalPct/pctN):0;
  let h=`<div class="pg-title">전체 현황</div>
  <div class="pg-sub">마지막 갱신: ${new Date().toLocaleString("ko-KR")}
    <button class="btn-sm" onclick="loadAll()">새로고침</button>
  </div>
  <div class="sum-grid">
    <div class="sum-card"><div class="sum-label">참여 학생</div><div class="sum-num">${students}</div><div class="sum-sub">제출 이력 기준</div></div>
    <div class="sum-card"><div class="sum-label">총 제출</div><div class="sum-num">${totalSub}</div><div class="sum-sub">학생 × 단원</div></div>
    <div class="sum-card"><div class="sum-label">평균 정답률</div><div class="sum-num" style="color:${rateColor(avgPct)}">${avgPct}%</div><div class="sum-sub">완료 기준</div></div>
    <div class="sum-card"><div class="sum-label">총 시도 횟수</div><div class="sum-num">${totalTries}</div><div class="sum-sub">오답 재시도 포함</div></div>
  </div>
  <div class="card">
    <div class="card-hdr"><span class="card-title">학년·단원별 요약</span>
      <button class="btn-sm" onclick="exportOverview()">CSV 내보내기</button>
    </div>
    <table><thead><tr>
      <th>단원</th><th>학년</th><th>영역</th><th>완료 학생</th><th>평균 정답률</th><th>평균 시도</th>
    </tr></thead><tbody>`;
  [1,2,3].forEach(g=>{
    // Fix: ws.grade 없음 → wsGrade(ws) 사용
    WORKSHEETS.filter(w=>wsGrade(w)===g).forEach(ws=>{
      const cat=wsCategory(ws)||"-";
      const recs=Object.values(allData).map(d=>d[ws.id]).filter(r=>isRecDone(r));
      const done=recs.length;
      const avgR=done?Math.round(recs.reduce((s,r)=>s+(r.correctRate||0),0)/done):0;
      const avgT=done?(recs.reduce((s,r)=>s+getAttempts(r),0)/done).toFixed(1):"-";
      const gc=g===1?'#1e40af':g===2?'#166534':'#991b1b';
      const gb=g===1?'#dbeafe':g===2?'#dcfce7':'#fee2e2';
      h+=`<tr>
        <td><strong>${ws.title}</strong></td>
        <td><span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:${gb};color:${gc}">${g}학년</span></td>
        <td><span class="badge ${CAT_CLASS[cat]||''}">${cat}</span></td>
        <td>${done}명</td>
        <td>${done?rateBar(avgR):'<span style="color:var(--ink3)">-</span>'}</td>
        <td><span class="tries-badge ${avgT<=3?'tries-1':avgT<=6?'tries-2':'tries-many'}">${avgT}</span></td>
      </tr>`;
    });
  });
  h+=`</tbody></table></div>`;
  document.getElementById("content").innerHTML=h;
  window.loadAll=loadAll;
  window.exportOverview=exportOverview;
}

// ── Fix 3: renderWS - ws.grade/category, completedAt, perfect 수정 ──

let _wsFilter="", _wsSortBy="class";
// 인라인 onchange → 모듈 변수 접근용 래퍼
window.setWSFilter=function(v,wsId){_wsFilter=v; window.renderWSTable(wsId);};
window.setWSSort  =function(v,wsId){_wsSortBy=v; window.renderWSTable(wsId);};

window.renderWSTable=function(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId); if(!ws) return;
  const recs=[];
  Object.entries(allData).forEach(([uid,d])=>{ if(d[wsId]) recs.push({uid,...d[wsId]}); });

  // 완료 / 진행 중 분리
  const isDone=isRecDone;
  let done=recs.filter(isDone);
  let inProg=recs.filter(r=>!isDone(r));

  // 필터 적용
  if(_wsFilter){
    done=done.filter(r=>(findClass(r.studentEmail)||"")=== _wsFilter);
    inProg=inProg.filter(r=>(findClass(r.studentEmail)||"")=== _wsFilter);
  }

  // 정렬 (tries는 perQuestion에서 계산)
  const triesOf=r=>getAttempts(r);
  const sortFn=(a,b)=>{
    if(_wsSortBy==="class") return (findClass(a.studentEmail)||"zzz").localeCompare(findClass(b.studentEmail)||"zzz","ko");
    if(_wsSortBy==="name")  return (a.studentName||"").localeCompare(b.studentName||"","ko");
    if(_wsSortBy==="time")  return String(a.completedAt||a.lastUpdated||"").localeCompare(String(b.completedAt||b.lastUpdated||""));
    return triesOf(a)-triesOf(b); // tries: 오답 적은 순
  };
  done.sort(sortFn);
  inProg.sort(sortFn); // 진행 중도 선택한 정렬 적용

  const tbody=document.getElementById("ws-tbody"); if(!tbody) return;

  // 완료 행
  // perQuestion 정오답 셀 렌더 (완료/진행 중 공통)
  function renderPerQ(r){
    if(!r.perQuestion) return "";
    window._qd=window._qd||{};
    const cells=Object.entries(r.perQuestion).sort().map(([qid,v])=>{
      const wc=(v.wrongInputs||[]).length;
      const att=v.attempts||0;
      // 정답/오답/미응답 구분 (correct 필드 우선, 없으면 레거시 추정)
      const isCorrect = v.correct!==undefined ? v.correct===true : (wc===0);
      const unanswered = (v.correct===false) && wc===0 && att===0;
      let col, mark, ttl;
      if(unanswered){ col="var(--ink3)"; mark="—"; ttl=`${fmtQid(qid)}: 미응답`; }
      else if(isCorrect){ col="var(--green)"; mark=wc>0?`✓(${wc}회)`:"✓"; ttl=`${qid}: 정답${wc>0?` (오답 ${wc}회 후)`:""}`; }
      else { col=wc>=2?"var(--red)":"var(--amber)"; mark=`${wc}회`; ttl=`${fmtQid(qid)}: 오답 ${wc}회`; }
      const dkey=r.uid+"_"+qid;
      window._qd[dkey]={studentName:r.studentName||"-",qid,attempts:att||(isCorrect?1:0),wrong:wc,correct:isCorrect,unanswered,wrongInputs:v.wrongInputs||[],canvasImage:v.canvasImage||null};
      return `<div class="qcell" onclick="showQDetail('${dkey}')" title="${ttl}"><span class="qcell-id" style="color:${col}">${fmtQid(qid)}</span><span class="qcell-try" style="color:${col}">${mark}</span></div>`;
    }).join("");
    return `<div style="display:flex;flex-wrap:wrap;gap:3px">${cells}</div>`;
  }
  const doneRows=done.map(r=>{
    const ts=formatDate(r.completedAt||r.lastUpdated);
    const rate=r.correctRate??Math.round((r.answeredCount||0)/(r.totalCount||1)*100);
    const tries=getAttempts(r);
    const wrong=tries;
    const wcls=wrong===0?"tries-1":wrong<=2?"tries-2":"tries-many";
    const classInfo=findClass(r.studentEmail)||"-";
    const perQHtml=renderPerQ(r);
    return `<tr>
      <td><strong>${r.studentName||"-"}</strong></td>
      <td style="font-size:12px;color:var(--ink3)">${r.studentEmail||"-"}</td>
      <td style="font-size:12px">${classInfo}</td>
      <td>${rateBar(rate)}</td>
      <td><span class="tries-badge ${wcls}">${wrong}회</span></td>
      <td style="min-width:180px">${perQHtml||"-"}</td>
      <td style="font-size:12px"><span style="color:var(--green);font-weight:600">✅ 완료</span><br>${ts}</td>
    </tr>`;
  }).join("");

  // 진행 중 행
  const inProgRows=inProg.map(r=>{
    const classInfo=findClass(r.studentEmail)||"-";
    const pct=r.totalCount?Math.round((r.answeredCount||0)/r.totalCount*100):0;
    const upd=formatDate(r.lastUpdated);
    const tries=getAttempts(r);
    const wcls=tries===0?"tries-1":tries<=2?"tries-2":"tries-many";
    const perQHtml=renderPerQ(r);
    return `<tr style="background:var(--acc-lt)">
      <td><strong>${r.studentName||"-"}</strong></td>
      <td style="font-size:12px;color:var(--ink3)">${r.studentEmail||"-"}</td>
      <td style="font-size:12px">${classInfo}</td>
      <td><div class="rate-row"><div class="rate-bg"><div class="rate-fill" style="width:${pct}%;background:var(--amber)"></div></div><span class="rate-n" style="color:var(--amber)">${r.answeredCount||0}/${r.totalCount||"?"}</span></div></td>
      <td>${tries>0?`<span class="tries-badge ${wcls}">${tries}회</span>`:"-"}</td>
      <td style="min-width:180px">${perQHtml||"-"}</td>
      <td style="font-size:12px"><span style="color:var(--amber);font-weight:600">⏳ 진행 중</span><br>${upd}</td>
    </tr>`;
  }).join("");

  if(!doneRows&&!inProgRows){
    tbody.innerHTML=`<tr><td colspan="7" style="text-align:center;color:var(--ink3);padding:28px">${_wsFilter?"해당 학급의 학생이 없습니다.":"제출 기록이 없습니다."}</td></tr>`;
    return;
  }
  tbody.innerHTML=inProgRows+doneRows;
};


function renderWS(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  if(!ws){renderOverview();return;}
  const grade=wsGrade(ws)||"?";
  const cat=wsCategory(ws)||"-";
  const recs=[];
  Object.entries(allData).forEach(([uid,d])=>{ if(d[wsId]) recs.push({uid,...d[wsId]}); });
  const done=recs.filter(r=>isRecDone(r));
  const avgR=done.length?Math.round(done.reduce((s,r)=>s+(r.correctRate||0),0)/done.length):0;
  const avgT=done.length?(done.reduce((s,r)=>s+getAttempts(r),0)/done.length).toFixed(1):"-";
  // Fix: 하드코딩 5 → ws.qCount 사용
  const qc=ws.qCount||(ws.questions?.length)||0;
  const perfect=qc>0?done.filter(r=>getAttempts(r)===0).length:"-";

  // sum-grid까지 렌더링 후 템플릿 리터럴 닫기
  let h=`<div class="pg-title">${ws.title}</div>
  <div class="pg-sub">
    <span class="badge ${CAT_CLASS[cat]||''}">${cat}</span>
    수학 ${grade}학년
  </div>
  <div class="sum-grid">
    <div class="sum-card"><div class="sum-label">완료 학생</div><div class="sum-num">${done.length}<span style="font-size:14px;color:var(--amber)"> + ${recs.length-done.length}진행중</span></div></div>
    <div class="sum-card"><div class="sum-label">평균 정답률</div><div class="sum-num" style="color:${rateColor(avgR)}">${avgR}%</div></div>
    <div class="sum-card"><div class="sum-label">평균 시도 횟수</div><div class="sum-num">${avgT}</div><div class="sum-sub">문제당</div></div>
    <div class="sum-card"><div class="sum-label">첫 번에 완료</div><div class="sum-num" style="color:var(--green)">${perfect}</div><div class="sum-sub">모두 1회 정답</div></div>
  </div>`;

  // ── 반별 완료 현황 ──
  const classSummary=[];
  // 등록된 학급별 집계
  Object.entries(classes).sort().forEach(([key,cls])=>{
    const students=cls.students||[];
    const label=`${cls.grade}학년 ${cls.classNum}반`;
    const clsDone=done.filter(r=>students.includes((r.studentEmail||"").toLowerCase())).length;
    classSummary.push({label, done:clsDone, total:students.length, key});
  });
  // 미분류 (어떤 학급에도 없는 완료 학생)
  const allEnrolled=new Set(Object.values(classes).flatMap(c=>c.students||[]));
  const unclassified=done.filter(r=>!allEnrolled.has((r.studentEmail||"").toLowerCase())).length;
  if(unclassified>0||classSummary.length===0)
    classSummary.push({label:"미분류", done:unclassified, total:"-", key:"_unclassified"});

  if(classSummary.length){
    h+=`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:stretch">
      ${classSummary.map(c=>{
        const pct=typeof c.total==="number"&&c.total>0?Math.round(c.done/c.total*100):null;
        const col=pct===null?"var(--ink3)":pct>=80?"var(--green)":pct>=40?"var(--amber)":"var(--red)";
        return `<div style="background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);
          padding:12px 18px;min-width:120px;display:flex;flex-direction:column;gap:4px">
          <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;
            letter-spacing:.06em">${c.label}</div>
          <div style="font-size:22px;font-weight:900;color:${col};line-height:1">
            ${c.done}<span style="font-size:13px;color:var(--ink3);font-weight:400"> / ${c.total}</span>
          </div>
          ${pct!==null?`<div style="height:4px;border-radius:2px;background:var(--rule);overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${col};border-radius:2px"></div>
          </div>`:""}
        </div>`;
      }).join("")}
    </div>`;
  }


  // 학급 필터 옵션 생성 (JS 코드, 템플릿 리터럴 밖)
  const classSet=new Set(done.map(r=>findClass(r.studentEmail)||"").filter(Boolean));
  const classOpts=[...classSet].sort((a,b)=>a.localeCompare(b,"ko"))
    .map(c=>`<option value="${c}">${c}</option>`).join("");

  // 완료 학생 카드 (필터/정렬 컨트롤 포함)
  h+=`<div class="card">
    <div class="card-hdr">
      <span class="card-title">✅ 완료 학생 목록</span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select onchange="setWSFilter(this.value,'${wsId}')"
          style="font-size:12px;padding:5px 8px;border-radius:6px;border:1.5px solid var(--rule);font-family:inherit">
          <option value="" ${!_wsFilter?'selected':''}>전체 학급</option>${classOpts}
        </select>
        <select onchange="setWSSort(this.value,'${wsId}')"
          style="font-size:12px;padding:5px 8px;border-radius:6px;border:1.5px solid var(--rule);font-family:inherit">
          <option value="tries" ${_wsSortBy==='tries'?'selected':''}>오답 적은 순</option>
          <option value="class" ${_wsSortBy==='class'?'selected':''}>학급 순</option>
          <option value="name" ${_wsSortBy==='name'?'selected':''}>이름 순</option>
          <option value="time" ${_wsSortBy==='time'?'selected':''}>완료 시간 순</option>
        </select>
        <button class="btn-sm" onclick="exportWS('${wsId}')">CSV</button>
      </div>
    </div>
    <table><thead><tr>
      <th>학생</th><th>이메일</th><th>학급</th><th>정답률/진행률</th><th>오답</th><th>문항별 오답</th><th>상태</th>
    </tr></thead><tbody id="ws-tbody"></tbody></table>
  </div>`;
  const qStats={};
  recs.forEach(r=>{ if(!r.perQuestion) return;
    Object.entries(r.perQuestion).forEach(([qid,v])=>{
      if(!qStats[qid]) qStats[qid]={total:0,totalTries:0};
      qStats[qid].total++; qStats[qid].totalTries+=v.attempts||1;
    });
  });
  if(Object.keys(qStats).length){
    h+=`<div class="card"><div class="card-hdr"><span class="card-title">📊 문항별 난이도</span></div>
    <table><thead><tr><th>문항</th><th>응시</th><th>평균 시도</th><th>난이도</th></tr></thead><tbody>`;
    Object.entries(qStats).sort().forEach(([qid,s])=>{
      const avg=(s.totalTries/s.total).toFixed(1);
      const diff=avg<=1.2?"🟢 쉬움":avg<=2.0?"🟡 보통":"🔴 어려움";
      h+=`<tr><td>${qid}</td><td>${s.total}명</td>
        <td><span class="tries-badge ${avg<=1.2?'tries-1':avg<=2?'tries-2':'tries-many'}">${avg}회</span></td>
        <td>${diff}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }

  document.getElementById("content").innerHTML=h;
  _wsFilter=""; _wsSortBy="class";
  renderWSTable(wsId);
  window.exportWS=exportWS;
}

    <div class="class-row" style="gap:10px;margin-bottom:10px">

          ${students.map((e,i)=>{
            const disp=e.endsWith(STUDENT_DOMAIN)?e.replace(STUDENT_DOMAIN,''):e;

              <span>${disp}</span>
              <span style="font-size:11px;color:var(--ink3);margin-left:2px">${STUDENT_DOMAIN}</span>

async function saveClasses(){
  try{ await setDoc(doc(db,"teacher_data",tUser.uid),{classes},{merge:true}); }
  catch(e){ console.error("학급 저장 오류:",e); }
}

window.addClass=async function(){
  const year=document.getElementById("new-year").value.trim();
  const grade=document.getElementById("new-grade").value;
  const cn=document.getElementById("new-class").value.trim();
  if(!year||!cn){ alert("학년도와 반을 입력하세요."); return; }
  const key=`${year}-${grade}-${cn}`;
  if(classes[key]){ alert("이미 존재하는 학급입니다."); return; }
  classes[key]={year,grade,classNum:cn,students:[]};
  await saveClasses(); renderClasses();
};
window.deleteClass=async function(key){
  if(!confirm(`${classes[key]?.year}학년도 ${classes[key]?.grade}학년 ${classes[key]?.classNum}반을 삭제할까요?`)) return;
  delete classes[key]; await saveClasses(); renderClasses();
};
window.addStudent=async function(key){
  const inp=document.getElementById("add-"+key);
  let val=inp.value.trim().toLowerCase();
  if(!val) return;
  const email=val.includes("@")?val:val+STUDENT_DOMAIN;
  if(!classes[key].students) classes[key].students=[];
  if(classes[key].students.includes(email)){ alert("이미 등록된 학생입니다."); inp.select(); return; }
  classes[key].students.push(email);
  await saveClasses(); renderClasses();
  requestAnimationFrame(()=>{
    const newInp=document.getElementById("add-"+key);
    if(newInp){ newInp.value=""; newInp.focus(); }
  });
};
window.removeStudent=async function(key,idx){
  classes[key].students.splice(idx,1);
  await saveClasses(); renderClasses();
};

function findClass(email){
  if(!email) return null;
  for(const [key,cls] of Object.entries(classes)){
    if((cls.students||[]).includes(email.toLowerCase()))
      return `${cls.year}/${cls.grade}학년 ${cls.classNum}반`;
  }
  return null;
}

// ── Fix 4: formatDate - completedAt ISO 문자열 & Timestamp 모두 처리 ──
function formatDate(v){
  if(!v) return "-";
  if(typeof v==="string") return new Date(v).toLocaleString("ko-KR");
  if(v.toDate) return v.toDate().toLocaleString("ko-KR");
  return "-";
}
function rateColor(r){ return r>=80?"var(--green)":r>=60?"var(--amber)":"var(--red)"; }
function rateBar(rate){
  return `<div class="rate-row">
    <div class="rate-bg"><div class="rate-fill" style="width:${rate}%;background:${rateColor(rate)}"></div></div>
    <span class="rate-n" style="color:${rateColor(rate)}">${rate}%</span>
  </div>`;
}

// ── Fix 5: exportOverview/exportWS - ws.grade/category → wsGrade/wsCategory, formatDate ──
function exportOverview(){
  let csv="단원,학년,영역,완료학생수,평균정답률,평균시도\n";
  WORKSHEETS.forEach(ws=>{
    const recs=Object.values(allData).map(d=>d[ws.id]).filter(r=>isRecDone(r));
    const avgR=recs.length?Math.round(recs.reduce((s,r)=>s+(r.correctRate||0),0)/recs.length):0;
    const avgT=recs.length?(recs.reduce((s,r)=>s+getAttempts(r),0)/recs.length).toFixed(1):0;
    csv+=`"${ws.title}",${wsGrade(ws)||"-"},"${wsCategory(ws)||"-"}",${recs.length},${avgR}%,${avgT}\n`;
  });
  dl(csv,"전체현황.csv");
}
function exportWS(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  let csv="이름,이메일,학급,정답률,총시도,완료일시\n";
  Object.values(allData).forEach(d=>{
    const r=d[wsId]; if(!r?.completedAt) return;
    const ts=formatDate(r.completedAt);
    const cls=findClass(r.studentEmail)||"-";
    csv+=`"${r.studentName||""}","${r.studentEmail||""}","${cls}",${r.correctRate||0}%,${getAttempts(r)},"${ts}"\n`;
  });
  dl(csv,`${ws?.title||wsId}_결과.csv`);
}
function dl(content,name){
  const blob=new Blob(['\uFEFF'+content],{type:"text/csv;charset=utf-8;"});
  const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:name});
  a.click();
}

window.showQDetail=function(key){
  const d=(window._qd||{})[key]; if(!d) return;
  document.getElementById('qd-title').textContent=
    `${d.studentName} · ${d.qid.replace('q','Q')}` + (d.unanswered?' (미응답)':` (오답 ${d.wrong}회)`);
  let body='';
  if(d.unanswered){
    body+=`<div style="font-size:13px;color:var(--ink3);margin-bottom:14px">— 아직 풀지 않은 문항입니다</div>`;
  } else if(d.wrongInputs.length){
    body+=`<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">오답 기록</div>
      <div>${d.wrongInputs.map(w=>`<span class="wrong-chip">${w}</span>`).join('')}</div>
    </div>`;
  } else {
    body+=`<div style="font-size:13px;color:var(--green);margin-bottom:14px">✅ 첫 번에 정답</div>`;
  }
  // (오답 후 정답인 경우 위 오답 기록 + 아래 표시)
  if(!d.unanswered && d.wrongInputs.length && d.correct){
    body+=`<div style="font-size:13px;color:var(--green);margin-bottom:14px">✅ 이후 정답 처리됨</div>`;
  }
  if(d.canvasImage){
    body+=`<div>
      <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">풀이 이미지</div>
      <img src="${d.canvasImage}" style="width:100%;border-radius:8px;border:1px solid var(--rule)">
    </div>`;
  } else {
    body+=`<div style="font-size:12px;color:var(--ink3)">풀이 이미지 없음</div>`;
  }
  document.getElementById('qd-body').innerHTML=body;
  document.getElementById('qd-modal').style.display='flex';
};

window.loadAll=loadAll;
document.addEventListener('DOMContentLoaded',()=>{
  const el=document.getElementById('t-ver');
  if(el) el.textContent='v'+T_VERSION;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>교사 관리 · 수학 학습지+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf8f3;--paper:#fff;--rule:#e8e4d9;
  --ink:#1c1917;--ink2:#44403c;--ink3:#a8a29e;
  --accent:#1d4ed8;--acc-lt:#eff6ff;
  --green:#15803d;--grn-lt:#dcfce7;
  --red:#b91c1c;--red-lt:#fee2e2;
  --amber:#b45309;--amb-lt:#fef3c7;
  --r:10px;
  --g1:#1d4ed8;--g2:#15803d;--g3:#b91c1c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.6}

/* ── 통일 헤더 (grid 3열) ── */
header{display:grid !important;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hdr-left{display:flex;gap:6px;align-items:center;justify-self:start;flex-wrap:nowrap}
.hdr-center{display:flex;gap:8px;align-items:center;justify-self:center;white-space:nowrap}
.hdr-right{display:flex !important;gap:6px;align-items:center;justify-self:end;flex-wrap:nowrap}
.hdr-nav{display:inline-flex;gap:4px}
.hdr-nav .hdr-btn{padding:5px 10px;font-size:12px}
.hdr-sep{width:1px;height:20px;background:currentColor;opacity:.15;margin:0 4px}

header{position:sticky;top:0;z-index:200;background:var(--ink);height:52px;display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{font-weight:900;font-size:18px;color:#fff;letter-spacing:-.5px;flex:1}
.logo em{color:#60a5fa;font-style:normal}
.logo small{font-size:12px;font-weight:400;color:rgba(255,255,255,.4);margin-left:8px}
.hdr-right{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.65)}
.tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.tag-t{background:var(--accent);color:#fff}
.hdr-btn{padding:4px 12px;border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.hdr-btn:hover{background:rgba(255,255,255,.18)}
.hdr-btn-green{background:#15803d;border-color:#15803d}
#auth-gate{min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:40px 20px}
.gate-card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:48px 44px;text-align:center;max-width:380px;width:100%}
.gate-card .icon{font-size:48px;margin-bottom:16px}
.gate-card h2{font-size:20px;font-weight:900;margin-bottom:8px}
.gate-card p{color:var(--ink3);font-size:14px;margin-bottom:28px}
.btn-goog{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.btn-goog:hover{border-color:var(--accent);background:var(--acc-lt)}
.btn-goog svg{width:20px;height:20px}
#app{display:none}
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:240px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--rule);position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;padding:12px 0}
.sb-section{padding:8px 18px 4px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:8px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;cursor:pointer;color:var(--ink2);transition:background .1s;border-radius:0;user-select:none}
.sb-item:hover{background:var(--cream)}
.sb-item.active{background:var(--acc-lt);color:var(--accent);font-weight:700}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-count{font-size:11px;color:var(--ink3);font-family:'DM Mono',monospace;margin-left:auto}
.content{flex:1;padding:28px 32px;min-width:0}
.pg-title{font-size:22px;font-weight:900;margin-bottom:4px}
.pg-sub{color:var(--ink3);font-size:13px;margin-bottom:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.sum-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.sum-label{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.sum-num{font-size:28px;font-weight:900}
.sum-sub{font-size:12px;color:var(--ink3);margin-top:2px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--rule);flex-wrap:wrap;gap:8px}
.card-title{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse}
thead{background:var(--cream)}
th,td{text-align:left;padding:10px 16px;font-size:13px;border-bottom:1px solid var(--rule)}
th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--cream)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.b-done{background:var(--grn-lt);color:var(--green)}
.b-miss{background:var(--red-lt);color:var(--red)}
.rate-row{display:flex;align-items:center;gap:8px}
.rate-bg{flex:1;height:5px;background:var(--rule);border-radius:3px;min-width:50px}
.rate-fill{height:5px;border-radius:3px}
.rate-n{font-size:12px;font-family:'DM Mono',monospace;width:36px;text-align:right}
.tries-badge{font-size:12px;font-family:'DM Mono',monospace}
.tries-1{color:var(--green)}.tries-2{color:var(--amber)}.tries-many{color:var(--red)}
.btn-sm{padding:6px 14px;border-radius:7px;font-size:13px;font-family:inherit;background:var(--paper);border:1.5px solid var(--rule);cursor:pointer;font-weight:500}
.btn-sm:hover{background:var(--rule)}
.btn-sm-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-sm-accent:hover{opacity:.88;background:var(--accent)}
select,input[type=text]{padding:7px 10px;border:1.5px solid var(--rule);border-radius:7px;font-size:13px;font-family:inherit;background:var(--paper);color:var(--ink)}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.loading{text-align:center;padding:48px;color:var(--ink3);font-size:15px}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.class-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.class-card-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.class-row{display:flex;gap:8px}
.class-row>*{flex:1}
.student-list{margin-top:10px;display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto}
.student-chip{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--cream);border-radius:6px;font-size:13px}
.student-chip .remove{cursor:pointer;color:var(--ink3);font-size:16px;line-height:1;background:none;border:none;padding:0}
.student-chip .remove:hover{color:var(--red)}
.add-student-row{display:flex;gap:8px;margin-top:8px}
.add-student-row input{flex:1}
.cat-수와연산{background:#dbeafe;color:#1e40af}
.cat-변화와관계{background:#dcfce7;color:#166534}
.cat-도형과측정{background:#fef3c7;color:#92400e}
.cat-자료와가능성{background:#fce7f3;color:#9d174d}
@media(max-width:768px){.sidebar{display:none}.content{padding:20px}}
.sb-grade-header{display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;user-select:none;color:var(--ink2);transition:background .1s;}
.sb-grade-header:hover{background:var(--cream)}
.sb-grade-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sb-chevron{margin-left:auto;font-size:10px;transition:transform .2s;display:inline-block}
.sb-chevron.open{transform:rotate(90deg)}
.sb-unit-group{overflow:hidden;transition:max-height .25s ease}
.sb-unit-group.collapsed{max-height:0!important}
.sb-unit-header{display:flex;align-items:center;gap:6px;padding:7px 14px 7px 24px;font-size:12px;cursor:pointer;user-select:none;color:var(--ink3);transition:background .1s;}
.sb-unit-header:hover{background:var(--cream);color:var(--ink2)}
.sb-unit-chevron{margin-left:auto;font-size:9px;transition:transform .2s;display:inline-block}
.sb-unit-chevron.open{transform:rotate(90deg)}
.sb-ws-group{overflow:hidden;transition:max-height .2s ease}
.sb-ws-group.collapsed{max-height:0!important}
.sb-ws-item{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 36px;font-size:12px;cursor:pointer;color:var(--ink2);transition:background .1s;}
.sb-ws-item:hover{background:var(--cream)}
.sb-ws-item.active{background:var(--acc-lt);color:var(--accent);font-weight:700}
.sb-ws-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--ink3)}
.sb-ws-item.active .sb-ws-dot{background:var(--accent)}
.img-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:flex;align-items:center;justify-content:center}
.img-modal{background:var(--paper);border-radius:var(--r);padding:20px;max-width:700px;width:90%;max-height:90vh;overflow-y:auto}
.img-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.img-modal-title{font-size:15px;font-weight:700}
.img-modal-close{background:none;border:1px solid var(--rule);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;font-family:inherit}
.img-modal img{width:100%;border-radius:8px;border:1px solid var(--rule)}
.wrong-chip{display:inline-block;font-size:12px;font-family:'DM Mono',monospace;background:var(--red-lt);color:var(--red);padding:2px 8px;border-radius:4px;margin:2px}
.canvas-thumb{width:80px;height:50px;object-fit:cover;border-radius:5px;border:1px solid var(--rule);cursor:pointer;transition:transform .1s}
.canvas-thumb:hover{transform:scale(1.05)}
/* 문항별 가로 셀 */
.qcell{display:flex;flex-direction:column;align-items:center;padding:4px 5px;
  border-radius:6px;cursor:pointer;transition:background .1s;min-width:34px;border:1px solid transparent}
.qcell:hover{background:var(--cream);border-color:var(--rule)}
.qcell-id{font-size:11px;font-weight:700;font-family:'DM Mono',monospace;line-height:1.2}
.qcell-try{font-size:10px;line-height:1.2;margin-top:1px}
/* ── 학급 비교 히트맵 ── */
.heatmap-wrap{overflow-x:auto}
.heatmap-table{border-collapse:collapse;width:100%;font-size:13px}
.heatmap-table th{background:var(--cream);padding:8px 12px;text-align:center;
  border:1px solid var(--rule);font-weight:700;white-space:nowrap}
.heatmap-table th.ws-col{text-align:left;max-width:220px;min-width:120px}
.heatmap-table td{padding:8px 10px;text-align:center;border:1px solid var(--rule);
  white-space:nowrap;font-weight:600;font-size:12px;position:relative}
.hm-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.hm-num{font-size:13px;font-weight:700}
.hm-bar{width:100%;height:4px;border-radius:2px;background:var(--rule);margin-top:2px}
.hm-fill{height:100%;border-radius:2px}
.hm-ws-name{font-size:12px;font-weight:600;max-width:200px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hm-ws-unit{font-size:10px;color:var(--ink3)}
.hm-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.hm-grade-btn{padding:5px 14px;border:1.5px solid var(--rule);border-radius:20px;
  background:none;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
.hm-grade-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>

  </div>
</div>

</div>

<!-- 문항 상세 팝업 -->

  <div class="img-modal" style="max-width:480px">

  </div>
</div>

// Firestore curriculum에서 학습지 로드 (edit.html에서 만든 것 포함)
async function loadCurriculum(){
  try{
    const [uSnap,wSnap]=await Promise.all([
      getDocs(query(collection(db,'units'),orderBy('order'))),
      getDocs(collection(db,'curriculum'))
    ]);
    const units=uSnap.docs.map(d=>({...d.data()}));
    const unitOrder={};
    units.forEach((u,i)=>unitOrder[u.id]=u.order??i);
    const sheets=wSnap.docs.map(d=>({...d.data()}))
      .sort((a,b)=>{
        const ua=unitOrder[a.unitId]??999;
        const ub=unitOrder[b.unitId]??999;
        if(ua!==ub) return ua-ub;
        return (a.order??99)-(b.order??99);
      });
    sheets.forEach(ws=>{ if(!ws.questions) ws.questions=[]; if(!ws.vocab) ws.vocab=[];
      if(ws.questions && !ws.qCount) ws.qCount=ws.questions.filter(q=>q.type!=="link").length; });
    if(sheets.length) WORKSHEETS=sheets;   // Firestore 우선 (없으면 정적 worksheets.js 유지)
    if(units.length){ UNITS=units; units.forEach(u=>UNIT_MAP[u.id]=u); }  // UNIT_MAP 병합(학년/영역 조회용)
    console.log(`[teacher 커리큘럼] 단원 ${units.length}개, 학습지 ${sheets.length}개 (Firestore)`);
  }catch(e){ console.warn('[커리큘럼 로드 실패 → 정적 worksheets.js 사용]', e.message); }
}

async function loadAll(){
  document.getElementById("content").innerHTML='<div class="loading">데이터 불러오는 중…</div>';
  allData={};
  try{
    progressData={};
    const snap=await getDocs(collectionGroup(db,"worksheets"));
    snap.forEach(d=>{
      const parts=d.ref.path.split("/");
      const col=parts[0], uid=parts[1], wsId=parts[3];
      if(TEACHER_EMAILS.includes(uid)) return; // 교사 계정 제외
      if(col==="records"){                        // 새 통합 구조
        if(!allData[uid]) allData[uid]={};
        allData[uid][wsId]=d.data();
      } else if(col==="results"){                 // 구 완료 데이터
        if(!allData[uid]) allData[uid]={};
        if(!allData[uid][wsId]) allData[uid][wsId]=d.data(); // records 우선
      } else if(col==="progress"){                // 구 진행 중 데이터
        if(!progressData[uid]) progressData[uid]={};
        progressData[uid][wsId]=d.data();
      }
    });
  }catch(e){ console.error("Firestore 오류:",e); }
  try{
    const cSnap=await getDoc(doc(db,"teacher_data",tUser.uid));
    if(cSnap.exists()) classes=cSnap.data().classes||{};
  }catch(e){ classes={}; }
  buildSidebar();
  // 새로고침 후 직전 학습지 복원
  try{
    const lastWsId=sessionStorage.getItem('teacher_lastWsId');
    if(lastWsId && WORKSHEETS.find(w=>w.id===lastWsId)){
      renderWS(lastWsId);
      return;
    }
  }catch(e){}
  renderOverview();
}

function perQCells(r, uid){
  if(!r || !r.perQuestion) return '<span style="color:var(--ink3);font-size:12px">기록 없음</span>';
  window._qd=window._qd||{};
  const cells=Object.entries(r.perQuestion).sort().map(([qid,v])=>{
    const wc=(v.wrongInputs||[]).length;
    const att=v.attempts||0;
    const isCorrect = v.correct!==undefined ? v.correct===true : (wc===0);
    const unanswered = (v.correct===false) && wc===0 && att===0;
    let col, mark, ttl;
    if(unanswered){ col="var(--ink3)"; mark="—"; ttl=`${fmtQid(qid)}: 미응답`; }
    else if(isCorrect){ col="var(--green)"; mark=wc>0?`✓(${wc})`:"✓"; ttl=`${qid}: 정답${wc>0?` (오답 ${wc}회 후)`:""}`; }
    else { col=wc>=2?"var(--red)":"var(--amber)"; mark=`${wc}회`; ttl=`${fmtQid(qid)}: 오답 ${wc}회`; }
    const dkey=(uid||r.uid||"x")+"_"+qid;
    window._qd[dkey]={studentName:r.studentName||"-",qid,attempts:att||(isCorrect?1:0),wrong:wc,correct:isCorrect,unanswered,wrongInputs:v.wrongInputs||[],canvasImage:v.canvasImage||null};
    return `<div class="qcell" onclick="showQDetail('${dkey}')" title="${ttl}"><span class="qcell-id" style="color:${col}">${fmtQid(qid)}</span><span class="qcell-try" style="color:${col}">${mark}</span></div>`;
  }).join("");
  return `<div style="display:flex;flex-wrap:wrap;gap:3px">${cells}</div>`;
}

/* 진도율 대상 여부: 일반 학습지 + 진도율 반영 ON만 (index/edit와 동일 규칙)
   커리큘럼에 없는(삭제된) 학습지는 진도율 집계 제외 */
function countsForProgressWs(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  if(!ws) return false;
  if(ws.type==="vocab" || ws.type==="exam") return false;
  if(Array.isArray(ws.vocab) && ws.vocab.length) return false; // type 미설정 구 VOCA 방어
  if(ws.includeInProgress===false) return false;               // 진도율 반영 OFF
  return true;
}

function studentList(){
  const entries=Object.entries(allData).map(([uid,wsMap])=>{
    const recs=Object.values(wsMap);
    const any=recs.find(r=>r.studentName)||recs[0]||{};
    const email=any.studentEmail||"-";
    // 이 학생이 시작한 진도율 대상 학습지(기록이 있으면 시작으로 간주)
    const startedIds=Object.keys(wsMap).filter(countsForProgressWs);
    const done=startedIds.filter(id=>isRecDone(wsMap[id])).length;
    const rates=recs.filter(r=>typeof r.correctRate==="number").map(r=>r.correctRate);
    const avg=rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length):null;
    return {uid,name:any.studentName||"-",email,cls:findClass(email)||"-",startedIds,done,avg};
  });
  // 진도율 분모: 같은 반 학생이 1명이라도 시작한 진도율 대상 학습지 수
  const classStarted={};  // 반 → Set(wsId)
  entries.forEach(s=>{
    if(!classStarted[s.cls]) classStarted[s.cls]=new Set();
    s.startedIds.forEach(id=>classStarted[s.cls].add(id));
  });
  entries.forEach(s=>{
    s.total=classStarted[s.cls]?.size||0;
    s.pct=s.total?Math.round(s.done/s.total*100):null;  // 진도율% = 완료/전체
  });
  return entries;
}

/* 진단: 특정 학급의 진도율 분모 상세 출력
   콘솔에서 progDebug('4반') 처럼 실행 (인자 없으면 전체 학급) */
window.progDebug = function(filter){
  const byCls={};
  Object.entries(allData).forEach(([uid,wsMap])=>{
    const recs=Object.values(wsMap);
    const email=(recs.find(r=>r.studentEmail)||{}).studentEmail||'';
    const cls=findClass(email)||'-';
    const name=(recs.find(r=>r.studentName)||{}).studentName||email||uid;
    (byCls[cls]=byCls[cls]||[]).push({name,wsMap});
  });
  Object.entries(byCls).forEach(([cls,studs])=>{
    if(filter && !cls.includes(filter)) return;
    const starters={};  // wsId -> [학생이름]
    studs.forEach(s=>Object.keys(s.wsMap).forEach(id=>{ (starters[id]=starters[id]||[]).push(s.name); }));
    const rows=Object.entries(starters).map(([id,names])=>{
      const ws=WORKSHEETS.find(w=>w.id===id)||{};
      return {
        wsId:id,
        제목:ws.title||'(삭제/커리큘럼없음)',
        type:ws.type||'(없음)',
        vocab배열:Array.isArray(ws.vocab)?ws.vocab.length:0,
        진도반영:ws.includeInProgress===false?'OFF':'ON',
        카운트:countsForProgressWs(id)?'✅ 분모포함':'— 제외',
        시작학생:names.join(',')
      };
    }).sort((a,b)=>(a.카운트<b.카운트?1:a.카운트>b.카운트?-1:0));
    const denom=rows.filter(r=>r.카운트==='✅ 분모포함').length;
    console.log(`\n===== ${cls} : 진도율 분모 ${denom}개 (해당 반이 시작한 학습지 총 ${rows.length}개) =====`);
    console.table(rows);
  });
  return '진단 완료 — 위 표에서 카운트=✅ 인 항목이 분모. 예상보다 많으면 그 학습지의 type/진도반영 확인.';
};

function renderClassMatrix(){
  selView="classmatrix";
  buildSidebar();
  const content=document.getElementById("content");
  content.innerHTML='<div class="loading">분석 중…</div>';

  // 학급 목록 추출
  const clsSet=new Set();
  Object.values(allData).forEach(d=>Object.values(d).forEach(r=>{
    const c=findClass(r.studentEmail); if(c) clsSet.add(c);
  }));
  const allCls=[...clsSet].sort((a,b)=>a.localeCompare(b,'ko'));
  if(!allCls.length){content.innerHTML='<div class="card"><p style="color:var(--ink3)">학급 데이터가 없습니다.</p></div>';return;}

  // 학급별 전체 학생 수
  const clsTotalMap={};
  allCls.forEach(c=>{clsTotalMap[c]=new Set();});
  Object.values(allData).forEach(d=>{
    const emails=new Set(Object.values(d).map(r=>r.studentEmail).filter(Boolean));
    emails.forEach(email=>{const c=findClass(email); if(c) clsTotalMap[c].add(email);});
  });

  // 색상 함수
  const cellColor=(done,total)=>{
    if(!total) return 'background:#f8f9fa;color:#94a3b8';
    const p=done/total;
    if(p>=0.9) return 'background:#dcfce7;color:#15803d;font-weight:700';
    if(p>=0.7) return 'background:#d1fae5;color:#166534';
    if(p>=0.5) return 'background:#fef9c3;color:#854d0e';
    if(p>=0.3) return 'background:#fed7aa;color:#9a3412';
    if(p>0)    return 'background:#fee2e2;color:#991b1b';
    return 'background:#f8f9fa;color:#94a3b8';
  };

  // 단원별 학습지 그룹핑
  const unitGroups=[];
  UNITS.forEach(unit=>{
    const sheets=WORKSHEETS.filter(ws=>ws.unitId===unit.id&&ws.type!=='link')
      .filter(ws=>Object.values(allData).some(d=>d[ws.id]));
    if(sheets.length) unitGroups.push({unit,sheets});
  });
  const noUnit=WORKSHEETS.filter(ws=>ws.type!=='link'&&!UNITS.find(u=>u.id===ws.unitId)&&Object.values(allData).some(d=>d[ws.id]));
  if(noUnit.length) unitGroups.push({unit:{id:'_etc',title:'기타',grade:''},sheets:noUnit});

  if(!unitGroups.length){content.innerHTML='<div class="card"><p style="color:var(--ink3)">학생 기록이 있는 학습지가 없습니다.</p></div>';return;}

  // 열린 상태 (기본: 모두 열림)
  const _open={};
  unitGroups.forEach(({unit})=>{_open[unit.id]=true;});

  // 헤더 th
  const thCls=allCls.map(c=>`<th style="white-space:nowrap;font-size:12px;padding:6px 10px;min-width:72px">${c.replace(/\d+\//,'')}</th>`).join('');

  // 행 생성 함수
  function makeRows(sheets){
    return sheets.map(ws=>{
      const clsDone={};
      allCls.forEach(c=>clsDone[c]=0);
      Object.values(allData).forEach(d=>{
        const r=d[ws.id]; if(!r||!isRecDone(r)) return;
        const c=findClass(r.studentEmail); if(c) clsDone[c]=(clsDone[c]||0)+1;
      });
      const tds=allCls.map(c=>{
        const total=clsTotalMap[c].size, done=clsDone[c]||0;
        const style=cellColor(done,total);
        const label=total?`${done}/${total}`:'—';
        return `<td onclick="navigate('${ws.id}')" style="cursor:pointer;text-align:center;padding:5px 8px;font-size:13px;${style}" title="${ws.title} · ${c}: ${label}">${label}</td>`;
      }).join('');
      return `<tr data-ws="${ws.id}">
        <td style="padding:5px 12px;font-size:13px;font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${ws.title}">${ws.title}</td>
        ${tds}
      </tr>`;
    }).join('');
  }

  // 단원별 섹션 생성
  let sections='';
  unitGroups.forEach(({unit,sheets})=>{

  document.getElementById("content").innerHTML=`

window.repairPerQuestion=async function(){
  // 커리큘럼 유효 문항 ID 목록 구축
  const validIds={};  // wsId → Set of valid qIds
  WORKSHEETS.forEach(ws=>{
    validIds[ws.id]=new Set((ws.questions||[]).map(q=>q.id));
  });

  // 학생 기록에서 고아 키(orphan) 탐색
  const toRepair=[];
  for(const [uid,d] of Object.entries(allData)){
    for(const [wsId,rec] of Object.entries(d)){
      if(!rec?.perQuestion) continue;
      const valid=validIds[wsId]; if(!valid) continue;
      const orphanKeys=Object.keys(rec.perQuestion).filter(k=>!valid.has(k));
      if(!orphanKeys.length) continue;
      // 커리큘럼에 있지만 학생 기록에 없는 키
      const missingKeys=[...valid].filter(k=>!rec.perQuestion[k]);
      toRepair.push({uid,wsId,orphanKeys,missingKeys,rec});
    }
  }

  if(!toRepair.length){ alert('복구할 기록이 없습니다.\n모든 학생 기록의 문항 ID가 커리큘럼과 일치합니다.'); return; }

  const preview=toRepair.slice(0,5).map(({uid,wsId,orphanKeys})=>
    `• ${uid.split('@')[0]} / ${wsId}: 고아키 ${orphanKeys.length}개`).join('\n');
  if(!confirm(`문항 ID 불일치 기록 ${toRepair.length}건 발견:\n\n${preview}\n${toRepair.length>5?`...외 ${toRepair.length-5}건`:''}\n\n고아 키를 순서에 맞는 커리큘럼 ID로 매핑합니다.\n계속할까요?`)) return;

  let ok=0, skipped=0, errors=[];
  for(const {uid,wsId,orphanKeys,missingKeys,rec} of toRepair){
    try{
      const newPQ={...rec.perQuestion};
      const ws=WORKSHEETS.find(w=>w.id===wsId);

      if(missingKeys.length===0){
        // 신키가 이미 있음 → 구키만 삭제
        orphanKeys.forEach(k=>delete newPQ[k]);
      } else if(orphanKeys.length===missingKeys.length){
        // 구키↔신키 1:1 매핑 (타임스탬프 순 → 문항 순)
        orphanKeys.sort();
        const orderedMissing=missingKeys.sort((a,b)=>{
          const ia=(ws?.questions||[]).findIndex(q=>q.id===a);
          const ib=(ws?.questions||[]).findIndex(q=>q.id===b);
          return ia-ib;
        });
        orphanKeys.forEach((old,i)=>{
          newPQ[orderedMissing[i]]=newPQ[old];
          delete newPQ[old];
        });
      } else {
        // 그래도 불일치면 건너뜀
        skipped++; continue;
      }
      await updateDoc(doc(db,'records',uid,'worksheets',wsId),{perQuestion:newPQ});
      rec.perQuestion=newPQ; ok++;
    }catch(e){ errors.push(`${uid}/${wsId}: ${e.message}`); }
  }
  alert(`✅ 복구 완료: ${ok}건\n건너뜀(키 수 불일치): ${skipped}건`+(errors.length?`\n⚠️ 오류:\n${errors.slice(0,3).join('\n')}`:''));
  navigate(selView);
};
window.migrateQuestionIds=async function(){
  // ID가 올바른 순번(q01,q02...)이 아닌 문항이 있는 학습지 탐색
  const toMigrate=WORKSHEETS.filter(ws=>(ws.questions||[]).some((q,i)=>{
    const expected=`q${String(i+1).padStart(2,'0')}`;
    return q.id!==expected;
  }));
  if(!toMigrate.length){ alert('모든 문항 ID가 이미 올바른 순번입니다.'); return; }
  const preview=toMigrate.map(ws=>`• ${ws.title} (${ws.questions.length}개 문항)`).join('\n');
  if(!confirm(`문항 ID를 q01, q02... 형식으로 변환합니다:\n\n${preview}`)) return;
  let wsOk=0, recOk=0, errors=[];
  for(const ws of toMigrate){
    try{
      const idMap={};
      ws.questions.forEach((q,i)=>{ idMap[q.id]=`q${String(i+1).padStart(2,'0')}`; });
      const newQs=ws.questions.map(q=>({...q,id:idMap[q.id]||q.id}));
      await setDoc(doc(db,'curriculum',ws.id),{questions:newQs},{merge:true});
      ws.questions=newQs; wsOk++;
      for(const [uid,d] of Object.entries(allData)){
        const rec=d[ws.id]; if(!rec?.perQuestion) continue;
        const newPQ={};
        for(const [oid,val] of Object.entries(rec.perQuestion))
          newPQ[idMap[oid]||oid]=val;
        await updateDoc(doc(db,'records',uid,'worksheets',ws.id),{perQuestion:newPQ});
        rec.perQuestion=newPQ; recOk++;
      }
    }catch(e){ errors.push(e.message); }
  }
  alert(`✅ 완료\n학습지: ${wsOk}개, 학생기록: ${recOk}개`+(errors.length?`\n⚠️ ${errors.join('\n')}`:''));
  navigate(selView);
};

window.migrateWsIds=async function(){
  const byUnit={};
  WORKSHEETS.forEach(ws=>{ (byUnit[ws.unitId||'etc']=byUnit[ws.unitId||'etc']||[]).push(ws); });
  const changes=[];
  for(const [unitId,list] of Object.entries(byUnit)){
    list.sort((a,b)=>(a.order??99)-(b.order??99));
    list.forEach((ws,i)=>{
      const newId=`ws-${unitId}-${String(i+1).padStart(2,'0')}`;
      if(ws.id!==newId) changes.push({ws,newId});
    });
  }
  if(!changes.length){ alert('모든 학습지 ID가 순서와 일치합니다.'); return; }
  const preview=changes.map(({ws,newId})=>`• ${ws.id} → ${newId}`).join('\n');
  if(!confirm(`학습지 ID를 표시 순서 기준으로 변환합니다:\n\n${preview}`)) return;
  const tempPfx='ws-tmp-'+Date.now()+'-';
  let ok=0, errors=[];
  for(const {ws,newId} of changes){
    try{
      const tmpId=tempPfx+ws.id;
      const {_tmpId:_,...wsData}=ws;
      await setDoc(doc(db,'curriculum',tmpId),{...wsData,id:tmpId});
      await deleteDoc(doc(db,'curriculum',ws.id));
      for(const [uid,d] of Object.entries(allData)){
        const rec=d[ws.id]; if(!rec) continue;
        await setDoc(doc(db,'records',uid,'worksheets',tmpId),rec);
        await deleteDoc(doc(db,'records',uid,'worksheets',ws.id));
        d[tmpId]=rec; delete d[ws.id];
      }
      ws._tmpId=tmpId;
    }catch(e){ errors.push(`1단계 ${ws.id}: ${e.message}`); }
  }
  for(const {ws,newId} of changes){
    if(!ws._tmpId) continue;
    try{
      const {_tmpId:_,...wsData}=ws;
      await setDoc(doc(db,'curriculum',newId),{...wsData,id:newId});
      await deleteDoc(doc(db,'curriculum',ws._tmpId));
      for(const [uid,d] of Object.entries(allData)){
        const rec=d[ws._tmpId]; if(!rec) continue;
        await setDoc(doc(db,'records',uid,'worksheets',newId),rec);
        await deleteDoc(doc(db,'records',uid,'worksheets',ws._tmpId));
        d[newId]=rec; delete d[ws._tmpId];
      }
      ws.id=newId; delete ws._tmpId; ok++;
    }catch(e){ errors.push(`2단계 ${newId}: ${e.message}`); }
  }
  alert(`✅ 완료: ${ok}개 변환`+(errors.length?`\n⚠️ ${errors.join('\n')}`:''));
  navigate('overview');
};

window.deleteStudentRec=async function(wsId, uid){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  const rec=allData[uid]?.[wsId];
  const name=rec?.studentName||uid;
  if(!confirm(`⚠️ "${name}"의 "${ws?.title||wsId}" 학습 기록을 삭제하시겠습니까?`)) return;
  try{
    await deleteDoc(doc(db,"records",uid,"worksheets",wsId));
    if(allData[uid]) delete allData[uid][wsId];
    renderWS(wsId); // 현재 뷰 새로고침
    toast?.('삭제 완료');
  }catch(e){ alert('삭제 실패: '+e.message); }
};

window.clearWSRecords=async function(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  const title=ws?.title||wsId;
  const targets=Object.entries(allData).filter(([uid,d])=>d[wsId]).map(([uid])=>uid);
  if(!targets.length){ alert("삭제할 기록이 없습니다."); return; }
  if(!confirm(`⚠️ "${title}" 학습기록 ${targets.length}명을 모두 삭제합니다.\n\n이 작업은 되돌릴 수 없습니다. 계속하시겠습니까?`)) return;
  document.getElementById("content").innerHTML='<div class="loading">기록 삭제 중…</div>';
  let ok=0, fail=0;
  for(const uid of targets){
    try{
      await deleteDoc(doc(db,"records",uid,"worksheets",wsId));
      try{ await deleteDoc(doc(db,"results",uid,"worksheets",wsId)); }catch(e2){}
      delete allData[uid][wsId]; ok++;
    }catch(e){ console.warn("삭제 실패:",uid,e.message); fail++; }
  }
  alert(`완료: ${ok}명 삭제${fail?`, ${fail}명 실패`:""}`);
  await loadAll();
};

window.renderWSTable=function(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId); if(!ws) return;
  const recs=[];
  Object.entries(allData).forEach(([uid,d])=>{ if(d[wsId]) recs.push({uid,...d[wsId]}); });

  // 완료 / 진행 중 분리
  const isDone=isRecDone;
  let done=recs.filter(isDone);
  let inProg=recs.filter(r=>!isDone(r));

  // 필터 적용
  if(_wsFilter){
    done=done.filter(r=>(findClass(r.studentEmail)||"")=== _wsFilter);
    inProg=inProg.filter(r=>(findClass(r.studentEmail)||"")=== _wsFilter);
  }

  // 정렬 (tries는 perQuestion에서 계산)
  const triesOf=r=>getAttempts(r);
  const sortFn=(a,b)=>{
    if(_wsSortBy==="class") return (findClass(a.studentEmail)||"zzz").localeCompare(findClass(b.studentEmail)||"zzz","ko");
    if(_wsSortBy==="name")  return (a.studentName||"").localeCompare(b.studentName||"","ko");
    if(_wsSortBy==="time")  return String(a.completedAt||a.lastUpdated||"").localeCompare(String(b.completedAt||b.lastUpdated||""));
    return triesOf(a)-triesOf(b); // tries: 오답 적은 순
  };
  done.sort(sortFn);
  inProg.sort(sortFn); // 진행 중도 선택한 정렬 적용

  const tbody=document.getElementById("ws-tbody"); if(!tbody) return;

  // 완료 행
  // perQuestion 정오답 셀 렌더 (완료/진행 중 공통)
  // 문항 ID → 순번 매핑 (Q1, Q2, Q3...)
  const qidToNum={};
  (ws.questions||[]).forEach((q,i)=>{ qidToNum[q.id]=i+1; });
  const fmtQ=qid=>{ const n=qidToNum[qid]; return n?`Q${n}`:(fmtQid(qid)||qid); };

  function renderPerQ(r){
    if(!r.perQuestion) return "";
    window._qd=window._qd||{};
    const cells=Object.entries(r.perQuestion).sort().map(([qid,v])=>{
      const wc=(v.wrongInputs||[]).length;
      const att=v.attempts||0;
      const isCorrect = v.correct!==undefined ? v.correct===true : (wc===0);
      const unanswered = (v.correct===false) && wc===0 && att===0;
      let col, mark, ttl;
      // 그래프 그리기 (drawing 필드 있으면)
      if(v&&v.drawing){
        col=v.correct===true?"var(--green)":v.correct===false?"var(--red)":"var(--amber)";
        mark=v.correct===true?"⭕":v.correct===false?"❌":"📝";
        ttl=`${fmtQ(qid)}: 그래프`;
      } else if(unanswered){ col="var(--ink3)"; mark="—"; ttl=`${fmtQ(qid)}: 미응답`; }
      else if(isCorrect){ col="var(--green)"; mark=wc>0?`✓(${wc}회)`:"✓"; ttl=`${qid}: 정답${wc>0?` (오답 ${wc}회 후)`:""}`; }
      else { col=wc>=2?"var(--red)":"var(--amber)"; mark=`${wc}회`; ttl=`${fmtQ(qid)}: 오답 ${wc}회`; }
      const dkey=r.uid+"_"+qid;
      window._qd[dkey]={studentName:r.studentName||"-",qid,uid:r.uid,wsId:r.wsId,v,attempts:att,wrong:wc,correct:isCorrect,unanswered,wrongInputs:v.wrongInputs||[],canvasImage:v.canvasImage||null};
      return `<div class="qcell" onclick="showQDetail('${dkey}')" title="${ttl}"><span class="qcell-id" style="color:${col}">${fmtQ(qid)}</span><span class="qcell-try" style="color:${col}">${mark}</span></div>`;
    }).join("");
    return `<div style="display:flex;flex-wrap:wrap;gap:3px">${cells}</div>`;
  }
  const isVoca=ws?.type==="vocab";
  const doneRows=done.map(r=>{
    const ts=formatDate(r.completedAt||r.lastUpdated);
    const rate=r.correctRate??Math.round((r.answeredCount||0)/(r.totalCount||1)*100);
    const tries=getAttempts(r);
    const wrong=tries;
    const wcls=wrong===0?"tries-1":wrong<=2?"tries-2":"tries-many";
    const classInfo=findClass(r.studentEmail)||"-";
    r.uid=r.uid||r.studentEmail; r.wsId=wsId; const perQHtml=renderPerQ(r);
    const passCount=r.passCount||1;
    return `<tr>
      <td><strong>${r.studentName||"-"}</strong></td>
      <td style="font-size:12px;color:var(--ink3)">${r.studentEmail||"-"}</td>
      <td style="font-size:12px">${classInfo}</td>
      <td>${isVoca?`<span style="color:var(--green);font-weight:700">✅ ${passCount}회 PASS</span>`:rateBar(rate)}</td>
      <td>${isVoca?`<span style="color:var(--ink3);font-size:12px">-</span>`:`<span class="tries-badge ${wcls}">${wrong}회</span>`}</td>
      <td style="min-width:180px">${perQHtml||"-"}</td>
      <td style="font-size:12px"><span style="color:var(--green);font-weight:600">✅ 완료</span><br>${ts}</td>
      <td><button onclick="deleteStudentRec('${wsId}','${r.uid}')" style="background:#fee2e2;color:#dc2626;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-weight:600">🗑 삭제</button></td>
    </tr>`;
  }).join("");

  // 진행 중 행
  const inProgRows=inProg.map(r=>{
    const classInfo=findClass(r.studentEmail)||"-";
    const pct=r.totalCount?Math.round((r.answeredCount||0)/r.totalCount*100):0;
    const upd=formatDate(r.lastUpdated);
    const tries=getAttempts(r);
    const wcls=tries===0?"tries-1":tries<=2?"tries-2":"tries-many";
    r.uid=r.uid||r.studentEmail; r.wsId=wsId; const perQHtml=renderPerQ(r);
    return `<tr style="background:var(--acc-lt)">
      <td><strong>${r.studentName||"-"}</strong></td>
      <td style="font-size:12px;color:var(--ink3)">${r.studentEmail||"-"}</td>
      <td style="font-size:12px">${classInfo}</td>
      <td><div class="rate-row"><div class="rate-bg"><div class="rate-fill" style="width:${pct}%;background:var(--amber)"></div></div><span class="rate-n" style="color:var(--amber)">${r.answeredCount||0}/${r.totalCount||"?"}</span></div></td>
      <td>${tries>0?`<span class="tries-badge ${wcls}">${tries}회</span>`:"-"}</td>
      <td style="min-width:180px">${perQHtml||"-"}</td>
      <td style="font-size:12px"><span style="color:var(--amber);font-weight:600">⏳ 진행 중</span><br>${upd}</td>
    </tr>`;
  }).join("");

  if(!doneRows&&!inProgRows){
    tbody.innerHTML=`<tr><td colspan="7" style="text-align:center;color:var(--ink3);padding:28px">${_wsFilter?"해당 학급의 학생이 없습니다.":"제출 기록이 없습니다."}</td></tr>`;
    return;
  }
  tbody.innerHTML=inProgRows+doneRows;
};


function renderWS(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  if(!ws){renderOverview();return;}
  const grade=wsGrade(ws)||"?";
  const cat=wsCategory(ws)||"-";
  const recs=[];
  Object.entries(allData).forEach(([uid,d])=>{ if(d[wsId]) recs.push({uid,...d[wsId]}); });
  const done=recs.filter(r=>isRecDone(r));
  const avgR=done.length?Math.round(done.reduce((s,r)=>s+(r.correctRate||0),0)/done.length):0;
  const avgT=done.length?(done.reduce((s,r)=>s+getAttempts(r),0)/done.length).toFixed(1):"-";
  // Fix: 하드코딩 5 → ws.qCount 사용
  const qc=ws.qCount||(ws.questions?.length)||0;
  const perfect=qc>0?done.filter(r=>getAttempts(r)===0).length:"-";

  // sum-grid까지 렌더링 후 템플릿 리터럴 닫기
  let h=`<div class="pg-title">${ws.title}</div>
  <div class="pg-sub">
    <span class="badge ${CAT_CLASS[cat]||''}">${cat}</span>
    수학 ${grade}학년
  </div>
  <div class="sum-grid">
    <div class="sum-card"><div class="sum-label">완료 학생</div><div class="sum-num">${done.length}<span style="font-size:14px;color:var(--amber)"> + ${recs.length-done.length}진행중</span></div></div>
    <div class="sum-card"><div class="sum-label">평균 정답률</div><div class="sum-num" style="color:${rateColor(avgR)}">${avgR}%</div></div>
    <div class="sum-card"><div class="sum-label">평균 시도 횟수</div><div class="sum-num">${avgT}</div><div class="sum-sub">문제당</div></div>
    <div class="sum-card"><div class="sum-label">첫 번에 완료</div><div class="sum-num" style="color:var(--green)">${perfect}</div><div class="sum-sub">모두 1회 정답</div></div>
  </div>`;

  // ── 반별 완료 현황 ──
  const classSummary=[];
  // 등록된 학급별 집계
  Object.entries(classes).sort().forEach(([key,cls])=>{
    const students=cls.students||[];
    const label=`${cls.grade}학년 ${cls.classNum}반`;
    const clsDone=done.filter(r=>students.includes((r.studentEmail||"").toLowerCase())).length;
    classSummary.push({label, done:clsDone, total:students.length, key});
  });
  // 미분류 (어떤 학급에도 없는 완료 학생)
  const allEnrolled=new Set(Object.values(classes).flatMap(c=>c.students||[]));
  const unclassified=done.filter(r=>!allEnrolled.has((r.studentEmail||"").toLowerCase())).length;
  if(unclassified>0||classSummary.length===0)
    classSummary.push({label:"미분류", done:unclassified, total:"-", key:"_unclassified"});

  if(classSummary.length){
    h+=`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:stretch">
      ${classSummary.map(c=>{
        const pct=typeof c.total==="number"&&c.total>0?Math.round(c.done/c.total*100):null;
        const col=pct===null?"var(--ink3)":pct>=80?"var(--green)":pct>=40?"var(--amber)":"var(--red)";
        return `<div style="background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);
          padding:12px 18px;min-width:120px;display:flex;flex-direction:column;gap:4px">
          <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;
            letter-spacing:.06em">${c.label}</div>
          <div style="font-size:22px;font-weight:900;color:${col};line-height:1">
            ${c.done}<span style="font-size:13px;color:var(--ink3);font-weight:400"> / ${c.total}</span>
          </div>
          ${pct!==null?`<div style="height:4px;border-radius:2px;background:var(--rule);overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${col};border-radius:2px"></div>
          </div>`:""}
        </div>`;
      }).join("")}
    </div>`;
  }


  // 학급 필터 옵션 생성 (JS 코드, 템플릿 리터럴 밖)
  const classSet=new Set(done.map(r=>findClass(r.studentEmail)||"").filter(Boolean));
  const classOpts=[...classSet].sort((a,b)=>a.localeCompare(b,"ko"))
    .map(c=>`<option value="${c}">${c}</option>`).join("");

  // 완료 학생 카드 (필터/정렬 컨트롤 포함)
  h+=`<div class="card">
    <div class="card-hdr">
      <span class="card-title">✅ 완료 학생 목록</span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button onclick="clearWSRecords('${wsId}')" style="padding:5px 12px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">🗑 기록 초기화</button>
        <select onchange="setWSFilter(this.value,'${wsId}')"
          style="font-size:12px;padding:5px 8px;border-radius:6px;border:1.5px solid var(--rule);font-family:inherit">
          <option value="" ${!_wsFilter?'selected':''}>전체 학급</option>${classOpts}
        </select>
        <select onchange="setWSSort(this.value,'${wsId}')"
          style="font-size:12px;padding:5px 8px;border-radius:6px;border:1.5px solid var(--rule);font-family:inherit">
          <option value="tries" ${_wsSortBy==='tries'?'selected':''}>오답 적은 순</option>
          <option value="class" ${_wsSortBy==='class'?'selected':''}>학급 순</option>
          <option value="name" ${_wsSortBy==='name'?'selected':''}>이름 순</option>
          <option value="time" ${_wsSortBy==='time'?'selected':''}>완료 시간 순</option>
        </select>
        <button class="btn-sm" onclick="exportWS('${wsId}')">CSV</button>
      </div>
    </div>
    <table><thead><tr>
      <th>학생</th><th>이메일</th><th>학급</th><th>정답률/진행률</th><th>오답</th><th>문항별 오답</th><th>상태</th><th></th>
    </tr></thead><tbody id="ws-tbody"></tbody></table>
  </div>`;
  const qStats={};
  const wrongCnt={};  // qid → {답: 빈도}
  recs.forEach(r=>{ if(!r.perQuestion) return;
    Object.entries(r.perQuestion).forEach(([qid,v])=>{
      if(!qStats[qid]) qStats[qid]={total:0,totalTries:0};
      qStats[qid].total++; qStats[qid].totalTries+=v.attempts||1;
      // 빈출 오답 집계
      if(Array.isArray(v.wrongInputs)){
        if(!wrongCnt[qid]) wrongCnt[qid]={};
        v.wrongInputs.forEach(w=>{
          const key=String(w||'(빈칸)').slice(0,40);
          wrongCnt[qid][key]=(wrongCnt[qid][key]||0)+1;
        });
      }
    });
  });
  if(Object.keys(qStats).length){
    h+=`<div class="card"><div class="card-hdr"><span class="card-title">📊 문항별 난이도</span></div>
    <table><thead><tr><th>문항</th><th>응시</th><th>평균 시도</th><th>난이도</th><th>빈출 오답 (TOP 3)</th></tr></thead><tbody>`;
    Object.entries(qStats).sort().forEach(([qid,s])=>{
      const avg=(s.totalTries/s.total).toFixed(1);
      const diff=avg<=1.2?"🟢 쉬움":avg<=2.0?"🟡 보통":"🔴 어려움";
      const top3=Object.entries(wrongCnt[qid]||{}).sort((a,b)=>b[1]-a[1]).slice(0,3);
      const wrongHtml=top3.length?top3.map(([ans,cnt])=>`<span style="display:inline-block;background:#fee2e2;color:#b91c1c;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;font-family:monospace">${ans} <b>${cnt}</b></span>`).join(''):'<span style="color:var(--ink3);font-size:11px">-</span>';
      h+=`<tr><td>${qid}</td><td>${s.total}명</td>
        <td><span class="tries-badge ${avg<=1.2?'tries-1':avg<=2?'tries-2':'tries-many'}">${avg}회</span></td>
        <td>${diff}</td>
        <td>${wrongHtml}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }

  document.getElementById("content").innerHTML=h;
  _wsFilter=""; _wsSortBy="class";
  renderWSTable(wsId);
  window.exportWS=exportWS;
}

  let h=`<div class="pg-title">🏫 학급 관리</div>
  <div class="pg-sub">학년도·학년·반 단위로 학생 이메일을 등록합니다.</div>
  <div style="background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px;margin-bottom:20px">
    <div class="card-title" style="margin-bottom:12px">새 학급 추가</div>
    <div class="class-row" style="gap:10px;margin-bottom:10px">

window.addClass=async function(){

  if(!year||!cn){ alert("학년도와 반을 입력하세요."); return; }

  if(classes[key]){ alert("이미 존재하는 학급입니다."); return; }

  if(!confirm(`${classes[key]?.year}학년도 ${classes[key]?.grade}학년 ${classes[key]?.classNum}반을 삭제할까요?`)) return;

window.addStudent=async function(key){
  const inp=document.getElementById("add-"+key);
  let val=inp.value.trim().toLowerCase();
  if(!val) return;
  const email=val.includes("@")?val:val+STUDENT_DOMAIN;
  if(!classes[key].students) classes[key].students=[];
  if(classes[key].students.includes(email)){ alert("이미 등록된 학생입니다."); inp.select(); return; }
  classes[key].students.push(email);
  await saveClasses(); renderClasses();
  requestAnimationFrame(()=>{
    const newInp=document.getElementById("add-"+key);
    if(newInp){ newInp.value=""; newInp.focus(); }
  });
};
window.removeStudent=async function(key,idx){
  classes[key].students.splice(idx,1);
  await saveClasses(); renderClasses();
};

function findClass(email){
  if(!email) return null;
  for(const [key,cls] of Object.entries(classes)){
    if((cls.students||[]).includes(email.toLowerCase()))
      return `${cls.year}/${cls.grade}학년 ${cls.classNum}반`;
  }
  return null;
}

// ── Fix 4: formatDate - completedAt ISO 문자열 & Timestamp 모두 처리 ──
function formatDate(v){
  if(!v) return "-";
  if(typeof v==="string") return new Date(v).toLocaleString("ko-KR");
  if(v.toDate) return v.toDate().toLocaleString("ko-KR");
  return "-";
}
function rateColor(r){ return r>=80?"var(--green)":r>=60?"var(--amber)":"var(--red)"; }
function rateBar(rate){
  return `<div class="rate-row">
    <div class="rate-bg"><div class="rate-fill" style="width:${rate}%;background:${rateColor(rate)}"></div></div>
    <span class="rate-n" style="color:${rateColor(rate)}">${rate}%</span>
  </div>`;
}

// ── Fix 5: exportOverview/exportWS - ws.grade/category → wsGrade/wsCategory, formatDate ──
function exportOverview(){
  let csv="단원,학년,영역,완료학생수,평균정답률,평균시도\n";
  WORKSHEETS.forEach(ws=>{
    const recs=Object.values(allData).map(d=>d[ws.id]).filter(r=>isRecDone(r));
    const avgR=recs.length?Math.round(recs.reduce((s,r)=>s+(r.correctRate||0),0)/recs.length):0;
    const avgT=recs.length?(recs.reduce((s,r)=>s+getAttempts(r),0)/recs.length).toFixed(1):0;
    csv+=`"${ws.title}",${wsGrade(ws)||"-"},"${wsCategory(ws)||"-"}",${recs.length},${avgR}%,${avgT}\n`;
  });
  dl(csv,"전체현황.csv");
}
function exportWS(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  let csv="이름,이메일,학급,정답률,총시도,완료일시\n";
  Object.values(allData).forEach(d=>{
    const r=d[wsId]; if(!r?.completedAt) return;
    const ts=formatDate(r.completedAt);
    const cls=findClass(r.studentEmail)||"-";
    csv+=`"${r.studentName||""}","${r.studentEmail||""}","${cls}",${r.correctRate||0}%,${getAttempts(r)},"${ts}"\n`;
  });
  dl(csv,`${ws?.title||wsId}_결과.csv`);
}
function dl(content,name){
  const blob=new Blob(['\uFEFF'+content],{type:"text/csv;charset=utf-8;"});
  const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:name});
  a.click();
}

let _tdUndoStack=[], _tdEraser=false;
function initTeacherCanvas(canvas){
  _tdUndoStack=[]; _tdEraser=false;
  let drawing=false, lx=0, ly=0;
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#dc2626'; ctx.lineWidth=2; ctx.lineCap='round';
  const pos=e=>{
    const r=canvas.getBoundingClientRect();
    const scX=canvas.width/r.width, scY=canvas.height/r.height;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return [(cx-r.left)*scX,(cy-r.top)*scY];
  };
  const start=e=>{
    e.preventDefault(); drawing=true;
    _tdUndoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
    [lx,ly]=pos(e); ctx.beginPath(); ctx.moveTo(lx,ly);
    if(_tdEraser){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=20;}
    else{ctx.globalCompositeOperation='source-over';ctx.lineWidth=2;ctx.strokeStyle='#dc2626';}
  };
  const move=e=>{
    if(!drawing) return; e.preventDefault();
    const [x,y]=pos(e);
    ctx.lineTo(x,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y);
  };
  const end=()=>{ drawing=false; };
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);

  document.getElementById('td-pen-btn')?.addEventListener('click',()=>{
    _tdEraser=false;
    document.getElementById('td-pen-btn').style.background='#fee2e2';
    document.getElementById('td-erase-btn').style.background='';
  });
  document.getElementById('td-erase-btn')?.addEventListener('click',()=>{
    _tdEraser=true;
    document.getElementById('td-erase-btn').style.background='#fee2e2';
    document.getElementById('td-pen-btn').style.background='';
  });
}

function drawGraphGridForTeacher(canvas, q, W, H){
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  const isNL=q.graphType==='numberline';
  if(isNL){
    _drawNumberLineT(ctx,W,H,q.nMin??-10,q.nMax??10);
  } else {
    _drawCoordPlaneT(ctx,W,H,q.xMin??-5,q.xMax??5,q.yMin??-5,q.yMax??5);
  }
}
function _drawCoordPlaneT(ctx,W,H,xMin,xMax,yMin,yMax){
  const PAD=32;
  const cW=W-PAD*2, cH=H-PAD*2;
  const xRange=xMax-xMin, yRange=yMax-yMin;
  const toX=v=>PAD+((v-xMin)/xRange)*cW;
  const toY=v=>PAD+((yMax-v)/yRange)*cH;
  ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=0.5;
  for(let x=Math.ceil(xMin);x<=xMax;x++){
    ctx.beginPath(); ctx.moveTo(toX(x),PAD); ctx.lineTo(toX(x),H-PAD); ctx.stroke();
  }
  for(let y=Math.ceil(yMin);y<=yMax;y++){
    ctx.beginPath(); ctx.moveTo(PAD,toY(y)); ctx.lineTo(W-PAD,toY(y)); ctx.stroke();
  }
  ctx.strokeStyle='#374151'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PAD,toY(0)); ctx.lineTo(W-PAD,toY(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(toX(0),PAD); ctx.lineTo(toX(0),H-PAD); ctx.stroke();
  ctx.fillStyle='#374151';
  const arw=6;
  ctx.beginPath(); ctx.moveTo(W-PAD,toY(0)); ctx.lineTo(W-PAD-arw,toY(0)-arw/2); ctx.lineTo(W-PAD-arw,toY(0)+arw/2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(toX(0),PAD); ctx.lineTo(toX(0)-arw/2,PAD+arw); ctx.lineTo(toX(0)+arw/2,PAD+arw); ctx.fill();
  ctx.font='10px sans-serif'; ctx.fillStyle='#6b7280'; ctx.textAlign='center';
  for(let x=Math.ceil(xMin);x<=xMax;x++){
    if(x===0) continue;
    ctx.beginPath(); ctx.moveTo(toX(x),toY(0)-4); ctx.lineTo(toX(x),toY(0)+4); ctx.strokeStyle='#374151'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillText(x,toX(x),toY(0)+14);
  }
  ctx.textAlign='right';
  for(let y=Math.ceil(yMin);y<=yMax;y++){
    if(y===0) continue;
    ctx.beginPath(); ctx.moveTo(toX(0)-4,toY(y)); ctx.lineTo(toX(0)+4,toY(y)); ctx.strokeStyle='#374151'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillText(y,toX(0)-6,toY(y)+4);
  }
  ctx.fillStyle='#374151'; ctx.textAlign='right';
  ctx.fillText('O',toX(0)-4,toY(0)+14);
  ctx.fillStyle='#374151'; ctx.font='12px sans-serif';
  ctx.textAlign='left'; ctx.fillText('x',W-PAD+4,toY(0)+4);
  ctx.textAlign='center'; ctx.fillText('y',toX(0),PAD-6);
}
function _drawNumberLineT(ctx,W,H,nMin,nMax){
  const PAD=32; const MID=H/2;
  const range=nMax-nMin;
  const toX=v=>PAD+((v-nMin)/range)*(W-PAD*2);
  ctx.strokeStyle='#374151'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PAD,MID); ctx.lineTo(W-PAD,MID); ctx.stroke();
  ctx.fillStyle='#374151';
  ctx.beginPath(); ctx.moveTo(W-PAD,MID); ctx.lineTo(W-PAD-8,MID-4); ctx.lineTo(W-PAD-8,MID+4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(PAD,MID); ctx.lineTo(PAD+8,MID-4); ctx.lineTo(PAD+8,MID+4); ctx.fill();
  ctx.font='11px sans-serif'; ctx.fillStyle='#374151'; ctx.textAlign='center';
  for(let n=Math.ceil(nMin);n<=nMax;n++){
    const x=toX(n);
    const nearLeft=x<PAD+10, nearRight=x>W-PAD-10;
    if(!nearLeft && !nearRight){
      ctx.beginPath(); ctx.moveTo(x,MID-6); ctx.lineTo(x,MID+6); ctx.strokeStyle='#374151'; ctx.lineWidth=1.5; ctx.stroke();
    }
    ctx.fillText(n,x,MID+18);
    if(n===0){ctx.beginPath();ctx.arc(x,MID,3,0,Math.PI*2);ctx.fill();}
  }
}

function toast(msg, duration=2000){
  let t=document.getElementById('_toast');
  if(!t){
    t=document.createElement('div');
    t.id='_toast';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity.3s;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.style.opacity='0', duration);
}

    const gridCanvas=document.getElementById('graph-grid-canvas');
    if(!img||!canvas) return;
    // 학습지에서 그래프 정보 가져오기
    const ws=WORKSHEETS.find(w=>w.id===d.wsId);
    const q=ws?.questions?.find(q=>q.id===d.qid);
    const setSize=()=>{
      const W=img.naturalWidth||img.clientWidth||400;
      const H=img.naturalHeight||img.clientHeight||300;
      canvas.width=W; canvas.height=H;
      canvas.style.height=img.clientHeight+'px';
      if(gridCanvas){
        gridCanvas.width=W; gridCanvas.height=H;
        gridCanvas.style.height=img.clientHeight+'px';
        // 격자 그리기
        if(q){ drawGraphGridForTeacher(gridCanvas, q, W, H); }
      }
      // 기존 교사 주석 복원
      const td=window._qd[key]?.v?.teacherDrawing;
      if(td){ const i2=new Image(); i2.onload=()=>canvas.getContext('2d').drawImage(i2,0,0,canvas.width,canvas.height); i2.src=td; }
    };
    if(img.complete) setSize(); else img.onload=setSize;
    initTeacherCanvas(canvas);
  },100);
};

window.loadAll=loadAll;
document.addEventListener('DOMContentLoaded',()=>{
  const el=document.getElementById('t-ver');
  if(el) el.textContent='v'+VERSION;
});
</script>
</body>
</html>

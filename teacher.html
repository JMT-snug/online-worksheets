/* 한 학생의 모든 학습 기록 삭제 (학생별 조회의 🗑) */
async function _purgeStudents(uids, label){
  let recTotal=0;
  uids.forEach(u=>{ recTotal+=Object.keys(allData[u]||{}).length; });
  if(!recTotal){ alert('삭제할 학습 기록이 없습니다.'); return false; }
  if(!confirm(`⚠️ ${label}의 학습 기록 ${recTotal}건을 삭제합니다.\n\n`
    + `푼 문제·점수·필기가 모두 사라지고, 시험지는 다시 응시할 수 있게 됩니다.\n`
    + `되돌릴 수 없습니다. 계속할까요?`)) return false;
  if(!confirm(`⚠️ 마지막 확인\n\n${label} / 기록 ${recTotal}건을 영구 삭제합니다.`)) return false;

  document.getElementById('content').innerHTML='<div class="loading">기록 삭제 중…</div>';
  let ok=0, fail=0;
  for(const uid of uids){
    for(const wsId of Object.keys(allData[uid]||{})){
      try{
        await deleteDoc(doc(db,'records',uid,'worksheets',wsId));
        try{ await deleteDoc(doc(db,'results',uid,'worksheets',wsId)); }catch(e2){}
        ok++;
      }catch(e){ fail++; console.warn('[삭제 실패]',uid,wsId,e.message); }
    }
    delete allData[uid];
  }
  alert(`🗑 삭제 완료: ${ok}건${fail?` (실패 ${fail}건 — 콘솔 확인)`:''}`);
  await loadAll();
  return true;
}

window.deleteStudentAll=async function(uid){
  const name=studentList().find(s=>s.uid===uid)?.name||uid;
  await _purgeStudents([uid], `"${name}"(${uid})`);
  renderStudents();
};

window.renderWSTable=function(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId); if(!ws) return;
  const recs=[];
  Object.entries(allData).forEach(([uid,d])=>{ if(d[wsId]) recs.push({uid,...d[wsId]}); });

  // 완료 / 진행 중 분리 — recs 는 {uid,...기록} 으로 새로 만든 객체라 REC_WS 에 없다 → 이 학습지(ws)로 직접 판정 (v4.5)
  const isDone=r=>recordIsDone(r, ws.questions);
  let done=recs.filter(isDone);
  let inProg=recs.filter(r=>!isDone(r));

  // 필터 적용
  if(_wsFilter){
    done=done.filter(r=>(findClass(r.studentEmail)||"")=== _wsFilter);
    inProg=inProg.filter(r=>(findClass(r.studentEmail)||"")=== _wsFilter);
  }

  // 정렬 (tries는 perQuestion에서 계산)
  const triesOf=r=>getAttempts(r);
  const sortFn=(a,b)=>{
    if(_wsSortBy==="class") return (findClass(a.studentEmail)||"zzz").localeCompare(findClass(b.studentEmail)||"zzz","ko");
    if(_wsSortBy==="name")  return (a.studentName||"").localeCompare(b.studentName||"","ko");
    if(_wsSortBy==="time")  return String(a.completedAt||a.lastUpdated||"").localeCompare(String(b.completedAt||b.lastUpdated||""));
    return triesOf(a)-triesOf(b); // tries: 오답 적은 순
  };
  done.sort(sortFn);
  inProg.sort(sortFn); // 진행 중도 선택한 정렬 적용

  const tbody=document.getElementById("ws-tbody"); if(!tbody) return;

  // 완료 행
  // perQuestion 정오답 셀 렌더 (완료/진행 중 공통)
  // 문항 ID → 순번 매핑 (Q1, Q2, Q3...)
  const qidToNum={};
  (ws.questions||[]).forEach((q,i)=>{ qidToNum[q.id]=i+1; });
  const fmtQ=qid=>{ const n=qidToNum[qid]; return n?`Q${n}`:(fmtQid(qid)||qid); };

  function renderPerQ(r){
    if(!r.perQuestion) return "";
    window._qd=window._qd||{};
    const cells=Object.entries(r.perQuestion).sort().map(([qid,v])=>{
      const wc=(v.wrongInputs||[]).length;
      const att=v.attempts||0;
      const isExamQ = v.examAnswer!==undefined || v.maxScore!==undefined;  // 시험지 문항
      const isCorrect = v.correct!==undefined && v.correct!==null ? v.correct===true
                        : (isExamQ ? false : (wc===0));  // 시험지는 오답기록 없다고 정답 처리 금지
      const unanswered = !isExamQ && (v.correct===false) && wc===0 && att===0;
      let col, mark, ttl;
      // 그래프 문항은 학습지 정의 기준으로 판정 (제출 안 했으면 미제출로 표시)
      const _gq = isGraphQ(r.wsId||wsId, qid);
      if(_gq){ const g=graphCell(v, fmtQ(qid)); col=g.col; mark=g.mark; ttl=g.ttl; }
      else if(isExamQ){
        // 시험지: 미채점을 정답으로 오인하지 않도록 별도 표시 + 제출 답안을 툴팁에 노출
        const ansTxt = fmtExamAnswer(v.examAnswer, r.wsId||wsId, qid, v.examSubmittedAt);
        if(v.correct===true){ col="var(--green)"; mark="⭕"; }
        else if(v.correct===false){ col="var(--red)"; mark="❌"; }
        else { col="var(--amber)"; mark="📝"; }
        ttl=`${fmtQ(qid)}: ${v.correct===true?'정답':v.correct===false?'오답':'미채점'} · 제출답안: ${ansTxt}`
            + (v.score!=null&&v.maxScore!=null?` (${v.score}/${v.maxScore}점)`:'');
      } else if(unanswered){ col="var(--ink3)"; mark="—"; ttl=`${fmtQ(qid)}: 미응답`; }
      else if(isCorrect){ col="var(--green)"; mark=wc>0?`✓(${wc}회)`:"✓"; ttl=`${qid}: 정답${wc>0?` (오답 ${wc}회 후)`:""}`; }
      else { col=wc>=2?"var(--red)":"var(--amber)"; mark=`${wc}회`; ttl=`${fmtQ(qid)}: 오답 ${wc}회`; }
      const dkey=r.uid+"_"+(r.wsId||wsId||"ws")+"_"+qid;   // 학습지 ID 포함 (다른 화면/학습지와 키 충돌 방지)
      window._qd[dkey]={studentName:r.studentName||"-",qid,uid:r.uid,wsId:r.wsId,v,attempts:att,wrong:wc,correct:isCorrect,unanswered,wrongInputs:v.wrongInputs||[],canvasImage:v.canvasImage||null};
      return `<div class="qcell" onclick="showQDetail('${dkey}')" title="${ttl}"><span class="qcell-id" style="color:${col}">${fmtQ(qid)}</span><span class="qcell-try" style="color:${col}">${mark}</span></div>`;
    }).join("");
    return `<div style="display:flex;flex-wrap:wrap;gap:3px">${cells}</div>`;
  }
  const isVoca=ws?.type==="vocab";
  const isReview=ws?.type==="review";
  const doneRows=done.map(r=>{
    const ts=formatDate(r.completedAt||r.lastUpdated);
    const rate=r.correctRate??Math.round((r.answeredCount||0)/(r.totalCount||1)*100);
    const tries=getAttempts(r);
    const wrong=tries;
    const wcls=wrong===0?"tries-1":wrong<=2?"tries-2":"tries-many";
    const classInfo=findClass(r.studentEmail)||"-";
    r.uid=r.uid||r.studentEmail; r.wsId=wsId; const perQHtml=renderPerQ(r);
    const passCount=r.passCount||1;
    return `<tr>
      <td style="text-align:center"><input type="checkbox" class="ws-chk" value="${r.uid}" onclick="updateWsSelCount()" style="width:15px;height:15px;cursor:pointer"></td>
      <td><strong>${r.studentName||"-"}</strong></td>
      <td style="font-size:12px;color:var(--ink3)">${r.studentEmail||"-"}</td>
      <td style="font-size:12px">${classInfo}</td>
      <td>${isVoca?`<span style="color:var(--green);font-weight:700">✅ ${passCount}회 PASS</span>`:isReview?reviewStatsHtml(r):ws.type==='exam'?examCountsHtml(ws,r):rateBar(rate)}</td>
      <td>${(isVoca||isReview)?`<span style="color:var(--ink3);font-size:12px">-</span>`:`<span class="tries-badge ${wcls}">${wrong}회</span>`}</td>
      <td style="min-width:180px">${perQHtml||"-"}</td>
      <td style="font-size:12px"><span style="color:var(--green);font-weight:600">✅ 완료</span><br>${ts}</td>
      <td><button onclick="deleteStudentRec('${wsId}','${r.uid}')" style="background:#fee2e2;color:#dc2626;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-weight:600">🗑 삭제</button></td>
    </tr>`;
  }).join("");

  // 진행 중 행
  const inProgRows=inProg.map(r=>{
    const classInfo=findClass(r.studentEmail)||"-";
    const pct=r.totalCount?Math.round((r.answeredCount||0)/r.totalCount*100):0;
    const upd=formatDate(r.lastUpdated);
    const tries=getAttempts(r);
    const wcls=tries===0?"tries-1":tries<=2?"tries-2":"tries-many";
    r.uid=r.uid||r.studentEmail; r.wsId=wsId; const perQHtml=renderPerQ(r);
    return `<tr style="background:var(--acc-lt)">
      <td style="text-align:center"><input type="checkbox" class="ws-chk" value="${r.uid}" onclick="updateWsSelCount()" style="width:15px;height:15px;cursor:pointer"></td>
      <td><strong>${r.studentName||"-"}</strong></td>
      <td style="font-size:12px;color:var(--ink3)">${r.studentEmail||"-"}</td>
      <td style="font-size:12px">${classInfo}</td>
      <td>${ws.type==='exam'?examCountsHtml(ws,r):`<div class="rate-row"><div class="rate-bg"><div class="rate-fill" style="width:${pct}%;background:var(--amber)"></div></div><span class="rate-n" style="color:var(--amber)">${r.answeredCount||0}/${r.totalCount||"?"}</span></div>`}</td>
      <td>${tries>0?`<span class="tries-badge ${wcls}">${tries}회</span>`:"-"}</td>
      <td style="min-width:180px">${perQHtml||"-"}</td>
      <td style="font-size:12px"><span style="color:var(--amber);font-weight:600">⏳ 진행 중</span><br>${upd}</td>
      <td><button onclick="deleteStudentRec('${wsId}','${r.uid}')" title="이 학생의 이 학습지 기록만 삭제 (다시 풀 수 있게 됨)" style="background:#fee2e2;color:#dc2626;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-weight:600">🗑 삭제</button></td>
    </tr>`;
  }).join("");

  if(!doneRows&&!inProgRows){
    tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;color:var(--ink3);padding:28px">${_wsFilter?"해당 학급의 학생이 없습니다.":"제출 기록이 없습니다."}</td></tr>`;
    return;
  }
  tbody.innerHTML=inProgRows+doneRows;
};


function renderWS(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  if(!ws){renderOverview();return;}
  const grade=wsGrade(ws)||"?";
  const cat=wsCategory(ws)||"-";
  const recs=[];
  Object.entries(allData).forEach(([uid,d])=>{ if(d[wsId]) recs.push({uid,...d[wsId]}); });
  const done=recs.filter(r=>isRecDone(r));
  const avgR=done.length?Math.round(done.reduce((s,r)=>s+(r.correctRate||0),0)/done.length):0;
  const avgT=done.length?(done.reduce((s,r)=>s+getAttempts(r),0)/done.length).toFixed(1):"-";
  // Fix: 하드코딩 5 → ws.qCount 사용
  const qc=ws.qCount||(ws.questions?.length)||0;
  const perfect=qc>0?done.filter(r=>getAttempts(r)===0).length:"-";

  // sum-grid까지 렌더링 후 템플릿 리터럴 닫기
  let h=`<div class="pg-title">${ws.title}</div>
  <div class="pg-sub">
    <span class="badge ${CAT_CLASS[cat]||''}">${cat}</span>
    수학 ${grade}학년
  </div>
  <div class="sum-grid">
    <div class="sum-card"><div class="sum-label">완료 학생</div><div class="sum-num">${done.length}<span style="font-size:14px;color:var(--amber)"> + ${recs.length-done.length}진행중</span></div></div>
    <div class="sum-card"><div class="sum-label">평균 정답률</div><div class="sum-num" style="color:${rateColor(avgR)}">${avgR}%</div></div>
    <div class="sum-card"><div class="sum-label">평균 시도 횟수</div><div class="sum-num">${avgT}</div><div class="sum-sub">문제당</div></div>
    <div class="sum-card"><div class="sum-label">첫 번에 완료</div><div class="sum-num" style="color:var(--green)">${perfect}</div><div class="sum-sub">모두 1회 정답</div></div>
  </div>`;

  // ── 반별 완료 현황 ──
  const classSummary=[];
  // 등록된 학급별 집계
  Object.entries(classes).sort().forEach(([key,cls])=>{
    const students=cls.students||[];
    const label=`${cls.grade}학년 ${cls.classNum}반`;
    const clsDone=done.filter(r=>students.includes((r.studentEmail||"").toLowerCase())).length;
    classSummary.push({label, done:clsDone, total:students.length, key});
  });
  // 미분류 (어떤 학급에도 없는 완료 학생)
  const allEnrolled=new Set(Object.values(classes).flatMap(c=>c.students||[]));
  const unclassified=done.filter(r=>!allEnrolled.has((r.studentEmail||"").toLowerCase())).length;
  if(unclassified>0||classSummary.length===0)
    classSummary.push({label:"미분류", done:unclassified, total:"-", key:"_unclassified"});

  if(classSummary.length){
    h+=`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:stretch">
      ${classSummary.map(c=>{
        const pct=typeof c.total==="number"&&c.total>0?Math.round(c.done/c.total*100):null;
        const col=pct===null?"var(--ink3)":pct>=80?"var(--green)":pct>=40?"var(--amber)":"var(--red)";
        return `<div style="background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);
          padding:12px 18px;min-width:120px;display:flex;flex-direction:column;gap:4px">
          <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;
            letter-spacing:.06em">${c.label}</div>
          <div style="font-size:22px;font-weight:900;color:${col};line-height:1">
            ${c.done}<span style="font-size:13px;color:var(--ink3);font-weight:400"> / ${c.total}</span>
          </div>
          ${pct!==null?`<div style="height:4px;border-radius:2px;background:var(--rule);overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${col};border-radius:2px"></div>
          </div>`:""}
        </div>`;
      }).join("")}
    </div>`;
  }


  // 학급 필터 옵션 생성 (JS 코드, 템플릿 리터럴 밖)
  const classSet=new Set(done.map(r=>findClass(r.studentEmail)||"").filter(Boolean));
  const classOpts=[...classSet].sort((a,b)=>a.localeCompare(b,"ko"))

    });

window.setClassTeacher=async function(key){
  if(!isMaster()){ alert(`교사 계정 지정은 마스터 계정(${MASTER_EMAIL})만 가능합니다.`); return; }
  const inp=document.getElementById("tch-"+key);
  let val=(inp?.value||"").trim().toLowerCase();
  if(!val) return;
  const email=val.includes("@")?val:val+STUDENT_DOMAIN;
  if(classes[key].teacher){ alert("이미 담당 교사가 지정된 학급입니다. 기존 교사를 해제한 뒤 지정하세요."); return; }
  if((classes[key].students||[]).includes(email)){ alert("이 학급에 학생으로 등록된 이메일입니다. 교사로 지정할 수 없습니다."); return; }
  classes[key].teacher=email;
  await saveClasses();
  await updateTeacherConfig();
  renderClasses();
};
window.removeClassTeacher=async function(key){
  if(!isMaster()){ alert(`교사 계정 해제는 마스터 계정(${MASTER_EMAIL})만 가능합니다.`); return; }
  const cls=classes[key];
  if(!confirm(`${cls?.year}학년도 ${cls?.grade}학년 ${cls?.classNum}반의 담당 교사(${cls?.teacher})를 해제할까요?\n해제하면 해당 계정은 교사 권한을 잃습니다.`)) return;
  classes[key].teacher="";  // merge:true는 맵 키 삭제를 반영 못 하므로 빈 값으로 저장
  await saveClasses();
  await updateTeacherConfig();
  renderClasses();
};

/* 모든 teacher_data 문서의 classes[*].teacher를 모아 config/teachers.emails로 저장
   → index/edit/teacher/scoring이 로그인 시 이 문서를 읽어 교사 권한을 부여 (마스터 전용) */
async function updateTeacherConfig(){
  if(!isMaster()) return;
  try{
    let docsData=[];
    try{
      const allSnap=await getDocs(collection(db,"teacher_data"));
      docsData=allSnap.docs.map(d=>d.data());
    }catch(eAll){ docsData=[{classes}]; }
    const emails=new Set(), byClass={};
    for(const data of docsData){
      for(const [k,c] of Object.entries(data.classes||{})){
        if(c && c.teacher){ const e=String(c.teacher).toLowerCase(); emails.add(e); byClass[k]=e; }
      }
    }
    await setDoc(doc(db,"config","teachers"),{
      emails:[...emails].sort(),
      byClass,
      updatedAt:new Date().toISOString(),
      updatedBy:tUser.email
    });
    // 현재 세션의 TEACHER_EMAILS에도 즉시 반영 (기본 교사 + 담당 교사로 재구성)
    const merged=[...BASE_TEACHER_EMAILS,...[...emails].filter(e=>!BASE_TEACHER_EMAILS.includes(e))];
    TEACHER_EMAILS.splice(0,TEACHER_EMAILS.length,...merged);
    console.log("[updateTeacherConfig] 담당 교사",[...emails]);
  }catch(e){ console.error("[updateTeacherConfig 실패]",e); alert("교사 목록 저장 중 오류: "+e.message); }
}

async function saveClasses(){
  if(scopedTeacher){ console.warn("[saveClasses] 담당 교사 계정은 학급 저장 불가"); return; } // 본인 uid 문서에 잘못 저장되는 것 방지
  try{ await setDoc(doc(db,"teacher_data",tUser.uid),{classes},{merge:true}); }
  catch(e){ console.error("학급 저장 오류:",e); }
  syncAllowedEmails(); // 반별 잠금 학습지의 allowedEmails 재계산 (백그라운드, 실패해도 무방)
}

/* 학생 명단만 저장 — 학급이 저장된 소유 문서에 필드 단위로 기록
   (담당 교사도 자기 담당 학급의 명단은 수정 가능. 학급키에 하이픈이 있어 FieldPath 사용) */
async function saveClassStudents(key){
  const ownerUid=classOwner[key]||tUser.uid;
  try{
    await updateDoc(doc(db,"teacher_data",ownerUid), new FieldPath("classes",key,"students"), classes[key].students||[]);
  }catch(e){ console.error("명단 저장 오류:",e); alert("명단 저장 실패: "+e.message); return; }
  if(scopeEmails) scopeEmails=new Set(Object.values(classes).flatMap(c=>(c.students||[]).map(e=>String(e).toLowerCase()))); // 세션 범위 갱신
  syncAllowedEmails(); // 잠금 학습지 허용 목록 재계산 (백그라운드)
}

/* 학급 명단 변경 시: 잠금 학습지의 해제 반 명단(allowedEmails)을 최신 명단으로 재계산
   (잠금 해제 시점의 스냅샷이 낡는 문제 방지 — 전학생 추가/삭제 반영) */
async function syncAllowedEmails(){
  try{
    // 모든 교사의 학급 병합 (반 이름 → 학생 이메일 Set)
    let docsData=[];
    try{
      const allSnap=await getDocs(collection(db,"teacher_data"));
      docsData=allSnap.docs.map(d=>d.data());
    }catch(eAll){ docsData=[{classes}]; }
    const roster={};
    for(const data of docsData){
      for(const c of Object.values(data.classes||{})){
        const name=`${c.year}/${c.grade}학년 ${c.classNum}반`;
        if(!roster[name]) roster[name]=new Set();
        (c.students||[]).forEach(e=>roster[name].add(String(e).toLowerCase()));
      }
    }
    // 반별 잠금(allowedEmails) + 파트별 잠금(partAllowed) 재계산
    const calc=m=>[...new Set(Object.keys(m||{}).filter(n=>m[n]).flatMap(n=>[...(roster[n]||[])]))].sort();
    const norm=a=>[...(a||[])].map(e=>String(e).toLowerCase()).sort();
    const wSnap=await getDocs(collection(db,'curriculum'));
    let checked=0, changedCnt=0;
    for(const d of wSnap.docs){
      const ws=d.data(); checked++;
      const updates={};
      // 학습지 전체 잠금의 해제 반 명단
      if(ws.status==='locked' && Object.values(ws.unlockedClasses||{}).some(Boolean)){
        const newAllowed=calc(ws.unlockedClasses);
        if(JSON.stringify(newAllowed)!==JSON.stringify(norm(ws.allowedEmails))) updates.allowedEmails=newAllowed;
      }
      // 파트별 잠금의 해제 반 명단
      for(const [pid,clsMap] of Object.entries(ws.partUnlocked||{})){
        if(!Object.values(clsMap||{}).some(Boolean)) continue;
        const newArr=calc(clsMap);
        if(JSON.stringify(newArr)!==JSON.stringify(norm((ws.partAllowed||{})[pid]))) updates['partAllowed.'+pid]=newArr;
      }
      if(Object.keys(updates).length){
        changedCnt++;
        await updateDoc(doc(db,'curriculum',d.id),updates);
        console.log('[syncAllowedEmails]',d.id,Object.keys(updates));
      }
    }
    console.log(`[syncAllowedEmails] 검사 완료: 학습지 ${checked}개 확인, ${changedCnt}개 갱신`);
  }catch(e){ console.warn('[syncAllowedEmails 실패]',e); }
}

window.deleteClass=async function(key){
  if(scopedTeacher){ alert("담당 교사 계정은 학급을 삭제할 수 없습니다."); return; }
  const cls=classes[key];
  const clsLabel=`${cls?.year}학년도 ${cls?.grade}학년 ${cls?.classNum}반`;
  if(!confirm(`${clsLabel}을 삭제할까요?`)) return;

  // ── 학습 기록도 함께 지울지 확인 ──
  // 다른 학급에도 등록된 학생은 대상에서 제외한다(그 학급에서 계속 쓰는 기록이므로)
  const others=new Set();
  for(const [k,c] of Object.entries(classes)){
    if(k===key) continue;
    (c.students||[]).forEach(e=>others.add(String(e).toLowerCase()));
  }
  const targets=(cls?.students||[]).map(e=>String(e).toLowerCase()).filter(e=>!others.has(e));
  const shared=(cls?.students||[]).length-targets.length;
  let recCount=0;
  targets.forEach(e=>{ recCount+=Object.keys(allData[e]||{}).length; });

  let purge=false;
  if(targets.length && recCount){
    purge=confirm(`이 학급 학생들의 학습 기록도 함께 삭제할까요?\n\n`
      + `• 대상 학생: ${targets.length}명\n`
      + `• 삭제될 학습 기록: ${recCount}건 (푼 문제·점수·필기 전부)\n`
      + (shared ? `• 다른 학급에도 있는 학생 ${shared}명의 기록은 남깁니다\n` : '')
      + `\n[확인] 학급과 학습 기록 모두 삭제\n[취소] 학급만 삭제하고 기록은 보존`);
    if(purge && !confirm(`⚠️ 마지막 확인\n\n학생 ${targets.length}명의 학습 기록 ${recCount}건을 영구 삭제합니다.\n되돌릴 수 없습니다. 정말 진행할까요?`)) purge=false;
  }

  // 1) 학급 삭제 (setDoc merge는 맵 키 삭제를 반영 못 해 FieldPath+deleteField 사용)
  const hadTeacher=!!cls?.teacher;
  delete classes[key];
  try{ await updateDoc(doc(db,"teacher_data",tUser.uid), new FieldPath("classes",key), deleteField()); }
  catch(e){ console.error("학급 삭제 오류:",e); }

  // 2) 선택 시 학생 기록 삭제 (records/results 모두)
  if(purge){
    let ok=0, fail=0;
    for(const email of targets){
      for(const wsId of Object.keys(allData[email]||{})){
        for(const col of ['records','results']){
          try{ await deleteDoc(doc(db,col,email,'worksheets',wsId)); }
          catch(e){ if(col==='records'){ fail++; console.warn('[학급 삭제] 기록 삭제 실패',email,wsId,e.message); } }
        }
        ok++;
      }
      delete allData[email];
    }
    alert(`🗑 ${clsLabel} 삭제 완료\n학습 기록 ${ok}건 삭제${fail?` (실패 ${fail}건 — 콘솔 확인)`:''}`);
  }

  syncAllowedEmails();
  if(hadTeacher) await updateTeacherConfig(); // 담당 교사가 있던 학급이면 교사 목록 재계산
  renderClasses();
};

// ── Fix 4: formatDate - completedAt ISO 문자열 & Timestamp 모두 처리 ──
function formatDate(v){
  if(!v) return "-";
  if(typeof v==="string") return new Date(v).toLocaleString("ko-KR");
  if(v.toDate) return v.toDate().toLocaleString("ko-KR");
  return "-";
}
function rateColor(r){ return r>=80?"var(--green)":r>=60?"var(--amber)":"var(--red)"; }
/* 시험지 학습지: 학생 기록에서 ⭕정답/❌오답/⬜미응답/📝미채점 문항 수 집계.
   시험지는 '완료율'이 의미가 없어(제출만 하면 100%) 문항 수로 표시한다. */
function examCounts(ws, r){
  let ok=0, ng=0, none=0, pend=0;
  (ws?.questions||[]).forEach(q=>{
    if(q.type==='link') return;
    const v=r?.perQuestion?.[q.id];
    if(!v){ none++; return; }
    if(v.correct===true) ok++;
    else if(v.correct===false) ng++;
    else {
      const hasAns = !(v.examAnswer===null||v.examAnswer===undefined||v.examAnswer===''
                       ||(Array.isArray(v.examAnswer)&&!v.examAnswer.length));
      (hasAns||v.examSubmittedAt) ? pend++ : none++;
    }
  });
  return {ok,ng,none,pend};
}
function examCountsHtml(ws, r){
  const c=examCounts(ws, r);
  const chip=(txt,col,bg)=>`<span style="font-size:11px;font-weight:700;color:${col};background:${bg};padding:2px 7px;border-radius:10px;white-space:nowrap">${txt}</span>`;
  let h='<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">'
    + chip('⭕ '+c.ok,'var(--green)','#dcfce7')
    + chip('❌ '+c.ng,'var(--red)','#fee2e2')
    + chip('⬜ 미응답 '+c.none,'var(--ink3)','var(--cream)');
  if(c.pend) h+=chip('📝 미채점 '+c.pend,'var(--amber)','#fef3c7');
  if(r?.examScore!=null&&r?.examMaxScore!=null)
    h+=`<span style="font-size:11px;color:var(--ink3)">${r.examScore}/${r.examMaxScore}점</span>`;
  return h+'</div>';
}
function rateBar(rate){
  return `<div class="rate-row">
    <div class="rate-bg"><div class="rate-fill" style="width:${rate}%;background:${rateColor(rate)}"></div></div>
    <span class="rate-n" style="color:${rateColor(rate)}">${rate}%</span>
  </div>`;
}

// ── Fix 5: exportOverview/exportWS - ws.grade/category → wsGrade/wsCategory, formatDate ──
function exportOverview(){
  let csv="단원,학년,영역,완료학생수,평균정답률,평균시도\n";
  WORKSHEETS.forEach(ws=>{
    const recs=Object.values(allData).map(d=>d[ws.id]).filter(r=>isRecDone(r));
    const avgR=recs.length?Math.round(recs.reduce((s,r)=>s+(r.correctRate||0),0)/recs.length):0;
    const avgT=recs.length?(recs.reduce((s,r)=>s+getAttempts(r),0)/recs.length).toFixed(1):0;
    csv+=`"${ws.title}",${wsGrade(ws)||"-"},"${wsCategory(ws)||"-"}",${recs.length},${avgR}%,${avgT}\n`;
  });
  dl(csv,"전체현황.csv");
}
function exportWS(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);

function dl(content,name){
  const blob=new Blob(['\uFEFF'+content],{type:"text/csv;charset=utf-8;"});
  const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:name});
  a.click();
}

let _tdUndoStack=[], _tdEraser=false;
function initTeacherCanvas(canvas){
  _tdUndoStack=[]; _tdEraser=false;
  let drawing=false, lx=0, ly=0;
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#dc2626'; ctx.lineWidth=2; ctx.lineCap='round';
  const pos=e=>{
    const r=canvas.getBoundingClientRect();
    const scX=canvas.width/r.width, scY=canvas.height/r.height;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return [(cx-r.left)*scX,(cy-r.top)*scY];
  };
  const start=e=>{
    e.preventDefault(); drawing=true;
    _tdUndoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
    [lx,ly]=pos(e); ctx.beginPath(); ctx.moveTo(lx,ly);
    if(_tdEraser){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=20;}
    else{ctx.globalCompositeOperation='source-over';ctx.lineWidth=2;ctx.strokeStyle='#dc2626';}
  };
  const move=e=>{
    if(!drawing) return; e.preventDefault();
    const [x,y]=pos(e);
    ctx.lineTo(x,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y);
  };
  const end=()=>{ drawing=false; };
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);

  document.getElementById('td-pen-btn')?.addEventListener('click',()=>{
    _tdEraser=false;
    document.getElementById('td-pen-btn').style.background='#fee2e2';
    document.getElementById('td-erase-btn').style.background='';
  });
  document.getElementById('td-erase-btn')?.addEventListener('click',()=>{
    _tdEraser=true;
    document.getElementById('td-erase-btn').style.background='#fee2e2';
    document.getElementById('td-pen-btn').style.background='';
  });
}

function drawGraphGridForTeacher(canvas, q, W, H){
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  const isNL=q.graphType==='numberline';
  if(isNL){
    _drawNumberLineT(ctx,W,H,q.nMin??-10,q.nMax??10);
  } else if(q.graphType==='axisonly'){
    drawAxisOnlyPlane(ctx,W,H,q.originPos||'mc');
  } else {
    _drawCoordPlaneT(ctx,W,H,q.xMin??-5,q.xMax??5,q.yMin??-5,q.yMax??5);
  }
}
function _drawCoordPlaneT(ctx,W,H,xMin,xMax,yMin,yMax){
  const PAD=32;
  const cW=W-PAD*2, cH=H-PAD*2;
  const xRange=xMax-xMin, yRange=yMax-yMin;
  const toX=v=>PAD+((v-xMin)/xRange)*cW;
  const toY=v=>PAD+((yMax-v)/yRange)*cH;
  ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=0.5;
  for(let x=Math.ceil(xMin);x<=xMax;x++){
    ctx.beginPath(); ctx.moveTo(toX(x),PAD); ctx.lineTo(toX(x),H-PAD); ctx.stroke();
  }
  for(let y=Math.ceil(yMin);y<=yMax;y++){
    ctx.beginPath(); ctx.moveTo(PAD,toY(y)); ctx.lineTo(W-PAD,toY(y)); ctx.stroke();
  }
  ctx.strokeStyle='#374151'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PAD,toY(0)); ctx.lineTo(W-PAD,toY(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(toX(0),PAD); ctx.lineTo(toX(0),H-PAD); ctx.stroke();
  ctx.fillStyle='#374151';
  const arw=6;
  ctx.beginPath(); ctx.moveTo(W-PAD,toY(0)); ctx.lineTo(W-PAD-arw,toY(0)-arw/2); ctx.lineTo(W-PAD-arw,toY(0)+arw/2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(toX(0),PAD); ctx.lineTo(toX(0)-arw/2,PAD+arw); ctx.lineTo(toX(0)+arw/2,PAD+arw); ctx.fill();
  ctx.font='10px sans-serif'; ctx.fillStyle='#6b7280'; ctx.textAlign='center';
  for(let x=Math.ceil(xMin);x<=xMax;x++){
    if(x===0) continue;
    ctx.beginPath(); ctx.moveTo(toX(x),toY(0)-4); ctx.lineTo(toX(x),toY(0)+4); ctx.strokeStyle='#374151'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillText(x,toX(x),toY(0)+14);
  }
  ctx.textAlign='right';
  for(let y=Math.ceil(yMin);y<=yMax;y++){
    if(y===0) continue;
    ctx.beginPath(); ctx.moveTo(toX(0)-4,toY(y)); ctx.lineTo(toX(0)+4,toY(y)); ctx.strokeStyle='#374151'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillText(y,toX(0)-6,toY(y)+4);
  }
  ctx.fillStyle='#374151'; ctx.textAlign='right';
  ctx.fillText('O',toX(0)-4,toY(0)+14);
  ctx.fillStyle='#374151'; ctx.font='12px sans-serif';
  ctx.textAlign='left'; ctx.fillText('x',W-PAD+4,toY(0)+4);
  ctx.textAlign='center'; ctx.fillText('y',toX(0),PAD-6);
}
/* ── 좌표축만 있는 좌표평면 (눈금·격자·좌표 숫자 없음) ──
   원점 위치를 9곳(가로 왼쪽/가운데/오른쪽 × 세로 위/가운데/아래) 중에서 고를 수 있다.
   화살표는 수학 관례대로 x축은 언제나 오른쪽, y축은 언제나 위를 향한다.
   원점을 가장자리에 두더라도 반대편에 STUB만큼 자투리 축을 남겨, 음의 방향도
   조금은 보이게 한다(원점이 딱 모서리에 붙어 축이 잘린 것처럼 보이지 않도록). */
const GRAPH_ORIGIN_POS = {
  tl:[0,0],   tc:[0.5,0],   tr:[1,0],
  ml:[0,0.5], mc:[0.5,0.5], mr:[1,0.5],
  bl:[0,1],   bc:[0.5,1],   br:[1,1]
};
function drawAxisOnlyPlane(ctx,W,H,originPos){
  const PAD=32, STUB=18;   // STUB: 원점이 가장자리일 때 반대편에 남기는 자투리 축 길이
  const p=GRAPH_ORIGIN_POS[originPos]||GRAPH_ORIGIN_POS.mc;
  const L=PAD, R=W-PAD, T=PAD, B=H-PAD;
  const ox = p[0]===0 ? L+STUB : p[0]===1 ? R-STUB : L+p[0]*(R-L);
  const oy = p[1]===0 ? T+STUB : p[1]===1 ? B-STUB : T+p[1]*(B-T);
  // 축
  ctx.strokeStyle='#374151'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(L,oy); ctx.lineTo(R,oy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox,T); ctx.lineTo(ox,B); ctx.stroke();
  // 화살표 — x축 오른쪽 끝, y축 위쪽 끝에만
  ctx.fillStyle='#374151';
  const arw=6;
  ctx.beginPath(); ctx.moveTo(R,oy); ctx.lineTo(R-arw,oy-arw/2); ctx.lineTo(R-arw,oy+arw/2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox,T); ctx.lineTo(ox-arw/2,T+arw); ctx.lineTo(ox+arw/2,T+arw); ctx.fill();
  // 축 이름
  ctx.font='12px sans-serif'; ctx.fillStyle='#374151';
  ctx.textAlign='left';   ctx.fillText('x',R+4,oy+4);
  ctx.textAlign='center'; ctx.fillText('y',ox,T-6);
  // 원점 O — 제3사분면 쪽(왼쪽 아래)에 붙인다
  ctx.textAlign='right';  ctx.fillText('O',ox-4,oy+14);
}

function _drawNumberLineT(ctx,W,H,nMin,nMax){
  const PAD=32; const MID=H/2;
  const range=nMax-nMin;
  const toX=v=>PAD+((v-nMin)/range)*(W-PAD*2);
  ctx.strokeStyle='#374151'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PAD,MID); ctx.lineTo(W-PAD,MID); ctx.stroke();
  ctx.fillStyle='#374151';
  ctx.beginPath(); ctx.moveTo(W-PAD,MID); ctx.lineTo(W-PAD-8,MID-4); ctx.lineTo(W-PAD-8,MID+4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(PAD,MID); ctx.lineTo(PAD+8,MID-4); ctx.lineTo(PAD+8,MID+4); ctx.fill();
  ctx.font='11px sans-serif'; ctx.fillStyle='#374151'; ctx.textAlign='center';
  for(let n=Math.ceil(nMin);n<=nMax;n++){
    const x=toX(n);
    const nearLeft=x<PAD+10, nearRight=x>W-PAD-10;
    if(!nearLeft && !nearRight){
      ctx.beginPath(); ctx.moveTo(x,MID-6); ctx.lineTo(x,MID+6); ctx.strokeStyle='#374151'; ctx.lineWidth=1.5; ctx.stroke();
    }
    ctx.fillText(n,x,MID+18);
    if(n===0){ctx.beginPath();ctx.arc(x,MID,3,0,Math.PI*2);ctx.fill();}
  }
}

}

      : d.unanswered?' (미응답)':` (오답 ${d.wrong}회)`);
  let body='';
  // 시험지 제출 답안 표시 (그래프가 아닌 경우) — 교사가 학생 답안을 확인할 수 있도록
  if(_isExam && !d.v?.drawing){
    const raw=d.v?.examAnswer;
    const ansTxt = fmtExamAnswer(raw, d.wsId, d.qid, d.v?.examSubmittedAt);
    const correctTxt = fmtCorrectAnswer(d.wsId, d.qid);
    const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const st=d.v?.correct===true?['정답','var(--green)','#dcfce7']
            :d.v?.correct===false?['오답','var(--red)','#fee2e2']
            :['미채점','var(--amber)','#fef3c7'];
    body+=`<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">📝 시험지 제출 답안</div>
      <div style="padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:15px;font-family:'DM Mono',monospace;word-break:break-all">${esc(ansTxt)}</div>
      ${correctTxt?`<div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px">✅ 정답</div>
      <div style="padding:10px 12px;border:1px solid var(--green);border-radius:8px;background:#f0fdf4;font-size:15px;font-family:'DM Mono',monospace;word-break:break-all;color:var(--green)">${esc(correctTxt)}</div>`:''}
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:700;color:${st[1]};background:${st[2]};padding:3px 10px;border-radius:12px">${st[0]}</span>
        ${d.v?.score!=null&&d.v?.maxScore!=null?`<span style="font-size:12px;color:var(--ink3)">획득 ${d.v.score} / ${d.v.maxScore}점</span>`:''}
        ${d.v?.examSubmittedAt?`<span style="font-size:11px;color:var(--ink3)">제출: ${formatDate(d.v.examSubmittedAt)}</span>`:''}
      </div>
    </div>`;
  }
  // 그래프 답안
  if(d.v?.drawing){
    const curScore=d.v.teacherScore??'';
    body+=`<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:8px">📝 그래프 답안</div>
      <div style="position:relative;display:inline-block;width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--rule)">
        <canvas id="graph-grid-canvas" style="display:block;width:100%;background:#fff"></canvas>
        <img src="${d.v.drawing}" id="graph-student-img" style="position:absolute;inset:0;width:100%;height:100%">
        ${d.v.teacherDrawing?`<img src="${d.v.teacherDrawing}" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">`:''}
        <!-- oncontextmenu·touch-callout: 한 자리를 오래 누르면 브라우저가 "길게 누르기 = 오른쪽 클릭"으로
             보고 상황 메뉴를 띄우면서 pointercancel 로 그리던 획까지 끊었다(점을 찍을 때 자주 났다).
             touch-action:none 은 스크롤·확대만 막을 뿐 이건 못 막는다. index 와 같은 처리다. -->
        <canvas id="teacher-draw-canvas" oncontextmenu="return false"
          style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;opacity:0.9;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none"></canvas>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center">
        <button id="td-pen-btn" class="btn-back" style="font-size:12px;background:#fee2e2;border-color:var(--red);color:var(--red)">🖊 펜</button>
        <button id="td-erase-btn" class="btn-back" style="font-size:12px">지우개</button>
        <button onclick="teacherDrawUndo()" class="btn-back" style="font-size:12px">↩ 실행취소</button>
        <button onclick="teacherDrawClear()" class="btn-back" style="font-size:12px">전체 지우기</button>
        <button onclick="saveTeacherDrawing('${key}')" style="background:#dc2626;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;margin-left:auto">💾 그림 저장</button>
      </div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px">
          <button onclick="saveGraphGrade('${key}',true)"
            style="flex:1;padding:8px;border-radius:8px;border:2px solid ${d.v.correct===true?'var(--green)':'var(--rule)'};background:${d.v.correct===true?'#dcfce7':'var(--paper)'};font-size:18px;font-weight:700;cursor:pointer;color:${d.v.correct===true?'var(--green)':'var(--ink3)'}">⭕</button>
          <button onclick="saveGraphGrade('${key}',false)"
            style="flex:1;padding:8px;border-radius:8px;border:2px solid ${d.v.correct===false&&d.v.correct!==undefined?'var(--red)':'var(--rule)'};background:${d.v.correct===false&&d.v.correct!==undefined?'#fee2e2':'var(--paper)'};font-size:18px;font-weight:700;cursor:pointer;color:${d.v.correct===false&&d.v.correct!==undefined?'var(--red)':'var(--ink3)'}">❌</button>
        </div>
        <textarea id="graph-feedback-input" placeholder="학생에게 피드백 (선택사항)" rows="2"
          style="width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;font-size:13px;resize:vertical;box-sizing:border-box">${d.v.feedback||''}</textarea>
        <button onclick="saveGraphFeedback('${key}')"
          style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;align-self:flex-start">피드백 저장</button>
      </div>
    </div>`;
  } else if(_isExam){
    // 시험지 문항: 제출 답안·정답·점수를 위에서 이미 표시했고, 오답 기록(wrongInputs)을
    // 남기지 않는 방식이라 '첫 번에 정답' 같은 일반 학습지용 표시를 하면 판정과 모순된다.
  } else if(d.unanswered){
    body+=`<div style="font-size:13px;color:var(--ink3);margin-bottom:14px">— 아직 풀지 않은 문항입니다</div>`;
  } else if(d.wrongInputs.length){
    body+=`<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">오답 기록</div>
      <!-- 학생이 친 답을 그대로 넣으면 안 된다: 부등식 답(3<x)의 < 가 태그로 읽혀 기록이 사라진다 -->
      <div>${d.wrongInputs.map(w=>`<span class="wrong-chip">${escapeAttr(w)}</span>`).join('')}</div>
    </div>`;
  } else {
    body+=`<div style="font-size:13px;color:var(--green);margin-bottom:14px">✅ 첫 번에 정답</div>`;
  }
  // (오답 후 정답인 경우 위 오답 기록 + 아래 표시)
  if(!d.unanswered && d.wrongInputs.length && d.correct){
    body+=`<div style="font-size:13px;color:var(--green);margin-bottom:14px">✅ 이후 정답 처리됨</div>`;
  }
  if(d.canvasImage){
    body+=`<div>
      <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">풀이 이미지</div>
      <img src="${d.canvasImage}" style="width:100%;border-radius:8px;border:1px solid var(--rule)">
    </div>`;
  } else if(!_isExam){
    body+=`<div style="font-size:12px;color:var(--ink3)">풀이 이미지 없음</div>`;
  }
  document.getElementById('qd-body').innerHTML=body;
  document.getElementById('qd-modal').style.display='flex';
  // 교사 드로잉 캔버스 초기화 (이미지 로드 후)
  setTimeout(()=>{
    const img=document.getElementById('graph-student-img');
    const canvas=document.getElementById('teacher-draw-canvas');
    const gridCanvas=document.getElementById('graph-grid-canvas');
    if(!img||!canvas) return;
    // 학습지에서 그래프 정보 가져오기
    const ws=WORKSHEETS.find(w=>w.id===d.wsId);
    const q=ws?.questions?.find(q=>q.id===d.qid);
    const setSize=()=>{
      const W=img.naturalWidth||img.clientWidth||400;
      const H=img.naturalHeight||img.clientHeight||300;
      canvas.width=W; canvas.height=H;
      canvas.style.height=img.clientHeight+'px';
      if(gridCanvas){
        gridCanvas.width=W; gridCanvas.height=H;
        gridCanvas.style.height=img.clientHeight+'px';
        // 격자 그리기
        if(q){ drawGraphGridForTeacher(gridCanvas, q, W, H); }
      }
      // 기존 교사 주석 복원
      const td=window._qd[key]?.v?.teacherDrawing;
      if(td){ const i2=new Image(); i2.onload=()=>canvas.getContext('2d').drawImage(i2,0,0,canvas.width,canvas.height); i2.src=td; }
    };
    if(img.complete) setSize(); else img.onload=setSize;
    initTeacherCanvas(canvas);
  },100);
};

window.loadAll=loadAll;
document.addEventListener('DOMContentLoaded',()=>{
  const el=document.getElementById('t-ver');
  if(el) el.textContent='v'+VERSION;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>교사 관리 · 수학 학습지+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf8f3;--paper:#fff;--rule:#e8e4d9;
  --ink:#1c1917;--ink2:#44403c;--ink3:#a8a29e;
  --accent:#1d4ed8;--acc-lt:#eff6ff;
  --green:#15803d;--grn-lt:#dcfce7;
  --red:#b91c1c;--red-lt:#fee2e2;
  --amber:#b45309;--amb-lt:#fef3c7;
  --r:10px;
  --g1:#1d4ed8;--g2:#15803d;--g3:#b91c1c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.6}

/* ── 통일 헤더 (grid 3열) ── */
header{display:grid !important;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hdr-left{display:flex;gap:6px;align-items:center;justify-self:start;flex-wrap:nowrap}
.hdr-center{display:flex;gap:8px;align-items:center;justify-self:center;white-space:nowrap}
.hdr-right{display:flex !important;gap:6px;align-items:center;justify-self:end;flex-wrap:nowrap}
.hdr-nav{display:inline-flex;gap:4px}
.hdr-nav .hdr-btn{padding:5px 10px;font-size:12px}
.hdr-sep{width:1px;height:20px;background:currentColor;opacity:.15;margin:0 4px}

header{position:sticky;top:0;z-index:200;background:var(--ink);height:52px;display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{font-weight:900;font-size:18px;color:#fff;letter-spacing:-.5px;flex:1}
.logo em{color:#60a5fa;font-style:normal}
.logo small{font-size:12px;font-weight:400;color:rgba(255,255,255,.4);margin-left:8px}
.hdr-right{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.65)}
.tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.tag-t{background:var(--accent);color:#fff}
.hdr-btn{padding:4px 12px;border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.hdr-btn:hover{background:rgba(255,255,255,.18)}
.hdr-btn-green{background:#15803d;border-color:#15803d}
#auth-gate{min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:40px 20px}
.gate-card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:48px 44px;text-align:center;max-width:380px;width:100%}
.gate-card .icon{font-size:48px;margin-bottom:16px}
.gate-card h2{font-size:20px;font-weight:900;margin-bottom:8px}
.gate-card p{color:var(--ink3);font-size:14px;margin-bottom:28px}
.btn-goog{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.btn-goog:hover{border-color:var(--accent);background:var(--acc-lt)}
.btn-goog svg{width:20px;height:20px}
#app{display:none}
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:240px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--rule);position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;padding:12px 0}
.sb-section{padding:8px 18px 4px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:8px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;cursor:pointer;color:var(--ink2);transition:background .1s;border-radius:0;user-select:none}
.sb-item:hover{background:var(--cream)}
.sb-item.active{background:var(--acc-lt);color:var(--accent);font-weight:700}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-count{font-size:11px;color:var(--ink3);font-family:'DM Mono',monospace;margin-left:auto}
.content{flex:1;padding:28px 32px;min-width:0}
.pg-title{font-size:22px;font-weight:900;margin-bottom:4px}
.pg-sub{color:var(--ink3);font-size:13px;margin-bottom:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.sum-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.sum-label{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.sum-num{font-size:28px;font-weight:900}
.sum-sub{font-size:12px;color:var(--ink3);margin-top:2px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--rule);flex-wrap:wrap;gap:8px}
.card-title{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse}
thead{background:var(--cream)}
th,td{text-align:left;padding:10px 16px;font-size:13px;border-bottom:1px solid var(--rule)}
th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--cream)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.b-done{background:var(--grn-lt);color:var(--green)}
.b-miss{background:var(--red-lt);color:var(--red)}
.rate-row{display:flex;align-items:center;gap:8px}
.rate-bg{flex:1;height:5px;background:var(--rule);border-radius:3px;min-width:50px}
.rate-fill{height:5px;border-radius:3px}
.rate-n{font-size:12px;font-family:'DM Mono',monospace;width:36px;text-align:right}
.tries-badge{font-size:12px;font-family:'DM Mono',monospace}
.tries-1{color:var(--green)}.tries-2{color:var(--amber)}.tries-many{color:var(--red)}
.btn-sm{padding:6px 14px;border-radius:7px;font-size:13px;font-family:inherit;background:var(--paper);border:1.5px solid var(--rule);cursor:pointer;font-weight:500}
.btn-sm:hover{background:var(--rule)}
.btn-sm-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-sm-accent:hover{opacity:.88;background:var(--accent)}
select,input[type=text]{padding:7px 10px;border:1.5px solid var(--rule);border-radius:7px;font-size:13px;font-family:inherit;background:var(--paper);color:var(--ink)}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.loading{text-align:center;padding:48px;color:var(--ink3);font-size:15px}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.class-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.class-card-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.class-row{display:flex;gap:8px}
.class-row>*{flex:1}
.student-list{margin-top:10px;display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto}
.student-chip{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--cream);border-radius:6px;font-size:13px}
.student-chip .remove{cursor:pointer;color:var(--ink3);font-size:16px;line-height:1;background:none;border:none;padding:0}
.student-chip .remove:hover{color:var(--red)}
.add-student-row{display:flex;gap:8px;margin-top:8px}
.add-student-row input{flex:1}
.cat-수와연산{background:#dbeafe;color:#1e40af}
.cat-변화와관계{background:#dcfce7;color:#166534}
.cat-도형과측정{background:#fef3c7;color:#92400e}
.cat-자료와가능성{background:#fce7f3;color:#9d174d}
@media(max-width:768px){.sidebar{display:none}.content{padding:20px}}
.sb-grade-header{display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;user-select:none;color:var(--ink2);transition:background .1s;}
.sb-grade-header:hover{background:var(--cream)}
.sb-grade-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sb-chevron{margin-left:auto;font-size:10px;transition:transform .2s;display:inline-block}
.sb-chevron.open{transform:rotate(90deg)}
.sb-unit-group{overflow:hidden;transition:max-height .25s ease}
.sb-unit-group.collapsed{max-height:0!important}
.sb-unit-header{display:flex;align-items:center;gap:6px;padding:7px 14px 7px 24px;font-size:12px;cursor:pointer;user-select:none;color:var(--ink3);transition:background .1s;}
.sb-unit-header:hover{background:var(--cream);color:var(--ink2)}
.sb-unit-chevron{margin-left:auto;font-size:9px;transition:transform .2s;display:inline-block}
.sb-unit-chevron.open{transform:rotate(90deg)}
.sb-ws-group{overflow:hidden;transition:max-height .2s ease}
.sb-ws-group.collapsed{max-height:0!important}
.sb-ws-item{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 36px;font-size:12px;cursor:pointer;color:var(--ink2);transition:background .1s;}
.sb-ws-item:hover{background:var(--cream)}
.sb-ws-item.active{background:var(--acc-lt);color:var(--accent);font-weight:700}
.sb-ws-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--ink3)}
.sb-ws-item.active .sb-ws-dot{background:var(--accent)}
.img-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:flex;align-items:center;justify-content:center}
.img-modal{background:var(--paper);border-radius:var(--r);padding:20px;max-width:700px;width:90%;max-height:90vh;overflow-y:auto}
.img-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.img-modal-title{font-size:15px;font-weight:700}
.img-modal-close{background:none;border:1px solid var(--rule);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;font-family:inherit}
.img-modal img{width:100%;border-radius:8px;border:1px solid var(--rule)}
.wrong-chip{display:inline-block;font-size:12px;font-family:'DM Mono',monospace;background:var(--red-lt);color:var(--red);padding:2px 8px;border-radius:4px;margin:2px}
.canvas-thumb{width:80px;height:50px;object-fit:cover;border-radius:5px;border:1px solid var(--rule);cursor:pointer;transition:transform .1s}
.canvas-thumb:hover{transform:scale(1.05)}
/* 문항별 가로 셀 */
.qcell{display:flex;flex-direction:column;align-items:center;padding:4px 5px;
  border-radius:6px;cursor:pointer;transition:background .1s;min-width:34px;border:1px solid transparent}
.qcell:hover{background:var(--cream);border-color:var(--rule)}
.qcell-id{font-size:11px;font-weight:700;font-family:'DM Mono',monospace;line-height:1.2}
.qcell-try{font-size:10px;line-height:1.2;margin-top:1px}
/* ── 학급 비교 히트맵 ── */
.heatmap-wrap{overflow-x:auto}
.heatmap-table{border-collapse:collapse;width:100%;font-size:13px}
.heatmap-table th{background:var(--cream);padding:8px 12px;text-align:center;
  border:1px solid var(--rule);font-weight:700;white-space:nowrap}
.heatmap-table th.ws-col{text-align:left;max-width:220px;min-width:120px}
.heatmap-table td{padding:8px 10px;text-align:center;border:1px solid var(--rule);
  white-space:nowrap;font-weight:600;font-size:12px;position:relative}
.hm-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.hm-num{font-size:13px;font-weight:700}
.hm-bar{width:100%;height:4px;border-radius:2px;background:var(--rule);margin-top:2px}
.hm-fill{height:100%;border-radius:2px}
.hm-ws-name{font-size:12px;font-weight:600;max-width:200px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hm-ws-unit{font-size:10px;color:var(--ink3)}
.hm-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.hm-grade-btn{padding:5px 14px;border:1.5px solid var(--rule);border-radius:20px;
  background:none;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
.hm-grade-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collectionGroup, collection, query, orderBy, getDocs, deleteDoc, doc, getDoc, setDoc, updateDoc, deleteField, writeBatch, FieldPath}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const FB = {
  apiKey:            "AIzaSyAW6nJ_r0PXyWc5II6QzrOuljBsyWhX4dA",
  authDomain:        "online-worksheets.firebaseapp.com",
  projectId:         "online-worksheets",
  storageBucket:     "online-worksheets.firebasestorage.app",
  messagingSenderId: "404110714320",
  appId:             "1:404110714320:web:cb79c555a383801f3205d5"
};
// 버전 문자열은 <meta name="app-version">을 단일 출처로 읽는다 (index와 동일 규칙 — 헤더 표시가 어긋나던 문제)
const VERSION = (document.querySelector('meta[name="app-version"]')?.content||"").trim() || "3.32";
// 🤖 AI 학습 분석용 Apps Script 웹앱 (AI기능_AppsScript.gs, 오류신고 웹앱과는 별개 프로젝트)
// SECRET 상수와 값이 같아야 함. URL 자체는 비밀번호가 아니라 장난 호출 차단용 토큰으로 보호됨.
const AI_WEBAPP_URL   = "https://script.google.com/macros/s/AKfycbxlfk09F9LFEwl7MUeUg3ujfoNOjJomX28SNyjc9lnDBJYJYebBudsxqQtuVk9KZ1Wp/exec";
const AI_WEBAPP_TOKEN = "snug-ai-assist";
// 완료 판정 (완료 플래그 OR 완료시각 OR 전부 정답) — 그래프 문항이 있으면 **모두 ⭕ 정답으로 채점**돼야 완료 (v4.4, grading.js recordIsDone)
//   filter 콜백으로도 쓰이므로 인자는 r 하나만 받고, 학습지는 기록의 worksheetId 로 찾는다(못 찾으면 옛 규칙 그대로)
/* 기록이 어느 학습지 것인지는 기록 문서의 ID(records/{uid}/worksheets/{wsId})로 정한다 (v4.5).
   기록 안의 worksheetId 필드는 예전 순서 변경 때 옛 ID 가 그대로 남은 것이 많아서(teacher v3.x 이전),
   그 값으로 학습지를 찾으면 엉뚱한 학습지의 그래프 문항과 대조해 다 맞힌 학생도 완료로 안 보였다.
   불러올 때 기록 객체 → 문서 ID 를 REC_WS 에 적어 두고(기록을 다시 저장할 때 섞이지 않게 필드로 넣지 않는다),
   없으면 worksheetId 필드로. */
const REC_WS=new WeakMap();
const isRecDone=r=>{ if(!r) return false; const id=REC_WS.get(r)||r.worksheetId; const ws=id ? WORKSHEETS.find(w=>w.id===id) : null; return recordIsDone(r, ws?.questions); };

// Firestore curriculum에서 학습지 로드 (edit.html에서 만든 것 포함)
async function loadCurriculum(){
  try{
    const [uSnap,wSnap]=await Promise.all([
      getDocs(query(collection(db,'units'),orderBy('order'))),
      getDocs(collection(db,'curriculum'))
    ]);
    const units=uSnap.docs.map(d=>({...d.data()}));
    const unitOrder={};
    units.forEach((u,i)=>unitOrder[u.id]=u.order??i);
    const sheets=wSnap.docs.map(d=>({...d.data()}))
      .filter(w=>w.type!=='vocab') // VOCA 학습지는 더 이상 지원하지 않음 (데이터는 Firestore에 보존)
      .sort((a,b)=>{
        const ua=unitOrder[a.unitId]??999;
        const ub=unitOrder[b.unitId]??999;
        if(ua!==ub) return ua-ub;
        return (a.order??99)-(b.order??99);
      });
    sheets.forEach(ws=>{ if(!ws.questions) ws.questions=[]; if(!ws.vocab) ws.vocab=[];
      if(ws.questions && !ws.qCount) ws.qCount=ws.questions.filter(q=>q.type!=="link").length; });
    if(sheets.length) WORKSHEETS=sheets;   // Firestore 우선 (없으면 정적 worksheets.js 유지)
    if(units.length){ UNITS=units; units.forEach(u=>UNIT_MAP[u.id]=u); }  // UNIT_MAP 병합(학년/영역 조회용)
    console.log(`[teacher 커리큘럼] 단원 ${units.length}개, 학습지 ${sheets.length}개 (Firestore)`);
  }catch(e){ console.warn('[커리큘럼 로드 실패 → 정적 worksheets.js 사용]', e.message); }
}

/* 학급 로드: 기본 교사는 본인 문서, 담당 교사는 전체 문서에서 자기 담당 학급만 (+학생 이메일 범위) */
async function loadClassScope(){
  try{
    if(scopedTeacher){
      const allSnap=await getDocs(collection(db,"teacher_data"));
      classes={}; classOwner={};
      allSnap.forEach(s=>{
        for(const [k,c] of Object.entries(s.data().classes||{})){
          if(c && String(c.teacher||'').toLowerCase()===tUser.email.toLowerCase()){ classes[k]=c; classOwner[k]=s.id; }
        }
      });
      scopeEmails=new Set(Object.values(classes).flatMap(c=>(c.students||[]).map(e=>String(e).toLowerCase())));
      console.log(`[담당 교사 범위] 학급 ${Object.keys(classes).length}개, 학생 ${scopeEmails.size}명`);
    } else {
      const cSnap=await getDoc(doc(db,"teacher_data",tUser.uid));
      classes=cSnap.exists()?(cSnap.data().classes||{}):{};
      classOwner={};
      scopeEmails=null;
    }
  }catch(e){ classes={}; if(scopedTeacher) scopeEmails=new Set(); console.error("[loadClassScope]",e); }
}

function findQDef(wsId, qid){
  const ws=(typeof WORKSHEETS!=='undefined'?WORKSHEETS:[]).find(w=>w.id===wsId);
  return ws?.questions?.find(x=>x.id===qid)||null;
}
/* backtick(`)은 수식 안 반칸 공백 표시용 문자다(index·edit 에서 \, 로 바뀐다).
   여긴 MathJax 없이 글자 그대로 보여 주는 곳이라, 지우지 않으면 선지에 ` 가 그대로 찍힌다. */
function _stripTex(s){ return String(s??'').replace(/\\\(|\\\)/g,'').replace(/`/g,' ').replace(/\s+/g,' ').trim(); }
/* submittedAt(제출 시각)이 있는데 답안이 비어 있으면 '안 푼 것'이 아니라
   구버전(v8.12 이전)의 시험 종료 저장이 답안을 null로 덮어써 유실된 경우다.
   실제 무응답과 구분해 표시해야 교사가 개별 조치를 할 수 있다. */
function fmtExamAnswer(raw, wsId, qid, submittedAt){
  const empty = raw===null||raw===undefined||raw===''||(Array.isArray(raw)&&!raw.length);
  if(empty) return submittedAt ? '⚠️ 답안 유실 (제출 기록은 있음)' : '(무응답)';
  if(Array.isArray(raw)){
    if(!raw.length) return '(무응답)';
    const opts=findQDef(wsId,qid)?.options||[];
    return raw.map(n=>`${Number(n)+1}번${opts[n]!=null?` (${_stripTex(opts[n])})`:''}`).join(', ');
  }
  return _stripTex(raw);
}
/* 문항의 정답을 사람이 읽을 수 있게 (교사가 제출답안과 비교할 수 있도록) */
function fmtCorrectAnswer(wsId, qid){
  const q=findQDef(wsId,qid);
  if(!q) return null;
  if(q.type==='multi'){
    const opts=q.options||[];
    const a=[...(q.answer||[])].map(Number);
    if(!a.length) return '(정답 미설정)';
    return a.map(n=>`${n+1}번${opts[n]!=null?` (${_stripTex(opts[n])})`:''}`).join(', ');
  }
  if(q.answer==null||q.answer==='') return null;
  return _stripTex(q.answer);
}

// ── 학생별 조회: 공용 문항 셀 렌더 ──

/* ── 그래프 문항 판정 (기록이 아니라 학습지 정의 기준) ──
   기존에는 "drawing 필드가 있으면 그래프"로 판단해서, 그래프를 제출하지 않은 문항은
   일반 문항 분기로 빠져 **오답 기록이 없다는 이유로 ✓(정답)** 으로 표시됐다. */
function isGraphQ(wsId, qid){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  return (ws?.questions||[]).some(q=>q.id===qid && q.type==='graph');
}
/* 그래프 문항 셀 표시값 (제출 없으면 '미제출') */
function graphCell(v, label){
  if(v && v.drawing){
    return { col: v.correct===true?"var(--green)":v.correct===false?"var(--red)":"var(--amber)",
             mark: v.correct===true?"⭕":v.correct===false?"❌":"📝",
             ttl: `${label}: 그래프 ${v.correct===true?'정답':v.correct===false?'오답':'미채점(교사 채점 대기)'}` };
  }
  return { col:"var(--ink3)", mark:"—", ttl:`${label}: 그래프 미제출 (학생이 그리지 않음 → 미완료 처리)` };
}
function perQCells(r, uid, wsIdArg){
  if(!r || !r.perQuestion) return '<span style="color:var(--ink3);font-size:12px">기록 없음</span>';
  window._qd=window._qd||{};
  const cells=Object.entries(r.perQuestion).sort().map(([qid,v])=>{
    const wc=(v.wrongInputs||[]).length;
    const att=v.attempts||0;
    const isExamQ = v.examAnswer!==undefined || v.maxScore!==undefined;  // 시험지 문항
    const isCorrect = v.correct!==undefined && v.correct!==null ? v.correct===true
                      : (isExamQ ? false : (wc===0));   // 시험지는 오답기록이 없다고 정답 처리하면 안 됨
    const unanswered = !isExamQ && (v.correct===false) && wc===0 && att===0;
    let col, mark, ttl;
    const _gq = isGraphQ(wsIdArg||r.wsId, qid);
    if(_gq){ const g=graphCell(v, fmtQid(qid)); col=g.col; mark=g.mark; ttl=g.ttl; }
    else if(isExamQ){
      // 시험지: 채점 결과가 없으면 '미채점'으로 표시 (정답으로 오인 방지)
      const ansTxt = fmtExamAnswer(v.examAnswer, wsIdArg||r.wsId, qid, v.examSubmittedAt);
      if(v.correct===true){ col="var(--green)"; mark="⭕"; }
      else if(v.correct===false){ col="var(--red)"; mark="❌"; }
      else { col="var(--amber)"; mark="📝"; }
      ttl=`${fmtQid(qid)}: ${v.correct===true?'정답':v.correct===false?'오답':'미채점'} · 제출답안: ${ansTxt}`
          + (v.score!=null&&v.maxScore!=null?` (${v.score}/${v.maxScore}점)`:'');
    }
    else if(unanswered){ col="var(--ink3)"; mark="—"; ttl=`${fmtQid(qid)}: 미응답`; }
    else if(isCorrect){ col="var(--green)"; mark=wc>0?`✓(${wc})`:"✓"; ttl=`${qid}: 정답${wc>0?` (오답 ${wc}회 후)`:""}`; }
    else { col=wc>=2?"var(--red)":"var(--amber)"; mark=`${wc}회`; ttl=`${fmtQid(qid)}: 오답 ${wc}회`; }
    // 학생 상세는 한 학생의 여러 학습지를 한 화면에 그리므로 학습지 ID를 키에 포함해야 한다.
    // (없으면 학습지가 달라도 q19끼리 같은 키가 되어 마지막 학습지 기록이 덮어써짐)
    const dkey=(uid||r.uid||"x")+"_"+(wsIdArg||r.wsId||"ws")+"_"+qid;
    window._qd[dkey]={studentName:r.studentName||"-",qid,attempts:att||(isCorrect?1:0),wrong:wc,correct:isCorrect,unanswered,wrongInputs:v.wrongInputs||[],canvasImage:v.canvasImage||null,v,isExamQ,wsId:(wsIdArg||r.wsId)};
    return `<div class="qcell" onclick="showQDetail('${dkey}')" title="${ttl}"><span class="qcell-id" style="color:${col}">${fmtQid(qid)}</span><span class="qcell-try" style="color:${col}">${mark}</span></div>`;
  }).join("");
  return `<div style="display:flex;flex-wrap:wrap;gap:3px">${cells}</div>`;
}

/* 진도율 대상 여부: 일반 학습지 + 진도율 반영 ON만 (index/edit와 동일 규칙)
   커리큘럼에 없는(삭제된) 학습지는 진도율 집계 제외 */
function countsForProgressWs(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  if(!ws) return false;
  if(ws.type==="review" || ws.type==="exam") return false;
  if(ws.includeInProgress===false) return false;               // 진도율 반영 OFF
  return true;
}

/* 단원별 복습 학습지 결과 표시: 완료 횟수 + 누적 정답률 (개별 문항 기록은 남기지 않음) */
function reviewStatsHtml(r){
  const n=r?.completions||0;
  const avg=r?.sumTotal?Math.round((r.sumCorrect||0)/r.sumTotal*100):null;
  return `<span style="color:var(--accent);font-weight:700">✅ ${n}회 완료</span>`
    + (avg!=null?`<br><span style="font-size:11px;color:var(--ink3)">평균 정답률 ${avg}%</span>`:'');
}

function studentList(){
  const entries=Object.entries(allData).map(([uid,wsMap])=>{
    const recs=Object.values(wsMap);
    const any=recs.find(r=>r.studentName)||recs[0]||{};
    const email=any.studentEmail||"-";
    // 이 학생이 시작한 진도율 대상 학습지(기록이 있으면 시작으로 간주)
    const startedIds=Object.keys(wsMap).filter(countsForProgressWs);
    const done=startedIds.filter(id=>isRecDone(wsMap[id])).length;
    const rates=recs.filter(r=>typeof r.correctRate==="number").map(r=>r.correctRate);
    const avg=rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length):null;
    return {uid,name:any.studentName||"-",email,cls:findClass(email)||"-",startedIds,done,avg};
  });
  // 진도율 분모: 같은 반 학생이 1명이라도 시작한 진도율 대상 학습지 수
  const classStarted={};  // 반 → Set(wsId)
  entries.forEach(s=>{
    if(!classStarted[s.cls]) classStarted[s.cls]=new Set();
    s.startedIds.forEach(id=>classStarted[s.cls].add(id));
  });
  entries.forEach(s=>{
    s.total=classStarted[s.cls]?.size||0;
    s.pct=s.total?Math.round(s.done/s.total*100):null;  // 진도율% = 완료/전체
  });
  return entries;
}

/* 진단: 특정 학급의 진도율 분모 상세 출력
   콘솔에서 progDebug('4반') 처럼 실행 (인자 없으면 전체 학급) */
window.progDebug = function(filter){
  const byCls={};
  Object.entries(allData).forEach(([uid,wsMap])=>{
    const recs=Object.values(wsMap);
    const email=(recs.find(r=>r.studentEmail)||{}).studentEmail||'';
    const cls=findClass(email)||'-';
    const name=(recs.find(r=>r.studentName)||{}).studentName||email||uid;
    (byCls[cls]=byCls[cls]||[]).push({name,wsMap});
  });
  Object.entries(byCls).forEach(([cls,studs])=>{
    if(filter && !cls.includes(filter)) return;
    const starters={};  // wsId -> [학생이름]
    studs.forEach(s=>Object.keys(s.wsMap).forEach(id=>{ (starters[id]=starters[id]||[]).push(s.name); }));
    const rows=Object.entries(starters).map(([id,names])=>{
      const ws=WORKSHEETS.find(w=>w.id===id)||{};
      return {
        wsId:id,
        제목:ws.title||'(삭제/커리큘럼없음)',
        type:ws.type||'(없음)',
        vocab배열:Array.isArray(ws.vocab)?ws.vocab.length:0,
        진도반영:ws.includeInProgress===false?'OFF':'ON',
        카운트:countsForProgressWs(id)?'✅ 분모포함':'— 제외',
        시작학생:names.join(',')
      };
    }).sort((a,b)=>(a.카운트<b.카운트?1:a.카운트>b.카운트?-1:0));
    const denom=rows.filter(r=>r.카운트==='✅ 분모포함').length;
    console.log(`\n===== ${cls} : 진도율 분모 ${denom}개 (해당 반이 시작한 학습지 총 ${rows.length}개) =====`);
    console.table(rows);
  });
  return '진단 완료 — 위 표에서 카운트=✅ 인 항목이 분모. 예상보다 많으면 그 학습지의 type/진도반영 확인.';
};

function renderClassMatrix(){
  selView="classmatrix";
  buildSidebar();
  const content=document.getElementById("content");
  content.innerHTML='<div class="loading">분석 중…</div>';

  // 학급 목록 추출
  const clsSet=new Set();
  Object.values(allData).forEach(d=>Object.values(d).forEach(r=>{
    const c=findClass(r.studentEmail); if(c) clsSet.add(c);
  }));
  const allCls=[...clsSet].sort((a,b)=>a.localeCompare(b,'ko'));
  if(!allCls.length){content.innerHTML='<div class="card"><p style="color:var(--ink3)">학급 데이터가 없습니다.</p></div>';return;}

  // 학급별 전체 학생 수
  const clsTotalMap={};
  allCls.forEach(c=>{clsTotalMap[c]=new Set();});
  Object.values(allData).forEach(d=>{
    const emails=new Set(Object.values(d).map(r=>r.studentEmail).filter(Boolean));
    emails.forEach(email=>{const c=findClass(email); if(c) clsTotalMap[c].add(email);});
  });

  // 색상 함수
  const cellColor=(done,total)=>{
    if(!total) return 'background:#f8f9fa;color:#94a3b8';
    const p=done/total;
    if(p>=0.9) return 'background:#dcfce7;color:#15803d;font-weight:700';
    if(p>=0.7) return 'background:#d1fae5;color:#166534';
    if(p>=0.5) return 'background:#fef9c3;color:#854d0e';
    if(p>=0.3) return 'background:#fed7aa;color:#9a3412';
    if(p>0)    return 'background:#fee2e2;color:#991b1b';
    return 'background:#f8f9fa;color:#94a3b8';
  };

  // 단원별 학습지 그룹핑
  const unitGroups=[];
  UNITS.forEach(unit=>{
    const sheets=WORKSHEETS.filter(ws=>ws.unitId===unit.id&&ws.type!=='link')
      .filter(ws=>Object.values(allData).some(d=>d[ws.id]));
    if(sheets.length) unitGroups.push({unit,sheets});
  });
  const noUnit=WORKSHEETS.filter(ws=>ws.type!=='link'&&!UNITS.find(u=>u.id===ws.unitId)&&Object.values(allData).some(d=>d[ws.id]));
  if(noUnit.length) unitGroups.push({unit:{id:'_etc',title:'기타',grade:''},sheets:noUnit});

  if(!unitGroups.length){content.innerHTML='<div class="card"><p style="color:var(--ink3)">학생 기록이 있는 학습지가 없습니다.</p></div>';return;}

  // 열린 상태 (기본: 모두 열림)
  const _open={};
  unitGroups.forEach(({unit})=>{_open[unit.id]=true;});

  // 헤더 th
  const thCls=allCls.map(c=>`<th style="white-space:nowrap;font-size:12px;padding:6px 10px;min-width:72px">${c.replace(/\d+\//,'')}</th>`).join('');

  // 행 생성 함수
  function makeRows(sheets){
    return sheets.map(ws=>{
      const clsDone={};
      allCls.forEach(c=>clsDone[c]=0);
      Object.values(allData).forEach(d=>{
        const r=d[ws.id]; if(!r||!isRecDone(r)) return;
        const c=findClass(r.studentEmail); if(c) clsDone[c]=(clsDone[c]||0)+1;
      });
      const tds=allCls.map(c=>{
        const total=clsTotalMap[c].size, done=clsDone[c]||0;
        const style=cellColor(done,total);
        const label=total?`${done}/${total}`:'—';
        return `<td onclick="navigate('${ws.id}')" style="cursor:pointer;text-align:center;padding:5px 8px;font-size:13px;${style}" title="${ws.title} · ${c}: ${label}">${label}</td>`;
      }).join('');
      return `<tr data-ws="${ws.id}">
        <td style="padding:5px 12px;font-size:13px;font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${ws.title}">${ws.title}</td>
        ${tds}
      </tr>`;
    }).join('');
  }

  // 단원별 섹션 생성
  let sections='';
  unitGroups.forEach(({unit,sheets})=>{
    const gc=GCOL[unit.grade]||'#6b7280';
    const rows=makeRows(sheets);
    sections+=`
      <tr class="matrix-unit-header" data-unit="${unit.id}" onclick="_toggleUnit('${unit.id}')" style="cursor:pointer;background:#f8fafc">
        <td colspan="${allCls.length+1}" style="padding:8px 12px;font-size:13px;font-weight:700;color:${gc}">
          <span id="unit-chevron-${unit.id}" style="display:inline-block;transition:transform .2s;margin-right:6px">▼</span>
          ${unit.grade?`${unit.grade}학년 · `:''}${unit.title}
          <span style="font-weight:400;color:var(--ink3);font-size:12px;margin-left:6px">(${sheets.length}개)</span>
        </td>
      </tr>
      <tbody id="unit-body-${unit.id}">${rows}</tbody>`;
  });

  content.innerHTML=`
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">📊 반별 학습지 완료 현황</span>
        <div style="display:flex;gap:8px;align-items:center">
          <button onclick="_toggleAllUnits(true)" style="font-size:12px;padding:4px 10px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;background:var(--paper)">모두 펼치기</button>
          <button onclick="_toggleAllUnits(false)" style="font-size:12px;padding:4px 10px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;background:var(--paper)">모두 접기</button>
          <span style="font-size:12px;color:var(--ink3)">셀 클릭 → 학습지 상세</span>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table id="matrix-table" style="border-collapse:collapse;width:100%;min-width:500px">
          <thead style="position:sticky;top:0;background:var(--paper);z-index:2">
            <tr>
              <th style="padding:6px 12px;font-size:12px;text-align:left;min-width:160px">학습지</th>
              ${thCls}
            </tr>
          </thead>
          ${sections}
        </table>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--ink3)">
        <span style="background:#dcfce7;color:#15803d;padding:2px 8px;border-radius:4px;font-weight:700">90%+</span>
        <span style="background:#fef9c3;color:#854d0e;padding:2px 8px;border-radius:4px">50~70%</span>
        <span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:4px">30% 미만</span>
        <span style="background:#f8f9fa;color:#94a3b8;padding:2px 8px;border-radius:4px">데이터 없음</span>
      </div>
    </div>`;

  // 단원 토글 함수
  window._toggleUnit=function(uid){
    _open[uid]=!_open[uid];
    const body=document.getElementById(`unit-body-${uid}`);
    const chev=document.getElementById(`unit-chevron-${uid}`);
    if(body){ body.style.display=_open[uid]?'':'none'; }
    if(chev){ chev.style.transform=_open[uid]?'':'rotate(-90deg)'; }
  };
  window._toggleAllUnits=function(open){
    unitGroups.forEach(({unit})=>{
      _open[unit.id]=open;
      const body=document.getElementById(`unit-body-${unit.id}`);
      const chev=document.getElementById(`unit-chevron-${unit.id}`);
      if(body) body.style.display=open?'':'none';
      if(chev) chev.style.transform=open?'':'rotate(-90deg)';
    });
  };
}

function renderStudentDetail(uid){
  selView="stu:"+uid;
  const wsMap=allData[uid]||{};
  const recs=Object.values(wsMap);
  const any=recs.find(r=>r.studentName)||recs[0]||{};
  const name=any.studentName||"-", email=any.studentEmail||"-", cls=findClass(email)||"-";
  // 진도율: 목록 화면과 동일 기준(반별 분모) 사용 — studentList 1회 계산 후 재사용
  const _slist=studentList();
  const me=_slist.find(s=>s.uid===uid)||{done:0,total:0,pct:null};
  const done=me.done, progTotal=me.total, progPct=me.pct;
  const rates=recs.filter(r=>typeof r.correctRate==="number").map(r=>r.correctRate);
  const avg=rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length):null;
  const totalTries=recs.reduce((s,r)=>s+getAttempts(r),0);

  // 학습지별 행 (WORKSHEETS 정의 순서, 학생이 시작한 것만)
  const ordered=WORKSHEETS.filter(ws=>wsMap[ws.id]);
  const startedIds=new Set(ordered.map(w=>w.id));
  // 삭제된 학습지는 표시하지 않음

  const rows=ordered.map(ws=>{
    const r=wsMap[ws.id]; if(!r) return "";
    const dn=isRecDone(r);
    const rate=r.correctRate ?? (r.totalCount?Math.round((r.answeredCount||0)/r.totalCount*100):0);
    const tries=getAttempts(r);
    const unit=UNIT_MAP[ws.unitId]?.title||"-";
    const ts=formatDate(r.completedAt||r.lastUpdated);
    const statusBadge=dn
      ? `<span style="color:var(--green);font-weight:600">✅ 완료</span>`
      : `<span style="color:var(--amber);font-weight:600">⏳ 진행 중 (${r.answeredCount||0}/${r.totalCount||"?"})</span>`;
    return `<tr>
      <td><strong>${ws.title||"-"}</strong><br><span style="font-size:11px;color:var(--ink3)">${unit}</span></td>
      <td style="font-size:12px">${statusBadge}<br><span style="font-size:11px;color:var(--ink3)">${ts}</span></td>
      <td>${ws.type==='review'?reviewStatsHtml(r):ws.type==='exam'?examCountsHtml(ws,r):(rate!=null?rateBar(rate):'-')}</td>
      <td style="text-align:center">${ws.type==='review'?'<span style="color:var(--ink3);font-size:12px">-</span>':`<span class="tries-badge ${tries===0?'tries-1':tries<=3?'tries-2':'tries-many'}">${tries}회</span>`}</td>
      <td style="min-width:200px">${perQCells(r,uid,ws.id)}</td>
    </tr>`;
  }).join("");

  // AI 학습 분석 — 이 학생이 시작한 학습지들이 걸쳐 있는 대단원 목록(대단원 선택 시 사용)
  const aiUnitOptions=[...new Set(ordered.map(w=>w.unitId).filter(Boolean))]
    .map(id=>({id, title:UNIT_MAP[id]?.title||id}))
    .sort((a,b)=>(""+a.title).localeCompare(""+b.title,"ko"))
    .map(u=>`<option value="${u.id}">${u.title}</option>`).join("");

  // ── 다른 학생으로 바로 이동 (목록과 동일 정렬: 학급→이름) ──
  let navList=[..._slist].sort((a,b)=>
    (""+a.cls).localeCompare(""+b.cls,"ko")||(""+a.name).localeCompare(""+b.name,"ko"));
  // 목록에서 학급 필터가 걸려 있고 현재 학생이 그 학급이면, 같은 학급 안에서만 이동
  if(window._stuClass){
    const f=navList.filter(s=>s.cls===window._stuClass);
    if(f.some(s=>s.uid===uid)) navList=f;
  }
  const navIdx=navList.findIndex(s=>s.uid===uid);
  const prevUid=navIdx>0?navList[navIdx-1].uid:null;
  const nextUid=(navIdx>=0&&navIdx<navList.length-1)?navList[navIdx+1].uid:null;
  const stuOptions=navList.map(s=>
    `<option value="${s.uid}" ${s.uid===uid?'selected':''}>${s.cls&&s.cls!=='-'?s.cls+' · ':''}${s.name}</option>`).join("");

  document.getElementById("content").innerHTML=`
    <div class="card">
      <div class="card-hdr" style="flex-wrap:wrap;gap:8px">
        <span class="card-title">👤 ${name} <span style="color:var(--ink3);font-weight:400">· ${cls} · ${email}</span></span>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button class="btn" onclick="navigate('students')">← 목록</button>
          <button class="btn" ${prevUid?`onclick="navigate('stu:${prevUid}')"`:'disabled style="opacity:.4;cursor:not-allowed"'} title="이전 학생">◀ 이전</button>
          <select onchange="if(this.value)navigate('stu:'+this.value)" title="학생 선택"
            style="padding:6px 10px;border:1px solid var(--rule);border-radius:8px;font-size:13px;max-width:220px;font-family:inherit;cursor:pointer">${stuOptions}</select>
          <button class="btn" ${nextUid?`onclick="navigate('stu:${nextUid}')"`:'disabled style="opacity:.4;cursor:not-allowed"'} title="다음 학생">다음 ▶</button>
          <span style="font-size:12px;color:var(--ink3)">${navIdx>=0?navIdx+1:'-'} / ${navList.length}</span>
        </div>
      </div>
      <div class="summary-row" style="margin-bottom:16px">
        <div class="sum-card"><div class="sum-label">진도율</div><div class="sum-num" style="color:${progPct!=null?rateColor(progPct):'var(--ink3)'}">${progPct!=null?progPct+'%':'-'}<span style="font-size:14px;color:var(--ink3)"> (${done}/${progTotal})</span></div><div style="font-size:11px;color:var(--ink3)">반 시작 학습지 기준</div></div>
        <div class="sum-card"><div class="sum-label">평균 정답률</div><div class="sum-num" style="color:${avg!=null&&avg>=70?'var(--green)':'var(--amber)'}">${avg!=null?avg+'%':'-'}</div></div>
        <div class="sum-card"><div class="sum-label">총 시도</div><div class="sum-num">${totalTries}<span style="font-size:14px;color:var(--ink3)">회</span></div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
        <select id="ai-scope-sel" onchange="_updateAIUnitSelVisibility()"
          style="padding:6px 10px;border:1px solid var(--rule);border-radius:8px;font-size:13px">
          <option value="all">전체 학습 기준</option>
          <option value="unit" ${aiUnitOptions?'':'disabled'}>대단원 선택</option>
        </select>
        <select id="ai-unit-sel" style="display:none;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;font-size:13px">${aiUnitOptions}</select>
        <button class="btn" onclick="analyzeStudentWithAI('${uid}')" title="정답률·오답을 바탕으로 학습 상태를 AI가 요약합니다 (참고용)"
          style="background:#4c1d95;color:#e9d5ff;border-color:#4c1d95">🤖 AI 학습 분석</button>
      </div>
      <div id="ai-analysis-result" style="display:none;margin-bottom:16px"></div>
      <div id="exam-ai-result" style="margin-bottom:16px"></div>
      <table class="data-table">
        <thead><tr><th>학습지</th><th>상태</th><th>정답률</th><th style="text-align:center">시도</th><th>문항별 (클릭=상세)</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:var(--ink3);padding:30px">기록이 없습니다</td></tr>'}</tbody>
      </table>
    </div>`;
  loadExamAiForStudent(uid);   // 📝 시험 대비 AI 진단 결과 (있을 때만, 비동기)
}

/* ══════════ 📝 시험 대비 설정 (teacher v3.43) ══════════
   Firestore config/exam 문서 하나에 학년별로 시험을 둔다:
     { exams: { "1": {title,start,end,wsIds:[...],aiLimit,aiRequireReview,aiLimitAfterDone,aiBonusEvery,aiBonusMax,updatedAt,updatedBy}, "2":…, "3":… } }
   · 🔒 aiLimitAfterDone (v4.1): 허용 횟수도 범위 학습지를 모두 완료한 뒤부터 (index v9.2)
   · 🎁 aiBonusEvery(n, 0=끔) · aiBonusMax(m) (v3.54): 범위 학습지를 모두 완료한 뒤 범위의 복습 학습지를 각각 n회 완료할 때마다
     AI 진단 1회 추가, 최대 m회 (index v9.0 이 진도로 판정 — 「각각」은 복습 학습지 완료 횟수의 최솟값). v3.53 의 aiBonusAllDone(boolean) 은
     저장할 때 지우고, index 는 그것만 있으면 n=1·m=1 로 읽는다.
   · 학생 index 는 오늘이 start~end 안이면 그 학년의 범위 학습지에 📝 표시를 하고,
     종 🔔 공지 + 🤖 AI 학습 진단(aiLimit 회) 배너를 띄운다.
   · 시험 ID = 학년-start (예 1-2026-10-12). 학생의 진단 횟수는 이 ID 로 세므로
     **시작일을 바꾸면 새 시험으로 보고 횟수가 다시 생긴다** — 화면에 안내.
   · 저장은 기본 교사만 (firestore.rules: config/exam write = isBaseTeacher). 담당 교사는 보기만. */
let examConfig=null;          // config/exam 문서 내용 (exams 맵)
let examSelGrade=1;
async function loadExamConfig(){
  try{
    const snap=await getDoc(doc(db,"config","exam"));
    examConfig=snap.exists()?(snap.data()||{}):{};
    if(!examConfig.exams) examConfig.exams={};
  }catch(e){ console.warn("[config/exam 로드 실패]",e.message); examConfig={exams:{}}; }
}
function examIdOf(grade,start){ return grade+"-"+start; }
function examStatusLabel(ex){
  if(!ex||!ex.start||!ex.end) return "";
  const today=new Date(); const t=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  if(t<ex.start) return `<span style="color:var(--ink3)">⏳ 시작 전 (${ex.start} 부터 학생 화면에 표시)</span>`;
  if(t>ex.end)   return `<span style="color:var(--ink3)">✅ 기간 종료 (학생 화면에서 사라짐)</span>`;
  return `<span style="color:#b45309;font-weight:700">🔔 시험기간 중 — 학생 화면에 표시되는 중</span>`;
}

      · 학생의 AI 진단 횟수는 「학년-시작일」을 시험 ID 로 셉니다. <b>시작일을 바꾸면 새 시험으로 보아 횟수가 다시 생깁니다.</b><br>
      · 🔒 허용 횟수 조건을 켜면 학생 배너에 「모두 완료하면 N회를 쓸 수 있어요 (M개 남음)」만 보이고, 다 완료한 뒤 버튼이 생깁니다(받아 둔 지난 진단은 그전에도 볼 수 있습니다).<br>
      · 🎁 추가 횟수를 켜면 학생 배너에 「모두 완료하면(N개 남음) … 각각 n회 완료할 때마다 1회씩 추가」 안내가 뜨고, 다 완료한 뒤에는 「복습 완료 r회 → k회 추가됨 · x회 더 완료하면 1회 추가」로 바뀝니다(복습 학습지는 1회 이상 완료가 「완료」).
      ${ex?'<br>· 현재 시험 ID: <code>'+examIdOf(g,ex.start)+'</code>'+(ex.updatedAt?' · 마지막 저장 '+String(ex.updatedAt).slice(0,16).replace('T',' ')+' ('+(ex.updatedBy||'')+')':''):''}
    </div>
  </div>
  <div style="background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px;margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <div class="card-title">시험 범위 학습지 <span id="exam-sel-count" style="font-size:12px;color:var(--ink3);font-weight:500">${sel.size}개 선택</span></div>
      ${ro?'':'<button class="btn-sm" onclick="examCheckAll(false)" style="margin-left:auto">전체 해제</button>'}
    </div>`;
  if(!units.length) h+='<div style="color:var(--ink3);font-size:13px">이 학년의 단원이 없습니다.</div>';
  units.forEach(u=>{
    // 복습 학습지(-FN)는 단원 맨 아래에 🔁 표시로 — AI 진단 조건(aiRequireReview)의 대상이 된다 (v3.44)
    // 자동 생성된 복습 학습지는 제목 자체가 「🔁 단원 복습」이라 🔁 가 두 번 붙었다 → 제목이 🔁 로 시작하면 안 붙인다 (v4.3, 교사 지적)
    const sheets=WORKSHEETS.filter(ws=>ws.unitId===u.id).sort((a,b)=>(a.type==='review')-(b.type==='review'));
    if(!sheets.length) return;
    const allOn=sheets.every(ws=>sel.has(ws.id));
    h+=`<div style="border-top:1px solid var(--rule);padding:10px 0">
      <label style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer">
        <input type="checkbox" class="exam-unit-cb" data-unit="${u.id}" ${allOn?'checked':''} ${ro?'disabled':''} onchange="examToggleUnit('${u.id}',this.checked)">
        📂 ${u.title} <span style="font-size:11px;color:var(--ink3);font-weight:500">${u.category||''} · ${sheets.length}개</span>
      </label>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px;margin:6px 0 0 26px">
        ${sheets.map(ws=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
          <input type="checkbox" class="exam-ws-cb" data-unit="${u.id}" value="${ws.id}" ${sel.has(ws.id)?'checked':''} ${ro?'disabled':''} onchange="examSyncUnit('${u.id}')">
          <span>${ws.type==='review'&&!/^\s*🔁/.test(ws.title||'')?'🔁 ':''}${ws.title}</span><span style="font-size:11px;color:var(--ink3)">${ws.type==='review'?'복습 · ':''}${ws.status==='draft'?'📝 준비 중':ws.status==='locked'?'🔒':''}</span></label>`).join('')}
      </div></div>`;
  });
  h+=`</div>`;
  if(!ro) h+=`<div style="display:flex;gap:8px;align-items:center">
    <button class="btn-sm btn-sm-accent" onclick="saveExamSettings(${g})">💾 저장</button>
    ${ex?`<button class="btn-sm" onclick="clearExamSettings(${g})" style="color:#b91c1c">🗑 ${g}학년 시험 해제</button>`:''}
    <span id="exam-save-msg" style="font-size:12px;color:var(--ink3)"></span>
  </div>`;
  content.innerHTML=h;
  examSyncLockRow();
}
/* 🔒 를 켜면 「모두 완료」에 복습 학습지 1회 이상 완료가 들어 있어 🔁 조건은 저절로 충족된다 — 교사 확인(2026-09-21).
   그 줄을 흐리게 하고 이유를 적는다 (v4.2). 값은 그대로 저장되므로 🔒 를 끄면 예전 설정이 되살아난다 */
window.examSyncLockRow=function(){
  const on=!!document.getElementById('exam-limit-afterdone')?.checked;
  const row=document.getElementById('exam-require-review-row'), note=document.getElementById('exam-require-review-note');
  if(row) row.style.opacity=on?'.55':'';
  if(note) note.textContent=on?'↳ 🔒를 켜 두면 「모두 완료」에 복습 학습지 1회 이상 완료가 포함되므로 이 조건은 저절로 충족됩니다 — 따로 켤 필요가 없습니다.':'';
};
function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
window.examSelectGrade=function(g){ examSelGrade=g; renderExamSettings(); };
/* 🎁 추가 횟수 칸의 값 — 새 필드가 있으면 그것, v3.53 의 aiBonusAllDone 만 있으면 n=1·m=1, 없으면 끔(0)·최대 3 */
function _examBonusEvery(ex){ return ex?.aiBonusEvery!==undefined ? Math.max(0,+ex.aiBonusEvery||0) : (ex?.aiBonusAllDone?1:0); }
function _examBonusMax(ex){ return ex?.aiBonusMax!==undefined ? Math.max(1,+ex.aiBonusMax||1) : (ex?.aiBonusAllDone?1:3); }
function examUpdateCount(){
  const n=document.querySelectorAll('.exam-ws-cb:checked').length;
  const el=document.getElementById('exam-sel-count'); if(el) el.textContent=n+'개 선택';
}
window.examToggleUnit=function(unitId,on){
  document.querySelectorAll(`.exam-ws-cb[data-unit="${unitId}"]`).forEach(cb=>{ cb.checked=on; });
  examUpdateCount();
};
window.examSyncUnit=function(unitId){
  const cbs=[...document.querySelectorAll(`.exam-ws-cb[data-unit="${unitId}"]`)];
  const u=document.querySelector(`.exam-unit-cb[data-unit="${unitId}"]`);
  if(u) u.checked=cbs.length>0&&cbs.every(c=>c.checked);
  examUpdateCount();
};
window.examCheckAll=function(on){
  document.querySelectorAll('.exam-ws-cb,.exam-unit-cb').forEach(cb=>{ cb.checked=on; });
  examUpdateCount();
};
window.saveExamSettings=async function(g){
  if(scopedTeacher){ alert('시험 설정은 기본 교사만 저장할 수 있습니다.'); return; }
  const title=(document.getElementById('exam-title')?.value||'').trim();
  const start=document.getElementById('exam-start')?.value||'';
  const end=document.getElementById('exam-end')?.value||'';
  const aiLimit=Math.max(0,Math.min(10,parseInt(document.getElementById('exam-ailimit')?.value,10)||0));
  const wsIds=[...document.querySelectorAll('.exam-ws-cb:checked')].map(cb=>cb.value);
  const aiRequireReview=!!document.getElementById('exam-require-review')?.checked;
  const aiLimitAfterDone=!!document.getElementById('exam-limit-afterdone')?.checked;
  const aiBonusEvery=Math.max(0,Math.min(10,parseInt(document.getElementById('exam-bonus-every')?.value,10)||0));
  const aiBonusMax=Math.max(1,Math.min(10,parseInt(document.getElementById('exam-bonus-max')?.value,10)||1));
  if(!start||!end){ alert('시작일과 종료일을 모두 입력하세요.'); return; }
  if(aiBonusEvery>0 && !wsIds.some(id=>WORKSHEETS.find(w=>w.id===id)?.type==='review')
     && !confirm('추가 횟수를 켰지만 범위에 🔁 복습 학습지가 없어 추가 횟수가 생기지 않습니다(복습 학습지 완료 횟수로 세기 때문). 그대로 저장할까요?')) return;
  if(aiRequireReview && aiLimit>0 && !wsIds.some(id=>WORKSHEETS.find(w=>w.id===id)?.type==='review')
     && !confirm('복습 학습지 완료 조건을 켰지만 범위에 복습 학습지가 하나도 없습니다. 이대로면 조건이 항상 통과됩니다. 그대로 저장할까요?')) return;
  if(start>end){ alert('종료일이 시작일보다 앞설 수 없습니다.'); return; }
  if(!wsIds.length && !confirm('시험 범위 학습지를 하나도 고르지 않았습니다. 그대로 저장할까요?')) return;
  const prev=examConfig.exams[String(g)];
  if(prev && prev.start!==start && !confirm('시작일이 바뀌면 새 시험으로 보아 학생들의 AI 진단 횟수가 다시 생깁니다. 계속할까요?')) return;
  const msg=document.getElementById('exam-save-msg'); if(msg) msg.textContent='저장 중…';
  try{
    const entry={ title:title||(g+'학년 시험'), start, end, wsIds, aiLimit, aiRequireReview, aiLimitAfterDone, aiBonusEvery, aiBonusMax,
      updatedAt:new Date().toISOString(), updatedBy:tUser.email };
    // v3.53 의 aiBonusAllDone 은 지운다 — merge 라 그냥 두면 남는다 (index 는 새 필드가 있으면 새 필드만 본다)
    await setDoc(doc(db,"config","exam"),{ exams:{ [String(g)]:{ ...entry, aiBonusAllDone:deleteField() } } },{ merge:true });
    examConfig.exams[String(g)]=entry;
    if(msg) msg.textContent='✅ 저장했습니다. 학생 화면은 다음 접속(새로고침)부터 반영됩니다.';
    renderExamSettings();
  }catch(e){ console.error('[saveExamSettings]',e); alert('저장 실패: '+e.message+'\n(firestore.rules 에 config/exam 쓰기 규칙이 게시돼 있는지 확인)'); if(msg) msg.textContent=''; }
};
window.clearExamSettings=async function(g){
  if(scopedTeacher) return;
  if(!confirm(g+'학년 시험 설정을 지울까요? 학생 화면의 시험 범위 표시와 AI 진단 버튼이 사라집니다.')) return;
  try{
    await setDoc(doc(db,"config","exam"),{ exams:{ [String(g)]:deleteField() } },{ merge:true });
    delete examConfig.exams[String(g)];
    renderExamSettings();
  }catch(e){ alert('해제 실패: '+e.message); }
};

/* ══════════ 📢 학생 공지 보내기 (teacher v3.47) ══════════
   Firestore config/notices 문서 하나에 공지 배열을 둔다:
     { items:[ {id, title, body, until, grade:'all'|'1'|'2'|'3', createdAt, createdBy} ] }
   · 학생 index 는 이 문서를 구독해서 종 🔔 목록 맨 위(시험 공지 다음)에 띄운다 — 올리면 새로고침 없이 바로 뜬다.
   · until(표시 종료일)이 지나면 학생 화면에서 저절로 사라진다. 지운 공지는 즉시 사라진다.
   · id 는 학생의 '읽음' 기록 열쇠라 만들 때 한 번 정하고 바꾸지 않는다.
   · 저장은 기본 교사만 (firestore.rules: config/notices write = isBaseTeacher). 담당 교사는 보기만.
   · 본문에 HTML 은 넣지 않는다(학생 화면이 글자 그대로 이스케이프한다). 이모지는 괜찮다. */
let noticeConfig=null;   // config/notices 문서 내용 (items 배열)
async function loadNoticeConfig(){
  try{
    const snap=await getDoc(doc(db,"config","notices"));
    noticeConfig=snap.exists()?(snap.data()||{}):{};
    if(!Array.isArray(noticeConfig.items)) noticeConfig.items=[];
  }catch(e){ console.warn("[config/notices 로드 실패]",e.message); noticeConfig={items:[]}; }
}
function _todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function _plusDaysISO(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const NOTICE_GRADE_LABEL={all:'전체 학년','1':'1학년','2':'2학년','3':'3학년'};

  const items=[...noticeConfig.items].sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  let h=`<div class="pg-title">📢 학생 공지</div>
  <div class="pg-sub">${ro
    ?'공지는 기본 교사만 보낼 수 있습니다. 여기서는 확인만 가능합니다.'
    :'여기서 보낸 공지는 학생 화면의 종 🔔 목록 맨 위에 바로 뜹니다(새로고침 불필요). 표시 종료일이 지나면 저절로 사라집니다.'}</div>`;

        <input type="text" id="ntc-title" maxlength="60" placeholder="예: 다음 주 수행평가 안내" style="width:100%"></div>
      <div><label style="font-size:12px;color:var(--ink3);font-weight:600;display:block;margin-bottom:4px">대상</label>
        <select id="ntc-grade" style="width:100%;padding:7px 10px;border:1.5px solid var(--rule);border-radius:8px;font-family:inherit;font-size:13px">
          <option value="all">전체 학년</option><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option>
        </select></div>
      <div><label style="font-size:12px;color:var(--ink3);font-weight:600;display:block;margin-bottom:4px">표시 종료일</label>
        <input type="date" id="ntc-until" value="${_plusDaysISO(14)}" min="${today}" style="width:100%"></div>
    </div>
    <label style="font-size:12px;color:var(--ink3);font-weight:600;display:block;margin-bottom:4px">내용</label>
    <textarea id="ntc-body" rows="3" maxlength="400" placeholder="학생에게 보일 내용 (이모지 OK, HTML 태그는 글자로 보입니다)" style="width:100%;max-width:760px;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;font-family:inherit;font-size:13px;resize:vertical;box-sizing:border-box"></textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
      <button class="btn-sm btn-sm-accent" onclick="sendNotice()">📨 보내기</button>

    <div style="font-size:12px;color:var(--ink3);line-height:1.6;margin-top:10px">
      · 학생마다 ✓ 로 「확인함」 처리할 수 있고, 표시 종료일이 지나면 종 목록에서 사라집니다.<br>
      · 종 배지가 늘 켜져 있으면 진짜 채점 알림이 묻히니, <b>학생이 알아야 실제로 달라지는 것</b>만 보내 주세요.

      ${ro?'':`<button class="btn-sm" onclick="deleteNotice('${escapeAttr(n.id)}')" style="color:#b91c1c;flex-shrink:0">🗑 지우기</button>`}

  });

window.sendNotice=async function(){
  if(scopedTeacher){ alert('공지는 기본 교사만 보낼 수 있습니다.'); return; }
  const title=(document.getElementById('ntc-title')?.value||'').trim();
  const body=(document.getElementById('ntc-body')?.value||'').trim();
  const grade=document.getElementById('ntc-grade')?.value||'all';
  const until=document.getElementById('ntc-until')?.value||'';
  if(!title){ alert('제목을 입력하세요.'); return; }
  if(!body){ alert('내용을 입력하세요.'); return; }
  if(!until){ alert('표시 종료일을 정하세요.'); return; }
  if(until<_todayISO()){ alert('표시 종료일이 이미 지났습니다.'); return; }
  const who=NOTICE_GRADE_LABEL[grade]||'전체 학년';
  if(!confirm(`${who} 학생들의 종 🔔 에 지금 바로 뜹니다.\n\n제목: ${title}\n표시 종료: ${until}\n\n보낼까요?`)) return;
  const msg=document.getElementById('ntc-msg'); if(msg) msg.textContent='보내는 중…';
  try{
    await loadNoticeConfig();   // 다른 교사가 그 사이 올린 것을 덮어쓰지 않도록 최신 배열 위에 더한다
    const item={ id:'t-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),
      title, body, grade, until, createdAt:new Date().toISOString(), createdBy:tUser.email };
    const items=[...noticeConfig.items, item];
    await setDoc(doc(db,"config","notices"),{ items, updatedAt:item.createdAt },{ merge:true });
    noticeConfig.items=items;
    renderNotices();
  }catch(e){ console.error('[sendNotice]',e); alert('보내기 실패: '+e.message+'\n(firestore.rules 에 config/notices 쓰기 규칙이 게시돼 있는지 확인)'); if(msg) msg.textContent=''; }
};

/* ══════════ 🤖 AI 학습 분석 (학생 단위 — 전체 또는 대단원) ══════════
   정답률·오답(wrongInputs)을 학습지의 실제 문항 텍스트·정답과 함께 Apps Script
   웹앱(Gemini 중계)에 보내 학습 상태 요약을 받는다. 참고용 — 최종 판단은 교사가 한다. */
window._updateAIUnitSelVisibility=function(){

  if(sel) sel.style.display = scope==='unit' ? '' : 'none';
};
const AI_ANALYZE_SKIP_TYPES=new Set(['graph','link','pool_random']);
/* ══════════ 🕳 오답 경로 대조 (v3.48 · v3.51) ══════════
   두 출처의 오답 경로를 학생의 실제 오답과 맞춰 본다:
     · aiTraps   — edit 의 🤖 AI 검토가 문항만 보고 "학생이 이렇게 틀릴 것 같다"고 예상해 둔 것 (src 'ai')
     · freqTraps — 이 화면의 📊 빈출 오답 분석이 그 학습지를 푼 학생 전체의 **실제** 오답에서 찾은 원인 (src 'freq', students = 낸 학생 수)
   같은 오답이 양쪽에 있으면 하나로 합친다(src 'both' — 원인 설명은 실제 데이터로 분석한 freq 쪽을 쓴다).
   일치하면 hit:true 로 표시해 AI 에 함께 보내고(원인을 추측 대신 이 경로로 설명하게), 화면에는 우리가 직접 센 적중 횟수를 따로 보여 준다.
   문항에 둘 다 없으면 아무 일도 일어나지 않는다(예전과 동일). index 의 시험 대비 진단(v8.98)도 같은 규칙이다. */
/** 예상 오답·경로를 화면에 그릴 때 쓰는 escape — 답에 부등호(<)가 들어가면 태그로 읽혀 화면이 깨진다 */
function _te(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/** 답 비교용 정규화 — 공백·쉼표 제거, 전각/유니코드 기호를 보통 기호로, 대소문자 무시.
    느슨하게 맞추되 값 자체는 바꾸지 않는다(일치하면 ★, 아니면 그냥 참고용으로만 넘어간다). */
function _trapNorm(v){
  return String(v??'').trim().toLowerCase()
    .replace(/\s+|,/g,'')
    .replace(/[−–—]/g,'-').replace(/[×✕]/g,'*').replace(/[÷]/g,'/')
    .replace(/[≤]/g,'<=').replace(/[≥]/g,'>=')
    .replace(/^\+/,'');
}
/** 객관식 오답 기록은 0부터 세는 보기 번호("0,2")다 — 예상 오답·빈출 오답은 사람이 읽는 1부터 세는 번호("1,3")로
    적으므로 맞춰서 비교한다 (v3.51. 그전엔 객관식은 한 번도 일치하지 않았다). 숫자·쉼표만으로 된 값만 바꾼다 */
function _multiNums(raw){
  const s=String(raw??'').trim();
  if(!s || !/^\d+(,\d+)*$/.test(s)) return s;
  return s.split(',').map(n=>String(+n+1)).join(',');
}
/** 학생 오답을 대조·표시용 형태로 — 객관식은 1부터 세는 보기 번호, 나머지는 그대로 */
function _ansForCompare(q, raw){ return q?.type==='multi' ? _multiNums(raw) : String(raw??''); }
/** 학생 답을 AI 에 보낼 글로 — 객관식은 "1,3번 (보기 글)" */
function _studentAnsText(q, raw){
  if(q?.type!=='multi') return String(raw??'');
  const nums=_multiNums(raw);
  if(!/^\d+(,\d+)*$/.test(nums)) return String(raw??'');
  const texts=nums.split(',').map(n=>(q.options||[])[+n-1]).filter(t=>t!=null);
  return nums+'번'+(texts.length?` (${texts.join(' / ')})`:'');
}
/** 이 문항의 오답 경로 목록(예상 + 빈출, 같은 오답은 합침 · 상한 없음) + 학생 답과 일치하는지 */
function _trapsFor(q, studentAns){
  const ai=q.aiTraps||[], fq=q.freqTraps||[];
  if(!ai.length && !fq.length) return [];
  const sa=_trapNorm(_ansForCompare(q, studentAns));
  const out=[], byKey=new Map();
  ai.forEach(t=>{ const o={ wrong:String(t.wrong??''), path:String(t.path??''), label:String(t.label??''), src:'ai' }; out.push(o); byKey.set(_trapNorm(o.wrong), o); });
  fq.forEach(t=>{
    const key=_trapNorm(t.wrong); const prev=byKey.get(key);
    if(prev){ prev.src='both'; if(t.path) prev.path=String(t.path); if(t.label) prev.label=String(t.label); prev.students=+t.students||0; return; }
    const o={ wrong:String(t.wrong??''), path:String(t.path??''), label:String(t.label??''), src:'freq', students:+t.students||0 };
    out.push(o); byKey.set(key, o);
  });
  out.forEach(o=>{ o.hit = sa!=='' && _trapNorm(o.wrong)===sa; });
  return out;
}
/** 적중한 경로를 이름(label)별로 묶어 센다 — 화면 표시용. [{label, path, count, answers:[...], peers}]
    peers = 그 답을 실제로 낸 학생 수(빈출 오답 분석 기준, 가장 큰 값) — 학급에 흔한 실수인지 함께 보여 준다 */
function _countTrapHits(worksheets){
  const map=new Map();
  worksheets.forEach(w=>(w.wrongItems||[]).forEach(it=>(it.traps||[]).forEach(t=>{
    if(!t.hit) return;
    const key=t.label||t.path;
    const cur=map.get(key)||{label:t.label||'(이름 없음)', path:t.path, count:0, answers:[], peers:0};
    cur.count++; if(cur.answers.length<5) cur.answers.push(t.wrong);
    if((t.src==='freq'||t.src==='both') && (+t.students||0)>cur.peers) cur.peers=+t.students||0;
    map.set(key,cur);
  })));
  return [...map.values()].sort((a,b)=>b.count-a.count);
}

/* ══════════ 📊 빈출 오답 분석 (v3.51, 학습지 단위) ══════════
   이 학습지를 푼 학생 전체의 오답 기록(perQuestion[].wrongInputs)에서 **여러 학생이 낸 틀린 답**을 문항마다 모아
   Apps Script 웹앱(Gemini 중계, action 'analyzeWrongAnswers')에 보내고, 답마다 왜 그렇게 틀렸는지(path)·짧은 이름(label)과
   학습지 전체 요약·수업에서 짚어 줄 것(teachingPoints)을 받는다. edit 의 🤖 AI 검토(예상 오답)가 "문항만 보고 추측"이라면
   이것은 "실제 데이터로 확인"이다 — 둘은 서로 보완한다(출제자가 예상해 둔 오답이 있으면 함께 보내 같은 실수엔 같은 이름을 쓰게 한다).
   · 기록은 학습지 문서(curriculum/{wsId})에 wrongAnalysis = { at, count, students, by, summary, teachingPoints,
       items:[{idx, qid, wrong, students, path, label, on, at}] } 로 저장한다(edit 의 aiReview 와 같은 꼴).
   · 교사가 체크한(on) 것만 문항에 freqTraps:[{wrong, path, label, students}] 로 저장되어, 이 화면의 🤖 AI 학습 분석과
     학생의 📝 시험 대비 진단(index)이 예상 오답(aiTraps)과 **함께** 오답 대조에 쓴다(_trapsFor).
   · 새로 분석하면 원인 설명은 새 결과로 갱신하고(데이터가 늘었으니), 체크를 풀어 둔 오답은 계속 꺼진 채로 둔다.
     더는 빈출이 아닌 오답(기록 삭제 등)은 빠진다. AI 가 분석을 못 돌려준 오답은 이전 설명이 있으면 그것을 유지한다.
   · 저장은 학습지 문서를 **다시 읽어** 최신 문항에 붙인다(edit 가 그새 문항을 고쳤을 수 있다) — 문항은 id 로 맞춘다.
     edit v3.39 도 저장할 때 wrongAnalysis·freqTraps 는 Firestore 최신 값을 따르므로 서로 덮어쓰지 않는다.
   · graph·link·pool_random 유형과 단계형(오답 기록을 남기지 않는다)은 자연히 대상이 아니다. "(빈칸)" 제출은 원인 분석 대상이 아니라 뺀다. */
const FREQ_MIN_STUDENTS=2;   // 이 수 이상의 학생이 낸 오답만 "빈출"로 본다
const FREQ_MAX_PER_Q=5;      // 문항당 AI 에 보내는 빈출 오답 수 (학생 수 많은 순)
/** 학습지의 문항별 오답 집계 — { students, byQ:{[qid]:[{wrong, students, blank}]} } (학생 수 많은 순)
    같은 학생이 같은 답(정규화 기준)을 여러 번 내도 1명으로 센다. wrong 은 처음 본 형태(객관식은 1부터 세는 보기 번호).
    📊 문항별 난이도 표의 「빈출 오답」 칸도 이 집계를 쓴다. */
function _freqWrongStats(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId); const byQ={}; const stu=new Set();
  const qById=new Map((ws?.questions||[]).map(q=>[q.id,q]));
  Object.entries(allData).forEach(([uid,d])=>{
    const r=d[wsId]; if(!r?.perQuestion) return;
    stu.add(uid);
    Object.entries(r.perQuestion).forEach(([qid,v])=>{
      if(!Array.isArray(v.wrongInputs) || !v.wrongInputs.length) return;
      const q=qById.get(qid);
      const m=byQ[qid]||(byQ[qid]=new Map());
      v.wrongInputs.forEach(w=>{
        const raw=String(w??'').trim();
        const blank = raw==='' || raw==='(빈칸)';
        const shown = blank ? '(빈칸)' : _ansForCompare(q, raw).slice(0,40);
        const key = blank ? '(빈칸)' : _trapNorm(shown);
        const cur=m.get(key)||{wrong:shown, uids:new Set(), blank};
        cur.uids.add(uid); m.set(key,cur);
      });
    });
  });
  const out={};
  Object.entries(byQ).forEach(([qid,m])=>{
    out[qid]=[...m.values()].map(x=>({wrong:x.wrong, students:x.uids.size, blank:x.blank})).sort((a,b)=>b.students-a.students);
  });
  return { students:stu.size, byQ:out };
}
/** AI 에 보낼 정답 요약 — edit 의 _aiAnswerSummary 와 같은 꼴 */
function _aiAnswerSummaryT(q){
  if(q.type==='multi'){
    const opts=(q.options||[]).map((o,i)=>`${i+1}.${o}`).join(' / ');
    return `보기: ${opts} / 정답 번호: ${(q.answer||[]).map(i=>i+1).join(',')}`;
  }
  if(q.type==='step3') return (q.steps||[]).map((s,i)=>`${i+1}단계 정답:${s.answer}`).join(' / ');
  return q.answer!=null && q.answer!=='' ? String(q.answer) : null;
}
/** 분석 대상 — 유형 제외 + 빈출 오답(빈칸 제외, FREQ_MIN_STUDENTS 명 이상)이 있는 문항만.
    [{idx, qid, type, text, answer, wrongs:[{wrong,students}], predicted:[{wrong,path,label}]}] */
function _freqQuestions(ws, stats){
  return (ws.questions||[]).map((q,i)=>{
    if(AI_ANALYZE_SKIP_TYPES.has(q.type)) return null;
    const wrongs=(stats.byQ[q.id]||[]).filter(w=>!w.blank && w.students>=FREQ_MIN_STUDENTS).slice(0,FREQ_MAX_PER_Q).map(w=>({wrong:w.wrong, students:w.students}));
    if(!wrongs.length) return null;
    return { idx:i, qid:q.id, type:q.type, text:String(q.text||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').slice(0,400),
      answer:_aiAnswerSummaryT(q), wrongs,
      predicted:(q.aiTraps||[]).map(t=>({wrong:String(t.wrong??''), path:String(t.path??''), label:String(t.label??'')})) };
  }).filter(Boolean);
}
let _waRec=null, _waWsId=null, _waSaveTimer=null;
window.analyzeWrongAnswersWithAI=async function(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId); if(!ws) return;
  _waWsId=wsId;
  const t=document.getElementById('wa-title'); if(t) t.textContent=`🤖 빈출 오답 분석 — ${ws.title||wsId}`;
  const m=document.getElementById('wa-modal'); if(m) m.style.display='flex';
  const saved=ws.wrongAnalysis;
  if(saved && Array.isArray(saved.items)){ _renderWrongAnalysis(wsId, saved, {saved:true}); return; }   // 저장된 분석이 있으면 그것부터
  await _runWrongAnalysis(wsId);
};
/** 🔄 새로 분석하기 */
window.rerunWrongAnalysis=async function(){ if(_waWsId) await _runWrongAnalysis(_waWsId); };
async function _runWrongAnalysis(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId); const body=document.getElementById('wa-body'); if(!ws||!body) return;
  const stats=_freqWrongStats(wsId);
  const qs=_freqQuestions(ws, stats);
  const prev=(ws.wrongAnalysis && Array.isArray(ws.wrongAnalysis.items)) ? ws.wrongAnalysis : null;
  const back=prev?`<div style="margin-top:10px"><button class="btn-sm" onclick="analyzeWrongAnswersWithAI('${wsId}')">저장된 분석 보기</button></div>`:'';
  if(!qs.length){
    body.innerHTML=`<div style="font-size:13px;color:var(--ink3)">아직 분석할 빈출 오답이 없습니다 — 같은 틀린 답을 <b>${FREQ_MIN_STUDENTS}명 이상</b>이 낸 문항이 없습니다 (학생 ${stats.students}명의 기록 기준).</div>`+back;
    return;
  }
  body.innerHTML=`🤖 분석 중… 문항 ${qs.length}개 · 빈출 오답 ${qs.reduce((n,q)=>n+q.wrongs.length,0)}개 (몇십 초 걸릴 수 있습니다)`;
  try{
    const res=await fetch(AI_WEBAPP_URL,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ token:AI_WEBAPP_TOKEN, action:'analyzeWrongAnswers', wsTitle:ws.title||'', students:stats.students,
        questions: qs.map(q=>({idx:q.idx, type:q.type, text:q.text, answer:q.answer, wrongs:q.wrongs, predicted:q.predicted})) }) });
    const out=await res.json();
    if(!out||!out.ok) throw new Error(out?.error==='unknown action' ? 'AI 서버에 아직 이 기능이 없습니다 — AI기능 Apps Script 를 새 버전으로 배포해 주세요' : (out?.error||'서버 응답 오류'));
    const rec=_mergeWrongAnalysis(prev, out, qs, stats);
    await _saveWrongAnalysis(wsId, rec);
    _renderWrongAnalysis(wsId, rec, {fresh:true, align:out.align||{}});
  }catch(e){
    body.innerHTML='❌ 분석 실패: '+_te(e.message)+back;
  }
}
/** 새 결과를 기록으로 — 지금 빈출인 오답마다 항목 하나: AI 가 준 설명(없으면 이전 설명 유지), 체크 상태는 이전 것을 잇는다 */
function _mergeWrongAnalysis(prev, out, qs, stats){
  const now=new Date().toISOString();
  const ai=new Map((out.items||[]).filter(t=>t&&t.path).map(t=>[t.idx+'|'+_trapNorm(t.wrong), t]));
  const old=new Map((prev?.items||[]).map(t=>[t.qid+'|'+_trapNorm(t.wrong), t]));
  const items=[]; let analyzed=0, kept=0, missing=0;
  qs.forEach(q=>q.wrongs.forEach(w=>{
    const key=_trapNorm(w.wrong);
    const a=ai.get(q.idx+'|'+key), o=old.get(q.qid+'|'+key);
    let path, label, at;
    if(a){ path=String(a.path).slice(0,200); label=String(a.label||'').slice(0,20); at=now; analyzed++; }
    else if(o){ path=o.path; label=o.label; at=o.at||''; kept++; }
    else { missing++; return; }
    items.push({ idx:q.idx, qid:q.qid, wrong:w.wrong, students:w.students, path, label, on: o ? o.on!==false : true, at });
  }));
  return { at:now, count:(prev?.count||0)+1, students:stats.students, by:tUser?.email||'', summary:String(out.summary||''),
    teachingPoints:(out.teachingPoints||[]).map(String).filter(Boolean), items, _analyzed:analyzed, _kept:kept, _missing:missing };
}
/** 기록을 학습지 문서에 저장하고, 문항의 freqTraps(대조용)를 기록의 on 인 것으로 다시 만든다.
    문서를 다시 읽어 최신 문항에 붙인다(edit 가 그새 고쳤을 수 있다) — 문항은 id 로 맞춘다 */
async function _saveWrongAnalysis(wsId, rec){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  const stored={ at:rec.at, count:rec.count, students:rec.students, by:rec.by||'', summary:rec.summary||'', teachingPoints:rec.teachingPoints||[], items:rec.items };
  const byQid=new Map();
  rec.items.filter(t=>t.on).forEach(t=>{ if(!byQid.has(t.qid)) byQid.set(t.qid,[]); byQid.get(t.qid).push({ wrong:t.wrong, path:t.path, label:t.label||'', students:t.students||0 }); });
  let fresh=null;
  try{ fresh=(await getDoc(doc(db,'curriculum',wsId))).data()||null; }
  catch(e){ console.warn('[빈출 오답 분석] 학습지 다시 읽기 실패 — 메모리의 문항으로 저장', e.message); }
  const baseQs=(fresh?.questions)||(ws?.questions)||[];
  const newQs=baseQs.map(q=>{ const c={...q}; const l=byQid.get(q.id); if(l?.length) c.freqTraps=l; else delete c.freqTraps; return c; });
  await setDoc(doc(db,'curriculum',wsId), { wrongAnalysis:stored, questions:newQs }, { merge:true });
  if(ws){ ws.wrongAnalysis=stored; ws.questions=newQs; }
}
/** 체크박스 — 바꾸면 잠시 뒤 자동 저장 */

function _fmtAtT(iso){ return iso ? String(iso).slice(0,16).replace('T',' ') : ''; }
/** 모달 본문 — 저장된 기록이든 방금 받은 결과든 같은 모양으로 그린다 */
function _renderWrongAnalysis(wsId, rec, opts={}){

    : `저장된 분석 · 마지막 분석 ${_fmtAtT(rec.at)} (${rec.count}회 · 학생 ${rec.students}명의 기록${rec.by?` · ${_te(rec.by)}`:''})`;

  const alignNote=(al.fixed||al.dropped)

  // 지금 집계에는 있는데 기록에 없는 빈출 오답 — 「아직 분석 안 됨」으로 함께 보여 준다(새 학생이 풀어 새로 생긴 것 등)
  const nowQs=_freqQuestions(ws, _freqWrongStats(wsId));
  const recKeys=new Set(rec.items.map(t=>t.qid+'|'+_trapNorm(t.wrong)));
  const byQ=new Map();

  nowQs.forEach(q=>q.wrongs.forEach(w=>{
    if(recKeys.has(q.qid+'|'+_trapNorm(w.wrong))) return;
    if(!byQ.has(q.qid)) byQ.set(q.qid,[]); byQ.get(q.qid).push({qid:q.qid, idx:q.idx, wrong:w.wrong, students:w.students, _na:true});
  }));

window.repairPerQuestion=async function(){
  // 커리큘럼 유효 문항 ID 목록 구축
  const validIds={};  // wsId → Set of valid qIds
  WORKSHEETS.forEach(ws=>{
    validIds[ws.id]=new Set((ws.questions||[]).map(q=>q.id));
  });

  // 학생 기록에서 고아 키(orphan) 탐색
  const toRepair=[];
  for(const [uid,d] of Object.entries(allData)){
    for(const [wsId,rec] of Object.entries(d)){
      if(!rec?.perQuestion) continue;
      const valid=validIds[wsId]; if(!valid) continue;
      const orphanKeys=Object.keys(rec.perQuestion).filter(k=>!valid.has(k));
      if(!orphanKeys.length) continue;
      // 커리큘럼에 있지만 학생 기록에 없는 키
      const missingKeys=[...valid].filter(k=>!rec.perQuestion[k]);
      toRepair.push({uid,wsId,orphanKeys,missingKeys,rec});
    }
  }

  if(!toRepair.length){ alert('복구할 기록이 없습니다.\n모든 학생 기록의 문항 ID가 커리큘럼과 일치합니다.'); return; }

  const preview=toRepair.slice(0,5).map(({uid,wsId,orphanKeys})=>
    `• ${uid.split('@')[0]} / ${wsId}: 고아키 ${orphanKeys.length}개`).join('\n');
  if(!confirm(`문항 ID 불일치 기록 ${toRepair.length}건 발견:\n\n${preview}\n${toRepair.length>5?`...외 ${toRepair.length-5}건`:''}\n\n고아 키를 순서에 맞는 커리큘럼 ID로 매핑합니다.\n계속할까요?`)) return;

  let ok=0, skipped=0, errors=[];
  for(const {uid,wsId,orphanKeys,missingKeys,rec} of toRepair){
    try{
      const newPQ={...rec.perQuestion};
      const ws=WORKSHEETS.find(w=>w.id===wsId);

      if(missingKeys.length===0){
        // 신키가 이미 있음 → 구키만 삭제
        orphanKeys.forEach(k=>delete newPQ[k]);
      } else if(orphanKeys.length===missingKeys.length){
        // 구키↔신키 1:1 매핑 (타임스탬프 순 → 문항 순)
        orphanKeys.sort();
        const orderedMissing=missingKeys.sort((a,b)=>{
          const ia=(ws?.questions||[]).findIndex(q=>q.id===a);
          const ib=(ws?.questions||[]).findIndex(q=>q.id===b);
          return ia-ib;
        });
        orphanKeys.forEach((old,i)=>{
          newPQ[orderedMissing[i]]=newPQ[old];
          delete newPQ[old];
        });
      } else {
        // 그래도 불일치면 건너뜀
        skipped++; continue;
      }
      await updateDoc(doc(db,'records',uid,'worksheets',wsId),{perQuestion:newPQ});
      rec.perQuestion=newPQ; ok++;
    }catch(e){ errors.push(`${uid}/${wsId}: ${e.message}`); }
  }
  alert(`✅ 복구 완료: ${ok}건\n건너뜀(키 수 불일치): ${skipped}건`+(errors.length?`\n⚠️ 오류:\n${errors.slice(0,3).join('\n')}`:''));
  navigate(selView);
};
window.migrateQuestionIds=async function(){
  // ID가 올바른 순번(q01,q02...)이 아닌 문항이 있는 학습지 탐색
  const toMigrate=WORKSHEETS.filter(ws=>(ws.questions||[]).some((q,i)=>{
    const expected=`q${String(i+1).padStart(2,'0')}`;
    return q.id!==expected;
  }));
  if(!toMigrate.length){ alert('모든 문항 ID가 이미 올바른 순번입니다.'); return; }
  const preview=toMigrate.map(ws=>`• ${ws.title} (${ws.questions.length}개 문항)`).join('\n');
  if(!confirm(`문항 ID를 q01, q02... 형식으로 변환합니다:\n\n${preview}`)) return;
  let wsOk=0, recOk=0, errors=[];
  for(const ws of toMigrate){
    try{
      const idMap={};
      ws.questions.forEach((q,i)=>{ idMap[q.id]=`q${String(i+1).padStart(2,'0')}`; });
      const newQs=ws.questions.map(q=>({...q,id:idMap[q.id]||q.id}));
      await setDoc(doc(db,'curriculum',ws.id),{questions:newQs},{merge:true});
      ws.questions=newQs; wsOk++;
      for(const [uid,d] of Object.entries(allData)){
        const rec=d[ws.id]; if(!rec?.perQuestion) continue;
        const newPQ={};
        for(const [oid,val] of Object.entries(rec.perQuestion))
          newPQ[idMap[oid]||oid]=val;
        await updateDoc(doc(db,'records',uid,'worksheets',ws.id),{perQuestion:newPQ});
        rec.perQuestion=newPQ; recOk++;
      }
    }catch(e){ errors.push(e.message); }
  }
  alert(`✅ 완료\n학습지: ${wsOk}개, 학생기록: ${recOk}개`+(errors.length?`\n⚠️ ${errors.join('\n')}`:''));
  navigate(selView);
};

window.migrateWsIds=async function(){
  // 담당 학급만 보는 계정은 allData에 자기 학급 학생만 담겨 있다(loadAll의 scopeEmails 필터).
  // 그 상태로 돌리면 curriculum ID는 전체가 바뀌는데 다른 학급 학생 기록은 옛 ID에 남아
  // 통째로 유실된 것처럼 보인다 — 전체 조회 권한이 있는 계정에서만 실행한다.
  if(scopeEmails){
    alert('이 작업은 전체 학생 기록을 함께 옮겨야 해서, 담당 학급만 조회하는 계정에서는 실행할 수 없습니다.\n마스터 계정으로 실행해 주세요.');
    return;
  }
  const byUnit={};
  WORKSHEETS.forEach(ws=>{ (byUnit[ws.unitId||'etc']=byUnit[ws.unitId||'etc']||[]).push(ws); });
  const changes=[];
  for(const [unitId,list] of Object.entries(byUnit)){
    list.sort((a,b)=>(a.order??99)-(b.order??99));
    let seq=0;
    list.forEach(ws=>{
      // 복습 학습지는 번호를 먹지 않고 항상 -FN 고정 (edit.html의 ID 정리와 같은 규칙).
      // 예전엔 복습 학습지도 번호를 차지해서 뒤 학습지 번호가 한 칸씩 밀렸다.
      const newId = ws.type==='review'
        ? `ws-${unitId}-FN`
        : (()=>{ seq++; return `ws-${unitId}-${String(seq).padStart(2,'0')}`; })();
      if(ws.id!==newId) changes.push({ws,newId});
    });
  }
  if(!changes.length){ alert('모든 학습지 ID가 순서와 일치합니다.'); return; }
  const preview=changes.map(({ws,newId})=>`• ${ws.id} → ${newId}`).join('\n');
  if(!confirm(`학습지 ID를 표시 순서 기준으로 변환합니다.\n학생 기록도 함께 옮깁니다 — 끝날 때까지 새로고침하지 마세요.\n\n${preview}\n\n진행할까요?`)) return;

  // setDoc/deleteDoc을 수백 번 연달아 부르면 Firestore 쓰기 스트림이 막힌다
  // (resource-exhausted: maximum allowed queued writes). writeBatch로 모아 커밋한다.
  // 건수뿐 아니라 크기도 봐야 한다 — 커밋 요청 하나의 한도가 11,534,336바이트라
  // 문항·이미지가 많은 학습지는 몇 개만 모여도 "Request payload size exceeds the limit"이 난다.
  function makeBatcher(){
    const MAX_OPS=300, MAX_BYTES=8*1024*1024;
    let batch=writeBatch(db), count=0, bytes=0;
    const sizeOf=data=>{ try{ return new TextEncoder().encode(JSON.stringify(data)).length; }catch(e){ return 0; } };
    const flush=async()=>{ if(!count) return; await batch.commit(); batch=writeBatch(db); count=0; bytes=0; };
    const add=async(apply,size)=>{
      if(count>0 && (count+1>MAX_OPS || bytes+size>MAX_BYTES)) await flush();
      apply(); count++; bytes+=size;
    };
    return {
      set:async(ref,data)=>add(()=>batch.set(ref,data), sizeOf(data)),
      delete:async(ref)=>add(()=>batch.delete(ref), 200),
      flush
    };
  }

  const tempPfx='ws-tmp-'+Date.now()+'-';
  let ok=0, errors=[];
  try{
    const bw=makeBatcher();
    for(const {ws} of changes){
      const tmpId=tempPfx+ws.id;
      const {_tmpId:_,...wsData}=ws;
      await bw.set(doc(db,'curriculum',tmpId),{...wsData,id:tmpId});
      await bw.delete(doc(db,'curriculum',ws.id));
      for(const [uid,d] of Object.entries(allData)){
        const rec=d[ws.id]; if(!rec) continue;
        await bw.set(doc(db,'records',uid,'worksheets',tmpId),rec);
        await bw.delete(doc(db,'records',uid,'worksheets',ws.id));
        d[tmpId]=rec; delete d[ws.id]; REC_WS.set(rec, tmpId);
      }
      ws._tmpId=tmpId;
    }
    await bw.flush();
  }catch(e){ errors.push(`1단계 중단: ${e.message} — 임시 ID(ws-tmp-…)에 남아 있을 수 있으니 다시 실행하세요`); }

  try{
    const bw=makeBatcher();
    for(const {ws,newId} of changes){
      if(!ws._tmpId) continue;
      const {_tmpId:_,...wsData}=ws;
      await bw.set(doc(db,'curriculum',newId),{...wsData,id:newId});
      await bw.delete(doc(db,'curriculum',ws._tmpId));
      for(const [uid,d] of Object.entries(allData)){
        const rec=d[ws._tmpId]; if(!rec) continue;
        // 기록 안의 worksheetId도 새 ID로 맞춘다 — 예전엔 옛 ID가 그대로 남아
        // 문서 ID와 필드 값이 어긋난 채 쌓였다
        const moved={...rec, worksheetId:newId};
        await bw.set(doc(db,'records',uid,'worksheets',newId),moved);
        await bw.delete(doc(db,'records',uid,'worksheets',ws._tmpId));
        d[newId]=moved; delete d[ws._tmpId]; REC_WS.set(moved, newId);
      }
      ws.id=newId; delete ws._tmpId; ok++;
    }
    await bw.flush();
  }catch(e){ errors.push(`2단계 중단: ${e.message} — 임시 ID(ws-tmp-…)에 남아 있을 수 있으니 다시 실행하세요`); }

  alert(`✅ 완료: ${ok}개 변환`+(errors.length?`\n\n⚠️ ${errors.join('\n')}`:''));
  navigate('overview');
};


/* ── 시험지 재채점 ──
   채점 함수는 공용 grading.js(judgeAnswer)를 사용한다. HTML에 복사하지 말 것. */
/* 한 문항 채점: index의 endExamAndGrade와 동일한 분기 */
function regradeOne(q, ans, tokens){
  return judgeAnswer(q, ans, tokens);   // grading.js 공용 판정 (factorMode 토큰 포함)
}

/* 재채점 미리보기 계산 (쓰기 없음) */
function buildRegradePlan(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  const plan=[];
  if(!ws) return plan;
  for(const [uid,d] of Object.entries(allData)){
    const rec=d[wsId]; if(!rec?.perQuestion) continue;
    const changes=[]; let before=0, after=0, maxScore=0, lost=0;
    let noAns=0;   // 일반 학습지에서 저장된 답안이 없어 재채점할 수 없는 문항 수
    (ws.questions||[]).forEach(q=>{
      const v=rec.perQuestion[q.id]; if(!v) return;
      const isExamQ = v.examAnswer!==undefined || v.maxScore!==undefined;
      // 시험지는 examAnswer, 일반 학습지는 lastAnswer(index v8.27부터 저장)를 근거로 재채점
      const stored = isExamQ ? v.examAnswer : v.lastAnswer;
      const tokens = isExamQ ? v.examAnswerTokens : v.lastAnswerTokens;
      const mx=(q.score??v.maxScore??1);
      if(isExamQ){ maxScore+=mx; before+=(v.score||0); }
      const _empty = stored===null||stored===undefined||stored===''
                   ||(Array.isArray(stored)&&!stored.length);
      if(_empty){
        // 시험지: 제출 기록은 있는데 답안이 비었으면 '유실' — 근거 없이 오답 확정하지 않고 현재 값 유지
        if(isExamQ && v.examSubmittedAt){ lost++; after+=(v.score||0); return; }
        // 일반 학습지: v8.27 이전 기록은 답안 자체가 없어 재채점 불가 (건너뜀)
        if(!isExamQ && v.correct!==undefined) noAns++;
        if(isExamQ) after+=(v.score||0);
        return;
      }
      const nc=regradeOne(q, stored, tokens);
      const ns=(nc===true)?mx:0;
      if(isExamQ) after+=ns;
      const oldC=(v.correct===undefined?null:v.correct);
      // 일반 학습지는 점수 개념이 없어 correct만 비교
      const scoreChanged = isExamQ && (v.score||0)!==ns;
      if(oldC!==nc || scoreChanged) changes.push({qid:q.id, from:oldC, to:nc, fromScore:v.score||0, toScore:ns, isExamQ});
    });
    if(changes.length||lost) plan.push({uid, name:rec.studentName||uid, changes, before, after, maxScore, lost, noAns});
  }
  return plan;
}

/* 유실 분포 리포트 — 콘솔에서 lostReport() 또는 lostReport('학습지 제목 일부')
   (allData는 모듈 내부 변수라 외부 스크립트로는 접근 불가 → 여기 내장.
    유실 판정은 재채점(buildRegradePlan)과 동일: 제출 시각은 있는데 답안이 비어 있음) */
window.lostReport=function(nameFilter){
  if(!Object.keys(allData).length){
    console.warn('⏳ 학생 데이터가 아직 로드되지 않았습니다. 화면에 학생 기록이 표시된 후 다시 실행하세요.');
    return '데이터 로드 전';
  }
  const rows=[];
  const typeCount={}, typeQids={};   // 문항 유형별 유실 집계 (특정 유형 캡처 누락 진단용)
  for(const [uid,d] of Object.entries(allData)){
    for(const [wsId,rec] of Object.entries(d)){
      const ws=WORKSHEETS.find(w=>w.id===wsId);
      if(!ws || !rec?.perQuestion) continue;
      if(nameFilter && !(ws.title||'').includes(nameFilter)) continue;
      let lost=0, answered=0, none=0, total=0;
      const lostQids=[];
      (ws.questions||[]).forEach(q=>{
        if(q.type==='link') return;
        const v=rec.perQuestion[q.id];
        const isExamQ = v && (v.examAnswer!==undefined || v.maxScore!==undefined);
        if(!isExamQ) return;   // 재채점과 동일하게 시험 형식 기록만 집계
        total++;
        const empty=v.examAnswer===null||v.examAnswer===undefined||v.examAnswer===''
                    ||(Array.isArray(v.examAnswer)&&!v.examAnswer.length);
        if(empty && v.examSubmittedAt){
          lost++; lostQids.push(q.id);
          const qt=q.type||'?';
          typeCount[qt]=(typeCount[qt]||0)+1;
          (typeQids[qt]=typeQids[qt]||new Set()).add(wsId+'/'+q.id);
        }
        else if(!empty) answered++;
        else none++;
      });
      if(lost>0){
        rows.push({
          학습지: ws.title||wsId,
          학생: rec.studentName||uid,
          유실: lost, 정상답안: answered, 미응답: none, 집계문항: total,
          유실비율: total?Math.round(lost/total*100)+'%':'-',
          판정: (total&&lost>=total*0.7) ? '🔴 전면 유실(구버전 탭 덮어쓰기)'
               : lost<=2 ? '🟡 빈 답 제출 가능성' : '🟠 부분 유실',
          마지막저장: rec.lastUpdated||'-',
          유실문항: lostQids.slice(0,8).join(',')+(lostQids.length>8?'…':''),
        });
      }
    }
  }
  rows.sort((a,b)=>b.유실-a.유실);
  const totalLost=rows.reduce((s,r)=>s+r.유실,0);
  console.log('%c=== 유실 분포 리포트 ===','font-size:14px;font-weight:bold;color:#b91c1c');
  console.log(`유실 총 ${totalLost}개 · 학생기록 ${rows.length}건 · 🔴전면 ${rows.filter(r=>r.판정.startsWith('🔴')).length} / 🟠부분 ${rows.filter(r=>r.판정.startsWith('🟠')).length} / 🟡빈답추정 ${rows.filter(r=>r.판정.startsWith('🟡')).length}`);
  console.table(rows);
  if(Object.keys(typeCount).length){
    console.log('%c── 문항 유형별 유실 (유형에 몰려 있으면 해당 유형의 답안 캡처 문제) ──','font-weight:bold');
    console.table(Object.entries(typeCount).map(([유형,건수])=>({
      유형, 유실건수:건수, '해당 문항 수':typeQids[유형].size,
      비고: 유형==='equation' ? 'v8.21 이전: 시험지에서 키패드 답안이 빈 값으로 저장됨(복구 불가)'
          : 유형==='step3' ? 'v8.20 이전: 시험지에서 답안 캡처 자체가 안 됨(복구 불가)' : ''
    })));
  }
  return `${totalLost}개 (🔴=재시험/개별판정 필요, 🟡=무응답 처리 무방)`;
};

window.regradeWS=async function(wsId){
  const ws=WORKSHEETS.find(w=>w.id===wsId);
  if(!ws){ alert('학습지를 찾을 수 없습니다.'); return; }
  if(ws.type!=='exam' && !confirm('시험지가 아닌 학습지입니다.\n시험지 문항(제출 답안이 저장된 문항)만 재채점됩니다. 계속할까요?')) return;

  let plan;
  try{ plan=buildRegradePlan(wsId); }
  catch(e){ alert('재채점 계산 실패: '+e.message); console.error(e); return; }

  const totalCh=plan.reduce((s,p)=>s+p.changes.length,0);
  const totalLost=plan.reduce((s,p)=>s+(p.lost||0),0);
  if(!totalCh){
    alert('✅ 재채점해도 바뀌는 채점 결과가 없습니다.'
      + (totalLost?`\n\n⚠️ 다만 답안이 유실된 문항이 ${totalLost}개 있습니다.\n(제출 기록은 있으나 답안이 비어 있어 자동 채점 불가 — 개별 확인 필요)`:''));
    return;
  }

  const lines=plan.filter(p=>p.changes.length).slice(0,12).map(p=>{
    const mk=v=>v===true?'⭕':v===false?'❌':'📝';
    const det=p.changes.slice(0,4).map(c=>`${c.qid}: ${mk(c.from)}→${mk(c.to)}`).join(', ');
    return `• ${p.name}: ${p.before}점 → ${p.after}점 (${p.changes.length}문항)\n    ${det}${p.changes.length>4?' …':''}`;
  }).join('\n');
  const nChanged=plan.filter(p=>p.changes.length).length;
  if(!confirm(`📝 "${ws.title}" 재채점\n\n대상 학생 ${nChanged}명 · 변경 문항 ${totalCh}개\n\n${lines}${nChanged>12?`\n…외 ${nChanged-12}명`:''}`
    + (totalLost?`\n\n⚠️ 답안 유실 ${totalLost}개 문항은 건드리지 않습니다 (개별 확인 필요)`:'')
    + (plan.reduce((s,p)=>s+(p.noAns||0),0)
        ? `\n\nℹ️ 저장된 답안이 없는 ${plan.reduce((s,p)=>s+(p.noAns||0),0)}개 문항은 재채점 불가 (일반 학습지는 index v8.27부터 답안 저장)` : '')
    + `\n\n저장된 제출 답안으로 정답/점수를 다시 계산합니다.\n적용할까요?`)) return;

  let ok=0; const errs=[];
  for(const p of plan){
    if(!p.changes.length) continue;   // 유실 문항만 있는 학생은 저장하지 않음
    try{
      const upd={};
      let hasExam=false;
      for(const c of p.changes){
        upd[`perQuestion.${c.qid}.correct`]=c.to;
        if(c.isExamQ){ upd[`perQuestion.${c.qid}.score`]=c.toScore; hasExam=true; }  // 점수는 시험지 문항만
      }
      upd['regradedAt']=new Date().toISOString();
      if(hasExam){
        upd['examScore']=p.after;
        upd['examMaxScore']=p.maxScore;
        // 과거 자동저장이 시험 기록에 남긴 응답률 기반 correctRate(100%) 오염 제거
        upd['correctRate']=deleteField();
      }
      await updateDoc(doc(db,'records',p.uid,'worksheets',wsId), upd);
      // 메모리 반영
      const rec=allData[p.uid]?.[wsId];
      if(rec){
        for(const c of p.changes){
          if(rec.perQuestion[c.qid]){
            rec.perQuestion[c.qid].correct=c.to;
            if(c.isExamQ) rec.perQuestion[c.qid].score=c.toScore;
          }
        }
        if(p.changes.some(c=>c.isExamQ)){ rec.examScore=p.after; rec.examMaxScore=p.maxScore; }
      }
      ok++;
    }catch(e){ errs.push(`${p.name}: ${e.message}`); }
  }
  alert(`✅ 재채점 완료: ${ok}명`+(errs.length?`\n⚠️ 실패 ${errs.length}건\n${errs.slice(0,3).join('\n')}`:''));
  renderWS(wsId);
};
